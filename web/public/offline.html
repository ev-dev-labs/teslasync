<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Offline · TeslaSync</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #11141b 0%, #0a0a0f 60%);
      color: #e6e9ef;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem env(safe-area-inset-bottom, 1.5rem);
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 1.5rem;
      border-radius: 16px;
      background: linear-gradient(135deg, #00f0ff 0%, #10b981 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.25);
    }
    .logo svg { width: 36px; height: 36px; color: #0a0a0f; }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 0.5rem;
      color: #f3f4f6;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #9ca3af;
      max-width: 28rem;
      margin: 0 0 2rem;
    }
    button {
      appearance: none;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.625rem 1.25rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(0, 240, 255, 0.4);
      background: rgba(0, 240, 255, 0.08);
      color: #00f0ff;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    button:hover { background: rgba(0, 240, 255, 0.18); border-color: rgba(0, 240, 255, 0.7); }
    button:focus-visible { outline: 2px solid #00f0ff; outline-offset: 2px; }
    .meta {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
        <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="2" y1="2" x2="22" y2="22"></line>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>
      TeslaSync can't reach the server right now. Check your connection — your
      cached vehicle data is still available once the app finishes loading.
    </p>
    <button type="button" onclick="window.location.reload()">Try again</button>
    <p class="meta">This page is shown only when the app shell itself can't load.</p>
  </div>
</body>
</html>
