<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gradRev" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowBolt" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="512" height="512" rx="107" fill="#0a0a0f"/>

  <!-- Ambient glow -->
  <circle cx="256" cy="256" r="192" fill="url(#bgGlow)"/>

  <!-- Outer hexagonal frame -->
  <polygon points="256,48 437,152 437,360 256,464 75,360 75,152"
           fill="none" stroke="url(#grad)" stroke-width="4" stroke-linejoin="round"
           opacity="0.35" filter="url(#glow)"/>

  <!-- Inner hexagonal frame (dashed circuit pattern) -->
  <polygon points="256,85 400,165 400,347 256,427 112,347 112,165"
           fill="none" stroke="url(#grad)" stroke-width="1.3"
           opacity="0.12" stroke-dasharray="11 21"/>

  <!-- Circuit nodes at hex vertices -->
  <g filter="url(#glow)">
    <circle cx="256" cy="48" r="5" fill="#00f0ff" opacity="0.7"/>
    <circle cx="437" cy="152" r="5" fill="#00f0ff" opacity="0.5"/>
    <circle cx="437" cy="360" r="5" fill="#a855f7" opacity="0.5"/>
    <circle cx="256" cy="464" r="5" fill="#a855f7" opacity="0.7"/>
    <circle cx="75" cy="360" r="5" fill="#a855f7" opacity="0.5"/>
    <circle cx="75" cy="152" r="5" fill="#00f0ff" opacity="0.5"/>
  </g>

  <!-- Circuit trace extensions -->
  <g stroke-width="2" opacity="0.25" stroke-linecap="round">
    <line x1="256" y1="48" x2="256" y2="21" stroke="#00f0ff"/>
    <line x1="437" y1="152" x2="459" y2="141" stroke="#00f0ff"/>
    <line x1="437" y1="360" x2="459" y2="371" stroke="#a855f7"/>
    <line x1="256" y1="464" x2="256" y2="491" stroke="#a855f7"/>
    <line x1="75" y1="360" x2="53" y2="371" stroke="#a855f7"/>
    <line x1="75" y1="152" x2="53" y2="141" stroke="#00f0ff"/>
  </g>

  <!-- Upper sync arc -->
  <path d="M 128 235 A 144 96 0 0 1 384 235"
        fill="none" stroke="url(#grad)" stroke-width="7" stroke-linecap="round"
        opacity="0.7" filter="url(#glow)"/>
  <polygon points="384,235 363,213 365,251" fill="#a855f7" opacity="0.85" filter="url(#glow)"/>

  <!-- Lower sync arc -->
  <path d="M 384 277 A 144 96 0 0 1 128 277"
        fill="none" stroke="url(#gradRev)" stroke-width="7" stroke-linecap="round"
        opacity="0.7" filter="url(#glow)"/>
  <polygon points="128,277 149,299 147,261" fill="#00f0ff" opacity="0.85" filter="url(#glow)"/>

  <!-- Data flow dots on arcs -->
  <circle cx="192" cy="192" r="4" fill="#00f0ff" opacity="0.5" filter="url(#glow)"/>
  <circle cx="320" cy="192" r="4" fill="#a855f7" opacity="0.5" filter="url(#glow)"/>
  <circle cx="320" cy="320" r="4" fill="#a855f7" opacity="0.5" filter="url(#glow)"/>
  <circle cx="192" cy="320" r="4" fill="#00f0ff" opacity="0.5" filter="url(#glow)"/>

  <!-- Lightning bolt -->
  <path d="M 288 91 L 219 245 L 267 245 L 229 421 L 309 267 L 261 267 Z"
        fill="url(#grad)" filter="url(#glowBolt)" opacity="0.95"/>

  <!-- Bolt highlight edge -->
  <path d="M 288 91 L 219 245 L 267 245 L 229 421"
        fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
