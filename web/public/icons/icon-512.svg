<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="192" height="192" rx="38" fill="#0a0a14"/>

  <!-- Subtle circuit grid -->
  <g stroke="#00f0ff" stroke-width="0.3" opacity="0.08">
    <line x1="32" y1="0" x2="32" y2="192"/><line x1="64" y1="0" x2="64" y2="192"/>
    <line x1="96" y1="0" x2="96" y2="192"/><line x1="128" y1="0" x2="128" y2="192"/>
    <line x1="160" y1="0" x2="160" y2="192"/>
    <line x1="0" y1="32" x2="192" y2="32"/><line x1="0" y1="64" x2="192" y2="64"/>
    <line x1="0" y1="96" x2="192" y2="96"/><line x1="0" y1="128" x2="192" y2="128"/>
    <line x1="0" y1="160" x2="192" y2="160"/>
  </g>

  <!-- Orbital rings (data sync visualization) -->
  <ellipse cx="96" cy="96" rx="68" ry="28" fill="none" stroke="url(#g1)" stroke-width="1.2"
    opacity="0.25" transform="rotate(-20 96 96)"/>
  <ellipse cx="96" cy="96" rx="68" ry="28" fill="none" stroke="url(#g2)" stroke-width="1.2"
    opacity="0.25" transform="rotate(40 96 96)"/>

  <!-- Data flow dots on orbits -->
  <circle r="3" fill="#00f0ff" opacity="0.8" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#orbit1"/>
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#10b981" opacity="0.7" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite">
      <mpath href="#orbit2"/>
    </animateMotion>
  </circle>

  <!-- Hidden orbit paths for animateMotion -->
  <path id="orbit1" d="M 28,96 A 68,28 -20 1 1 164,96 A 68,28 -20 1 1 28,96"
    fill="none" transform="rotate(-20 96 96)"/>
  <path id="orbit2" d="M 28,96 A 68,28 40 1 1 164,96 A 68,28 40 1 1 28,96"
    fill="none" transform="rotate(40 96 96)"/>

  <!-- Tesla car silhouette (top-down, minimal) -->
  <g transform="translate(96,96)" filter="url(#glow)">
    <!-- Car body -->
    <path d="M-18,-38 C-18,-42 -14,-44 -8,-44 L8,-44 C14,-44 18,-42 18,-38
             L20,-20 L22,-8 L22,24 L20,36 C20,40 16,42 12,42
             L-12,42 C-16,42 -20,40 -20,36 L-22,24 L-22,-8 L-20,-20 Z"
      fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.9"/>
    <!-- Windshield -->
    <path d="M-14,-28 L-10,-16 L10,-16 L14,-28 Z" fill="#00f0ff" opacity="0.12"
      stroke="#00f0ff" stroke-width="0.5" opacity="0.3"/>
    <!-- Rear window -->
    <path d="M-12,20 L-10,30 L10,30 L12,20 Z" fill="#10b981" opacity="0.08"
      stroke="#10b981" stroke-width="0.5" opacity="0.2"/>
    <!-- Headlights -->
    <rect x="-16" y="-42" width="6" height="2" rx="1" fill="#00f0ff" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="10" y="-42" width="6" height="2" rx="1" fill="#00f0ff" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </rect>
    <!-- Taillights -->
    <rect x="-16" y="40" width="6" height="2" rx="1" fill="#ef4444" opacity="0.7"/>
    <rect x="10" y="40" width="6" height="2" rx="1" fill="#ef4444" opacity="0.7"/>
    <!-- Center line (data stream) -->
    <line x1="0" y1="-36" x2="0" y2="36" stroke="url(#g1)" stroke-width="0.8"
      stroke-dasharray="3 4" opacity="0.4">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Signal waves (telemetry broadcast) -->
  <g transform="translate(96,56)" opacity="0.5">
    <path d="M-8,-8 A 12,12 0 0 1 8,-8" fill="none" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M-14,-14 A 20,20 0 0 1 14,-14" fill="none" stroke="#00f0ff" stroke-width="1" filter="url(#glow)">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M-20,-20 A 28,28 0 0 1 20,-20" fill="none" stroke="#00f0ff" stroke-width="0.7">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- GPS pin dot (vehicle tracking) -->
  <circle cx="96" cy="96" r="4" fill="#10b981" filter="url(#glowStrong)" opacity="0.9">
    <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="96" cy="96" r="2" fill="#fff" opacity="0.9"/>
</svg>
