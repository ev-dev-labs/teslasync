<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="s"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>
  <circle cx="100" cy="100" r="100" fill="#020208"/>
  <!-- Deep space glow -->
  <circle cx="100" cy="90" r="80" fill="#00f0ff" opacity="0.025" filter="url(#s)"/>
  <circle cx="80" cy="110" r="50" fill="#a855f7" opacity="0.02" filter="url(#s)"/>
  <!-- Orbital rings -->
  <ellipse cx="100" cy="100" rx="75" ry="20" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.2" transform="rotate(-15 100 100)"/>
  <ellipse cx="100" cy="100" rx="75" ry="20" fill="none" stroke="#10b981" stroke-width="1" opacity="0.2" transform="rotate(20 100 100)"/>
  <ellipse cx="100" cy="100" rx="75" ry="20" fill="none" stroke="#a855f7" stroke-width="0.7" opacity="0.15" transform="rotate(55 100 100)"/>
  <!-- Particles -->
  <circle cx="173" cy="95" r="3.5" fill="#00f0ff" opacity="0.8" filter="url(#g)"/>
  <circle cx="38" cy="115" r="3" fill="#10b981" opacity="0.7" filter="url(#g)"/>
  <circle cx="125" cy="68" r="2.5" fill="#a855f7" opacity="0.6" filter="url(#g)"/>
  <circle cx="70" cy="125" r="2" fill="#00f0ff" opacity="0.5"/>
  <circle cx="145" cy="118" r="1.8" fill="#10b981" opacity="0.4"/>
  <!-- Central sphere -->
  <circle cx="100" cy="100" r="24" fill="#060610" stroke="url(#lg)" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="30" fill="none" stroke="url(#lg)" stroke-width="0.5" opacity="0.3"/>
  <circle cx="100" cy="100" r="16" fill="#00f0ff" opacity="0.06" filter="url(#g)"/>
  <!-- Bolt -->
  <path d="M104 88l-8 14h6l-5 11 12-14h-6z" fill="url(#lg)" filter="url(#g)"/>
</svg>
