<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="192x192" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="TeslaSync — Next-gen Tesla Fleet Intelligence Platform" />
    <meta name="color-scheme" content="dark" />
    <title>TeslaSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      /* Splash screen — brand reveal animation */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #0a0a0f;
        transition: opacity 0.6s ease;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      #splash .brand-logo {
        width: 120px; height: 120px;
        animation: logo-appear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0; transform: scale(0.5);
        filter: drop-shadow(0 0 30px rgba(0,240,255,0.4)) drop-shadow(0 0 60px rgba(16,185,129,0.2));
      }
      #splash .brand-logo svg { width: 100%; height: 100%; }
      #splash .logo-text {
        font-family: 'Inter', sans-serif;
        font-size: 28px; font-weight: 800;
        background: linear-gradient(135deg, #00f0ff, #10b981);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.03em; margin-top: 20px;
        animation: text-appear 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        opacity: 0; transform: translateY(10px);
      }
      #splash .logo-sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; color: rgba(255,255,255,0.25);
        margin-top: 12px; letter-spacing: 0.2em; text-transform: uppercase;
        animation: text-appear 0.5s ease 0.5s forwards;
        opacity: 0; transform: translateY(5px);
      }
      #splash .loading-bar {
        width: 120px; height: 2px; margin-top: 24px;
        background: rgba(255,255,255,0.06); border-radius: 1px; overflow: hidden;
        animation: text-appear 0.4s ease 0.6s forwards; opacity: 0;
      }
      #splash .loading-bar::after {
        content: ''; display: block; width: 40%; height: 100%;
        background: linear-gradient(90deg, #00f0ff, #10b981);
        border-radius: 1px;
        animation: loading-slide 1.2s ease-in-out infinite;
      }
      @keyframes logo-appear {
        0% { opacity: 0; transform: scale(0.5) rotate(-20deg); }
        100% { opacity: 1; transform: scale(1) rotate(0deg); }
      }
      @keyframes text-appear {
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes loading-slide {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(200%); }
        100% { transform: translateX(-100%); }
      }
      @keyframes orbit-spin {
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-tesla-dark text-white antialiased">
    <div id="splash">
      <div class="brand-logo">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#00f0ff"/>
              <stop offset="100%" stop-color="#10b981"/>
            </linearGradient>
            <radialGradient id="glow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="100" cy="100" r="95" fill="url(#glow)"/>
          <circle cx="100" cy="100" r="30" fill="url(#sg)" opacity="0.9"/>
          <circle cx="100" cy="100" r="34" fill="none" stroke="url(#sg)" stroke-width="1" opacity="0.4"/>
          <ellipse cx="100" cy="100" rx="70" ry="28" fill="none" stroke="url(#sg)" stroke-width="1.5" opacity="0.5" transform="rotate(-30 100 100)" style="animation: orbit-spin 8s linear infinite"/>
          <ellipse cx="100" cy="100" rx="70" ry="28" fill="none" stroke="url(#sg)" stroke-width="1.5" opacity="0.35" transform="rotate(30 100 100)" style="animation: orbit-spin 12s linear infinite reverse"/>
          <ellipse cx="100" cy="100" rx="55" ry="18" fill="none" stroke="url(#sg)" stroke-width="1" opacity="0.2" transform="rotate(60 100 100)" style="animation: orbit-spin 10s linear infinite"/>
          <!-- Bolt -->
          <path d="M100 68 L108 92 L100 88 L92 92 Z" fill="white" opacity="0.95"/>
          <path d="M100 132 L92 108 L100 112 L108 108 Z" fill="white" opacity="0.95"/>
          <!-- Orbital particles -->
          <circle cx="165" cy="82" r="3" fill="#00f0ff" opacity="0.8" style="animation: orbit-spin 8s linear infinite; transform-origin: 100px 100px"/>
          <circle cx="35" cy="118" r="2.5" fill="#10b981" opacity="0.7" style="animation: orbit-spin 12s linear infinite reverse; transform-origin: 100px 100px"/>
          <circle cx="140" cy="140" r="2" fill="#00f0ff" opacity="0.5" style="animation: orbit-spin 10s linear infinite; transform-origin: 100px 100px"/>
        </svg>
      </div>
      <div class="logo-text">TeslaSync</div>
      <div class="logo-sub">Fleet Intelligence Platform</div>
      <div class="loading-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove splash after React hydrates
      window.addEventListener('load', function() {
        setTimeout(function() {
          var s = document.getElementById('splash');
          if (s) { s.classList.add('fade-out'); setTimeout(function() { s.remove(); }, 500); }
        }, 300);
      });
      // Unregister any existing service worker and clear all caches.
      // The PWA service worker was caching stale JavaScript and causing
      // the app to show outdated code despite server-side deployments.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(n) { caches.delete(n); });
          });
        }
      }
    </script>
  </body>
</html>
