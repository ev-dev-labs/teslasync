<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Typography no-FOUC bootstrap (Typography Unit 0).
      // Applies the cached --font-* CSS variables from the `teslasync-font-*`
      // localStorage keys BEFORE any stylesheet/module loads, so the very first
      // paint already uses the user's chosen font / scale / line-height /
      // tracking / heading weight. Mirrored by the belt in src/main.tsx and
      // owned at runtime by src/components/ui/FontProvider.tsx.
      (function () {
        try {
          var d = document.documentElement;
          var ls = window.localStorage;
          var accent = ls.getItem('teslasync-theme-primary');
          if (accent && /^#[0-9a-f]{6}$/i.test(accent)) d.style.setProperty('--theme-primary', accent);
          var mode = ls.getItem('teslasync-mode');
          if (mode === 'light' || (mode === 'auto' && window.matchMedia?.('(prefers-color-scheme: light)').matches)) {
            d.setAttribute('data-splash-light', '');
          }
          var SANS = {
            inter: "'Inter', system-ui, -apple-system, sans-serif",
            system: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
            roboto: "'Roboto', system-ui, -apple-system, sans-serif",
            source: "'Source Sans 3', system-ui, -apple-system, sans-serif",
            plex: "'IBM Plex Sans', system-ui, -apple-system, sans-serif",
            atkinson: "'Atkinson Hyperlegible', system-ui, -apple-system, sans-serif",
            nunito: "'Nunito', system-ui, -apple-system, sans-serif",
            "dm-sans": "'DM Sans', system-ui, -apple-system, sans-serif",
            manrope: "'Manrope', system-ui, -apple-system, sans-serif",
            outfit: "'Outfit', system-ui, -apple-system, sans-serif",
            poppins: "'Poppins', system-ui, -apple-system, sans-serif",
            "work-sans": "'Work Sans', system-ui, -apple-system, sans-serif",
            "public-sans": "'Public Sans', system-ui, -apple-system, sans-serif",
            lato: "'Lato', system-ui, -apple-system, sans-serif",
            "open-sans": "'Open Sans', system-ui, -apple-system, sans-serif",
            "noto-sans": "'Noto Sans', system-ui, -apple-system, sans-serif"
          };
          var MONO = {
            jetbrains: "'JetBrains Mono', 'Fira Code', ui-monospace, monospace",
            fira: "'Fira Code', ui-monospace, monospace",
            "plex-mono": "'IBM Plex Mono', ui-monospace, monospace",
            "source-code-pro": "'Source Code Pro', ui-monospace, monospace",
            "roboto-mono": "'Roboto Mono', ui-monospace, monospace",
            inconsolata: "'Inconsolata', ui-monospace, monospace",
            "space-mono": "'Space Mono', ui-monospace, monospace",
            "ubuntu-mono": "'Ubuntu Mono', ui-monospace, monospace",
            system: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          };
          var sansId = ls.getItem('teslasync-font-family');
          var customSans = ls.getItem('teslasync-font-custom-sans');
          if (sansId === 'custom' && customSans) d.style.setProperty('--font-sans', customSans + ', system-ui, -apple-system, sans-serif');
          else if (sansId && SANS[sansId]) d.style.setProperty('--font-sans', SANS[sansId]);
          var monoId = ls.getItem('teslasync-font-mono');
          var customMono = ls.getItem('teslasync-font-custom-mono');
          if (monoId === 'custom' && customMono) d.style.setProperty('--font-mono', customMono + ', ui-monospace, monospace');
          else if (monoId && MONO[monoId]) d.style.setProperty('--font-mono', MONO[monoId]);
          var scale = ls.getItem('teslasync-font-scale');
          if (scale) d.style.setProperty('--font-scale', scale);
          var leading = ls.getItem('teslasync-font-leading');
          if (leading) d.style.setProperty('--leading', leading);
          var tracking = ls.getItem('teslasync-font-tracking');
          if (tracking) d.style.setProperty('--tracking', tracking);
          var weight = ls.getItem('teslasync-font-heading-weight');
          if (weight) d.style.setProperty('--font-weight-bold', weight);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="192x192" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Toolbar tint per OS scheme until React hydrates; `useDynamicAppIcon`
         then re-tints BOTH metas to the active app surface so the browser
         chrome always matches the app theme, not the OS theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d12" />
    <!-- Windows Start tile / classic Edge pinned-site chrome. -->
    <meta name="msapplication-TileColor" content="#0b0d12" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />
    <!-- Installability (PWA-01).
         `mobile-web-app-capable` is the standardised name honoured by Chrome
         on Android. iOS Safari does NOT read it — it still keys standalone
         launch off the vendor-prefixed `apple-mobile-web-app-capable`, so both
         must be present or an "Add to Home Screen" install on iPhone opens in
         a Safari chrome instead of a standalone window.
         `apple-mobile-web-app-title` is the iOS home-screen label; without it
         iOS falls back to <title>, which the SPA rewrites per page. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TeslaSync" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- iOS launch screens. Without these, "Add to Home Screen" installs
         flash a blank screen on every cold start. Generated via
         `npm run pwa:assets` (device-pixel-exact PNGs, portrait). -->
    <link rel="apple-touch-startup-image" href="/splash/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1668x2388.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-2048x2732.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <meta name="description" content="TeslaSync — Next-gen Tesla Fleet Intelligence Platform" />
    <meta name="color-scheme" content="dark" />
    <title>TeslaSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- FontProvider requests only the active font pair after first paint.
         Map routes load Leaflet's bundled stylesheet with their own chunk. -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-content: center; justify-items: center;
        padding: 1rem; text-align: center;
        background: #0b0d12;
        color: #f4f7fb;
        --splash-secondary: #aab4c3;
        font-family: var(--font-sans, system-ui, sans-serif);
        transition: opacity 180ms ease;
      }
      [data-splash-light] #splash {
        background: #f8fafc;
        color: #0f172a;
        --splash-secondary: #475569;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      #splash .splash-bolt {
        width: clamp(56px, 10vmin, 72px);
        height: auto; overflow: visible;
        margin-block-end: 14px;
      }
      #splash-title {
        font-size: calc(clamp(1.375rem, 3.5vmin, 1.625rem) * var(--font-scale, 1));
        font-weight: var(--font-weight-bold, 650);
        letter-spacing: -.035em; line-height: 1.2;
      }
      #splash-subtitle {
        margin-block-start: 5px;
        color: var(--splash-secondary);
        font-size: calc(.875rem * var(--font-scale, 1));
        line-height: 1.5;
      }
      /* Shared with Spinner. First paint must not wait for the app stylesheet. */
      .spinner-bolt-draw { animation: boltDraw 2s ease-in-out infinite; }
      @keyframes boltDraw {
        0%   { stroke-dashoffset: 100;  fill-opacity: 0; opacity: .15; }
        30%  { stroke-dashoffset: 0;    fill-opacity: 0; opacity: 1; }
        55%  { stroke-dashoffset: 0;    fill-opacity: 1; opacity: 1; }
        80%  { stroke-dashoffset: 0;    fill-opacity: 1; opacity: .9; }
        100% { stroke-dashoffset: -100; fill-opacity: 0; opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash { transition: none; }
        #splash .spinner-bolt-draw { animation: none; stroke-dasharray: none; }
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="splash" role="progressbar" aria-labelledby="splash-title" aria-describedby="splash-subtitle">
      <svg class="splash-bolt" width="72" height="72" viewBox="0 0 200 200" aria-hidden="true">
        <path class="spinner-bolt-draw" d="M112 30L62 108h34L78 170l58-82h-34z" pathLength="100"
          fill="currentColor" stroke="currentColor" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100"/>
      </svg>
      <div id="splash-title">TeslaSync</div>
      <div id="splash-subtitle">Fleet Intelligence Platform</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
