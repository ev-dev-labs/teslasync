<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="TeslaSync — Next-gen Tesla Fleet Intelligence Platform" />
    <meta name="color-scheme" content="dark" />
    <title>TeslaSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      /* Splash loader - removed once React mounts */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #0a0a0f;
        transition: opacity 0.4s ease;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      #splash .logo-ring {
        width: 64px; height: 64px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.06);
        border-top-color: #00f0ff;
        animation: splash-spin 1s linear infinite;
        filter: drop-shadow(0 0 8px rgba(0,240,255,0.4));
        margin-bottom: 24px;
      }
      #splash .logo-text {
        font-family: 'Inter', sans-serif;
        font-size: 24px; font-weight: 700;
        color: white; letter-spacing: -0.025em;
      }
      #splash .logo-sub {
        font-family: 'Inter', sans-serif;
        font-size: 12px; color: rgba(255,255,255,0.3);
        margin-top: 8px; letter-spacing: 0.05em;
      }
      @keyframes splash-spin { 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="bg-tesla-dark text-white antialiased">
    <div id="splash">
      <div class="logo-ring"></div>
      <div class="logo-text">TeslaSync</div>
      <div class="logo-sub">INITIALIZING SYSTEMS</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove splash after React hydrates
      window.addEventListener('load', function() {
        setTimeout(function() {
          var s = document.getElementById('splash');
          if (s) { s.classList.add('fade-out'); setTimeout(function() { s.remove(); }, 500); }
        }, 300);
      });
      // Unregister any existing service worker and clear all caches.
      // The PWA service worker was caching stale JavaScript and causing
      // the app to show outdated code despite server-side deployments.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(n) { caches.delete(n); });
          });
        }
      }
    </script>
  </body>
</html>
