<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="192x192" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="TeslaSync — Next-gen Tesla Fleet Intelligence Platform" />
    <meta name="color-scheme" content="dark" />
    <title>TeslaSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      /* Splash screen — brand reveal animation */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #0a0a0f;
        transition: opacity 0.6s ease;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      #splash .brand-logo {
        width: 120px; height: 120px;
        animation: logo-appear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0; transform: scale(0.5);
        filter: drop-shadow(0 0 30px rgba(0,240,255,0.4)) drop-shadow(0 0 60px rgba(16,185,129,0.2));
      }
      #splash .brand-logo svg { width: 100%; height: 100%; }
      #splash .logo-text {
        font-family: 'Inter', sans-serif;
        font-size: 28px; font-weight: 800;
        background: linear-gradient(135deg, #00f0ff, #10b981);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.03em; margin-top: 20px;
        animation: text-appear 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        opacity: 0; transform: translateY(10px);
      }
      #splash .logo-sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px; color: rgba(255,255,255,0.25);
        margin-top: 12px; letter-spacing: 0.2em; text-transform: uppercase;
        animation: text-appear 0.5s ease 0.5s forwards;
        opacity: 0; transform: translateY(5px);
      }
      #splash .loading-bar {
        width: 120px; height: 2px; margin-top: 24px;
        background: rgba(255,255,255,0.06); border-radius: 1px; overflow: hidden;
        animation: text-appear 0.4s ease 0.6s forwards; opacity: 0;
      }
      #splash .loading-bar::after {
        content: ''; display: block; width: 40%; height: 100%;
        background: linear-gradient(90deg, #00f0ff, #10b981);
        border-radius: 1px;
        animation: loading-slide 1.2s ease-in-out infinite;
      }
      @keyframes logo-appear {
        0% { opacity: 0; transform: scale(0.5) rotate(-20deg); }
        100% { opacity: 1; transform: scale(1) rotate(0deg); }
      }
      @keyframes text-appear {
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes loading-slide {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(200%); }
        100% { transform: translateX(-100%); }
      }
      @keyframes orbit-spin {
        100% { transform: rotate(360deg); }
      }
      @keyframes bolt-pulse {
        0% { opacity: 0.85; filter: url(#sgl); }
        100% { opacity: 1; filter: url(#sgl) brightness(1.2); }
      }
    </style>
  </head>
  <body class="bg-tesla-dark text-white antialiased">
    <div id="splash">
      <div class="brand-logo">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="sb" x1="0.3" y1="0" x2="0.7" y2="1">
              <stop stop-color="#00f0ff"/>
              <stop offset="0.5" stop-color="#40e8c0"/>
              <stop offset="1" stop-color="#10b981"/>
            </linearGradient>
            <linearGradient id="sc" x1="0" y1="0.3" x2="1" y2="0.7">
              <stop stop-color="#00f0ff" stop-opacity="0.7"/>
              <stop offset="1" stop-color="#10b981" stop-opacity="0.5"/>
            </linearGradient>
            <filter id="sg"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <filter id="sgl"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <!-- Car silhouette -->
          <path d="M35 128 Q32 124 37 120 L52 110 Q65 102 80 97 L100 92 Q115 89 130 92 L150 97 Q165 102 178 110 L193 120 Q198 124 195 128 L188 132 Q165 138 130 140 L100 140 Q65 138 42 132 Z" fill="none" stroke="url(#sc)" stroke-width="2.5" filter="url(#sg)"/>
          <!-- Headlights -->
          <ellipse cx="48" cy="122" rx="9" ry="4" fill="#00f0ff" opacity="0.9" filter="url(#sg)"/>
          <ellipse cx="182" cy="122" rx="9" ry="4" fill="#00f0ff" opacity="0.9" filter="url(#sg)"/>
          <!-- Lightning bolt -->
          <path d="M128 22 L92 95 h25 L84 178 l55-80 h-26 Z" fill="url(#sb)" filter="url(#sgl)" opacity="0.95" style="animation: bolt-pulse 2s ease-in-out infinite alternate"/>
        </svg>
      </div>
      <div class="logo-text">TeslaSync</div>
      <div class="logo-sub">Fleet Intelligence Platform</div>
      <div class="loading-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove splash after React hydrates
      window.addEventListener('load', function() {
        setTimeout(function() {
          var s = document.getElementById('splash');
          if (s) { s.classList.add('fade-out'); setTimeout(function() { s.remove(); }, 500); }
        }, 300);
      });
      // Register self-destructing service worker to kill any cached production SW.
      // The sw.js file immediately clears caches and unregisters itself.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
        // Also force-unregister any stale registrations
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.update(); });
        });
      }
    </script>
  </body>
</html>
