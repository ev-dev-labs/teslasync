<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Typography no-FOUC bootstrap (Typography Unit 0).
      // Applies the cached --font-* CSS variables from the `teslasync-font-*`
      // localStorage keys BEFORE any stylesheet/module loads, so the very first
      // paint already uses the user's chosen font / scale / line-height /
      // tracking / heading weight. Mirrored by the belt in src/main.tsx and
      // owned at runtime by src/components/ui/FontProvider.tsx.
      (function () {
        try {
          var d = document.documentElement;
          var ls = window.localStorage;
          var SANS = {
            inter: "'Inter', system-ui, -apple-system, sans-serif",
            system: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
            roboto: "'Roboto', system-ui, -apple-system, sans-serif",
            source: "'Source Sans 3', system-ui, -apple-system, sans-serif",
            plex: "'IBM Plex Sans', system-ui, -apple-system, sans-serif",
            atkinson: "'Atkinson Hyperlegible', system-ui, -apple-system, sans-serif"
          };
          var MONO = {
            jetbrains: "'JetBrains Mono', 'Fira Code', ui-monospace, monospace",
            fira: "'Fira Code', ui-monospace, monospace",
            "plex-mono": "'IBM Plex Mono', ui-monospace, monospace",
            system: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          };
          var sansId = ls.getItem('teslasync-font-family');
          var customSans = ls.getItem('teslasync-font-custom-sans');
          if (sansId === 'custom' && customSans) d.style.setProperty('--font-sans', customSans + ', system-ui, -apple-system, sans-serif');
          else if (sansId && SANS[sansId]) d.style.setProperty('--font-sans', SANS[sansId]);
          var monoId = ls.getItem('teslasync-font-mono');
          var customMono = ls.getItem('teslasync-font-custom-mono');
          if (monoId === 'custom' && customMono) d.style.setProperty('--font-mono', customMono + ', ui-monospace, monospace');
          else if (monoId && MONO[monoId]) d.style.setProperty('--font-mono', MONO[monoId]);
          var scale = ls.getItem('teslasync-font-scale');
          if (scale) d.style.setProperty('--font-scale', scale);
          var leading = ls.getItem('teslasync-font-leading');
          if (leading) d.style.setProperty('--leading', leading);
          var tracking = ls.getItem('teslasync-font-tracking');
          if (tracking) d.style.setProperty('--tracking', tracking);
          var weight = ls.getItem('teslasync-font-heading-weight');
          if (weight) d.style.setProperty('--font-weight-bold', weight);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="192x192" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="TeslaSync — Next-gen Tesla Fleet Intelligence Platform" />
    <meta name="color-scheme" content="dark" />
    <title>TeslaSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- FontProvider requests only the active font pair after first paint.
         Map routes load Leaflet's bundled stylesheet with their own chunk. -->
    <style>
      /* Minimal first-paint shell. Keep startup calm and product-focused. */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #0b0d12;
        transition: opacity 180ms ease;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      #splash .brand-logo {
        width: 48px; height: 48px;
      }
      #splash .brand-logo svg { width: 100%; height: 100%; }
      #splash .logo-text {
        font-family: 'Inter', sans-serif;
        font-size: 19px; font-weight: 600; color: #f4f7fb;
        letter-spacing: -0.02em; margin-top: 14px;
      }
      #splash .logo-sub {
        font-family: 'Inter', sans-serif;
        font-size: 11px; color: #758195;
        margin-top: 5px; letter-spacing: 0.04em;
      }
      #splash .loading-bar {
        width: 144px; height: 2px; margin-top: 22px;
        background: rgba(255,255,255,0.08); border-radius: 1px; overflow: hidden;
      }
      #splash .loading-bar::after {
        content: ''; display: block; width: 40%; height: 100%;
        background: #3b82f6;
        border-radius: 1px;
        animation: loading-slide 1.2s ease-in-out infinite;
      }
      @keyframes loading-slide {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(200%); }
        100% { transform: translateX(-100%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash,
        #splash .loading-bar::after { animation: none; transition: none; }
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="splash">
      <div class="brand-logo">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
          <rect x="8" y="8" width="184" height="184" rx="38" fill="#171c25" stroke="#2a3441" stroke-width="8"/>
          <path d="M112 30L62 108h34L78 170l58-82h-34z" fill="#3b82f6"/>
        </svg>
      </div>
      <div class="logo-text">TeslaSync</div>
      <div class="logo-sub">Fleet Intelligence Platform</div>
      <div class="loading-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
