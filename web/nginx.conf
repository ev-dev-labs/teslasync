server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — re-resolves on each request instead of once at startup.
    # Prevents Nginx from crashing if teslasync-api starts after this container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # SPA routing - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must not be cached so new JS bundle references are picked up
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Proxy API requests to backend
    location /api/ {
        set $backend "http://teslasync-api:8080";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy health checks
    location /healthz {
        set $backend "http://teslasync-api:8080";
        proxy_pass $backend;
    }

    location /readyz {
        set $backend "http://teslasync-api:8080";
        proxy_pass $backend;
    }

    # Service worker must never be cached — browser needs to detect updates
    location ~* (sw|workbox).*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
