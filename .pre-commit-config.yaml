# Pre-commit hooks for TeslaSync
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
# Skip:    git commit --no-verify

repos:
  # ── General ─────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1000]

  # ── Go ──────────────────────────────────────────────────
  - repo: https://github.com/golangci/golangci-lint
    rev: v1.64.8
    hooks:
      - id: golangci-lint
        args: [--timeout=5m]

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-build-mod
      - id: go-mod-tidy

  # gofmt / goimports run as LOCAL hooks (not via dnephin) so they
  # remain available after the dnephin/pre-commit-golang repo
  # archival (Mar 2025). Bodies live in scripts/pre-commit/ so the
  # YAML stays parsable (entry: ... cannot easily contain nested
  # quotes + colons inline).
  #
  # Note for Windows contributors: run these via WSL or the Docker
  # one-liner (docs/CONTRIBUTING.md § "Running make without
  # installing it"). On a native Windows working tree CRLF can
  # cause false positives; .gitattributes (A2.3) forces text eol=lf
  # for .go files on next checkout.
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt -s (Go formatting)
        entry: scripts/pre-commit/gofmt-check.sh
        language: script
        types: [go]
        pass_filenames: true

      - id: goimports
        name: goimports (Go imports grouping)
        entry: scripts/pre-commit/goimports-check.sh
        language: script
        types: [go]
        pass_filenames: true

  # ── Frontend ────────────────────────────────────────────
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: bash -c 'cd web && npx eslint --max-warnings 0'
        language: system
        files: '^web/src/.*\.(ts|tsx)$'
        pass_filenames: false

      - id: tsc-frontend
        name: TypeScript type-check (frontend)
        entry: bash -c 'cd web && npx tsc --noEmit'
        language: system
        files: '^web/(src/.*\.(ts|tsx)|tsconfig.*\.json|package\.json)$'
        pass_filenames: false
        stages: [pre-push]

      - id: vitest
        name: Vitest
        entry: bash -c 'cd web && npx vitest run --reporter=dot'
        language: system
        files: '^web/src/.*\.(ts|tsx)$'
        pass_filenames: false
        stages: [pre-push]

  # ── Secrets ─────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
