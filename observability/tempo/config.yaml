# Single-binary Tempo configuration for the Docker Compose tracing profile.
# Traces arrive through the OpenTelemetry Collector; the metrics generator
# derives the traces_spanmetrics_* and traces_service_graph_* series consumed
# by the provisioned Grafana dashboards and remote-writes them to Prometheus.

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m
  trace_idle_period: 10s

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  registry:
    collection_interval: 15s
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      dimensions: []
    span_metrics:
      dimensions:
        - http.request.method
        - http.route
        - http.response.status_code
        - db.system
        - messaging.system
        - messaging.destination.name
      histogram_buckets:
        - 0.002
        - 0.004
        - 0.008
        - 0.016
        - 0.032
        - 0.064
        - 0.128
        - 0.25
        - 0.5
        - 1.0
        - 2.5
        - 5.0
        - 10.0
        - 15.0

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
