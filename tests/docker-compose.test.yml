version: "3.8"

services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    shm_size: 1g
    environment:
      POSTGRES_USER: teslasync
      POSTGRES_PASSWORD: teslasync
      POSTGRES_DB: teslasync
      PGDATA: /home/postgres/pgdata/data
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb,pg_stat_statements
      - -c
      - timescaledb.max_background_workers=8
    volumes:
      - ../scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teslasync"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://teslasync:teslasync@postgres:5432/teslasync?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    depends_on:
      - backend
