name: Frontend Quality Gates

on:
  workflow_dispatch:
    inputs:
      production_base_url:
        description: 'Optional deployed URL for authenticated smoke (no mocks)'
        required: false
        type: string
  pull_request:
    branches: [main, revamped-ui]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '43 8 * * *'
  push:
    branches: [main, revamped-ui]
    paths:
      - 'web/**'
      - 'scripts/screenshots.js'
      - 'cmd/routetemplategen/**'
      - 'cmd/notification-worker/**'
      - 'internal/api/webvitals/routetemplates_gen.go'
      - 'internal/adapter/heretraffic/**'
      - 'internal/adapter/smartdelivery/**'
      - 'internal/app/actioncentersvc/**'
      - 'internal/app/smartcommutesvc/**'
      - 'internal/app/smartdeliverysvc/**'
      - 'internal/app/smartreadinesssvc/**'
      - 'internal/database/smartcommute/**'
      - 'internal/database/smartdelivery/**'
      - 'internal/database/smartreadiness/**'
      - 'internal/domain/personal/**'
      - 'internal/domain/smartcommute/**'
      - 'internal/domain/smartdelivery/**'
      - 'internal/domain/smartreadiness/**'
      - 'internal/handler/v1/actioncenter/**'
      - 'internal/handler/v1/personal/**'
      - 'internal/handler/v1/smartcommute/**'
      - 'internal/handler/v1/smartdelivery/**'
      - 'internal/handler/v1/smartreadiness/**'
      - 'internal/integration/smartcommute/**'
      - 'internal/integration/smartreadiness/**'
      - 'internal/port/smartcommute/**'
      - 'internal/port/smartdelivery/**'
      - 'internal/port/smartreadiness/**'
      - 'migrations/000223_action_center_state.*.sql'
      - 'migrations/000259_smart_commute.*.sql'
      - 'migrations/000260_smart_charging_readiness.*.sql'
      - 'migrations/000261_smart_charging_slow_samples.*.sql'
      - 'migrations/000262_smart_charging_site_rate_consent.*.sql'
      - 'migrations/000263_smart_personal_push.*.sql'
      - 'migrations/000264_smart_charging_trip_legs.*.sql'
      - 'migrations/000265_smart_charging_scheduled_start.*.sql'
      - 'migrations/000266_smart_charging_schedule_power_ceiling.*.sql'
      - 'migrations/000267_smart_departure_overlap.*.sql'
      - 'migrations/000268_smart_commute_traffic_consent.*.sql'
      - '.github/workflows/frontend-quality.yml'
      - '.github/scripts/ci_workflows.test.mjs'
      - '.github/scripts/playwright-duration-shards.mjs'
      - '.github/scripts/playwright-test-durations.json'

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: web

env:
  APP_DESIGNS: ${{ contains(fromJSON('["merge_group","schedule","workflow_dispatch"]'), github.event_name) }}

jobs:
  contract:
    name: Route registry and test discovery
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v7
      - &node
        uses: actions/setup-node@v5
        id: node
        with:
          node-version: '26'
      - &host-dependencies
        uses: actions/cache@v5
        id: dependencies
        with:
          path: web/node_modules
          key: modules-v1-${{ runner.os }}-${{ runner.arch }}-host-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('web/package-lock.json') }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - &npm-install
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
      - &playwright-version
        name: Resolve exact Playwright version
        id: playwright
        shell: bash
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: browsers
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: browsers-v1-${{ runner.os }}-${{ runner.arch }}-host-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium for browser contracts
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Route registry is fresh (App.tsx -> routeRegistry.ts)
        run: node scripts/generate-route-registry.mjs --check
      - name: Backend route table is fresh (routeRegistry.ts -> Go artifact)
        working-directory: .
        run: go run ./cmd/routetemplategen --check
      - run: npm run e2e:routes
      - run: npm run e2e:contract -- --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ci-contract/results.json
      - name: Upload contract JSON
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pw-contract
          path: web/ci-contract/results.json
          if-no-files-found: error
          retention-days: 14
      - run: npm run e2e:scenario-contract
      - run: npm run e2e:list -- --reporter=line
      - run: node --test ../.github/scripts/ci_workflows.test.mjs

  browser-build:
    name: Shared hermetic browser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *node
      - *host-dependencies
      - *npm-install
      - run: npm run e2e:build
        env:
          E2E_MOCKS: '1'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-app
          path: web/e2e/.app-dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  private-notifications:
    name: Private notifications real-handler journey
    runs-on: ubuntu-latest
    needs: browser-build
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: teslasync_smart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d teslasync_smart_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - *node
      - *host-dependencies
      - *npm-install
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - *playwright-version
      - uses: actions/cache@v5
        id: browsers
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: browsers-v1-${{ runner.os }}-${{ runner.arch }}-host-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - uses: actions/download-artifact@v8
        with:
          name: e2e-app
          path: web/dist
      - name: Exercise private actions against real handlers and PostgreSQL
        working-directory: .
        env:
          TESLASYNC_SMART_COMMUTE_BROWSER: '1'
          TESLASYNC_SMART_CHARGING_BROWSER: '1'
          TESLASYNC_SMART_COMMUTE_TEST_DSN: postgres://test:test@127.0.0.1:5432/teslasync_smart_test?sslmode=disable
        run: xvfb-run -a go test -race -p=1 -count=1 -run '^TestPrivate(Commute|CommuteTraffic|Charging|PersonalDelivery)BrowserJourney$' -v ./internal/integration/smartcommute ./internal/integration/smartreadiness

  chromium-tests:
    name: Chromium ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    needs: browser-build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mix measured long cases and short routes instead of reserving
          # four undersized-worker runners for all 2,681 ordinary tests.
          - {name: responsive-1, shard: '1/20', extra: a11y}
          - {name: responsive-2, shard: '2/20', extra: performance}
          - {name: responsive-3, shard: '3/20'}
          - {name: responsive-4, shard: '4/20'}
          - {name: responsive-5, shard: '5/20'}
          - {name: responsive-6, shard: '6/20'}
          - {name: responsive-7, shard: '7/20'}
          - {name: responsive-8, shard: '8/20'}
          - {name: responsive-9, shard: '9/20'}
          - {name: responsive-10, shard: '10/20'}
          - {name: responsive-11, shard: '11/20'}
          - {name: responsive-12, shard: '12/20'}
          - {name: responsive-13, shard: '13/20'}
          - {name: responsive-14, shard: '14/20'}
          - {name: responsive-15, shard: '15/20'}
          - {name: responsive-16, shard: '16/20'}
          - {name: responsive-17, shard: '17/20'}
          - {name: responsive-18, shard: '18/20'}
          - {name: responsive-19, shard: '19/20'}
          - {name: responsive-20, shard: '20/20'}
    steps:
      - uses: actions/checkout@v7
      - *node
      - &container-dependencies
        uses: actions/cache@v5
        id: dependencies
        with:
          path: web/node_modules
          key: modules-v1-${{ runner.os }}-${{ runner.arch }}-pw163-noble-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('web/package-lock.json') }}
      - *npm-install
      - &shared-build
        uses: actions/download-artifact@v8
        with:
          name: e2e-app
          path: web/e2e/.app-dist
      - name: Run isolated Chromium suite
        env:
          E2E_MOCKS: '1'
          E2E_REUSE_BUILD: '1'
          GUARD_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
        run: node ../.github/scripts/playwright-duration-shards.mjs run --suite=quality --shard=${{ matrix.shard }}
      - name: Run isolated single-worker accessibility or performance gate
        if: always() && matrix.extra != ''
        env:
          E2E_MOCKS: '1'
          E2E_REUSE_BUILD: '1'
        run: node ../.github/scripts/playwright-duration-shards.mjs run --suite=${{ matrix.extra }} --shard=1/1 --out=ci-evidence/${{ matrix.extra }}
      - name: Record application design build receipt
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          const hash = path => createHash('sha256').update(readFileSync(path)).digest('hex');
          for (const key of ['GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT']) {
            if (!process.env[key]) throw new Error(`Missing actual ${key}`);
          }
          const common = {
            checkoutSHA: process.env.GITHUB_SHA, workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT, sharedBuildArtifact: 'e2e-app',
            indexSHA256: hash('e2e/.app-dist/index.html'),
            acceptanceSourceSHA256: hash('e2e/widget-design-packs.app.spec.ts'),
          };
          mkdirSync('ci-evidence', { recursive: true });
          writeFileSync('ci-evidence/app-design-receipts.json', JSON.stringify([390, 1440].flatMap(profileWidth =>
            ['dark', 'light', 'custom'].map(theme => ({ ...common, project: 'chromium-smoke', profileWidth, theme })))));
          NODE
      - name: Upload Chromium JSON and blob
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pw-chromium-${{ matrix.name }}
          path: web/ci-evidence/
          if-no-files-found: error
          retention-days: 14
      - &failure-evidence
        name: Upload heavy failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: failure-${{ github.job }}-${{ strategy.job-index }}
          path: |
            web/test-results/
            web/test-results-guard/
          if-no-files-found: error
          retention-days: 14

  chromium-quality:
    name: Chromium responsive, a11y, keyboard, and performance
    if: always()
    needs: [contract, browser-build, private-notifications, chromium-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *node
      - *host-dependencies
      - *npm-install
      - uses: actions/download-artifact@v8
        with:
          pattern: pw-chromium-*
          path: browser-evidence
      - name: Merge every Chromium suite
        env: &report-failure
          REPORT_FAILURE: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: node ../.github/scripts/playwright-duration-shards.mjs merge --family=chromium --input=../browser-evidence
      - &merged-json
        name: Upload merged suite JSON
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: combined-${{ github.job }}-${{ strategy.job-index }}
          path: web/ci-merged/**/results.json
          if-no-files-found: error
          retention-days: 14
      - &merged-html
        name: Upload combined failure HTML
        if: failure() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: combined-failure-${{ github.job }}-${{ strategy.job-index }}
          path: web/ci-merged/**/html/
          if-no-files-found: error
          retention-days: 14
      - name: Require every Chromium gate
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os; results = json.loads(os.environ["RESULTS"]); print(results); assert all(job["result"] == "success" for job in results.values()), "A required browser job failed, was cancelled, or was skipped"'

  cross-browser-tests:
    name: ${{ matrix.browser }} critical smoke (1/1)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    needs: browser-build
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit, edge]
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - *node
      - *container-dependencies
      - *npm-install
      - *playwright-version
      - name: Cache the effective Edge system installation
        if: matrix.browser == 'edge'
        uses: actions/cache@v5
        id: edge
        with:
          path: /opt/microsoft/msedge
          key: browsers-v1-${{ runner.os }}-${{ runner.arch }}-pw163-noble-msedge-${{ steps.playwright.outputs.version }}
      - name: Install Microsoft Edge
        if: matrix.browser == 'edge' && steps.edge.outputs.cache-hit != 'true'
        run: npx playwright install msedge
      - name: Verify cached or installed Edge executable
        if: matrix.browser == 'edge'
        run: |
          test -x /opt/microsoft/msedge/msedge
          ln -sf /opt/microsoft/msedge/msedge /usr/bin/microsoft-edge
      - *shared-build
      - name: Run lightweight engine smoke
        env:
          E2E_MOCKS: '1'
          E2E_REUSE_BUILD: '1'
        run: node ../.github/scripts/playwright-duration-shards.mjs run --suite=engine --browser=${{ matrix.browser }} --shard=1/1
      - name: Upload engine JSON and blob
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pw-engine-${{ matrix.browser }}
          path: web/ci-evidence/
          if-no-files-found: error
          retention-days: 14
      - *failure-evidence

  app-design-tests:
    name: ${{ matrix.browser }} application designs (${{ matrix.width }}px/${{ matrix.theme }}, ${{ matrix.shard }})
    if: contains(fromJSON('["merge_group","schedule","workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    needs: browser-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {browser: firefox, width: 1440, theme: dark, shard: '1/1'}
          - {browser: firefox, width: 1440, theme: light, shard: '1/1'}
          - {browser: firefox, width: 1440, theme: custom, shard: '1/1'}
          - {browser: firefox, width: 390, theme: dark, shard: '1/1'}
          - {browser: firefox, width: 390, theme: light, shard: '1/1'}
          - {browser: firefox, width: 390, theme: custom, shard: '1/1'}
          - {browser: webkit, width: 1440, theme: dark, shard: '1/4'}
          - {browser: webkit, width: 1440, theme: dark, shard: '2/4'}
          - {browser: webkit, width: 1440, theme: dark, shard: '3/4'}
          - {browser: webkit, width: 1440, theme: dark, shard: '4/4'}
          - {browser: webkit, width: 1440, theme: light, shard: '1/4'}
          - {browser: webkit, width: 1440, theme: light, shard: '2/4'}
          - {browser: webkit, width: 1440, theme: light, shard: '3/4'}
          - {browser: webkit, width: 1440, theme: light, shard: '4/4'}
          - {browser: webkit, width: 1440, theme: custom, shard: '1/4'}
          - {browser: webkit, width: 1440, theme: custom, shard: '2/4'}
          - {browser: webkit, width: 1440, theme: custom, shard: '3/4'}
          - {browser: webkit, width: 1440, theme: custom, shard: '4/4'}
          - {browser: webkit, width: 390, theme: dark, shard: '1/2'}
          - {browser: webkit, width: 390, theme: dark, shard: '2/2'}
          - {browser: webkit, width: 390, theme: light, shard: '1/2'}
          - {browser: webkit, width: 390, theme: light, shard: '2/2'}
          - {browser: webkit, width: 390, theme: custom, shard: '1/2'}
          - {browser: webkit, width: 390, theme: custom, shard: '2/2'}
    env:
      E2E_MOCKS: '1'
      E2E_REUSE_BUILD: '1'
      E2E_APP_DESIGN_CROSS_BROWSER: '1'
      APP_DESIGN_WORKERS: ${{ matrix.browser == 'webkit' && (matrix.width == 1440 && '1' || '2') || '4' }}
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - *node
      - *container-dependencies
      - *npm-install
      - *shared-build
      - name: Bind application design evidence to its source and build
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync, mkdirSync } from 'node:fs';
          import { availableParallelism } from 'node:os';
          const hash = path => createHash('sha256').update(readFileSync(path)).digest('hex');
          mkdirSync('ci-evidence', { recursive: true });
          writeFileSync('ci-evidence/app-design-run-envelope.json', JSON.stringify({
            checkoutSHA: process.env.GITHUB_SHA, workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT, sharedBuildArtifact: 'e2e-app',
            runtime: { node: process.version, architecture: process.arch, availableCPUs: availableParallelism(),
              requestedWorkers: Number(process.env.APP_DESIGN_WORKERS) },
            indexSHA256: hash('e2e/.app-dist/index.html'),
            acceptanceSourceSHA256: hash('e2e/widget-design-packs.app.spec.ts'),
          }));
          NODE
      - name: Require complete profile registration and run its exact partition
        run: node ../.github/scripts/playwright-duration-shards.mjs run --suite=profile --browser=${{ matrix.browser }} --width=${{ matrix.width }} --theme=${{ matrix.theme }} --shard=${{ matrix.shard }}
      - name: Preserve engine replay contract
        if: always() && matrix.width == 1440 && matrix.theme == 'dark' && (matrix.shard == '1/1' || matrix.shard == '1/4')
        run: node ../.github/scripts/playwright-duration-shards.mjs run --suite=replay --browser=${{ matrix.browser }} --shard=1/1 --out=ci-evidence/replay
      - name: Upload application design JSON and blobs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pw-app-${{ matrix.browser }}-${{ matrix.width }}-${{ matrix.theme }}-${{ strategy.job-index }}
          path: web/ci-evidence/
          if-no-files-found: error
          retention-days: 14
      - *failure-evidence

  cross-browser:
    name: ${{ matrix.browser }} critical smoke
    if: always()
    needs: [contract, browser-build, cross-browser-tests, app-design-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit, edge]
    steps:
      - uses: actions/checkout@v7
      - *node
      - *host-dependencies
      - *npm-install
      - uses: actions/download-artifact@v8
        with:
          pattern: pw-*-${{ matrix.browser }}*
          path: browser-evidence
      - name: Merge engine, complete profiles and replay
        env: *report-failure
        run: node ../.github/scripts/playwright-duration-shards.mjs merge --family=${{ matrix.browser }} --profiles=${{ env.APP_DESIGNS }} --input=../browser-evidence
      - *merged-json
      - *merged-html
      - name: Require every engine smoke shard
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
          SKIPPED_JOBS: ${{ env.APP_DESIGNS != 'true' && 'app-design-tests' || '' }}
        run: node ../.github/scripts/ci-job-results.mjs

  visual-tests:
    name: Windows visual snapshots (${{ matrix.shard }}/4)
    runs-on: windows-latest
    needs: browser-build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v7
      - *node
      - *host-dependencies
      - *npm-install
      - *playwright-version
      - uses: actions/cache@v5
        id: browsers
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: browsers-v1-${{ runner.os }}-${{ runner.arch }}-host-chromium-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - *shared-build
      - name: Compare committed Windows snapshots
        env:
          E2E_MOCKS: '1'
          E2E_REUSE_BUILD: '1'
        run: node ../.github/scripts/playwright-duration-shards.mjs run --suite=visual --shard=${{ matrix.shard }}/4
      - name: Upload visual JSON and blob
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pw-visual-${{ matrix.shard }}
          path: web/ci-evidence/
          if-no-files-found: error
          retention-days: 14
      - *failure-evidence

  visual:
    name: Deliberate visual snapshot gate (Windows baseline)
    if: always()
    needs: [contract, browser-build, visual-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *node
      - *host-dependencies
      - *npm-install
      - uses: actions/download-artifact@v8
        with:
          pattern: pw-visual-*
          path: browser-evidence
      - name: Merge complete Windows baseline
        env: *report-failure
        run: node ../.github/scripts/playwright-duration-shards.mjs merge --family=visual --input=../browser-evidence
      - *merged-json
      - *merged-html
      - name: Require every Windows snapshot shard
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os; results = json.loads(os.environ["RESULTS"]); print(results); assert all(job["result"] == "success" for job in results.values()), "A required visual job failed, was cancelled, or was skipped"'

  authenticated-production-smoke:
    name: Optional authenticated production smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.production_base_url != '' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    needs: contract
    steps:
      - uses: actions/checkout@v7
      - *node
      - *container-dependencies
      - *npm-install
      - name: Materialize ephemeral storage state
        env:
          STORAGE_STATE_B64: ${{ secrets.E2E_STORAGE_STATE_B64 }}
        run: |
          if [ -n "$STORAGE_STATE_B64" ]; then
            echo "$STORAGE_STATE_B64" | base64 --decode > e2e/.auth-state.json
            echo "E2E_STORAGE_STATE=e2e/.auth-state.json" >> "$GITHUB_ENV"
          else
            echo "No E2E_STORAGE_STATE_B64 secret supplied; running an unauthenticated deployed smoke."
          fi
      - name: Run deployed smoke without mocks
        id: production_smoke
        env:
          E2E_BASE_URL: ${{ inputs.production_base_url }}
          E2E_MOCKS: '0'
          E2E_SENSITIVE: '1'
        run: |
          set +e
          npx playwright test --project=chromium-smoke cross-browser.smoke.spec.ts production-journeys.smoke.spec.ts
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          STATUS=$([ "$EXIT_CODE" -eq 0 ] && echo passed || echo failed)
          printf '{"status":"%s","project":"chromium-smoke","recording":"disabled"}\n' "$STATUS" > authenticated-smoke-status.json
          exit 0
      - name: Remove ephemeral credentials
        if: always()
        run: |
          rm -f e2e/.auth-state.json
          rm -rf test-results playwright-report blob-report
      - name: Upload sanitized deployed smoke status
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: authenticated-production-smoke-status
          if-no-files-found: error
          retention-days: 7
          path: web/authenticated-smoke-status.json
      - name: Enforce deployed smoke result
        if: always() && steps.production_smoke.outputs.exit_code != '0'
        run: exit 1
