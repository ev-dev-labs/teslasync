name: Frontend quality gates

on:
  pull_request:
    branches: [main, revamped-ui]
    paths:
      - 'web/**'
      - 'scripts/screenshots.js'
      - 'cmd/routetemplategen/**'
      - 'internal/api/webvitals/routetemplates_gen.go'
      - '.github/workflows/frontend-quality.yml'
  push:
    branches: [main, revamped-ui]
    paths:
      - 'web/**'
      - 'scripts/screenshots.js'
      - 'cmd/routetemplategen/**'
      - 'internal/api/webvitals/routetemplates_gen.go'
      - '.github/workflows/frontend-quality.yml'
  workflow_dispatch:
    inputs:
      production_base_url:
        description: 'Optional deployed URL for authenticated smoke (no mocks)'
        required: false
        type: string

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  contract:
    name: Route registry and test discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: npm ci --legacy-peer-deps
      # ── Route-template freshness chain ────────────────────────────────────
      # App.tsx -> routeRegistry.ts -> internal/api/webvitals (generated Go).
      # routeRegistry.ts is the source of truth for privacy-safe route
      # templating on BOTH sides. A `:param` route added to App.tsx but never
      # regenerated means its opaque value (share token, customer slug) is
      # never templated and lands verbatim in a Prometheus label and in
      # buffered browser-error payloads. Both links are checked here so the
      # gate covers main AND revamped-ui.
      - name: Route registry is fresh (App.tsx -> routeRegistry.ts)
        run: node scripts/generate-route-registry.mjs --check
      - name: Backend route table is fresh (routeRegistry.ts -> Go artifact)
        working-directory: .
        run: go run ./cmd/routetemplategen --check
      - run: npm run e2e:routes
      - run: npm run e2e:contract
      - run: npm run e2e:scenario-contract
      - run: npm run e2e:list

  browser-build:
    name: Shared hermetic browser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run e2e:build
        env:
          E2E_MOCKS: '1'
      - uses: actions/upload-artifact@v6
        with:
          name: e2e-app
          path: web/e2e/.app-dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  chromium-tests:
    name: Chromium ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: browser-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: responsive-1, suite: quality, shard: '1/4'}
          - {name: responsive-2, suite: quality, shard: '2/4'}
          - {name: responsive-3, suite: quality, shard: '3/4'}
          - {name: responsive-4, suite: quality, shard: '4/4'}
          - {name: accessibility, suite: a11y, shard: '1/1'}
          - {name: performance, suite: performance, shard: '1/1'}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: e2e-app
          path: web/e2e/.app-dist
      - name: Run isolated Chromium suite
        env:
          E2E_MOCKS: '1'
          E2E_REUSE_BUILD: '1'
        run: npm run e2e:${{ matrix.suite }} -- --shard=${{ matrix.shard }}
      - name: Upload Chromium failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chromium-${{ matrix.name }}-report
          if-no-files-found: ignore
          retention-days: 14
          path: |
            web/test-results/
            web/playwright-report/

  chromium-quality:
    name: Chromium responsive, a11y, keyboard, and performance
    if: always()
    needs: [contract, browser-build, chromium-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require every Chromium gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os; results = json.loads(os.environ["RESULTS"]); print(results); assert all(job["result"] == "success" for job in results.values()), "A required browser job failed, was cancelled, or was skipped"'

  cross-browser:
    name: ${{ matrix.browser }} critical smoke
    runs-on: ubuntu-latest
    needs: browser-build
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v8
        with:
          name: e2e-app
          path: web/e2e/.app-dist
      - name: Run lightweight engine smoke
        env:
          E2E_MOCKS: '1'
          E2E_REUSE_BUILD: '1'
        run: npm run e2e -- --project=${{ matrix.browser }}-smoke
      - name: Upload engine failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.browser }}-smoke-report
          if-no-files-found: ignore
          retention-days: 14
          path: |
            web/test-results/
            web/playwright-report/

  visual-tests:
    name: Windows visual snapshots (${{ matrix.shard }}/4)
    runs-on: windows-latest
    needs: browser-build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install chromium
      - uses: actions/download-artifact@v8
        with:
          name: e2e-app
          path: web/e2e/.app-dist
      - name: Compare committed Windows snapshots
        env:
          E2E_MOCKS: '1'
          E2E_REUSE_BUILD: '1'
        run: npm run e2e:visual -- --shard=${{ matrix.shard }}/4 --workers=2
      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-regression-report-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            web/test-results/
            web/playwright-report/

  visual:
    name: Deliberate visual snapshot gate (Windows baseline)
    if: always()
    needs: [contract, browser-build, visual-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require every Windows snapshot shard
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os; results = json.loads(os.environ["RESULTS"]); print(results); assert all(job["result"] == "success" for job in results.values()), "A required visual job failed, was cancelled, or was skipped"'

  authenticated-production-smoke:
    name: Optional authenticated production smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.production_base_url != '' }}
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Materialize ephemeral storage state
        env:
          STORAGE_STATE_B64: ${{ secrets.E2E_STORAGE_STATE_B64 }}
        run: |
          if [ -n "$STORAGE_STATE_B64" ]; then
            echo "$STORAGE_STATE_B64" | base64 --decode > e2e/.auth-state.json
            echo "E2E_STORAGE_STATE=e2e/.auth-state.json" >> "$GITHUB_ENV"
          else
            echo "No E2E_STORAGE_STATE_B64 secret supplied; running an unauthenticated deployed smoke."
          fi
      - name: Run deployed smoke without mocks
        id: production_smoke
        env:
          E2E_BASE_URL: ${{ inputs.production_base_url }}
          E2E_MOCKS: '0'
          E2E_SENSITIVE: '1'
        run: |
          set +e
          npx playwright test --project=chromium-smoke cross-browser.smoke.spec.ts production-journeys.smoke.spec.ts
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          STATUS=$([ "$EXIT_CODE" -eq 0 ] && echo passed || echo failed)
          printf '{"status":"%s","project":"chromium-smoke","recording":"disabled"}\n' "$STATUS" > authenticated-smoke-status.json
          exit 0
      - name: Remove ephemeral credentials
        if: always()
        run: |
          rm -f e2e/.auth-state.json
          rm -rf test-results playwright-report blob-report
      - name: Upload sanitized deployed smoke status
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: authenticated-production-smoke-status
          if-no-files-found: error
          retention-days: 7
          path: web/authenticated-smoke-status.json
      - name: Enforce deployed smoke result
        if: always() && steps.production_smoke.outputs.exit_code != '0'
        run: exit 1
