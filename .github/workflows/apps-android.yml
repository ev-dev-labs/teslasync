name: apps-android

# P0/0004 — path-filtered CI for the Android (Compose / KMP) program
# (ADR-001/007/010/012). Linux runner per ADR-012. No-op-but-valid until the
# P3 Android program adds a buildable Gradle project; the guard step documents
# that state instead of a bare `exit 0`.

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/shared/**'
      - 'api/openapi/**'
      - '.github/workflows/apps-android.yml'
  push:
    branches: [feat/apps-android]
    paths:
      - 'apps/android/**'
      - 'apps/shared/**'
      - 'api/openapi/**'
      - '.github/workflows/apps-android.yml'
  workflow_dispatch:

concurrency:
  group: apps-android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    name: Android Compose (build + lint + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Detect buildable project (guard)
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -f apps/android/gradlew ] || [ -f apps/android/build.gradle.kts ] || [ -f apps/android/settings.gradle.kts ]; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
            echo "Buildable Gradle project detected under apps/android — running full triad."
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            echo "GUARD: no buildable Gradle project under apps/android yet (P3 not landed)."
            echo "GUARD: passing as a documented no-op; will fail once a project exists but does not build."
          fi

      - name: Build (gradlew assembleDebug)
        if: steps.detect.outputs.buildable == 'true'
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Strict lint/format (ktlint + detekt + Android Lint)
        if: steps.detect.outputs.buildable == 'true'
        working-directory: apps/android
        run: ./gradlew ktlintCheck detekt lint --no-daemon

      - name: Unit tests (gradlew test)
        if: steps.detect.outputs.buildable == 'true'
        working-directory: apps/android
        run: ./gradlew test --no-daemon

      - name: CI honesty marker
        if: success()
        run: echo "EXIT=0"
