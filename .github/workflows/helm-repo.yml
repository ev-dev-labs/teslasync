name: Publish Helm Chart

on:
  workflow_dispatch: {}

# DISABLED - quota limit - original triggers:
# on:
#   push:
#     branches: [main]
#     tags: ["v*"]
#   workflow_dispatch:
#     inputs:
#       version:
#         description: "Chart version (e.g. 0.2.0-alpha.1, 0.2.0-beta.1)"
#         required: false
#         type: string


permissions:
  contents: write
  pages: write
  packages: write
  id-token: write

jobs:
  publish:
    name: Package & Publish Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            # Manual dispatch with explicit version
            VERSION="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Tag push: v1.2.3 → 1.2.3
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Main branch push: auto-increment from latest tag
            LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -z "$LATEST" ]; then
              VERSION="0.1.0"
            else
              MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
              MINOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f2)
              PATCH=$(echo "$LATEST" | sed 's/v//' | cut -d. -f3)
              VERSION="${MAJOR}.${MINOR}.$((PATCH))"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Chart version: $VERSION"

      - name: Package chart
        run: |
          mkdir -p .helm-repo
          helm package helm/teslasync \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            -d .helm-repo

      - name: Push to OCI registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push .helm-repo/teslasync-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Download existing index
        run: |
          HTTP_CODE=$(curl -sSL -w '%{http_code}' -o .helm-repo/existing-index.yaml \
            https://ev-dev-labs.github.io/teslasync/helm/index.yaml 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" != "200" ] || ! grep -q "apiVersion:" .helm-repo/existing-index.yaml 2>/dev/null; then
            echo "No valid existing index found (HTTP $HTTP_CODE) — creating fresh"
            rm -f .helm-repo/existing-index.yaml
          else
            echo "Existing index downloaded successfully"
          fi

      - name: Generate repo index
        run: |
          if [ -f .helm-repo/existing-index.yaml ]; then
            helm repo index .helm-repo \
              --url https://ev-dev-labs.github.io/teslasync/helm \
              --merge .helm-repo/existing-index.yaml
            rm -f .helm-repo/existing-index.yaml
          else
            helm repo index .helm-repo \
              --url https://ev-dev-labs.github.io/teslasync/helm
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .helm-repo
          destination_dir: helm
          keep_files: true
