name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: teslasync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
            frontend:
              - 'web/**'
            helm:
              - 'helm/**'

      # --- Go steps ---
      - uses: actions/setup-go@v5
        if: github.event_name != 'pull_request' || steps.changes.outputs.go == 'true'
        with:
          go-version: "1.24"

      - name: Go lint
        if: github.event_name != 'pull_request' || steps.changes.outputs.go == 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Go vet
        if: github.event_name != 'pull_request' || steps.changes.outputs.go == 'true'
        run: go vet ./...

      - name: Go build
        if: github.event_name != 'pull_request' || steps.changes.outputs.go == 'true'
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o teslasync ./cmd/teslasync

      - name: Go test
        if: github.event_name != 'pull_request' || steps.changes.outputs.go == 'true'
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          DATABASE_NAME: teslasync_test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: github.event_name != 'pull_request' || steps.changes.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      # --- Frontend steps ---
      - uses: actions/setup-node@v4
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: ESLint
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        working-directory: web
        run: npm run lint

      - name: TypeScript check
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        working-directory: web
        run: npx tsc --noEmit

      - name: Build frontend
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        working-directory: web
        run: npm run build

      # --- Helm steps ---
      - name: Helm lint
        if: github.event_name != 'pull_request' || steps.changes.outputs.helm == 'true'
        run: |
          helm lint helm/teslasync
          helm template test helm/teslasync > /dev/null
