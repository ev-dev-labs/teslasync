name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-backend:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6

  test-backend:
    name: Test Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: teslasync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run tests
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test
          DATABASE_PASS: test
          DATABASE_NAME: teslasync_test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Test migration rollback
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/teslasync_test?sslmode=disable
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          # Apply all migrations
          migrate -path migrations -database "$DATABASE_URL" up
          # Get current version
          migrate -path migrations -database "$DATABASE_URL" version
          # Rollback last migration
          migrate -path migrations -database "$DATABASE_URL" down 1
          # Re-apply
          migrate -path migrations -database "$DATABASE_URL" up
          echo "Migration rollback test passed"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
        if: github.event_name != 'pull_request'

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build-backend:
    name: Build Go
    runs-on: ubuntu-latest
    needs: [lint-backend, test-backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o teslasync ./cmd/teslasync
          CGO_ENABLED=0 go build -ldflags="-s -w" -o notification-worker ./cmd/notification-worker
          CGO_ENABLED=0 go build -ldflags="-s -w" -o export-worker ./cmd/export-worker

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - name: Run frontend tests with coverage
        run: npx vitest run --coverage --reporter=verbose
      - name: Check coverage threshold
        run: |
          npx vitest run --coverage --coverage.thresholds.statements=15 --coverage.thresholds.branches=10 --coverage.thresholds.functions=10 --coverage.thresholds.lines=15

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --legacy-peer-deps
      - run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,mode=max,scope=ci-api

      - name: Build Notification Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.notification
          push: false
          cache-from: type=gha,scope=ci-notification
          cache-to: type=gha,mode=max,scope=ci-notification

      - name: Build Export Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.export-worker
          push: false
          cache-from: type=gha,scope=ci-export
          cache-to: type=gha,mode=max,scope=ci-export
