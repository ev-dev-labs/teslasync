name: E2E Tests

on:
  workflow_dispatch:

jobs:
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start services
        run: |
          docker compose up -d --build
          sleep 30
      - name: Load seed data
        run: |
          docker compose exec -T postgres psql -U teslasync -d teslasync < db/seed.sql
          docker compose exec -T postgres psql -U teslasync -d teslasync < db/seed_large.sql
      - name: Run E2E tests
        run: bash tests/e2e.sh
      - name: Stop services
        if: always()
        run: docker compose down -v
