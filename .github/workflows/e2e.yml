name: E2E

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to use (manual runs only)'
        type: choice
        options:
          - arc-runner
          - ubuntu-latest
        default: arc-runner

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E (smoke)
    # Pinned to ubuntu-latest (not the arc-runner default) because Playwright's
    # browser binaries need system libraries (libnss3, libatk, fonts, ...) that
    # the self-hosted arc-runner image does not ship — same rationale as the
    # Lighthouse job in perf.yml. GitHub-hosted ubuntu-latest ships everything
    # `playwright install --with-deps` needs out of the box.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        # Only the two engines this scaffold's projects use (desktop-chrome,
        # mobile-safari) — skips downloading/installing firefox.
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
