name: proto-gen-check

on:
  pull_request:
    paths:
      - 'api/proto/tesla/**'
      - 'internal/tesla/protomodel/**'
      - 'cmd/protogen-tesla/**'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to use (manual runs only)'
        type: choice
        options:
          - arc-runner
          - ubuntu-latest
        default: arc-runner

concurrency:
  group: proto-gen-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Verify generated Tesla protomodel matches proto
    runs-on: ${{ inputs.runner || 'arc-runner' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Verify generated files match proto
        run: make gen-tesla-check
