name: SI Canonical Gate

# Phase-44 / observability-batch / Prompt F7 — SI Canonical Gate.
#
# Blocks PRs that introduce NEW legacy unit-suffixed Go field names,
# JSON tags, or DB column references. The Phase-48 mandate is clear:
# we ship SI only. Pre-existing legacy identifiers in the codebase
# (~7 files at gate inception) are grandfathered via the
# CI_ALLOWLIST_PATHS variable; everything else is rejected.
#
# Two passes:
#
#   1. Backend Go — bans Go identifiers / JSON tags / struct fields /
#      DB column literals containing legacy unit suffixes.
#
#   2. Frontend TS — bans new callers of the @deprecated unit
#      conversion helpers in web/src/lib/unitConversion.ts.
#
# The gate inspects added lines from the event's actual change range:
# PR merge base, push before-SHA, or merge-queue base SHA.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: si-canonical-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Block new legacy unit-suffixed identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch enough history to compute the diff against the merge
          # base. depth: 0 is wasteful but reliable on shallow clones.
          fetch-depth: 0

      - name: Compute changes for this event
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          PATHS=(
            'internal/**/*.go' 'cmd/**/*.go'
            'web/src/**/*.ts' 'web/src/**/*.tsx'
            'migrations/**/*.sql'
          )
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
              git diff --root --unified=0 HEAD -- "${PATHS[@]}" > /tmp/si.diff
            else
              git cat-file -e "${PUSH_BEFORE}^{commit}"
              git diff --unified=0 "$PUSH_BEFORE" HEAD -- "${PATHS[@]}" > /tmp/si.diff
            fi
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            git cat-file -e "${MERGE_GROUP_BASE}^{commit}"
            git diff --unified=0 "$MERGE_GROUP_BASE" HEAD -- "${PATHS[@]}" > /tmp/si.diff
          else
            BASE="${BASE_REF:-main}"
            git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
            MERGE_BASE=$(git merge-base "origin/${BASE}" HEAD)
            git diff --unified=0 "${MERGE_BASE}...HEAD" -- "${PATHS[@]}" > /tmp/si.diff
          fi
          wc -l /tmp/si.diff

      - name: Test canonical gate field boundaries
        run: python3 -m unittest discover -s .github/scripts -p test_si_canonical_gate.py -v

      - name: Check for new legacy unit-suffixed Go identifiers
        run: python3 .github/scripts/si_canonical_gate.py go

      - name: Check for new callers of @deprecated unit conversion helpers
        run: python3 .github/scripts/si_canonical_gate.py fe
