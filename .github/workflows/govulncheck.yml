name: Go Vulnerability Check

on:
  workflow_dispatch: {}

# DISABLED - quota limit - original triggers:
# on:
#   schedule:
#     - cron: "0 5 * * 1"
#   workflow_dispatch:


permissions:
  contents: read

jobs:
  govulncheck:
    name: Check Go Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./... || echo "::warning::govulncheck found vulnerabilities in dependencies (exit code $?)"
