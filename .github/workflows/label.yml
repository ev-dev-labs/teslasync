name: Auto Label

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to use (manual runs only)'
        type: choice
        options:
          - arc-runner
          - ubuntu-latest
        default: arc-runner

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label PR
    runs-on: ${{ inputs.runner || 'arc-runner' }}
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
