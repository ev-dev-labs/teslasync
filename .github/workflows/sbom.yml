name: SBOM & Signing

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate Go SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          artifact-name: sbom-go.spdx.json
          output-file: sbom-go.spdx.json
      - name: Generate Frontend SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./web
          artifact-name: sbom-frontend.spdx.json
          output-file: sbom-frontend.spdx.json
      - name: Upload SBOMs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom-go.spdx.json
            sbom-frontend.spdx.json

  sign-images:
    name: Sign Container Images
    runs-on: ubuntu-latest
    needs: []
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v6
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign backend image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}-api:${{ github.ref_name }}"
          cosign sign --yes "${IMAGE}"
      - name: Sign web image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}-web:${{ github.ref_name }}"
          cosign sign --yes "${IMAGE}"
