name: Security Scan

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  trivy-backend:
    name: Trivy - Backend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t teslasync:scan -f Dockerfile .
      - name: Run Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity CRITICAL,HIGH --exit-code 0 \
            --format table teslasync:scan

  trivy-web:
    name: Trivy - Web Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -t teslasync-web:scan -f Dockerfile.web .
      - name: Run Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity CRITICAL,HIGH --exit-code 0 \
            --format table teslasync-web:scan

  trivy-filesystem:
    name: Trivy - Source Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        run: |
          docker run --rm -v "$(pwd):/src" -w /src \
            aquasec/trivy:latest fs --severity CRITICAL,HIGH --exit-code 0 \
            --format table .

  helm-security:
    name: Helm Chart Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kube-linter
        run: |
          curl -sL https://github.com/stackrox/kube-linter/releases/latest/download/kube-linter-linux -o kube-linter
          chmod +x kube-linter
      - name: Lint Helm chart
        run: |
          helm template test helm/teslasync > rendered.yaml
          ./kube-linter lint rendered.yaml --format sarif > kube-linter.sarif || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        if: always()
        with:
          sarif_file: kube-linter.sarif
