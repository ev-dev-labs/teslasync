name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 Features"
    labels:
      - enhancement
      - feature
  - title: "🐛 Bug Fixes"
    labels:
      - bug
      - fix
  - title: "🔒 Security"
    labels:
      - security
  - title: "📝 Documentation"
    labels:
      - docs
      - documentation
  - title: "🏗️ Infrastructure"
    labels:
      - ci
      - docker
      - helm
      - infrastructure
  - title: "🧹 Maintenance"
    labels:
      - dependencies
      - chore
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - major
      - breaking
  minor:
    labels:
      - minor
      - enhancement
      - feature
  patch:
    labels:
      - patch
      - bug
      - fix
      - dependencies
  default: patch
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
