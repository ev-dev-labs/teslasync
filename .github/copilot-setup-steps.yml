# Copilot Cloud Agent — Environment Setup
# This file configures the environment for the Copilot coding agent
# when it works on issues/PRs in this repository.

steps:
  # Install Go
  - name: Setup Go
    uses: actions/setup-go@v5
    with:
      go-version: '1.25'

  # Install Node.js (for frontend)
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  # Install backend dependencies
  - name: Install Go dependencies
    run: |
      go mod download
      go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

  # Install frontend dependencies
  - name: Install frontend dependencies
    run: |
      cd web
      npm ci

  # Make guidelines available — the agent reads .github/copilot-instructions.md
  # automatically, but we echo a reminder at setup time
  - name: Print guidelines reminder
    run: |
      echo "========================================="
      echo "ENGINEERING GUIDELINES ARE ENFORCED"
      echo "Read: .github/copilot-instructions.md"
      echo "Full: ENGINEERING_GUIDELINES.md"
      echo "========================================="
