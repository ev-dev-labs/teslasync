# TeslaSync SLO catalog
#
# Single source of truth for service-level objectives. Subsequent phase-44
# prompts generate Prometheus recording rules (0031), burn-rate alerts
# (0032), and Grafana dashboards (0033) from this file.
#
# Schema: slo/catalog.schema.json. Validate with `go run ./cmd/slogen validate slo/catalog.yaml`.
#
# Format conventions enforced by `cmd/slogen validate`:
#   - Top-level keys: version, slos.
#   - Each SLO is a list item starting with `  - name: <snake_case>`.
#   - All scalar values are single-line; no `>-` block scalars.
#   - `tags` uses inline array syntax `[a, b, c]`.
version: 1

slos:
  - name: api_availability
    description: "HTTP request success ratio across /api/v1/. Counts non-5xx responses as good events."
    sli:
      good_events: "sum(rate(teslasync_red_http_requests_total{status_class!=\"5xx\"}[5m]))"
      valid_events: "sum(rate(teslasync_red_http_requests_total[5m]))"
    objective: 99.5
    window: 30d
    owner: platform
    tags: [http, red]

  - name: api_latency_p99_500ms
    description: "p99 latency of /api/v1/vehicles/{vehicleID}/state must stay under 500ms."
    sli:
      good_events: "sum(rate(teslasync_red_http_request_duration_seconds_bucket{route=\"/api/v1/vehicles/{vehicleID}/state\",le=\"0.5\"}[5m]))"
      valid_events: "sum(rate(teslasync_red_http_request_duration_seconds_count{route=\"/api/v1/vehicles/{vehicleID}/state\"}[5m]))"
    objective: 99.0
    window: 30d
    owner: platform
    tags: [http, latency]

  - name: battery_health_latency_1s
    description: "Battery health analytics requests must complete within one second."
    sli:
      good_events: "sum(rate(teslasync_red_http_request_duration_seconds_bucket{route=\"/api/v1/analytics/battery-health\",le=\"1\"}[5m]))"
      valid_events: "sum(rate(teslasync_red_http_request_duration_seconds_count{route=\"/api/v1/analytics/battery-health\"}[5m]))"
    objective: 99.0
    window: 30d
    owner: analytics
    tags: [http, battery, latency]

  - name: vehicle_management_availability
    description: "Tesla Vehicle Management metadata and enterprise operations must complete without server errors."
    sli:
      good_events: "sum(rate(teslasync_red_http_requests_total{route=~\"/api/v1/(tesla/vehicle-pricing|vehicles/\\\\{vehicleID\\\\}/((options|specs|subscriptions|upgrades|warranty|enterprise-roles)(|/refresh)|enterprise-payer))\",status_class!=\"5xx\"}[5m]))"
      valid_events: "sum(rate(teslasync_red_http_requests_total{route=~\"/api/v1/(tesla/vehicle-pricing|vehicles/\\\\{vehicleID\\\\}/((options|specs|subscriptions|upgrades|warranty|enterprise-roles)(|/refresh)|enterprise-payer))\"}[5m]))"
    objective: 99.0
    window: 30d
    owner: platform
    tags: [http, vehicle-management, upstream]

  - name: service_intelligence_availability
    description: "Recall and service-intelligence requests must return without a server or upstream-gateway failure."
    sli:
      good_events: "sum(rate(teslasync_red_http_requests_total{route=\"/api/v1/service-intelligence/vehicles/{vehicleID}\",status_class!=\"5xx\"}[5m]))"
      valid_events: "sum(rate(teslasync_red_http_requests_total{route=\"/api/v1/service-intelligence/vehicles/{vehicleID}\"}[5m]))"
    objective: 99.0
    window: 30d
    owner: platform
    tags: [http, upstream, safety]

  - name: service_intelligence_catalog_admin_availability
    description: "NHTSA communications catalog status and import operations must complete without server errors."
    sli:
      good_events: "sum(rate(teslasync_red_http_requests_total{route=~\"/api/v1/admin/service-intelligence/communications/(status|import)\",status_class!=\"5xx\"}[5m]))"
      valid_events: "sum(rate(teslasync_red_http_requests_total{route=~\"/api/v1/admin/service-intelligence/communications/(status|import)\"}[5m]))"
    objective: 99.0
    window: 30d
    owner: platform
    tags: [http, upstream, safety, admin]

  - name: action_center_read_availability
    description: "Unified Action Center list and history reads must return without server errors."
    sli:
      good_events: "sum(rate(teslasync_red_http_requests_total{route=~\"/api/v1/action-center(|/\\\\{recommendationID\\\\}/history)\",method=\"GET\",status_class!=\"5xx\"}[5m]))"
      valid_events: "sum(rate(teslasync_red_http_requests_total{route=~\"/api/v1/action-center(|/\\\\{recommendationID\\\\}/history)\",method=\"GET\"}[5m]))"
    objective: 99.0
    window: 30d
    owner: platform
    tags: [http, action-center, decision-inbox]

  - name: action_center_write_availability
    description: "Confirmation-gated Action Center state actions must return without server errors; expected conflicts remain valid outcomes."
    sli:
      good_events: "sum(rate(teslasync_red_http_requests_total{route=\"/api/v1/action-center/{recommendationID}/actions\",method=\"POST\",status_class!=\"5xx\"}[5m]))"
      valid_events: "sum(rate(teslasync_red_http_requests_total{route=\"/api/v1/action-center/{recommendationID}/actions\",method=\"POST\"}[5m]))"
    objective: 99.5
    window: 30d
    owner: platform
    tags: [http, action-center, writes]

  - name: advanced_intelligence_read_availability
    description: "Advanced-intelligence evidence reads must return without server errors."
    sli:
      good_events: "sum(rate(teslasync_red_http_requests_total{route=~\"/api/v1/advanced-intelligence/(firmware-canary|component-survival|road-hazards|behavioral-sentinel|charging-forensics|federated-learning/model-cards|causal-experiments)\",method=\"GET\",status_class!=\"5xx\"}[5m]))"
      valid_events: "sum(rate(teslasync_red_http_requests_total{route=~\"/api/v1/advanced-intelligence/(firmware-canary|component-survival|road-hazards|behavioral-sentinel|charging-forensics|federated-learning/model-cards|causal-experiments)\",method=\"GET\"}[5m]))"
    objective: 99.0
    window: 30d
    owner: analytics
    tags: [http, advanced-intelligence, evidence]

  - name: advanced_intelligence_scenario_availability
    description: "Confirmation-gated advanced-intelligence scenarios and durable experiments must avoid server errors."
    sli:
      good_events: "sum(rate(teslasync_red_http_requests_total{route=~\"/api/v1/advanced-intelligence/(twin-lab/scenarios|journey-assurance/scenarios|charging-site-twin/scenarios|federated-learning/rounds|resilience/plans|causal-experiments|tco-optimizer/scenarios)\",method=\"POST\",status_class!=\"5xx\"}[5m]))"
      valid_events: "sum(rate(teslasync_red_http_requests_total{route=~\"/api/v1/advanced-intelligence/(twin-lab/scenarios|journey-assurance/scenarios|charging-site-twin/scenarios|federated-learning/rounds|resilience/plans|causal-experiments|tco-optimizer/scenarios)\",method=\"POST\"}[5m]))"
    objective: 99.0
    window: 30d
    owner: analytics
    tags: [http, advanced-intelligence, scenarios, writes]

  - name: telemetry_freshness
    description: "Vehicle telemetry must arrive within 60 seconds. Good = vehicles with lag <= 60s."
    sli:
      good_events: "sum(teslasync_telemetry_lag_seconds <= 60)"
      valid_events: "sum(teslasync_telemetry_lag_seconds >= 0)"
    objective: 99.0
    window: 7d
    owner: ingest
    tags: [telemetry, freshness]

  - name: normalize_throughput
    description: "Normalize pipeline must sustain at least 100 signals per second."
    sli:
      good_events: "sum_over_time((teslasync_normalize_pipeline_throughput_signals_per_second >= 100)[5m:30s])"
      valid_events: "count_over_time(teslasync_normalize_pipeline_throughput_signals_per_second[5m:30s])"
    objective: 95.0
    window: 7d
    owner: ingest
    tags: [throughput, pipeline]

  - name: mqtt_no_backlog
    description: "MQTT consumer backlog must stay below 1000 messages."
    sli:
      good_events: "sum_over_time((teslasync_mqtt_consumer_backlog < 1000)[5m:30s])"
      valid_events: "count_over_time(teslasync_mqtt_consumer_backlog[5m:30s])"
    objective: 99.0
    window: 7d
    owner: ingest
    tags: [mqtt, backlog]

  - name: tesla_api_availability
    description: "Tesla upstream API circuit breaker must remain closed."
    sli:
      good_events: "sum_over_time((max(teslasync_tesla_api_circuit_breaker_state) == 0)[5m:30s])"
      valid_events: "count_over_time(teslasync_tesla_api_circuit_breaker_state[5m:30s])"
    objective: 99.0
    window: 30d
    owner: platform
    tags: [upstream, breaker]

  - name: sse_delivery
    description: "Server-sent-events broadcast latency p95 must remain under 2 seconds."
    sli:
      good_events: "sum(rate(teslasync_sse_broadcast_duration_seconds_bucket{le=\"2.0\"}[5m]))"
      valid_events: "sum(rate(teslasync_sse_broadcast_duration_seconds_count[5m]))"
    objective: 95.0
    window: 7d
    owner: realtime
    tags: [sse, latency]

  - name: frontend_lcp
    description: "Largest Contentful Paint p75 must stay below 2.5 seconds."
    sli:
      good_events: "sum(rate(teslasync_frontend_web_vitals_lcp_seconds_bucket{le=\"2.5\"}[5m]))"
      valid_events: "sum(rate(teslasync_frontend_web_vitals_lcp_seconds_count[5m]))"
    objective: 90.0
    window: 28d
    owner: frontend
    tags: [frontend, web-vitals]

  - name: fleet_ops_availability
    description: "Small-fleet operations endpoints must return non-5xx responses."
    sli:
      good_events: "sum(rate(teslasync_red_http_requests_total{route=~\"/api/v1/fleet-ops/.*\",status_class!=\"5xx\"}[5m]))"
      valid_events: "sum(rate(teslasync_red_http_requests_total{route=~\"/api/v1/fleet-ops/.*\"}[5m]))"
    objective: 99.5
    window: 30d
    owner: fleet
    tags: [http, fleet-ops]

  - name: fleet_ops_forecast_latency
    description: "Small-fleet utilization forecasts must complete within one second."
    sli:
      good_events: "sum(rate(teslasync_red_http_request_duration_seconds_bucket{route=\"/api/v1/fleet-ops/utilization-forecast\",le=\"1.0\"}[5m]))"
      valid_events: "sum(rate(teslasync_red_http_request_duration_seconds_count{route=\"/api/v1/fleet-ops/utilization-forecast\"}[5m]))"
    objective: 99.0
    window: 30d
    owner: fleet
    tags: [http, fleet-ops, latency]

  - name: benchmark_privacy_status_availability
    description: "Privacy benchmark status reads must avoid server errors."
    sli:
      good_events: "sum(rate(teslasync_red_http_requests_total{method=\"GET\",route=\"/api/v1/benchmarks/privacy\",status_class!=\"5xx\"}[5m]))"
      valid_events: "sum(rate(teslasync_red_http_requests_total{method=\"GET\",route=\"/api/v1/benchmarks/privacy\"}[5m]))"
    objective: 99.5
    window: 30d
    owner: analytics
    tags: [http, privacy, benchmarks]

  - name: benchmark_consent_availability
    description: "Privacy benchmark consent and revocation writes must avoid server errors."
    sli:
      good_events: "sum(rate(teslasync_red_http_requests_total{method=~\"PUT|DELETE\",route=\"/api/v1/benchmarks/privacy/consent\",status_class!=\"5xx\"}[5m]))"
      valid_events: "sum(rate(teslasync_red_http_requests_total{method=~\"PUT|DELETE\",route=\"/api/v1/benchmarks/privacy/consent\"}[5m]))"
    objective: 99.0
    window: 30d
    owner: analytics
    tags: [http, privacy, benchmarks]

  - name: benchmark_release_read_availability
    description: "Paginated privacy benchmark release reads must avoid server errors."
    sli:
      good_events: "sum(rate(teslasync_red_http_requests_total{method=\"GET\",route=\"/api/v1/benchmarks/releases\",status_class!=\"5xx\"}[5m]))"
      valid_events: "sum(rate(teslasync_red_http_requests_total{method=\"GET\",route=\"/api/v1/benchmarks/releases\"}[5m]))"
    objective: 99.5
    window: 30d
    owner: analytics
    tags: [http, privacy, benchmarks]

  - name: benchmark_release_creation_availability
    description: "Stable differential-privacy release creation must avoid server errors."
    sli:
      good_events: "sum(rate(teslasync_red_http_requests_total{method=\"POST\",route=\"/api/v1/benchmarks/releases\",status_class!=\"5xx\"}[5m]))"
      valid_events: "sum(rate(teslasync_red_http_requests_total{method=\"POST\",route=\"/api/v1/benchmarks/releases\"}[5m]))"
    objective: 99.0
    window: 30d
    owner: analytics
    tags: [http, privacy, benchmarks]

  - name: geofence_pricing_read_availability
    description: "Charging-place rate history, preview, and activity reads must avoid server errors."
    sli:
      good_events: "sum(rate(teslasync_red_http_requests_total{method=\"GET\",route=~\"/api/v1/geofences/(needs-review|rates/current|\\\\{geofenceID\\\\}/(rates(|/\\\\{rateID\\\\}/preview)|charging-summary|charging-activity))\",status_class!=\"5xx\"}[5m]))"
      valid_events: "sum(rate(teslasync_red_http_requests_total{method=\"GET\",route=~\"/api/v1/geofences/(needs-review|rates/current|\\\\{geofenceID\\\\}/(rates(|/\\\\{rateID\\\\}/preview)|charging-summary|charging-activity))\"}[5m]))"
    objective: 99.5
    window: 30d
    owner: platform
    tags: [http, geofences, pricing]

  - name: geofence_pricing_write_availability
    description: "Charging-place rate creation, apply/backfill, and lifecycle writes must avoid server errors."
    sli:
      good_events: "sum(rate(teslasync_red_http_requests_total{method=~\"POST|DELETE\",route=~\"/api/v1/geofences/\\\\{geofenceID\\\\}/(archive|unarchive|reviewed|rates(|/\\\\{rateID\\\\}(|/apply)))\",status_class!=\"5xx\"}[5m]))"
      valid_events: "sum(rate(teslasync_red_http_requests_total{method=~\"POST|DELETE\",route=~\"/api/v1/geofences/\\\\{geofenceID\\\\}/(archive|unarchive|reviewed|rates(|/\\\\{rateID\\\\}(|/apply)))\"}[5m]))"
    objective: 99.0
    window: 30d
    owner: platform
    tags: [http, geofences, pricing, writes]
