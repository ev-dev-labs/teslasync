  # NOTE: there is deliberately NO `frontend_time_to_usable_content` SLO.
  # `teslasync_frontend_time_to_usable_content_seconds` is only populated when a
  # page explicitly calls `markContentReady(token)` (web/src/lib/webVitalsReporter.ts).
  # Until pages are wired the histogram has no samples, and an SLO over an empty
  # denominator reports a permanent 100% success — a dishonest green light.
  # Add the SLO in the same change that wires the first pages; the readiness
  # gate and the exact wording are in docs/runbooks/frontend-rum-slos.md.

