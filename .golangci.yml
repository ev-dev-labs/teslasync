version: "2"
run:
  timeout: 5m
# Preserve the v1 analyzer set: gosimple is now part of staticcheck,
# while typechecking remains mandatory. Style/quick-fix analyzers were not enabled.
linters:
  enable:
    - depguard
    - govet
    - staticcheck
    - unused
    - ineffassign
  disable:
    - errcheck
  settings:
    staticcheck:
      checks:
        - SA*
        - S1*
    # Keep these architecture edges in sync with internal/arch/rules.go
    # and tools/archmetrics/main.go; only internal/app is a composition root.
    depguard:
      rules:
        adapter:
          list-mode: lax
          files:
            - '**/internal/adapter/**'
          allow:
            - github.com/ev-dev-labs/teslasync/internal/apilog
          deny:
            - pkg: github.com/ev-dev-labs/teslasync/internal/handler
              desc: 'ADR-007: adapters implement ports; they MUST NOT depend on HTTP transport.'
            - pkg: github.com/ev-dev-labs/teslasync/internal/app
              desc: 'ADR-007: adapters MUST NOT depend on use cases — app/*svc CONSUMES adapters via ports.'
            - pkg: github.com/ev-dev-labs/teslasync/internal/api
              desc: 'ADR-007: adapters MUST NOT depend on the FROZEN internal/api package.'
        app-svc:
          list-mode: lax
          files:
            - '**/internal/app/*/**'
          allow:
            - github.com/ev-dev-labs/teslasync/internal/apilog
          deny:
            - pkg: github.com/ev-dev-labs/teslasync/internal/handler
              desc: 'ADR-007: use cases MUST NOT depend on HTTP transport. Handlers depend on svcs, not the reverse.'
            - pkg: github.com/ev-dev-labs/teslasync/internal/api
              desc: 'ADR-007: use cases MUST NOT depend on the FROZEN internal/api package.'
        cmd:
          list-mode: lax
          files:
            - '**/cmd/**'
          allow:
            - github.com/ev-dev-labs/teslasync/internal/apilog
          deny:
            - pkg: github.com/ev-dev-labs/teslasync/internal/api
              desc: 'ADR-007: cmd entry points wire the composition root in internal/app — do NOT import internal/api directly.'
        domain:
          list-mode: lax
          files:
            - '**/internal/domain/**'
          allow:
            - github.com/ev-dev-labs/teslasync/internal/apilog
          deny:
            - pkg: github.com/ev-dev-labs/teslasync/internal/adapter
              desc: 'ADR-006: domain MUST NOT import adapters (adapters depend on domain, not the other way around).'
            - pkg: github.com/ev-dev-labs/teslasync/internal/database
              desc: 'ADR-006: domain MUST NOT import persistence (use repository ports declared in internal/port instead).'
            - pkg: github.com/ev-dev-labs/teslasync/internal/models
              desc: 'ADR-006: domain MUST NOT import DTOs (models map to/from domain, not the other way around).'
            - pkg: github.com/ev-dev-labs/teslasync/internal/port
              desc: 'ADR-006: domain MUST NOT import ports — ports live at the consumer (svc) boundary.'
            - pkg: github.com/ev-dev-labs/teslasync/internal/handler
              desc: 'ADR-006: domain MUST NOT import HTTP transport (handlers depend on domain via svcs, not the other way around).'
            - pkg: github.com/ev-dev-labs/teslasync/internal/api
              desc: 'ADR-006: domain MUST NOT import the FROZEN internal/api package.'
            - pkg: github.com/ev-dev-labs/teslasync/internal/app
              desc: 'ADR-006: domain MUST NOT import use cases (app/*svc depend on domain, not the other way around).'
        handler:
          list-mode: lax
          files:
            - '**/internal/handler/**'
          allow:
            - github.com/ev-dev-labs/teslasync/internal/tesla_pipeline
          deny:
            - pkg: github.com/ev-dev-labs/teslasync/internal/database
              desc: 'ADR-009: handlers MUST be thin — call an internal/app/*svc use case instead of querying the DB directly.'
            - pkg: github.com/ev-dev-labs/teslasync/internal/adapter
              desc: 'ADR-009: handlers MUST NOT call adapters directly — go through internal/app/*svc + ports.'
            - pkg: github.com/ev-dev-labs/teslasync/internal/tesla
              desc: 'ADR-009: handlers MUST NOT call Tesla vendor code directly — go through internal/app/*svc + ports.'
            - pkg: github.com/ev-dev-labs/teslasync/internal/mqtt
              desc: 'ADR-009: handlers MUST NOT publish to MQTT directly — go through internal/app/*svc + ports.'
            - pkg: github.com/ev-dev-labs/teslasync/internal/redis
              desc: 'ADR-009: handlers MUST NOT call Redis directly — go through internal/app/*svc + ports.'
            - pkg: github.com/ev-dev-labs/teslasync/internal/geocoding
              desc: 'ADR-009: handlers MUST NOT call geocoding adapters directly — go through internal/app/*svc + ports.'
        main:
          list-mode: lax
          files:
            - $all
          allow:
            - $gostd
            - github.com/ev-dev-labs/teslasync
        models:
          list-mode: lax
          files:
            - '**/internal/models/**'
          allow:
            - github.com/ev-dev-labs/teslasync/internal/apilog
          deny:
            - pkg: github.com/ev-dev-labs/teslasync/internal/database
              desc: 'ADR-006: models are DTOs only — they MUST NOT import persistence.'
            - pkg: github.com/ev-dev-labs/teslasync/internal/adapter
              desc: 'ADR-006: models are DTOs only — they MUST NOT import adapters.'
            - pkg: github.com/ev-dev-labs/teslasync/internal/handler
              desc: 'ADR-006: models are DTOs only — they MUST NOT import HTTP transport.'
            - pkg: github.com/ev-dev-labs/teslasync/internal/app
              desc: 'ADR-006: models are DTOs only — they MUST NOT import use cases.'
            - pkg: github.com/ev-dev-labs/teslasync/internal/api
              desc: 'ADR-006: models are DTOs only — they MUST NOT import the FROZEN internal/api package.'
        port:
          list-mode: lax
          files:
            - '**/internal/port/**'
          allow:
            - github.com/ev-dev-labs/teslasync/internal/apilog
          deny:
            - pkg: github.com/ev-dev-labs/teslasync/internal/adapter
              desc: 'ADR-007: port packages declare interfaces only; adapters implement them, not the reverse.'
            - pkg: github.com/ev-dev-labs/teslasync/internal/database
              desc: 'ADR-007: port MUST NOT depend on persistence — repository ports describe DB operations abstractly.'
            - pkg: github.com/ev-dev-labs/teslasync/internal/handler
              desc: 'ADR-007: port MUST NOT depend on HTTP transport.'
            - pkg: github.com/ev-dev-labs/teslasync/internal/app
              desc: 'ADR-007: port MUST NOT depend on use cases (app/*svc IS the consumer of ports).'
            - pkg: github.com/ev-dev-labs/teslasync/internal/api
              desc: 'ADR-007: port MUST NOT depend on the FROZEN internal/api package.'
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - staticcheck
          - unused
        path: _test\.go
      - linters:
          - unused
        path: doc\.go
      - linters:
          - staticcheck
        text: 'SA1019:'
      - linters:
          - unused
        path: internal[/\\]ai[/\\]tools[/\\].*\.go
        # Same documented per-tool bounds exception; v2 dropped identifier backticks.
        text: const `?\w*(Max[A-Z]\w*)`? is unused
      - linters:
          - staticcheck
        text: 'SA9003: empty branch'
    paths:
      - web/node_modules
      - tmp
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
