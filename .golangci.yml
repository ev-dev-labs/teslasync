run:
  timeout: 5m

linters:
  disable:
    - errcheck
  enable:
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck

issues:
  exclude-dirs:
    - web/node_modules
  exclude-rules:
    - path: _test\.go
      linters:
        - staticcheck
    - path: doc\.go
      linters:
        - unused
  max-issues-per-linter: 50
  max-same-issues: 10
