  # SentryMode is the security-armed state (vehicle_state, enum
  # SentryModeState). Routes to security_event because every
  # transition is a discrete security-relevant event; the writer
  # diffs against the previous observation and emits one row per
  # transition into the security_events hypertable.
  - field: SentryMode
    dest: security_event
  # ServiceMode is the technician-unlock flag (vehicle_state, bool).
  # safety_snapshots.service_mode (migrations/000170_snapshots_si.up.sql
  # line 312) carries this as a continuous-value flag. State changes
  # are also surfaced on security_events by the writer; routing here
  # is for the hot-table snapshot read path.
  - field: ServiceMode
    dest: safety_snapshot
    column: service_mode
  - field: Soc
    dest: signal_log
  # SoftwareUpdate* atomics (vehicle_state). Update-progress UI feeds
