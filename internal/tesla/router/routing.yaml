    column: rear_right_vbat_v
  # DoorState flatten atomics. The codec parses the JSON-shaped
  # string_value emitted for the DoorState compound (proto field 58,
  # vehicle_state) via flattenDoorStateJSON in
  # internal/tesla/codec/flatten.go and expands it into 6 boolean
  # atomics: driver/passenger × front/rear, plus front/rear trunk.
  # Note the JSON wire shape uses FrontTrunk/RearTrunk (the codec
  # preserves the producer's field names verbatim — see the comment
  # in flatten.go), which is why these atomics differ from the proto
  # Doors message's TrunkFront/TrunkRear naming.
  #
  # Routing rule: door states route to signal_log for the change-feed
  # analytics. Door open/close transitions surface on the security
  # timeline through the security_events writer, which reads from
  # signal_log rather than the router dispatching here directly.
  - field: DoorStateDriverFront
    dest: signal_log
  - field: DoorStateDriverRear
    dest: signal_log
  - field: DoorStateFrontTrunk
    dest: signal_log
  - field: DoorStatePassengerFront
    dest: signal_log
  - field: DoorStatePassengerRear
    dest: signal_log
  - field: DoorStateRearTrunk
    dest: signal_log
  - field: DriveRail
    dest: drive_telemetry
    column: drive_rail
  - field: DriverSeatBelt
    dest: climate_snapshot
    column: driver_seat_belt
  - field: DriverSeatOccupied
    dest: climate_snapshot
    column: driver_seat_occupied
  - field: EnergyRemaining
    dest: signal_log
  - field: EstBatteryRange
    dest: signal_log
  - field: EstimatedHoursToChargeTermination
    dest: signal_log
  - field: ExpectedEnergyPercentAtTripArrival
    dest: signal_log
  - field: FastChargerPresent
    dest: signal_log
  - field: FastChargerType
    dest: charging_telemetry
    column: fast_charger_type
    also_signal_log: true
  # Window-position atomics (vehicle_state, enum WindowState). Front-
  # driver, front-passenger, rear-driver, rear-passenger. No hot
  # column exists for window state; the change feed in signal_log
  # is sufficient for the cabin-state timeline.
  - field: FdWindow
    dest: signal_log
  - field: FpWindow
    dest: signal_log
  - field: Gear
    dest: drive_telemetry
    column: gear
  - field: GpsHeading
    dest: positions
    column: heading_deg
  - field: GpsState
    dest: positions
    column: gps_state
  # GuestMode + Homelink atomics (vehicle_state). Low-cardinality
  # ordinal/boolean state with no hot column — change feed in
  # signal_log drives the access-control and "near home" UI.
  - field: GuestModeEnabled
    dest: signal_log
  - field: GuestModeMobileAccessState
    dest: signal_log
  - field: HomelinkDeviceCount
    dest: signal_log
  - field: HomelinkNearby
    dest: signal_log
  - field: HvacACEnabled
    dest: climate_snapshot
    column: hvac_ac_enabled
  - field: HvacAutoMode
    dest: climate_snapshot
    column: hvac_auto_mode
  - field: HvacFanSpeed
    dest: climate_snapshot
    column: hvac_fan_speed
  - field: HvacFanStatus
    dest: climate_snapshot
    column: hvac_fan_status
  - field: HvacLeftTemperatureRequest
    dest: climate_snapshot
    column: hvac_left_request_c
  - field: HvacPower
    dest: climate_snapshot
    column: hvac_power
    also_signal_log: true
  - field: HvacRightTemperatureRequest
    dest: climate_snapshot
    column: hvac_right_request_c
  - field: HvacSteeringWheelHeatAuto
    dest: climate_snapshot
    column: hvac_steering_wheel_heat_auto
  - field: HvacSteeringWheelHeatLevel
