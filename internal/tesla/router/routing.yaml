  # DestinationLocationLatitude/Longitude are the codec-flattened atomics of
  # the DestinationLocation compound (proto field 112). They route to
  # signal_log only — there is no current-state column on positions for
  # navigation destination coordinates (positions.lat/lng carry the live
  # vehicle position). The pair is emitted by the codec with a shared
  # EmittedAt timestamp so any downstream consumer can re-pair them.
  - field: DestinationLocationLatitude
    dest: signal_log
  - field: DestinationLocationLongitude
    dest: signal_log
  - field: DestinationName
    dest: signal_log
  - field: DetailedChargeState
    dest: signal_log
  # Powertrain Drive-Inverter atomics (Category=="powertrain" in
  # protomodel.Signals). Every powertrain field maps to a motor_snapshots
  # SI column from migrations/000170_snapshots_si.up.sql lines 125-166.
  # Per-corner suffix convention: F=front, R=rear (single-motor or shared),
  # REL=rear-left, RER=rear-right (Plaid tri-motor / Cybertruck quad-motor).
  # Temperatures are UnitKindTemperature and pass through normalize.toSI;
  # axle speeds are UnitKindNone (RPM is the field-natural unit).
  - field: DiAxleSpeedF
    dest: motor_snapshot
    column: front_axle_speed_rpm
  - field: DiAxleSpeedR
    dest: motor_snapshot
    column: rear_axle_speed_rpm
  - field: DiAxleSpeedREL
    dest: motor_snapshot
    column: rear_left_axle_speed_rpm
  - field: DiAxleSpeedRER
    dest: motor_snapshot
    column: rear_right_axle_speed_rpm
  - field: DiHeatsinkTF
    dest: motor_snapshot
    column: front_heatsink_c
  - field: DiHeatsinkTR
    dest: motor_snapshot
    column: rear_heatsink_c
  - field: DiHeatsinkTREL
    dest: motor_snapshot
    column: rear_left_heatsink_c
  - field: DiHeatsinkTRER
    dest: motor_snapshot
    column: rear_right_heatsink_c
  - field: DiInverterTF
    dest: motor_snapshot
    column: front_inverter_c
  - field: DiInverterTR
    dest: motor_snapshot
    column: rear_inverter_c
  - field: DiInverterTREL
    dest: motor_snapshot
    column: rear_left_inverter_c
  - field: DiInverterTRER
    dest: motor_snapshot
    column: rear_right_inverter_c
  - field: DiMotorCurrentF
    dest: motor_snapshot
    column: front_motor_current_a
  - field: DiMotorCurrentR
    dest: motor_snapshot
    column: rear_motor_current_a
  - field: DiMotorCurrentREL
    dest: motor_snapshot
    column: rear_left_motor_current_a
  - field: DiMotorCurrentRER
    dest: motor_snapshot
    column: rear_right_motor_current_a
  - field: DiSlaveTorqueCmd
    dest: motor_snapshot
    column: torque_command_nm
  - field: DiStateF
    dest: motor_snapshot
    column: front_state
  - field: DiStateR
    dest: motor_snapshot
    column: rear_state
  - field: DiStateREL
    dest: motor_snapshot
    column: rear_left_state
  - field: DiStateRER
    dest: motor_snapshot
    column: rear_right_state
  - field: DiStatorTempF
    dest: motor_snapshot
    column: front_stator_c
  - field: DiStatorTempR
    dest: motor_snapshot
    column: rear_stator_c
  - field: DiStatorTempREL
    dest: motor_snapshot
    column: rear_left_stator_c
  - field: DiStatorTempRER
    dest: motor_snapshot
    column: rear_right_stator_c
  - field: DiTorqueActualF
