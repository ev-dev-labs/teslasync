    column: front_torque_nm
  - field: DiTorqueActualR
    dest: motor_snapshot
    column: rear_torque_nm
  - field: DiTorqueActualREL
    dest: motor_snapshot
    column: rear_left_torque_nm
  - field: DiTorqueActualRER
    dest: motor_snapshot
    column: rear_right_torque_nm
  - field: DiTorquemotor
    dest: motor_snapshot
    column: torque_motor_nm
  - field: DiVBatF
    dest: motor_snapshot
    column: front_vbat_v
  - field: DiVBatR
    dest: motor_snapshot
    column: rear_vbat_v
  - field: DiVBatREL
    dest: motor_snapshot
    column: rear_left_vbat_v
  - field: DiVBatRER
