  # LocationLatitude/Longitude are the codec-flattened atomics of the
  # Location compound (proto field 21). They form a flatten group: the
  # codec emits both in the same payload with a shared EmittedAt
  # timestamp, and the positions writer (added in prompt 0061) buffers
  # one half until the other arrives so the (lat, lng) pair lands on a
  # single row. Routing is field-static per ADR-004 #8 — the pair-up
  # logic lives in the writer, not here. Routing the compound `Location`
  # itself is forbidden (the codec never emits it past the flatten step).
  - field: LocationLatitude
    dest: positions
    column: lat
  - field: LocationLongitude
    dest: positions
    column: lng
  # Locked is the door-lock state (safety_security, bool). Routes to
  # security_event because every lock/unlock transition is a discrete
  # security-relevant event; the writer diffs against the previous
  # observation and emits one row per transition into the
  # security_events hypertable.
  - field: Locked
    dest: security_event
  - field: LongitudinalAcceleration
    dest: drive_telemetry
    column: longitudinal_acceleration_mps2
  # MilesSinceReset is the lifetime distance counter for the user-
  # resettable trip meter (safety_security, UnitKindDistance). The
  # protomodel codegen tags this field UnitKindDistance so
  # normalize.toSI converts to meters via the vehicle_unit_history
  # layer; the SI value lands in signal_log. Despite the legacy
  # "Miles" name the wire value is in the active SettingDistanceUnit.
  - field: MilesSinceReset
    dest: signal_log
  - field: MilesToArrival
