  # SettingDistanceUnit (km or mi). normalize.toSI converts to meters
  # via the vehicle_unit_history layer; the SI value lands in
  # signal_log. The vehicle_live_state writer mirrors the latest meters
  # value into vehicle_live_state.odometer_m for the L2 live-state
  # contract — that mirror is writer-internal and is NOT a separate
  # routing destination.
  - field: Odometer
    dest: signal_log
  # OriginLocationLatitude/Longitude are the codec-flattened atomics of
