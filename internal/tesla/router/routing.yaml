  - field: ScheduledChargingPending
    dest: signal_log
  - field: ScheduledChargingStartTime
    dest: signal_log
  - field: ScheduledDepartureTime
    dest: signal_log
  - field: SeatHeaterLeft
    dest: climate_snapshot
    column: seat_heater_left
  - field: SeatHeaterRearCenter
    dest: climate_snapshot
    column: seat_heater_rear_center
  - field: SeatHeaterRearLeft
    dest: climate_snapshot
    column: seat_heater_rear_left
  - field: SeatHeaterRearRight
    dest: climate_snapshot
    column: seat_heater_rear_right
  - field: SeatHeaterRight
    dest: climate_snapshot
    column: seat_heater_right
  - field: SeatVentEnabled
    dest: climate_snapshot
    column: seat_vent_enabled
  - field: SemitruckPassengerSeatFoldPosition
