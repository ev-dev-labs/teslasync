  # CurrentLimitMph is the active speed-limit-mode threshold. The
  # protomodel codegen tags this field UnitKindDistance (the wire value
  # is in the active SettingDistanceUnit, not always mph despite the
  # legacy name); normalize.toSI converts to meters via the
  # vehicle_unit_history layer and the SI value lands in signal_log.
  - field: CurrentLimitMph
    dest: signal_log
  - field: DCChargingEnergyIn
    dest: charging_telemetry
    column: dc_charging_energy_in_wh
    also_signal_log: true
  - field: DCChargingPower
