  # DoorState flatten atomics. The codec parses the JSON-shaped
  # string_value emitted for the DoorState compound (proto field 58,
  # vehicle_state) via flattenDoorStateJSON in
  # internal/tesla/codec/flatten.go and expands it into 6 boolean
  # atomics: driver/passenger × front/rear, plus front/rear trunk.
  # Note the JSON wire shape uses FrontTrunk/RearTrunk (the codec
  # preserves the producer's field names verbatim — see the comment
  # in flatten.go), which is why these atomics differ from the proto
  # Doors message's TrunkFront/TrunkRear naming.
  #
  # Routing rule: door states route to signal_log for the change-feed
  # analytics. Door open/close transitions surface on the security
  # timeline through the security_events writer, which reads from
  # signal_log rather than the router dispatching here directly.
  - field: DoorStateDriverFront
    dest: signal_log
  - field: DoorStateDriverRear
    dest: signal_log
  - field: DoorStateFrontTrunk
    dest: signal_log
  - field: DoorStatePassengerFront
    dest: signal_log
  - field: DoorStatePassengerRear
    dest: signal_log
  - field: DoorStateRearTrunk
