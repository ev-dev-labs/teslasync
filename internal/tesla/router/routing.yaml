  # Semitruck per-position TPMS pressures (safety_security,
  # UnitKindPressure, ValueKindString). The Re1L0/Re1L1/Re1R0/Re1R1
  # naming maps to "rear axle 1, left/right, inner/outer" and
  # Re2L0/Re2L1/Re2R0/Re2R1 to "rear axle 2, left/right, inner/outer"
  # for the dual-rear-axle Semi tractor. tire_pressure_snapshots
  # models only the four passenger-car corners; the Semi six-axle
  # layout has no hot column and lands in signal_log. The values are
  # string-typed on the wire (the Semi producer encodes the pressure
  # as a serialized string rather than a float), so units conversion
  # does not apply — the raw string is preserved in signal_log.
  - field: SemitruckTpmsPressureRe1L0
    dest: signal_log
  - field: SemitruckTpmsPressureRe1L1
    dest: signal_log
  - field: SemitruckTpmsPressureRe1R0
