  # limit feature (vehicle_state). SpeedLimitWarning (already routed)
  # is the audible-alert toggle and is distinct.
  - field: SpeedLimitMode
    dest: signal_log
  - field: SpeedLimitWarning
    dest: signal_log
  - field: SuperchargerSessionTripPlanner
    dest: signal_log
  - field: TimeToFullCharge
    dest: signal_log
  # Cybertruck tonneau atomics (vehicle_state). Low-cardinality
  # ordinal/percent state; signal_log drives the cargo-bay timeline
  # UI. TonneauTentMode is an enum tracking the deployable tent
  # accessory state.
  - field: TonneauOpenPercent
    dest: signal_log
  - field: TonneauPosition
    dest: signal_log
  - field: TonneauTentMode
    dest: signal_log
  # TpmsHardWarnings flatten atomics (safety_security). The codec
  # parses the proto Value_TireLocationValue carried by TpmsHardWarnings
  # (Field=224, IsCompound=true) via flattenTireLocation in
  # internal/tesla/codec/flatten.go and expands it into 10 boolean
  # atomics: the four passenger-car corners (Front/Rear × Left/Right)
  # plus six Semi-truck positions (SemiMiddleAxleLeft2/Right2 and
  # SemiRearAxleLeft/Left2/Right/Right2). The "_2" suffix preserves
  # the upstream proto's Get*_2 accessor naming for the second-axle
  # tires on dual-rear-axle Semis.
  #
  # Routing rule: per-corner hard-warning bools route to signal_log
  # for the change feed. tire_pressure_snapshots.hard_warnings is a
  # single TEXT token aggregating the per-corner bits; the snapshot
  # writer reads the per-corner change stream from signal_log to
  # populate the per-corner *_status columns and the rolled-up
  # hard_warnings token, rather than the router dispatching directly
  # to the snapshot table for each corner.
  - field: TpmsHardWarningsFrontLeft
    dest: signal_log
  - field: TpmsHardWarningsFrontRight
    dest: signal_log
  - field: TpmsHardWarningsRearLeft
    dest: signal_log
  - field: TpmsHardWarningsRearRight
    dest: signal_log
  - field: TpmsHardWarningsSemiMiddleAxleLeft2
    dest: signal_log
  - field: TpmsHardWarningsSemiMiddleAxleRight2
    dest: signal_log
  - field: TpmsHardWarningsSemiRearAxleLeft
    dest: signal_log
  - field: TpmsHardWarningsSemiRearAxleLeft2
    dest: signal_log
  - field: TpmsHardWarningsSemiRearAxleRight
    dest: signal_log
  - field: TpmsHardWarningsSemiRearAxleRight2
    dest: signal_log
  # TpmsLastSeenPressureTime{Fl,Fr,Rl,Rr} (safety_security, ValueKindFloat,
  # UnitKindNone). The wire value is a unix epoch in seconds; the
  # tire_pressure_snapshots writer converts to TIMESTAMPTZ when
  # populating the per-corner *_last_seen_at columns. UnitKindNone so
  # normalize.toSI is a pass-through — the writer owns the
  # epoch→timestamp conversion.
  - field: TpmsLastSeenPressureTimeFl
    dest: tire_pressure_snapshot
    column: front_left_last_seen_at
  - field: TpmsLastSeenPressureTimeFr
    dest: tire_pressure_snapshot
    column: front_right_last_seen_at
  - field: TpmsLastSeenPressureTimeRl
    dest: tire_pressure_snapshot
    column: rear_left_last_seen_at
  - field: TpmsLastSeenPressureTimeRr
    dest: tire_pressure_snapshot
    column: rear_right_last_seen_at
  # TpmsPressure{Fl,Fr,Rl,Rr} (safety_security, UnitKindPressure).
  # normalize.toSI converts the wire value (psi or bar depending on
  # SettingPressureUnit) to Pascals via units.ToSI; the SI value
  # lands in tire_pressure_snapshots.{front,rear}_{left,right}_pa.
  - field: TpmsPressureFl
    dest: tire_pressure_snapshot
    column: front_left_pa
  - field: TpmsPressureFr
    dest: tire_pressure_snapshot
    column: front_right_pa
  - field: TpmsPressureRl
    dest: tire_pressure_snapshot
    column: rear_left_pa
  - field: TpmsPressureRr
    dest: tire_pressure_snapshot
    column: rear_right_pa
  # TpmsSoftWarnings flatten atomics (safety_security). Mirrors
  # TpmsHardWarnings in shape (10 booleans across the four passenger-
  # car corners and six Semi positions); same routing rationale —
  # signal_log change feed, with the snapshot writer aggregating to
  # the soft_warnings TEXT and per-corner *_status columns.
  - field: TpmsSoftWarningsFrontLeft
    dest: signal_log
  - field: TpmsSoftWarningsFrontRight
    dest: signal_log
  - field: TpmsSoftWarningsRearLeft
    dest: signal_log
  - field: TpmsSoftWarningsRearRight
    dest: signal_log
  - field: TpmsSoftWarningsSemiMiddleAxleLeft2
    dest: signal_log
  - field: TpmsSoftWarningsSemiMiddleAxleRight2
    dest: signal_log
  - field: TpmsSoftWarningsSemiRearAxleLeft
    dest: signal_log
  - field: TpmsSoftWarningsSemiRearAxleLeft2
    dest: signal_log
  - field: TpmsSoftWarningsSemiRearAxleRight
    dest: signal_log
  - field: TpmsSoftWarningsSemiRearAxleRight2
    dest: signal_log
  # ValetModeEnabled is the per-trip restricted-driver flag
  # (vehicle_state, bool). Routes to security_event because every
  # transition is a security-relevant event; the writer diffs
  # against the previous observation and emits one row per
  # transition into the security_events hypertable.
  - field: ValetModeEnabled
    dest: security_event
  - field: VehicleSpeed
    dest: drive_telemetry
    column: speed_mps
  - field: WiperHeatEnabled
    dest: climate_snapshot
    column: wiper_heat_enabled
