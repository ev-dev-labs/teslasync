  - field: SoftwareUpdateDownloadPercentComplete
    dest: signal_log
  - field: SoftwareUpdateExpectedDurationMinutes
    dest: signal_log
  - field: SoftwareUpdateInstallationPercentComplete
    dest: signal_log
  - field: SoftwareUpdateScheduledStartTime
