  - field: ChargePortDoorOpen
    dest: charging_telemetry
    column: charge_port_door_open
    also_signal_log: true
  - field: ChargePortLatch
    dest: charging_telemetry
    column: charge_port_latch
    also_signal_log: true
  - field: ChargeRateMilePerHour
