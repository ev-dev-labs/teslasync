    column: hvac_steering_wheel_heat_level
  # Hvil is the high-voltage interlock loop status (powertrain category,
  # proto 33, Enum HvilStatus). Routes to motor_snapshots.hvil_state which
  # the writer fills via the protomodel HvilStatus enum parser.
  - field: Hvil
    dest: motor_snapshot
    column: hvil_state
  - field: IdealBatteryRange
    dest: signal_log
  - field: InsideTemp
    dest: climate_snapshot
    column: inside_temp_c
    also_signal_log: true
  # IsolationResistance is the high-voltage isolation resistance
  # measurement (powertrain category, proto 11). Routes to
  # motor_snapshots.isolation_resistance_ohm (Ohms, SI).
  - field: IsolationResistance
    dest: motor_snapshot
    column: isolation_resistance_ohm
  - field: LateralAcceleration
    dest: drive_telemetry
    column: lateral_acceleration_mps2
  - field: LifetimeEnergyGainedRegen
    dest: drive_telemetry
    column: lifetime_energy_gained_regen_wh
  - field: LifetimeEnergyUsed
    dest: signal_log
  - field: LifetimeEnergyUsedDrive
    dest: drive_telemetry
    column: lifetime_energy_used_drive_wh
  # Exterior-light atomics (vehicle_state). Low-cardinality bool/enum
  # state; signal_log drives the lights-on timeline and is the source
  # for the security-event writer's hazard/turn-signal correlation.
  - field: LightsHazardsActive
    dest: signal_log
  - field: LightsHighBeams
    dest: signal_log
  - field: LightsTurnSignal
    dest: signal_log
  - field: LocatedAtFavorite
    dest: signal_log
  - field: LocatedAtHome
    dest: signal_log
  - field: LocatedAtWork
    dest: signal_log
  # LocationLatitude/Longitude are the codec-flattened atomics of the
  # Location compound (proto field 21). They form a flatten group: the
  # codec emits both in the same payload with a shared EmittedAt
  # timestamp, and the positions writer (added in prompt 0061) buffers
  # one half until the other arrives so the (lat, lng) pair lands on a
  # single row. Routing is field-static per ADR-004 #8 — the pair-up
  # logic lives in the writer, not here. Routing the compound `Location`
  # itself is forbidden (the codec never emits it past the flatten step).
  - field: LocationLatitude
    dest: positions
    column: lat
  - field: LocationLongitude
    dest: positions
    column: lng
  - field: LongitudinalAcceleration
    dest: drive_telemetry
    column: longitudinal_acceleration_mps2
  - field: MilesToArrival
    dest: signal_log
  - field: MinutesToArrival
    dest: signal_log
  - field: ModuleTempMax
    dest: signal_log
  - field: ModuleTempMin
    dest: signal_log
  - field: NotEnoughPowerToHeat
    dest: signal_log
  - field: NumBrickVoltageMax
    dest: signal_log
  - field: NumBrickVoltageMin
    dest: signal_log
  - field: NumModuleTempMax
    dest: signal_log
  - field: NumModuleTempMin
    dest: signal_log
  # Odometer carries the vehicle's lifetime distance in the active
  # SettingDistanceUnit (km or mi). normalize.toSI converts to meters
  # via the vehicle_unit_history layer; the SI value lands in
  # signal_log. The vehicle_live_state writer mirrors the latest meters
  # value into vehicle_live_state.odometer_m for the L2 live-state
  # contract — that mirror is writer-internal and is NOT a separate
  # routing destination.
  - field: Odometer
    dest: signal_log
  # OriginLocationLatitude/Longitude are the codec-flattened atomics of
  # the OriginLocation compound (proto field 111). Like the
  # DestinationLocation pair, they route to signal_log only — no
  # current-state column exists on positions for the trip origin.
  - field: OriginLocationLatitude
    dest: signal_log
  - field: OriginLocationLongitude
    dest: signal_log
  - field: OutsideTemp
    dest: climate_snapshot
    column: outside_temp_c
    also_signal_log: true
  - field: PackCurrent
    dest: signal_log
  - field: PackVoltage
    dest: signal_log
  # PairedPhoneKeyAndKeyFobQty is the count of paired phone keys + key
  # fobs (vehicle_state). Static config-shaped value, no hot column.
  - field: PairedPhoneKeyAndKeyFobQty
    dest: signal_log
  - field: PassengerSeatBelt
    dest: climate_snapshot
    column: passenger_seat_belt
  - field: PedalPosition
    dest: drive_telemetry
    column: pedal_position_pct
  - field: PowershareHoursLeft
