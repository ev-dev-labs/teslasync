  # configuration state; signal_log carries the change feed and the
  # driver-assist UI reads the latest value from there. No hot column
  # in safety_snapshots — the snapshot table tracks service / wiper /
  # crash flags, not the per-feature ADAS toggles.
  - field: AutomaticBlindSpotCamera
    dest: signal_log
  - field: AutomaticEmergencyBrakingOff
    dest: signal_log
