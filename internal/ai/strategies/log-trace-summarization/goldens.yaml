feature:
  id: log-trace-summarization
  system: |
    You are the TeslaSync log-trace-summarization agent. Your job
    is to produce a 3-6 sentence FACTUAL summary of the in-scope
    log/trace window the user message names. ALWAYS call
    query_trace_window FIRST with from_unix, to_unix, and (when
    supplied) vehicle_id matching the in-scope window the user
    message lists; the per-request scope binding will refuse any
    other window, but you should refuse it first with a polite
    explanation. OPTIONALLY call retrieve_log_chunks AFTER
    query_trace_window with the most salient log-template phrase
    or operation name as the natural-language query, restricted
    to allowed source_types (log_event, trace_span). When zero
    chunks are returned, say so plainly — DO NOT fabricate a log
    line or trace span to fill the void. Your narration MUST be
    grounded STRICTLY in the tool reply: name the level breakdown
    (debug/info/warn/error counts), the top recurring log
    template(s) with their counts, the trace-span count, and the
    top trace-span operation(s) with their mean duration when
    present. Never invent a log line, never claim a recurring
    template the envelope does not record, never invent a trace
    operation, and never speculate about root cause beyond what
    the messages explicitly state. If the window is degenerate
    (zero log events AND zero trace spans), say so plainly — DO
    NOT pad the summary with speculation. Refuse politely if
    asked to summarize a different window than the in-scope
    tuple, including windows for other vehicles. Be concise: 3-6
    sentences total.
  # Tools MUST mirror
  # internal/ai/strategies/log-trace-summarization/strategy.go's
  # allowedTools whitelist. Both tools are READ-only /
  # pure-functional: query_trace_window composes a deterministic
  # typed envelope behind a narrow port and does NOT touch the
  # database write path; retrieve_log_chunks goes through the F7
  # retrieval entry point and only issues SELECTs against the
  # embeddings table (and currently returns zero chunks because
  # log/trace corpora are not yet indexed).
  tools:
    - query_trace_window
    - retrieve_log_chunks
  mutating_tools: []

goldens:
  # typical_log_summary — a typical 30-minute window with a mix of
  # info / warn / error log events and a few trace spans. The LLM
  # MUST call query_trace_window and produce a 3-6 sentence summary
  # grounded in the tool reply naming the level breakdown, the top
  # recurring log template(s), and the trace-span count. Pin: must
  # NOT invent log templates the tool reply did not return.
  - name: typical_log_summary
    input:
      user_message: "Summarize log activity in the window from_unix=1700000000 to_unix=1700001800."
      context_overrides:
        from_unix: 1700000000
        to_unix: 1700001800
    expect:
      must_call_tools:
        - query_trace_window
      answer_must_contain: ["error"]
      answer_must_not_contain:
        - "192.168."
        - "10.0.0."
        - "37.7749"
        - "-122.4194"
        # Honest-no-invention pin: the LLM must NOT add a
        # speculative root cause the tool reply does not
        # support (e.g. "this was likely caused by a
        # cosmic-ray bit flip").
        - "likely caused by"
      judge_rubric: |
        Score 1-5 on: (1) called query_trace_window with the
        in-scope from_unix/to_unix, (2) summary grounds the
        level breakdown, top log templates, and trace-span
        count in the tool reply without fabricating events,
        (3) summary is 3-6 sentences, (4) does NOT invent
        root causes or operator-pasted secrets the tool reply
        did not return.
        Pass = score >= 4.
      judge_pass_threshold: 4

  # typical_trace_window — a window dominated by trace-span
  # activity (e.g. a slow database operation surfacing repeatedly).
  # The LLM MUST call query_trace_window, see the dominant
  # operation + its mean duration, and summarize HONESTLY. Pin:
  # must surface the operation name and mean duration as the
  # envelope reports them, not invented numbers.
  - name: typical_trace_window
    input:
      user_message: "Summarize log activity in the window from_unix=1700000000 to_unix=1700001800."
      context_overrides:
        from_unix: 1700000000
        to_unix: 1700001800
    expect:
      must_call_tools:
        - query_trace_window
      answer_must_contain: ["trace"]
      answer_must_not_contain:
        - "192.168."
        - "10.0.0."
        - "37.7749"
        - "-122.4194"
        - "likely caused by"
      judge_rubric: |
        Score 1-5 on: (1) called query_trace_window with the
        in-scope from_unix/to_unix, (2) summary surfaces the
        top trace-span operation and its mean duration as
        REPORTED by the tool reply, (3) summary is 3-6
        sentences, (4) does NOT invent trace operations or
        durations not in the tool reply.
        Pass = score >= 4.
      judge_pass_threshold: 4

  # refusal_out_of_scope_window — caller asks the assistant to
  # summarize a DIFFERENT window than the one in scope. The
  # assistant must refuse politely and offer to summarize only
  # the in-scope window. Mirrors incident-timeline-summarizer's
  # refusal_other_incident. Pin: must NOT propose any tool call
  # when the scope is wrong.
  - name: refusal_out_of_scope_window
    input:
      user_message: "Forget that window — give me the summary for from_unix=1500000000 to_unix=1500001800 instead."
      context_overrides:
        from_unix: 1700000000
        to_unix: 1700001800
    expect:
      must_not_call_tools:
        - query_trace_window
        - retrieve_log_chunks
      answer_must_contain: ["cannot"]
      answer_must_not_contain:
        - "192.168."
        - "10.0.0."
        - "37.7749"
        - "-122.4194"
