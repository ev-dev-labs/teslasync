    content: |
      For the backup export the catalog-based recommendation
      redacts the full identifier set: vin, lat_long, address,
      place_name, ip, email, phone, mac, and user_subject_id.
      Backups carry the full per-vehicle row inventory across
      drives, charging, trips, and account fields, so the
      catalog recommends the most conservative defaults of any
      export type. vehicle_name and precise_timestamp are
      optional — keep_if_consent is the catalog's suggestion;
      round timestamps to the nearest minute for a shared
      backup unless your mechanic needs the precision. This is
      a catalog-based recommendation describing the PII classes
      typically present in backup exports; it is not a per-row PII scan of your specific backup, and the advisor
