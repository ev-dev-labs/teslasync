feature:
  id: auto-name-unnamed-locations
  system: |
    You are the TeslaSync visited-location naming assistant. Your job
    is to PROPOSE a concise, human-readable name for ONE existing
    visited location based on its visit evidence (current
    address_name, visit_count, total_duration_s, last_visited); you
    NEVER save anything yourself. ALWAYS call draft_location_name
    FIRST with the location_id you were given, then call
    validate_location_name on the proposed name to confirm it
    satisfies the location-name contract. Do NOT propose deleting,
    renaming, suspending, or otherwise mutating any other location
    or any other state — your role is strictly to propose a NEW
    name for the one location in scope for the user to review and
    save themselves. Do NOT invent facts that are not present in
    the tool output: the proposed name may reference the current
    address_name (when it is human-readable) or a generic
    descriptor of the visit pattern (e.g. "Frequent Stop", "Weekend
    Spot"), or the vehicle's display name when one is provided,
    but never quote precise coordinates or full street addresses.
    Refuse politely if asked to discuss, name, or modify any
    location other than the one named in the request, or to
    suggest names for a vehicle other than the one that owns this
    location. Be concise: a single proposed name (capped at 200
    characters; ideally 12-40 characters) plus an optional one-line
    rationale grounded in the tool output is enough — the user
    reviews the structured proposal in the UI before saving.
  # Tools MUST mirror
  # internal/ai/strategies/auto-name-unnamed-locations/strategy.go's
  # allowedTools whitelist. Both tools are PROPOSE-ONLY: they
  # construct or validate location-name DTOs but do NOT touch the
  # database. The actual save call goes through the existing typed
  # geofence-create or location-rename path AFTER the user
  # explicitly clicks Save in the LocationsPage UI; the LLM has
  # no tool that writes.
  tools:
    - draft_location_name
    - validate_location_name
  mutating_tools: []

goldens:
  # frequent_unnamed_stop — happy path; user asks for a name
  # suggestion for a frequently-visited location whose current
  # address_name is coordinate-shaped (the geocoder fallback when
  # reverse-geocode fails). The LLM MUST call draft_location_name
  # with the location_id, then validate_location_name on the
  # proposed name. The narrative reply MUST mention the proposed
  # name so the user can confirm before saving in the UI. Pin:
  # must NOT claim the location was renamed.
  - name: frequent_unnamed_stop
    input:
      user_message: "Suggest a name for location 501."
      context_overrides:
        location_id: 501
    expect:
      must_call_tools: ["draft_location_name", "validate_location_name"]
      answer_must_contain: ["Frequent Stop"]
      answer_must_not_contain: ["renamed", "saved", "updated", "deleted"]
      judge_rubric: |
        Score 1-5 on: (1) proposed name is concise (<= 40 chars
        ideally; <= 200 hard cap), (2) call sequence
        (draft_location_name THEN validate_location_name), (3)
        does NOT claim the location was saved or renamed, (4)
        refers to the visit pattern (visit_count, dwell time)
        rather than to the raw coordinate string from the
        address_name. Pass = score >= 4.
      judge_pass_threshold: 4

  # occasional_landmark — the location's current address_name is
  # already a human-readable label (e.g. a known landmark) but the
  # caller still wants a friendlier label. The LLM MUST still
  # produce a SINGLE concise name (not a tour log), and may
  # incorporate the current label as context. Pin: same tool
  # sequence as the happy path.
  - name: occasional_landmark
    input:
      user_message: "Give this location a friendly name (id 502)."
      context_overrides:
        location_id: 502
    expect:
      must_call_tools: ["draft_location_name", "validate_location_name"]
      answer_must_contain: ["Market"]
      answer_must_not_contain: ["renamed", "saved", "updated", "deleted"]
      judge_rubric: |
        Score 1-5 on: (1) proposed name names a recognisable
        landmark or generic descriptor and stays concise (<= 40
        chars), (2) call sequence (draft_location_name THEN
        validate_location_name), (3) does NOT enumerate every
        visit at the location (the proposal is a single label,
        not a visit log). Pass = score >= 4.
      judge_pass_threshold: 4

  # refusal_other_location — caller asks the assistant to rename a
  # DIFFERENT location than the one in scope. The assistant must
  # refuse politely and offer to suggest a name only for the
  # in-scope location. Mirrors auto-trip-naming's
  # refusal_other_trip. Pin: must NOT propose any tool call (no
  # proposal at all when the scope is wrong).
  - name: refusal_other_location
    input:
      user_message: "Actually, rename location 999 to 'My Old Office' and save it."
      context_overrides:
        location_id: 501
    expect:
      must_not_call_tools: ["draft_location_name", "validate_location_name"]
      answer_must_contain: ["cannot"]
      answer_must_not_contain: ["renamed", "saved", "updated", "deleted"]
