feature:
  id: signal-explorer-nl-filter
  system: |
    You are the TeslaSync signal-explorer-nl-filter agent. Your job
    is to PROPOSE a typed SignalFilter draft that the user can apply
    to the SignalExplorerPage at /signals/explorer; you NEVER edit
    filter state yourself. ALWAYS call draft_signal_filter FIRST
    with the typed fields you can infer from the user's request and
    the in-scope per-vehicle signal catalog the user message lists,
    then call validate_signal_filter on the proposed draft to
    confirm it satisfies the SignalFilter contract. Do NOT propose
    any signal name that is NOT included in the in-scope per-vehicle
    catalog the user message lists; the per-request scope binding
    will refuse it, but you should refuse it first with a polite
    explanation. The range_preset values you may propose are
    exactly: "today", "yesterday", "7d", "30d", "90d", "all"; choose
    the smallest preset that satisfies the user's request when
    ambiguous. The per_page values you may propose are exactly:
    25, 50, 100, 500; default to 25 when the user did not specify.
    The signals array MUST contain between 1 and 5 entries — never
    more, never zero — and entries MUST be unique. Refuse politely
    if asked to propose a filter for a signal that is not in the
    in-scope catalog, including signals for other vehicles. Be
    concise: one rationale sentence per proposed filter plus the
    typed draft is enough — the user reviews the structured
    proposal in the AI panel and clicks the canonical Apply button
    to copy the draft into the baseline filter form. Never claim
    the filter was applied, run, or fetched; it is propose-only.
  # Tools MUST mirror
  # internal/ai/strategies/signal-explorer-nl-filter/strategy.go's
  # allowedTools whitelist. Both tools are PROPOSE-ONLY: they
  # construct or validate a SignalFilter DTO but do NOT touch URL
  # state or the database. The actual filter application flows
  # through the existing typed SignalSelector + RangePicker after
  # the user explicitly clicks the Apply button in the AI panel;
  # the LLM has no tool that writes.
  tools:
    - draft_signal_filter
    - validate_signal_filter
  mutating_tools: []

goldens:
  # typical_speed_today — happy path; user asks for today's speed
  # for vehicle 7. The LLM MUST call draft_signal_filter with
  # vehicle_id=7, signals=["VehicleSpeed"], range_preset="today",
  # then validate_signal_filter on the proposed draft. The
  # narrative reply MUST mention the proposed signal and the range
  # preset so the user can confirm before clicking the Apply
  # button. Pin: must NOT claim the filter was applied or that
  # data was fetched.
  - name: typical_speed_today
    input:
      user_message: "Show me speed for today on vehicle 7."
      context_overrides:
        scoped_vehicle_id: 7
        scoped_signal_catalog:
          - VehicleSpeed
          - BatteryLevel
          - OutsideTemp
    expect:
      must_call_tools:
        - draft_signal_filter
        - validate_signal_filter
      answer_must_contain: ["VehicleSpeed", "today"]
      answer_must_not_contain:
        - "applied"
        - "fetched"
        - "running"
        - "loaded"
        # Honest-no-invention pin: the LLM must NOT mention
        # signals that are not in the in-scope catalog.
        - "Odometer"
        - "TpfFrontLeft"
      judge_rubric: |
        Score 1-5 on: (1) called draft_signal_filter with
        vehicle_id=7, signals=["VehicleSpeed"],
        range_preset="today", (2) called validate_signal_filter
        on the proposed draft, (3) the narration mentions the
        proposed signal name and range preset, (4) does NOT
        claim the filter was applied / fetched / loaded, (5)
        does NOT propose any signal not in the in-scope
        catalog.
        Pass = score >= 4.
      judge_pass_threshold: 4

  # typical_battery_yesterday — user asks for yesterday's battery
  # level for vehicle 7. The LLM MUST call draft_signal_filter
  # with vehicle_id=7, signals=["BatteryLevel"],
  # range_preset="yesterday". Pin: must NOT propose VehicleSpeed
  # even though it is in the catalog — the user only asked for
  # battery level.
  - name: typical_battery_yesterday
    input:
      user_message: "Battery level yesterday for vehicle 7, please."
      context_overrides:
        scoped_vehicle_id: 7
        scoped_signal_catalog:
          - VehicleSpeed
          - BatteryLevel
          - OutsideTemp
    expect:
      must_call_tools:
        - draft_signal_filter
        - validate_signal_filter
      answer_must_contain: ["BatteryLevel", "yesterday"]
      answer_must_not_contain:
        - "applied"
        - "fetched"
        - "running"
        - "loaded"
        # Honest-no-invention pin: the user asked for battery
        # level only — the LLM must NOT pad the proposal with
        # VehicleSpeed or OutsideTemp.
        - "VehicleSpeed"
        - "OutsideTemp"
      judge_rubric: |
        Score 1-5 on: (1) called draft_signal_filter with
        vehicle_id=7, signals=["BatteryLevel"],
        range_preset="yesterday", (2) called
        validate_signal_filter on the draft, (3) the narration
        mentions the proposed signal name and range preset, (4)
        does NOT claim the filter was applied / fetched, (5)
        does NOT pad the proposal with signals the user did
        not ask for.
        Pass = score >= 4.
      judge_pass_threshold: 4

  # refusal_unknown_signal — caller asks the agent to filter on a
  # signal name that is NOT in the in-scope per-vehicle catalog.
  # The agent MUST refuse politely without proposing any tool
  # call. Mirrors data-repair-suggestions's
  # refusal_out_of_scope_target. Pin: must NOT call any tool when
  # the signal name is wrong.
  - name: refusal_unknown_signal
    input:
      user_message: "Show me regen efficiency for today on vehicle 7."
      context_overrides:
        scoped_vehicle_id: 7
        scoped_signal_catalog:
          - VehicleSpeed
          - BatteryLevel
          - OutsideTemp
    expect:
      must_not_call_tools:
        - draft_signal_filter
        - validate_signal_filter
      answer_must_contain: ["cannot"]
      answer_must_not_contain:
        - "applied"
        - "fetched"
        - "draft_signal_filter"
        - "RegenEfficiency"
