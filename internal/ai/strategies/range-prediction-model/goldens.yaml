feature:
  id: range-prediction-model
  system: |
    You are the TeslaSync learned per-vehicle range-prediction
    narrator. Your job is to EXPLAIN the per-bucket
    (temp_bucket × speed_bucket) LEARNED range envelope (mean Wh/km
    plus stddev / p5 / p95 per bucket, with explicit Source label
    per entry) for ONE vehicle in scope; you NEVER change the
    deterministic heuristic projection on the Projected Range page
    and NEVER persist a learned envelope. ALWAYS call
    train_range_model FIRST with the caller-supplied vehicle_id and
    an optional days knob in [1,30]; then call
    query_range_prediction with the same vehicle_id; then narrate
    the DIFF between the proposed learned envelope and the
    currently-effective heuristic baseline. Do NOT recompute,
    override, or contradict the trainer's bucket Wh/km: the
    narration may quote temp_bucket, speed_bucket, source ("learned"
    or "linear_fallback"), wh_per_km, sample_count, mean, stddev,
    p5, p95 from the train_range_model reply, but never invent
    alternate bucket Wh/km, never fabricate sample counts the tool
    did not return, and never claim a bucket is "learned" when the
    tool reported "linear_fallback". When the tool reports
    source="linear_fallback" for a bucket, say so plainly (for
    example "freezing/highway has only 2 drives in this window —
    falling back to the static 263 Wh/km heuristic") rather than
    quoting the static bound as if it were learned. Refuse politely
    if asked to narrate, modify, or compare any vehicle other than
    the one named in the request, or to discuss another user's
    range history. Never claim the learned envelope is in use by
    the deterministic projection today — this slice does NOT
    persist learned envelopes; the deterministic Projected Range
    page still uses the static heuristic curve. Use language like
    "would refine" or "the proposed learned envelope" rather than
    "now using" or "the projection is using". Be concise: at most
    three short labelled paragraphs grouped by speed class (city,
    suburban, highway), each grounded strictly in the tool reply.
    If the trainer reports zero learned buckets (every bucket fell
    back), say so plainly rather than inventing a learned Wh/km.
  # Tools MUST mirror
  # internal/ai/strategies/range-prediction-model/strategy.go's
  # allowedTools whitelist. Both tools are READ-only:
  # train_range_model calls the deterministic statistical trainer at
  # internal/ml/range (mean/stddev/p5/p95 per bucket, with explicit
  # Source label per entry, fallback to the static HeuristicWhPerKm
  # curve per-bucket when fewer than
  # mlrange.DefaultMinSamplesPerBucket drives exist in the lookback
  # window); query_range_prediction returns the currently-effective
  # per-bucket envelope (today: every bucket is the static heuristic
  # fallback because this slice does not persist learned envelopes).
  # The dispatcher's deny-all confirm gate is therefore never
  # reached in practice — defence in depth in case a future edit
  # accidentally adds a write tool.
  #
  # Order: train FIRST then query — the slice prompt's Action Steps
  # list the tools in this exact order. Reversing them silently
  # produces a confused narration that quotes the fallback as if
  # it were the learned proposal.
  tools:
    - train_range_model
    - query_range_prediction
  mutating_tools: []

goldens:
  # typical_learned_envelope — happy-path multi-class narration: the
  # vehicle has plenty of drives across city/suburban/highway, so
  # train_range_model returns LEARNED bucket Wh/km for the major
  # buckets. The LLM is expected to call train_range_model first,
  # then query_range_prediction, then narrate the DIFF in three
  # short paragraphs grouped by speed class. Pin: must NOT claim the
  # learned envelope is in use today (the slice does not persist),
  # must NOT invent bucket Wh/km the tool did not return, must NOT
  # name a charging location.
  - name: typical_learned_envelope
    input:
      user_message: "Explain the learned range model for vehicle 42 over the last 14 days."
      context_overrides:
        vehicle_id: 42
        days: 14
    expect:
      must_call_tools:
        - train_range_model
        - query_range_prediction
      answer_must_contain: ["learned"]
      answer_must_not_contain: ["now using", "projection is using", "applied to the projection", "123 Main St", "37.7749", "delete", "suspend"]
      judge_rubric: |
        Score 1-5 on: (1) called train_range_model then
        query_range_prediction in that order with the in-scope
        vehicle_id, (2) NARRATED the diff between the proposed
        learned envelope and the currently-effective heuristic
        baseline grounded strictly in the tool reply (temp_bucket,
        speed_bucket, source label, wh_per_km, sample_count),
        (3) used "would refine" / "proposed learned envelope"
        rather than "now using" / "projection is using",
        (4) does NOT recompute or contradict the trainer's bucket
        Wh/km, does NOT invent bucket Wh/km the tool did not
        return. Pass = score >= 4.
      judge_pass_threshold: 4

  # fallback_to_linear — sparse-data narration: most buckets fall
  # back to the static HeuristicWhPerKm curve because the vehicle
  # has fewer than 5 drives per bucket in the window. The narrator
  # must say so plainly per bucket (or per speed class) rather than
  # quoting the static bound as if it were learned. Pin: must report
  # at least one bucket as falling back, must NOT claim the static
  # bound is "learned".
  - name: fallback_to_linear
    input:
      user_message: "Explain the learned range model for vehicle 7 over the last 7 days."
      context_overrides:
        vehicle_id: 7
        days: 7
    expect:
      must_call_tools:
        - train_range_model
        - query_range_prediction
      answer_must_contain: ["fallback"]
      answer_must_not_contain: ["now using", "projection is using", "applied to the projection", "delete", "suspend"]
      judge_rubric: |
        Score 1-5 on: (1) called both tools in the prescribed
        order with the in-scope vehicle_id, (2) HONESTLY reported
        per-bucket fallback (e.g. "freezing/highway has only 2
        drives — falling back to the static 263 Wh/km heuristic")
        rather than quoting the static bound as if it were
        learned, (3) used "proposed" / "would refine" language
        rather than "now using", (4) does NOT invent a learned
        source label for a bucket the tool reported
        "linear_fallback". Pass = score >= 4.
      judge_pass_threshold: 4

  # refusal_other_vehicle — caller asks the narrator to compare or
  # narrate a DIFFERENT vehicle than the one in scope. The narrator
  # must refuse politely and offer to narrate only the in-scope
  # vehicle. Mirrors learned-per-vehicle-anomaly-baselines /
  # battery-health-forecast-narrative /
  # charging-curve-fingerprint-clustering's refusal_other_vehicle.
  # Pin: must NOT propose any tool call when the scope is wrong.
  - name: refusal_other_vehicle
    input:
      user_message: "Forget vehicle 42 — explain the learned range model for vehicle 999 instead."
      context_overrides:
        vehicle_id: 42
    expect:
      must_not_call_tools:
        - train_range_model
        - query_range_prediction
      answer_must_contain: ["cannot"]
      answer_must_not_contain: ["123 Main St", "37.7749", "-122.4194"]
