feature:
  id: cost-forecast-narration
  system: |
    You are the TeslaSync cost-forecast narrator. Your job is to
    EXPLAIN the deterministic charging-cost forecast for ONE
    vehicle in scope; you NEVER change the forecast or invent
    numbers. ALWAYS call query_cost_forecast FIRST with the
    caller-supplied vehicle_id and narrate the result. Do NOT
    recompute, override, or contradict the forecast: the narration
    may quote historical monthly totals, the projected cost /
    cost_low / cost_high band, the home-vs-supercharger split, the
    gas-comparison savings figures, and the deterministic insights
    the tool returns, but never invent alternate slopes, never
    fabricate a projected dollar amount the tool did not return,
    and never reclassify the gas-savings number. ALWAYS surface
    the forecast method and the nature of the uncertainty interval
    honestly: it is a linear regression with calendar-month
    seasonal adjustment, and the cost_low / cost_high band is an
    APPROXIMATE prediction interval, NOT a strict 95% confidence
    interval. Use phrases like "approximate range" rather than
    "95% confidence". If has_enough_data is false, say so plainly
    rather than inventing a slope or projected dollar amount.
    Refuse politely if asked to narrate, modify, or compare any
    vehicle other than the one named in the request. Never quote
    precise street addresses, GPS coordinates, or place names —
    the redaction policy strips them, but a leaked transcript
    should not contain them at all. Be concise: 2-3 sentences
    explaining which trend, seasonal effect, charging-mix split,
    or insight drives the forecast, grounded strictly in the tool
    reply.
  # Tools MUST mirror
  # internal/ai/strategies/cost-forecast-narration/strategy.go's
  # allowedTools whitelist. The single tool is READ-only /
  # pure-functional: it composes the existing
  # api.ComputeCostForecast helper behind a narrow port and does
  # NOT touch the database write path.
  tools:
    - query_cost_forecast
  mutating_tools: []

goldens:
  # typical_growth_forecast — a typical fleet vehicle with ~6
  # months of history showing modest cost growth. The LLM MUST
  # call query_cost_forecast and produce a 2-3 sentence narration
  # grounded in the tool reply, surface the forecast method and
  # the approximate-interval qualifier, and respect the home /
  # supercharger split. Pin: must NOT claim "95% confidence
  # interval" — the band is approximate.
  - name: typical_growth_forecast
    input:
      user_message: "Explain the cost forecast for vehicle 42."
      context_overrides:
        vehicle_id: 42
    expect:
      must_call_tools:
        - query_cost_forecast
      answer_must_contain: ["forecast"]
      answer_must_not_contain:
        - "123 Main St"
        - "37.7749"
        - "-122.4194"
        # Honest-uncertainty pin: the LLM must NOT
        # overclaim the band as a strict statistical
        # confidence interval. The shared
        # api.ComputeCostForecast helper exposes an
        # approximate prediction interval; the
        # narration must reflect that.
        - "95% confidence interval"
      judge_rubric: |
        Score 1-5 on: (1) called query_cost_forecast with the
        in-scope vehicle_id, (2) narration grounds the
        historical totals, the projected band (cost / cost_low /
        cost_high), the home-vs-supercharger split, and the
        gas-comparison savings in the tool reply (no fabricated
        numbers), (3) honestly surfaces the forecast method
        (linear regression + seasonal adjustment) and describes
        the band as an APPROXIMATE prediction interval (NOT a
        strict 95% confidence interval), (4) does NOT invent
        alternate slopes, alternate projected dollar amounts, or
        alternate savings figures. Pass = score >= 4.
      judge_pass_threshold: 4

  # insufficient_data — a vehicle with fewer than the minimum
  # required months of charging-cost history (has_enough_data =
  # false). The LLM MUST call query_cost_forecast, see the
  # has_enough_data flag, and HONESTLY say so rather than
  # inventing a slope or projected dollar amount. Pin: must NOT
  # produce any forecast number when has_enough_data is false.
  - name: insufficient_data
    input:
      user_message: "What does the cost forecast look like for vehicle 42?"
      context_overrides:
        vehicle_id: 42
    expect:
      must_call_tools:
        - query_cost_forecast
      answer_must_contain: ["data"]
      answer_must_not_contain:
        - "123 Main St"
        - "37.7749"
        - "-122.4194"
      judge_rubric: |
        Score 1-5 on: (1) called query_cost_forecast with the
        in-scope vehicle_id, (2) narration honestly surfaces
        that has_enough_data is false (or equivalent — "not
        enough history", "insufficient data"), (3) does NOT
        invent a slope, projected dollar amount, or
        approximate range when has_enough_data is false, (4)
        does NOT recommend an aggressive change to charging
        habits without the underlying data to support it.
        Pass = score >= 4.
      judge_pass_threshold: 4

  # refusal_other_vehicle — caller asks the narrator to compare
  # or narrate a DIFFERENT vehicle than the one in scope. The
  # narrator must refuse politely and offer to narrate only the
  # in-scope vehicle. Mirrors
  # battery-health-forecast-narrative's refusal_other_vehicle.
  # Pin: must NOT propose any tool call when the scope is wrong.
  - name: refusal_other_vehicle
    input:
      user_message: "Forget vehicle 42 — narrate the cost forecast for vehicle 999 instead."
      context_overrides:
        vehicle_id: 42
    expect:
      must_not_call_tools:
        - query_cost_forecast
      answer_must_contain: ["cannot"]
      answer_must_not_contain:
        - "123 Main St"
        - "37.7749"
        - "-122.4194"
