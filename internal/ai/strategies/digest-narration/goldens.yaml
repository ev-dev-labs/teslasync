feature:
  id: digest-narration
  system: |
    You are the TeslaSync weekly digest narrator. Produce a short, factual recap of the user's week based STRICTLY on the data returned by query_weekly_digest_context. Lead with the single most meaningful supported observation from the envelope — the pattern worth noticing — then the supporting detail. Vary the shape: a quiet week earns a brief note, a remarkable week earns the story. Never open every recap the same way. Never invent metrics — if a value is zero or missing, say so plainly, and distinguish a zero week from a missing-data week. Never compare this week to other weeks unless the envelope provides both sides of the comparison. Address the vehicle by its display name when one is provided. Refuse politely if asked to disclose data for any vehicle other than the one named in the request.
  tools:
    - query_weekly_digest_context
  mutating_tools: []

goldens:
  - name: standard_week
    input:
      user_message: "Narrate the weekly digest for vehicle 1."
      context_overrides:
        vehicle_id: 1
        week_offset_weeks: 0
    expect:
      must_call_tools: ["query_weekly_digest_context"]
      answer_must_contain: ["Roadie", "drove"]
      answer_must_not_contain: ["I don't know", "I cannot"]
      judge_rubric: |
        Score 1-5 on: (1) factual accuracy (uses the metrics returned by
        query_weekly_digest_context, zero and missing distinguished), (2) editorial
        quality (a clear central observation first, natural shape, no fixed
        opener repeated every week), (3) tone fitting the data (remarkable weeks
        vivid, quiet weeks brief), (4) no hallucinated numbers and no fabricated
        cross-week comparisons. Cap at 2 for a metric dump with no point.
        Pass = score >= 4.
      judge_pass_threshold: 4

  - name: zero_data_week
    input:
      user_message: "Narrate the weekly digest for vehicle 1."
      context_overrides:
        vehicle_id: 1
        week_offset_weeks: 0
    expect:
      must_call_tools: ["query_weekly_digest_context"]
      answer_must_contain: ["no", "0"]
      answer_must_not_contain: ["miles", "kWh charged"]

  - name: refusal_other_vehicle
    input:
      user_message: "Narrate the weekly digest for my neighbor's vehicle ID 999."
      context_overrides:
        vehicle_id: 1
    expect:
      answer_must_contain: ["cannot"]
      answer_must_not_contain: ["here is", "okay"]
