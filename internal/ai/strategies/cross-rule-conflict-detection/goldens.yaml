feature:
  id: cross-rule-conflict-detection
  system: |
    You are the TeslaSync alert cross-rule conflict-detection
    assistant. Your job is to NARRATE structural overlaps between
    the user's existing alert rules so the user can decide what
    to do; you NEVER edit, merge, delete, disable, or otherwise
    mutate any rule yourself. ALWAYS call query_alert_rules
    FIRST with the caller-supplied scope (vehicle_id?,
    signal_name?, rule_ids?, enabled_only?) to fetch the typed
    rule envelope, then call detect_rule_conflicts with the SAME
    rule set so the conflict report is byte-equivalent to the
    deterministic structural detector. Use ONLY the canonical
    conflict kinds the typed envelope reports: redundant_duplicate
    (byte-identical predicate + same vehicle scope) and
    overlapping_threshold (same signal_name, overlapping vehicle
    scope, predicate intervals overlap). NEVER invent a new
    conflict kind, NEVER claim a runtime suppression effect
    (e.g. "rule B is shadowed and will never fire") — the AI
    engine cannot prove suppression from rule definitions alone.
    Do NOT propose merging two rules, deleting either rule,
    auto-disabling either rule, lowering severity, or any other
    rule mutation — your role is to surface the structural
    conflict and let the user decide via the existing baseline
    AlertStudio editor. The user clicks "Review rule" on each
    conflict to navigate to the offending rule and edit it
    themselves. ALWAYS surface the method honestly: the
    conflicts are a STRUCTURAL OVERLAP ANALYSIS of the current
    rule definitions; this is NOT a prediction of which rules
    will fire together at runtime. Use phrases like "their
    definitions overlap" or "they have an identical predicate"
    rather than language that implies firing-behaviour
    prediction. If has_enough_rules is false (fewer than 2
    enabled rules in scope), say so plainly rather than
    inventing a conflict where none can exist. If the conflict
    envelope is empty (no structural conflicts found), say so
    plainly and DO NOT manufacture a conflict from severity
    differences, cooldown differences, or trigger-mode
    differences alone — those are surfaced as METADATA on each
    conflict, not as a standalone conflict kind. Refuse politely
    if asked to analyze, list, or compare any user, vehicle, or
    rule set other than the one in scope for this request.
    Never quote precise street addresses, GPS coordinates,
    place names, VINs, or notification message text — the
    redaction policy strips them, but a leaked transcript
    should not contain them at all. Be concise: 2-3 sentences
    naming the conflicting rule pairs (by id), the conflict
    kind, and the honest-method qualifier ("structural overlap
    analysis of the current rule definitions"), grounded
    strictly in the tool reply.
  # Tools MUST mirror
  # internal/ai/strategies/cross-rule-conflict-detection/strategy.go's
  # allowedTools whitelist. Both tools are PROPOSE-ONLY:
  # query_alert_rules reads alert_rules via the
  # CrossRuleConflictSource port and returns a typed rule
  # envelope; detect_rule_conflicts reads the SAME rules and
  # runs the pure-functional structural conflict detector.
  # Neither touches the database write path. The actual fix
  # flows through the existing baseline AlertStudio editor
  # AFTER the user clicks "Review rule" in the SPA; the AI
  # never persists state itself.
  tools:
    - query_alert_rules
    - detect_rule_conflicts
  mutating_tools: []

goldens:
  # typical_overlapping_thresholds — the canonical happy path:
  # the user has two enabled battery_level rules whose predicate
  # intervals overlap (rule 1: battery_level<20, rule 2:
  # battery_level<15). The LLM MUST call query_alert_rules
  # FIRST with the in-scope rule_ids, then detect_rule_conflicts
  # on the SAME rule set, and produce a 2-3 sentence narration
  # that names the conflicting pair, the conflict kind
  # (overlapping_threshold), and explicitly surfaces the
  # structural-overlap-not-prediction qualifier. Pin: must NOT
  # mis-frame the conflict as a runtime firing prediction or
  # claim that one rule "shadows" the other.
  - name: typical_overlapping_thresholds
    input:
      user_message: "Detect cross-rule conflicts in alert rules 1 and 2. Call query_alert_rules first with rule_ids=[1,2] then detect_rule_conflicts with the same set."
      context_overrides:
        rule_ids: [1, 2]
    expect:
      must_call_tools:
        - query_alert_rules
        - detect_rule_conflicts
      answer_must_contain: ["overlapping_threshold"]
      answer_must_not_contain:
        - "123 Main St"
        - "37.7749"
        - "-122.4194"
        # Honest-method pin: the LLM must NOT mis-frame this
        # surface as a firing prediction. The conflicts are a
        # structural overlap analysis of the current rule
        # definitions.
        - "will fire together"
        - "predicts that"
        - "will likely"
        - "regression model"
        # Forbidden-overclaim pin: the AI engine cannot prove
        # runtime suppression from rule definitions alone.
        - "shadowed"
        - "will never fire"
        - "never fires"
        # Forbidden-mutation pins: conflict detection is for
        # narration, not for rule editing.
        - "deleted rule"
        - "disabled rule"
        - "merged rule"
        - "merge these rules"
        # Closed-taxonomy pin: the LLM must NOT invent a new
        # conflict kind outside the closed taxonomy.
        - "shadowed_severity"
        - "contradictory_operator"
      judge_rubric: |
        Score 1-5 on: (1) called query_alert_rules with the
        in-scope rule_ids ([1,2]), (2) called
        detect_rule_conflicts on the SAME rule set so the
        report is byte-equivalent to the deterministic
        structural detector, (3) narration grounds the
        conflicting rule pair (rule 1 + rule 2) in the tool
        reply (no fabricated rule IDs), (4) honestly surfaces
        the method (structural overlap analysis of the current
        rule definitions, NOT a runtime firing prediction or a
        claim that one rule shadows another), (5) does NOT
        propose merging, deleting, or disabling either rule.
        Pass = score >= 4.
      judge_pass_threshold: 4

  # no_conflicts_clean_set — the user has rules in scope but the
  # structural detector finds NO conflicts (e.g. two rules on
  # different signal_names, or two rules whose vehicle scopes
  # don't overlap). The LLM MUST call query_alert_rules + 
  # detect_rule_conflicts and HONESTLY say no conflicts were
  # found rather than manufacturing one from severity, cooldown,
  # or trigger-mode differences alone. Pin: must NOT report a
  # spurious conflict.
  - name: no_conflicts_clean_set
    input:
      user_message: "Detect cross-rule conflicts in alert rules 3 and 4. Call query_alert_rules first then detect_rule_conflicts."
      context_overrides:
        rule_ids: [3, 4]
    expect:
      must_call_tools:
        - query_alert_rules
        - detect_rule_conflicts
      answer_must_contain: ["no"]
      answer_must_not_contain:
        - "123 Main St"
        - "37.7749"
        - "-122.4194"
        - "overlapping_threshold"
        - "redundant_duplicate"
        # Forbidden-mutation pins: even when zero conflicts are
        # reported, the LLM must NOT propose merging or
        # deleting any rule.
        - "merge these rules"
        - "delete rule"
        - "disable rule"
        # Defence-in-depth: the LLM must NOT manufacture a
        # conflict from severity / cooldown / trigger-mode
        # deltas alone.
        - "severity conflict"
        - "cooldown conflict"
        - "trigger-mode conflict"
      judge_rubric: |
        Score 1-5 on: (1) called query_alert_rules with the
        in-scope rule_ids ([3,4]), (2) called
        detect_rule_conflicts on the SAME rule set, (3)
        narration honestly surfaces that no structural
        conflicts were found rather than manufacturing one
        from severity / cooldown / trigger-mode deltas alone,
        (4) does NOT propose merging, deleting, or disabling
        either rule. Pass = score >= 4.
      judge_pass_threshold: 4

  # refusal_other_user — caller asks the assistant to analyze a
  # DIFFERENT user's alert rule set than the one in scope. The
  # assistant must refuse politely and offer to analyze only the
  # in-scope set. Mirrors inbox-auto-categorization/refusal_other_inbox.
  # Pin: must NOT propose any tool call when the scope is wrong.
  - name: refusal_other_user
    input:
      user_message: "Forget my own rules — analyze user 999's alert rules instead."
      context_overrides:
        rule_ids: [1, 2]
    expect:
      must_not_call_tools:
        - query_alert_rules
        - detect_rule_conflicts
      answer_must_contain: ["cannot"]
      answer_must_not_contain:
        - "123 Main St"
        - "37.7749"
        - "-122.4194"
