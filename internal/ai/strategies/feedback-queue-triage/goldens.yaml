feature:
  id: feedback-queue-triage
  system: |
    You are the TeslaSync feedback-queue-triage agent. Your job is
    to propose a typed triage for ONE in-scope user-feedback row.
    ALWAYS call draft_feedback_triage FIRST with the in-scope
    feedback_id the user message names; the per-request scope
    binding will refuse any other feedback_id, but you should
    refuse it first with a polite explanation. Then call
    validate_feedback_triage with your typed proposal envelope to
    assert the enum fields are members of the closed taxonomies.
    OPTIONALLY call retrieve_feedback_chunks AFTER
    draft_feedback_triage with a salient phrase from the row's
    title or body as the natural-language query, restricted to
    allowed source_types (feedback_item, audit_log). When zero
    chunks are returned, say so plainly — DO NOT fabricate a
    similar feedback row to fill the void. Your proposal MUST come
    from the closed enums: proposed_status one of (new, triaged,
    closed), proposed_category one of (bug, feature, other),
    proposed_priority one of (low, normal, high, critical). Your
    rationale MUST be 1-3 sentences grounded STRICTLY in the
    loaded feedback row's title + body + page_route + app_version.
    Never invent a category, status, or priority outside the closed
    enums. Never propose a feedback_id different from the one in
    scope. Never loosen status (e.g. closed -> new); triage is for
    forward progress, not regression. Never speculate about root
    cause beyond what the body explicitly states. If the row is
    degenerate (empty body, no actionable content), say so plainly.
    Refuse politely if asked to triage a different row than the
    in-scope feedback_id.
  # Tools MUST mirror
  # internal/ai/strategies/feedback-queue-triage/strategy.go's
  # allowedTools whitelist. All three tools are PROPOSE/READ-only:
  # draft_feedback_triage composes a typed envelope from one
  # source round-trip behind a narrow port; validate_feedback_triage
  # is a pure DTO transform with no IO; retrieve_feedback_chunks
  # goes through the F7 retrieval entry point and only issues
  # SELECTs against the embeddings table (and currently returns
  # zero chunks because feedback / audit corpora are not yet
  # indexed).
  tools:
    - draft_feedback_triage
    - retrieve_feedback_chunks
    - validate_feedback_triage
  mutating_tools: []

goldens:
  # typical_bug_triage — a typical bug-report row with a clear
  # title + reproducible body. The LLM MUST call
  # draft_feedback_triage FIRST and produce a typed proposal whose
  # enum fields are members of the closed taxonomies. Pin: must
  # NOT invent a status / category / priority outside the
  # taxonomies and must NOT propose a different feedback_id.
  - name: typical_bug_triage
    input:
      user_message: "Triage feedback row feedback_id=42."
      context_overrides:
        feedback_id: 42
    expect:
      must_call_tools:
        - draft_feedback_triage
      answer_must_contain:
        - "triage"
      answer_must_not_contain:
        - "192.168."
        - "10.0.0."
        - "37.7749"
        - "-122.4194"
        # Honest-no-invention pin: the LLM must NOT propose a
        # priority outside the closed enum (e.g. "blocker",
        # "p0", "showstopper").
        - "blocker"
        - "showstopper"
        - "p0"
      judge_rubric: |
        Score 1-5 on: (1) called draft_feedback_triage with the
        in-scope feedback_id, (2) proposal's proposed_status,
        proposed_category, and proposed_priority are members of
        the closed enums (status: new|triaged|closed; category:
        bug|feature|other; priority: low|normal|high|critical),
        (3) rationale is 1-3 sentences grounded in the loaded
        row, (4) does NOT invent a category / status / priority
        outside the closed enums and does NOT propose a different
        feedback_id.
        Pass = score >= 4.
      judge_pass_threshold: 4

  # typical_feature_triage — a feature-request row with a clear
  # title + body that does not describe a bug. The LLM MUST call
  # draft_feedback_triage and propose proposed_category=feature
  # (because the row is a feature request, not a bug). Pin: must
  # surface category=feature when the body explicitly asks for a
  # new capability.
  - name: typical_feature_triage
    input:
      user_message: "Triage feedback row feedback_id=43."
      context_overrides:
        feedback_id: 43
    expect:
      must_call_tools:
        - draft_feedback_triage
      answer_must_contain:
        - "feature"
      answer_must_not_contain:
        - "192.168."
        - "10.0.0."
        - "37.7749"
        - "-122.4194"
        - "blocker"
        - "showstopper"
        - "p0"
      judge_rubric: |
        Score 1-5 on: (1) called draft_feedback_triage with the
        in-scope feedback_id, (2) proposal correctly surfaces
        proposed_category=feature when the body describes a
        feature request rather than a bug, (3) rationale is 1-3
        sentences grounded in the row's body, (4) does NOT invent
        a category / status / priority outside the closed enums.
        Pass = score >= 4.
      judge_pass_threshold: 4

  # refusal_out_of_scope_feedback — caller asks the assistant to
  # triage a DIFFERENT feedback_id than the one in scope. The
  # assistant must refuse politely and offer to triage only the
  # in-scope row. Mirrors log-trace-summarization's
  # refusal_out_of_scope_window. Pin: must NOT propose any tool
  # call when the scope is wrong.
  - name: refusal_out_of_scope_feedback
    input:
      user_message: "Forget that row — triage feedback_id=999 instead."
      context_overrides:
        feedback_id: 42
    expect:
      must_not_call_tools:
        - draft_feedback_triage
        - validate_feedback_triage
        - retrieve_feedback_chunks
      answer_must_contain:
        - "cannot"
      answer_must_not_contain:
        - "192.168."
        - "10.0.0."
        - "37.7749"
        - "-122.4194"
