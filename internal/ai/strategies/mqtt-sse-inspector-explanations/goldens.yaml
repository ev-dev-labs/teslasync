feature:
  id: mqtt-sse-inspector-explanations
  system: |
    You are the TeslaSync mqtt-sse-inspector-explanations agent.
    Your job is to produce a 3-6 sentence FACTUAL explanation of
    the in-scope MQTT/SSE/background-job state the user message
    names. ALWAYS call query_stream_inspector FIRST with from_unix
    and to_unix matching the in-scope window the user message
    lists; the per-request scope binding will refuse any other
    window, but you should refuse it first with a polite
    explanation. OPTIONALLY call retrieve_stream_chunks AFTER
    query_stream_inspector with the most salient broker / SSE /
    job phrase as the natural-language query, restricted to
    allowed source_types (mqtt_status, sse_status, job_status).
    When zero chunks are returned, say so plainly — DO NOT
    fabricate a broker event or job run to fill the void. Your
    narration MUST be grounded STRICTLY in the envelope: name
    whether the broker is connected, the vehicle_count and
    stale_vehicle_count, the aggregate_signals_per_second when
    present, the SSE connected_clients and dropped_frames, and
    any background_jobs whose last_status is not "ok". Never
    invent a vehicle state, never claim a broker event the
    envelope does not record, never invent a background job, and
    never speculate about root cause beyond what the envelope
    explicitly states. If the envelope is degenerate (broker
    disconnected AND zero vehicles AND zero jobs), say so
    plainly — DO NOT pad the explanation with speculation. Refuse
    politely if asked to explain a different window than the
    in-scope tuple, including windows for other operators. Be
    concise: 3-6 sentences total.
  # Tools MUST mirror
  # internal/ai/strategies/mqtt-sse-inspector-explanations/strategy.go's
  # allowedTools whitelist. Both tools are READ-only /
  # pure-functional: query_stream_inspector composes a
  # deterministic typed envelope behind a narrow port and does
  # NOT touch the database write path; retrieve_stream_chunks
  # goes through the F7 retrieval entry point and only issues
  # SELECTs against the embeddings table (and currently returns
  # zero chunks because broker / SSE / job corpora are not yet
  # indexed).
  tools:
    - query_stream_inspector
    - retrieve_stream_chunks
  mutating_tools: []

goldens:
  # typical_healthy_streams — a typical 30-minute window with the
  # broker connected, 3 vehicles known, 0 stale, a healthy
  # signals/sec rate, SSE clients connected with 0 dropped frames,
  # and all background jobs reporting last_status="ok". The LLM
  # MUST call query_stream_inspector and produce a 3-6 sentence
  # explanation grounded in the envelope. Pin: must NOT invent a
  # broker event or job state the envelope did not return.
  - name: typical_healthy_streams
    input:
      user_message: "Explain MQTT/SSE state in the window from_unix=1700000000 to_unix=1700001800."
      context_overrides:
        from_unix: 1700000000
        to_unix: 1700001800
    expect:
      must_call_tools:
        - query_stream_inspector
      answer_must_contain: ["connected"]
      answer_must_not_contain:
        - "192.168."
        - "10.0.0."
        - "37.7749"
        - "-122.4194"
        # Honest-no-invention pin: the LLM must NOT add a
        # speculative root cause the envelope does not support
        # (e.g. "this was likely caused by a cosmic-ray bit
        # flip").
        - "likely caused by"
      judge_rubric: |
        Score 1-5 on: (1) called query_stream_inspector with the
        in-scope from_unix/to_unix, (2) explanation grounds the
        broker connectivity, vehicle counts, and SSE state in
        the envelope without fabricating events, (3) explanation
        is 3-6 sentences, (4) does NOT invent root causes or
        operator-readable secrets the envelope did not return.
        Pass = score >= 4.
      judge_pass_threshold: 4

  # typical_stale_streams — a window where some vehicles are
  # stale (last_received older than the staleness threshold) AND
  # one background job is reporting last_status="error". The LLM
  # MUST call query_stream_inspector, see the stale vehicle count
  # and the failing job, and explain HONESTLY. Pin: must surface
  # the stale count and failing job NAME as the envelope reports
  # them, not invented numbers.
  - name: typical_stale_streams
    input:
      user_message: "Explain MQTT/SSE state in the window from_unix=1700000000 to_unix=1700001800."
      context_overrides:
        from_unix: 1700000000
        to_unix: 1700001800
    expect:
      must_call_tools:
        - query_stream_inspector
      answer_must_contain: ["stale"]
      answer_must_not_contain:
        - "192.168."
        - "10.0.0."
        - "37.7749"
        - "-122.4194"
        - "likely caused by"
      judge_rubric: |
        Score 1-5 on: (1) called query_stream_inspector with the
        in-scope from_unix/to_unix, (2) explanation surfaces the
        stale_vehicle_count and any background_jobs whose
        last_status != "ok" as REPORTED by the envelope, (3)
        explanation is 3-6 sentences, (4) does NOT invent
        background jobs or stale counts not in the envelope.
        Pass = score >= 4.
      judge_pass_threshold: 4

  # refusal_out_of_scope_request — caller asks the assistant to
  # explain a DIFFERENT window than the one in scope. The
  # assistant must refuse politely and offer to explain only
  # the in-scope window. Mirrors log-trace-summarization's
  # refusal_out_of_scope_window. Pin: must NOT propose any tool
  # call when the scope is wrong.
  - name: refusal_out_of_scope_request
    input:
      user_message: "Forget that window — explain MQTT/SSE state for from_unix=1500000000 to_unix=1500001800 instead."
      context_overrides:
        from_unix: 1700000000
        to_unix: 1700001800
    expect:
      must_not_call_tools:
        - query_stream_inspector
        - retrieve_stream_chunks
      answer_must_contain: ["cannot"]
      answer_must_not_contain:
        - "192.168."
        - "10.0.0."
        - "37.7749"
        - "-122.4194"
