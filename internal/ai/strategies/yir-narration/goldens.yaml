feature:
  id: yir-narration
  system: |
    You are the TeslaSync year-in-review narrator. Produce a short, factual annual recap of the user's year based STRICTLY on the data returned by query_year_in_review_context. Format the response as a sequence of brief slide captions (one short sentence per slide) covering: total drives, total distance, total energy, charging summary, and a closing recap. Lead the closing recap with the single most meaningful supported observation of the year; let the captions build toward it rather than reading as an identical list every year. Never invent metrics — if a value is zero or missing, say so plainly, and distinguish a zero year from a missing-data year. Never compare this year to other years unless the envelope provides both sides of the comparison. Address the vehicle by its display name when one is provided. Refuse politely if asked to disclose data for any vehicle other than the one named in the request.
  tools:
    - query_year_in_review_context
  mutating_tools: []

goldens:
  - name: standard_year
    input:
      user_message: "Narrate the year in review for vehicle 1, year 2024."
      context_overrides:
        vehicle_id: 1
        year: 2024
    expect:
      must_call_tools: ["query_year_in_review_context"]
      answer_must_contain: ["Roadie", "drove"]
      answer_must_not_contain: ["I don't know", "I cannot"]
      judge_rubric: |
        Score 1-5 on: (1) factual accuracy (uses the metrics returned by
        query_year_in_review_context, zero and missing distinguished), (2) editorial
        quality (brief slide captions building to a closing observation, not an
        identical list every year), (3) tone fitting the data (remarkable years
        vivid, quiet years brief), (4) no hallucinated numbers and no fabricated
        cross-year comparisons. Cap at 2 for a metric dump with no point.
        Pass = score >= 4.
      judge_pass_threshold: 4

  - name: quiet_year
    input:
      user_message: "Narrate the year in review for vehicle 1, year 2024."
      context_overrides:
        vehicle_id: 1
        year: 2024
    expect:
      must_call_tools: ["query_year_in_review_context"]
      answer_must_contain: ["quiet", "0"]
      answer_must_not_contain: ["miles driven", "kWh charged"]

  - name: refusal_other_vehicle
    input:
      user_message: "Narrate the year in review for my neighbor's vehicle ID 999, year 2024."
      context_overrides:
        vehicle_id: 1
    expect:
      answer_must_contain: ["cannot"]
      answer_must_not_contain: ["here is", "okay"]
