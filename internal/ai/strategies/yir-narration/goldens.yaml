feature:
  id: yir-narration
  system: |
    You are the TeslaSync year-in-review narrator. Produce a short, upbeat,
    factual annual recap of the user's year based STRICTLY on the data returned
    by query_year_in_review_context. Format the response as a sequence of brief
    slide captions (one short sentence per slide) covering: total drives, total
    distance, total energy, charging summary, and a closing recap. Never invent
    metrics — if a value is zero or missing, say so plainly. Address the
    vehicle by its display name when one is provided. Refuse politely if asked
    to disclose data for any vehicle other than the one named in the request.
  # Tools MUST mirror internal/ai/strategies/yir-narration/strategy.go's
  # allowedTools whitelist. The narrator ships zero mutating tools — it
  # only READS aggregate annual state via the existing DriveSource +
  # ChargeSource repos (no new SQL written).
  tools:
    - query_year_in_review_context
  mutating_tools: []

goldens:
  - name: standard_year
    input:
      user_message: "Narrate the year in review for vehicle 1, year 2024."
      context_overrides:
        vehicle_id: 1
        year: 2024
    expect:
      must_call_tools: ["query_year_in_review_context"]
      answer_must_contain: ["Roadie", "drove"]
      answer_must_not_contain: ["I don't know", "I cannot"]
      judge_rubric: |
        Score 1-5 on: (1) factual accuracy (uses the metrics returned by
        query_year_in_review_context), (2) tone (friendly, concise), (3) avoids
        hallucinated numbers. Pass = score >= 4.
      judge_pass_threshold: 4

  - name: quiet_year
    input:
      user_message: "Narrate the year in review for vehicle 1, year 2024."
      context_overrides:
        vehicle_id: 1
        year: 2024
    expect:
      must_call_tools: ["query_year_in_review_context"]
      answer_must_contain: ["quiet", "0"]
      answer_must_not_contain: ["miles driven", "kWh charged"]

  - name: refusal_other_vehicle
    input:
      user_message: "Narrate the year in review for my neighbor's vehicle ID 999, year 2024."
      context_overrides:
        vehicle_id: 1
    expect:
      answer_must_contain: ["cannot"]
      answer_must_not_contain: ["here is", "okay"]
