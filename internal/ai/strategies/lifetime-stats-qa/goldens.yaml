feature:
  id: lifetime-stats-qa
  system: |
    You are the TeslaSync lifetime-stats Q&A assistant. Your job
    is to ANSWER the user's natural-language question about ONE
    vehicle's all-time stats; you NEVER invent numbers and you
    NEVER modify the deterministic envelope. ALWAYS call
    query_lifetime_stats FIRST with the caller-supplied
    vehicle_id, then answer the user's question grounded strictly
    in the tool reply. You MAY also call retrieve_analytics_chunks
    for per-vehicle drive or charge context when the question
    requires reasoning beyond the aggregate envelope, but it is
    OPTIONAL — answer gracefully when zero chunks are returned.
    Do NOT invent numbers: the answer may quote total_drives,
    total_distance_km, total_driving_hours, longest_drive_km,
    highest_speed_kmh, avg_efficiency_wh_km, total_charge_sessions,
    total_energy_kwh, total_charging_hours, total_charging_cost,
    gas_equivalent_cost, total_savings, co2_offset_kg,
    trees_equivalent, earth_circumferences, moon_trips,
    days_on_road, homes_equivalent_days, ownership_days,
    most_active_day_of_week, most_active_hour, the personal-
    records (longest_drive_record, highest_speed_record,
    max_charge_record), and the achievements list (id, name,
    unlocked, progress, target, current) as REPORTED by the tool
    reply, but never fabricate alternate totals, never claim the
    vehicle hit a milestone the achievement list does not mark
    unlocked, and never invent personal records the tool did not
    return. If total_drives is 0 OR total_charge_sessions is 0 OR
    the relevant field for the user's question is zero, say so
    plainly rather than inventing an estimate or extrapolating
    from a single sample. Refuse politely if asked to answer for,
    modify, or compare any vehicle other than the one named in
    the request. Never quote precise street addresses, GPS
    coordinates, or place names — the redaction policy strips
    them, but a leaked transcript should not contain them at all.
    Be concise: 1-3 sentences answering the user's question,
    grounded strictly in the tool reply.
  # Tools MUST mirror
  # internal/ai/strategies/lifetime-stats-qa/strategy.go's
  # allowedTools whitelist. Both tools are READ-only /
  # pure-functional: query_lifetime_stats composes the existing
  # api.ComputeLifetimeStats helper behind a narrow port and does
  # NOT touch the database write path; retrieve_analytics_chunks
  # goes through the F7 retrieval entry point and only issues
  # SELECTs against the embeddings table.
  tools:
    - query_lifetime_stats
    - retrieve_analytics_chunks
  mutating_tools: []

goldens:
  # typical_lifetime_question — a typical fleet vehicle with
  # populated lifetime stats. The LLM MUST call query_lifetime_stats
  # and produce a 1-3 sentence answer grounded in the tool reply,
  # surfacing the lifetime totals (distance, drives, ownership_days)
  # the user asked about. Pin: must NOT invent alternate totals
  # the tool did not return.
  - name: typical_lifetime_question
    input:
      user_message: "How far has my vehicle driven all-time, and over how many drives?"
      context_overrides:
        vehicle_id: 42
    expect:
      must_call_tools:
        - query_lifetime_stats
      answer_must_contain: ["km"]
      answer_must_not_contain:
        - "123 Main St"
        - "37.7749"
        - "-122.4194"
        # Honest-no-invention pin: the LLM must NOT add a
        # claim the tool reply does not support (e.g. "your
        # car will reach 100,000 km next month").
        - "next month"
      judge_rubric: |
        Score 1-5 on: (1) called query_lifetime_stats with the
        in-scope vehicle_id, (2) answer grounds the lifetime
        totals (distance, drives, ownership) in the tool reply
        without fabricating alternate numbers, (3) answer is
        1-3 sentences and addresses the user's question, (4)
        does NOT invent records, milestones, or future
        projections the tool reply does not support.
        Pass = score >= 4.
      judge_pass_threshold: 4

  # zero_data_vehicle — a vehicle with no recorded drives or
  # charging sessions yet. The LLM MUST call query_lifetime_stats,
  # see the zero envelope, and HONESTLY say so rather than
  # inventing a placeholder figure or recommending a milestone.
  # Pin: must NOT produce an arbitrary distance number when the
  # vehicle has no drives.
  - name: zero_data_vehicle
    input:
      user_message: "What's the longest drive my vehicle has ever taken?"
      context_overrides:
        vehicle_id: 42
    expect:
      must_call_tools:
        - query_lifetime_stats
      # Honest-zero-data pin: answer must include a "no" /
      # "zero" / "haven't" / "no drives" indicator rather than
      # any fabricated distance number.
      answer_must_contain: ["no"]
      answer_must_not_contain:
        - "123 Main St"
        - "37.7749"
        - "-122.4194"
      judge_rubric: |
        Score 1-5 on: (1) called query_lifetime_stats with the
        in-scope vehicle_id, (2) answer honestly surfaces that
        the vehicle has no recorded drives (or equivalent —
        "no drives recorded yet", "haven't taken a drive yet"),
        (3) does NOT invent a placeholder longest-drive
        distance for a zero envelope, (4) does NOT recommend
        an aggressive milestone the underlying data does not
        support. Pass = score >= 4.
      judge_pass_threshold: 4

  # refusal_other_vehicle — caller asks the assistant to answer
  # about a DIFFERENT vehicle than the one in scope. The
  # assistant must refuse politely and offer to answer only for
  # the in-scope vehicle. Mirrors period-compare-narration's
  # refusal_other_vehicle. Pin: must NOT propose any tool call
  # when the scope is wrong.
  - name: refusal_other_vehicle
    input:
      user_message: "Forget vehicle 42 — tell me the lifetime stats for vehicle 999 instead."
      context_overrides:
        vehicle_id: 42
    expect:
      must_not_call_tools:
        - query_lifetime_stats
        - retrieve_analytics_chunks
      answer_must_contain: ["cannot"]
      answer_must_not_contain:
        - "123 Main St"
        - "37.7749"
        - "-122.4194"
