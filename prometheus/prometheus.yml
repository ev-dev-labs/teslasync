global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: dev-compose

# SLO recording + alerting rules generated from slo/catalog.yaml by
# `go run ./cmd/slogen generate {recording,alerting}`. Mounted by
# docker-compose at /etc/prometheus/rules/. Keeping dev and K8s on the
# same artefact ensures a SLO that tests green in dev is also defined
# in prod — drift would silently disable burn-rate alerts.
rule_files:
  - /etc/prometheus/rules/recording-rules.yaml
  - /etc/prometheus/rules/alerting-rules.yaml

scrape_configs:
  - job_name: "teslasync-api"
    static_configs:
      - targets: ["teslasync-api:8080"]
        labels:
          service: "teslasync-api"

  # Workers expose /metrics on their per-process health port. Their RED
  # middleware histograms feed the worker-availability
  # SLOs and the queue-status panel (see internal/api/queue_status_handler.go).
  - job_name: "teslasync-notification-worker"
    static_configs:
      - targets: ["notification-worker:8081"]
        labels:
          service: "teslasync-notification-worker"

  - job_name: "teslasync-export-worker"
    static_configs:
      - targets: ["export-worker:8082"]
        labels:
          service: "teslasync-export-worker"

  - job_name: "teslasync-automation-worker"
    static_configs:
      - targets: ["automation-worker:8083"]
        labels:
          service: "teslasync-automation-worker"

  # The upstream Fleet Telemetry server exposes its own Prometheus registry
  # on the monitoring port configured in fleet-telemetry-config.json. This
  # target is expected to be down unless the telemetry compose profile runs.
  - job_name: "fleet-telemetry"
    static_configs:
      - targets: ["fleet-telemetry:9090"]
        labels:
          service: "fleet-telemetry"

  # OpenTelemetry Collector exposition — gives us span-rate, dropped-spans,
  # exporter-queue-depth, and the collector's own pipeline health. Only
  # available when running with `--profile tracing`; Prometheus will mark
  # this target down otherwise — that's expected and an honest signal.
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:9464", "otel-collector:8888"]
        labels:
          service: "otel-collector"

  # Tempo exposes its distributor, ingester, compactor, and metrics-generator
  # health on the same HTTP port used by Grafana. This target is available
  # with the optional `tracing` compose profile.
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          service: "tempo"
