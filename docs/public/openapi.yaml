  # ─── Analytics ──────────────────────────────────────────────────────
  /insurance-telematics:
    get:
      operationId: getInsuranceRiskProfile
      summary: Get the selected-clock insurance risk profile
      description: |
        Scores completed-drive evidence over the existing rolling UTC instant
        window. Optional timezone changes overnight trip-start classification
        and Sunday-start calendar-week trend grouping, not stored timestamps
        or eligibility bounds. The night_distance_m field remains the full
        distance of trips starting at or after 22:00 or before 05:00 in that
        clock; it is not measured distance traveled overnight. Omitting timezone
        preserves UTC behavior. The limited risk-summary checksum now uses a
        v2 canonical prefix and includes timezone, not the complete evidence.
      tags: [Analytics]
      parameters:
        - name: vehicle_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: window_days
          in: query
          schema:
            type: integer
            default: 90
            maximum: 1095
        - name: timezone
          in: query
          description: IANA location; defaults to UTC. Unknown zones and Local are rejected.
          schema:
            type: string
            default: UTC
      responses:
        "200":
          description: Existing risk profile plus its effective timezone; trend bucket_start remains an absolute instant
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /analytics/sleep:
    get:
      operationId: getSleepAnalytics
      summary: Get vehicle sleep transition evidence
      description: |
        Explicit RFC3339 bounds select [start, end) at database microsecond
        precision. Workspace callers send both shared-header instants, preserving
        selected-clock calendar dates, DST and rolling windows. Legacy date-only
        inputs retain their UTC calendar behavior and existing (start, end] SQL
        representation. Without a start bound, days selects a rolling UTC window
        (default 30, maximum 365). period_days is the rounded elapsed-day count,
        at least one; it does not establish observed sleep duration or occupancy.
        Transition counts remain available while dwell and per-park drain
        reconstruction are unavailable.
      tags: [Analytics]
      parameters:
        - name: vehicle_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: start
          in: query
          schema:
            type: string
          description: Inclusive RFC3339 instant or legacy YYYY-MM-DD UTC date.
        - name: end
          in: query
          schema:
            type: string
          description: Exclusive RFC3339 instant or legacy inclusive YYYY-MM-DD UTC date.
        - name: days
          in: query
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 365
          description: Used only when no explicit start bound is supplied.
      responses:
        "200":
          description: Transition evidence with preserved unavailable-duration fields
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /analytics/fleet:
    get:
      operationId: getFleetAnalytics
