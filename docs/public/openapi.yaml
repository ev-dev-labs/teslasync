          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/cases/scan:
    post:
      operationId: runDataRepairCaseScan
      summary: Run a bounded integrity scan
      description: Creates or refreshes durable cases using the shared cluster-locked scanner. Never mutates drive or charging source rows.
      tags: [Data Repair]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                vehicle_id:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Completed scan
          content:
            application/json:
