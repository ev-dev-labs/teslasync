  # ─── Data Repair ───────────────────────────────────────────────────
  /data-repair/stale-sessions:
    get:
      operationId: listStaleSessions
      summary: List stale/orphaned sessions
      description: Returns stale or orphaned drive and charging sessions.
      tags: [Data Repair]
      responses:
        "200":
          description: Stale sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  stale_drives:
                    type: array
                    items:
                      $ref: "#/components/schemas/Drive"
                  stale_charging:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChargingSession"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/suggestions:
    get:
      operationId: diagnoseDataRepairSuggestions
      summary: Diagnose session-boundary anomalies
      description: Returns bounded, evidence-backed repair proposals without changing source data.
      tags: [Data Repair]
      parameters:
        - name: vehicle_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: lookback_days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
        - name: limit
          in: query
          description: Maximum candidates inspected per session kind.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Evidence-backed repair diagnosis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairSuggestionReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: Diagnosis source is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/cases:
    get:
      operationId: listDataRepairCases
      summary: List durable repair cases
      description: Returns a bounded keyset-paginated repair worklist.
      tags: [Data Repair]
      parameters:
        - name: vehicle_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          description: A specific lifecycle status, or `active` for both open and in-review cases.
          schema:
            oneOf:
              - $ref: "#/components/schemas/DataRepairCaseStatus"
              - type: string
                enum: [active]
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/DataRepairSessionKind"
        - name: confidence
          in: query
          schema:
            $ref: "#/components/schemas/DataRepairConfidence"
        - name: assigned_to
          in: query
          schema:
            type: string
            maxLength: 255
        - name: cursor_last_seen_at
          in: query
          schema:
            type: string
            format: date-time
        - name: cursor_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Repair case page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairCaseList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: Case management is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/cases/stats:
    get:
      operationId: getDataRepairCaseStats
      summary: Get repair-case statistics
      tags: [Data Repair]
      parameters:
        - name: vehicle_id
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Repair-case counts and latest successful scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairCaseStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: Case management is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/cases/scan:
    post:
      operationId: runDataRepairCaseScan
      summary: Run a bounded integrity scan
      description: Creates or refreshes durable cases using the shared cluster-locked scanner. Never mutates drive or charging source rows.
      tags: [Data Repair]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                vehicle_id:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Completed scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairScanResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another scanner currently owns the cluster-wide lock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Scanner is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /data-repair/cases/bulk-transition:
    post:
      operationId: bulkTransitionDataRepairCases
      summary: Begin review or dismiss multiple cases
      tags: [Data Repair]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [case_ids, status]
              properties:
                case_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: integer
                    minimum: 1
                status:
                  type: string
                  enum: [in_review, dismissed]
                resolution_note:
                  type: string
                  maxLength: 4000
      responses:
        "200":
          description: Bulk transition result
          content:
            application/json:
              schema:
                type: object
                required: [updated, skipped]
                properties:
                  updated:
                    type: integer
                    minimum: 0
                  skipped:
                    type: integer
                    minimum: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/cases/{id}:
    get:
      operationId: getDataRepairCase
      summary: Get one repair case and its review trail
      tags: [Data Repair]
      parameters:
        - $ref: "#/components/parameters/dataRepairID"
      responses:
        "200":
          description: Repair case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairCaseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/cases/{id}/correction-preview:
    post:
      operationId: previewDataRepairCaseCorrection
      summary: Preview a case-linked structural correction
      description: >
        Read-only preview of an operator-selected correction. Values use SI units.
        For a boundary, both related sessions and all overlapping sessions are checked.
        No source data or case state is changed.
      tags: [Data Repair]
      parameters:
        - $ref: "#/components/parameters/dataRepairID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRepairCaseCorrectionInput"
      responses:
        "200":
          description: Exact proposed changes and a source snapshot hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairCaseCorrectionPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The case or supporting source data is no longer current
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Correction source is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /data-repair/cases/{id}/correction:
    post:
      operationId: applyDataRepairCaseCorrection
      summary: Apply a reviewed case-linked structural correction
      description: >
        Requires sudo and the source hash returned by preview. The case and
        source rows are locked and revalidated, and the correction, case outcome,
        and audit records commit together. Estimated energy-derived charging
        costs become unknown when the energy is corrected; actual costs are preserved.
      tags: [Data Repair]
      parameters:
        - $ref: "#/components/parameters/dataRepairID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/DataRepairCaseCorrectionInput"
                - type: object
                  required: [expected_source_hash]
      responses:
        "200":
          description: Reviewed correction applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairCaseCorrectionPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The case, source data, reviewed choice, or overlap check changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Correction source is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /data-repair/cases/{id}/transition:
    post:
      operationId: transitionDataRepairCase
      summary: Change a repair case lifecycle state
      tags: [Data Repair]
      parameters:
        - $ref: "#/components/parameters/dataRepairID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, expected_updated_at]
              properties:
                status:
                  type: string
                  enum: [open, in_review, dismissed, resolved]
                expected_updated_at:
                  type: string
                  format: date-time
                resolution_note:
                  type: string
                  maxLength: 4000
      responses:
        "200":
          description: Updated repair case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairCase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Lifecycle conflict or stale optimistic-concurrency token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/cases/{id}/assignment:
    put:
      operationId: assignDataRepairCase
      summary: Assign or unassign a repair case
      tags: [Data Repair]
      parameters:
        - $ref: "#/components/parameters/dataRepairID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assigned_to]
              properties:
                assigned_to:
                  type: string
                  nullable: true
                  maxLength: 255
      responses:
        "200":
          description: Updated repair case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairCase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

