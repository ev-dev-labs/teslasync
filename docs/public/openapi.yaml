          type: integer
        vehicle_id:
          type: integer
        version:
          type: string
        status:
          type: string
          enum: [available, downloading, installing, installed]
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        installed_at:
          type: string
          format: date-time
          nullable: true
