  /ownership/trip-packet:
    description: Private monthly evidence assembled from explicit drive purposes and matching receipt references. Requires a verified sign-in; responses are not cacheable.
    parameters:
      - { name: vehicle_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      operationId: getPrivateTripPacket
      summary: Read the private settings, current packet or one completed drive's confirmed purpose
      tags: [Analytics]
      parameters:
        - { name: drive_id, in: query, schema: { type: integer, format: int64, minimum: 1 }, description: Read a single entry instead of the packet. }
      responses:
        "200":
          description: The scoped review. Null plan means off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripPacketReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The revision or expected principal changed. }
    put:
      operationId: savePrivateTripPacket
      summary: Confirm, update, resume or pause private trip packet preparation
      tags: [Analytics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/TripPacketExpectedVersion" }
                - type: object
                  required: [time_zone]
                  properties:
                    time_zone: { type: string, maxLength: 80, example: America/New_York }
                    confirmed: { type: boolean, description: Must be true unless pausing. }
                    paused: { type: boolean, default: false }
      responses:
        "204": { description: Settings saved. A replaced or paused plan cannot publish in-flight work. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: The revision or expected principal changed. }
    patch:
      operationId: editPrivateTripPacket
      summary: Record one explicit drive purpose or dismiss the current packet
      tags: [Analytics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/TripPacketExpectedVersion" }
                - type: object
                  properties:
                    entry: { $ref: "#/components/schemas/TripPacketEntry" }
                    dismiss_through: { type: string, format: date-time, description: Exclusive end returned with the current packet. }
                  oneOf:
                    - required: [entry]
                    - required: [dismiss_through]
      responses:
        "204": { description: The selected classification was replaced or the current packet was dismissed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: The revision or expected principal changed. }
    post:
      operationId: exportPrivateTripPacket
      summary: Return the current explicitly confirmed packet for local download
      tags: [Analytics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/TripPacketExpectedVersion" }
                - type: object
                  required: [digest, confirmed]
                  properties:
                    digest: { type: string, pattern: '^[0-9a-f]{64}$', description: Digest from the most recent review, checked against current evidence. }
                    confirmed: { type: boolean, enum: [true] }
      responses:
        "200":
          description: Business evidence only. Does not export identifiers of unclassified drives or send anything to a recipient.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripPacketEvidence" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: The evidence, expiry, revision or expected principal changed. }
    delete:
      operationId: clearPrivateTripPacket
      summary: Revoke private packet consent and remove derived entries without deleting drives
      tags: [Analytics]
      parameters:
        - { name: plan_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: expected_revision, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "204": { description: Future checks stopped; private tags and receipt references removed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: The revision or expected principal changed. }

