  /media/favorite-digest:
    description: Private weekly, per-vehicle digest of repeated playback observations. No push, provider access, or inferred preferences.
    parameters:
      - { name: vehicle_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      operationId: getPrivateFavoriteDigest
      summary: Read the current schedule, unexpired shortlist and explicitly confirmed local favorites
      tags: [Media]
      responses:
        "200":
          description: The selected vehicle's private digest settings; revision zero is off.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [vehicle_id, revision, favorites]
                    properties:
                      vehicle_id: { type: integer, format: int64 }
                      revision: { type: integer, format: int64, minimum: 0 }
                      time_zone: { type: string }
                      next_at: { type: string, format: date-time, description: Absent when paused or off. }
                      favorites:
                        type: array
                        maxItems: 50
                        items: { $ref: "#/components/schemas/PrivateFavoriteRecording" }
                      digest:
                        type: object
                        required: [from, until, expires_at, candidates]
                        properties:
                          from: { type: string, format: date-time }
                          until: { type: string, format: date-time, description: Exclusive end of the observation week. }
                          expires_at: { type: string, format: date-time }
                          candidates:
                            type: array
                            maxItems: 5
                            items:
                              allOf:
                                - { $ref: "#/components/schemas/PrivateFavoriteRecording" }
                                - type: object
                                  required: [observed_drives, observed_dates]
                                  properties:
                                    observed_drives: { type: integer, minimum: 3, maximum: 100 }
                                    observed_dates: { type: integer, minimum: 2, maximum: 7 }
        "403": { description: Verified private sign-in required. }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: configurePrivateFavoriteDigest
      summary: Explicitly schedule, edit or pause the private weekly shortlist
      tags: [Media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision, confirmed, time_zone, paused]
              properties:
                expected_revision: { type: integer, format: int64, minimum: 0 }
                confirmed: { type: boolean, enum: [true] }
                time_zone: { type: string, maxLength: 80, example: America/New_York }
                paused: { type: boolean }
      responses:
        "204": { description: Settings committed; the worker checks the next local Monday at 09:00 unless paused. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Verified private sign-in required. }
        "409": { description: Vehicle or consent revision changed. }
        "429": { description: Too many private digest changes. }
    post:
      operationId: actOnPrivateFavoriteDigest
      summary: Confirm a current suggestion, dismiss a shortlist, or remove a confirmed favorite locally
      tags: [Media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, action]
              properties:
                revision: { type: integer, format: int64, minimum: 1 }
                action: { type: string, enum: [confirm, remove, dismiss] }
                digest_until: { type: string, format: date-time, description: Required for confirm and dismiss only. }
                key: { type: string, pattern: "^[0-9a-f]{64}$", description: Required for confirm and remove only. }
      responses:
        "204": { description: Explicit local choice committed. No provider traffic. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Verified private sign-in required. }
        "409": { description: Consent revision, shortlist or candidate changed, or saved favorites reached the limit. }
        "429": { description: Too many private digest changes. }
    delete:
      operationId: clearPrivateFavoriteDigest
      summary: Disable weekly review and delete derived private suggestions and favorites
      tags: [Media]
      parameters:
        - { name: revision, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "204": { description: All local digest data for the exact revision cleared; playback history unchanged. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Verified private sign-in required. }
        "409": { description: Consent revision or vehicle changed. }
        "429": { description: Too many private digest changes. }

  /media/episode-review:
    description: Private pre-drive estimate from one manually reported or explicitly authorized episode progress snapshot. No notifications or playback controls.
    parameters:
      - { name: vehicle_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      operationId: getPrivateEpisodeReview
      summary: Read the current private episode review and fit status
      tags: [Media]
      responses:
        "200":
          description: The available fit evidence, with unknown position and remaining duration never defaulted to zero.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, vehicle_id, reason, spotify_available]
                    properties:
                      id: { type: integer, format: int64, minimum: 0 }
                      vehicle_id: { type: integer, format: int64 }
                      reason: { type: string, enum: [off, expired, awaiting_progress, drive_unmatched, unknown_progress, completed, not_fit, fits] }
                      spotify_available: { type: boolean }
                      departure_at: { type: string, format: date-time }
                      expires_at: { type: string, format: date-time }
                      drive_duration_s: { type: integer, minimum: 300, maximum: 21600 }
                      remaining_s: { type: integer, minimum: 1, maximum: 86400 }
                      title: { type: string }
                      spotify_episode: { type: string, format: uri, description: Catalog link; not a playback acknowledgment. }
                      spotify_start_s: { type: integer, minimum: 0, maximum: 86399, description: Known saved cursor for the exact matching Spotify episode; omitted for unknown progress or local reviews. Not a playback acknowledgment. }
        "403": { description: Verified private sign-in required. }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: confirmPrivateEpisodeReview
      summary: Confirm one estimated drive and manual progress or start a narrowly scoped Spotify progress read
      tags: [Media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_review_id, departure_at, drive_duration_s, confirmed]
              properties:
                expected_review_id: { type: integer, format: int64, minimum: 0 }
                departure_at: { type: string, format: date-time, description: Future departure within 24 hours. }
                drive_duration_s: { type: integer, minimum: 300, maximum: 21600 }
                confirmed: { type: boolean, enum: [true] }
                spotify_episode: { type: string, maxLength: 512, description: Exact Spotify episode URL. Use only if manual progress is absent or null. }
                manual:
                  type: object
                  nullable: true
                  required: [title, duration_s]
                  properties:
                    title: { type: string, maxLength: 256 }
                    duration_s: { type: integer, minimum: 1, maximum: 86400 }
                    position_s: { type: integer, minimum: 0, maximum: 86400, nullable: true }
      responses:
        "200":
          description: Review saved. The authorization URL is populated only for the separate read-only Spotify path.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [authorization_url]
                    properties:
                      authorization_url: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Verified private sign-in required. }
        "409": { description: Vehicle, review revision or identity changed. }
        "429": { description: Too many review changes. }
        "503": { description: Spotify progress authorization unavailable. }
    delete:
      operationId: clearPrivateEpisodeReview
      summary: Remove the private episode review and any pending read authorization
      tags: [Media]
      parameters:
        - $ref: "#/components/parameters/privateMediaReviewID"
      responses:
        "204": { description: Local review cleared. Provider listening history unchanged. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Verified private sign-in required. }
        "409": { description: Review or subject changed. }
        "429": { description: Too many review changes. }

  /media/drive-track/{driveID}:
    description: Private subject-bound lookup for one exact instant during a completed drive. Local lookup never calls a provider or sends a notification.
    parameters:
      - $ref: "#/components/parameters/privateTrackDriveID"
      - $ref: "#/components/parameters/privateTrackVehicleID"
    get:
      operationId: getPrivateDriveTrack
      summary: Read the current private lookup and its exact, bracketing observations
      tags: [Media]
      responses:
        "200":
          description: The selected time and its supported track, or the reason a track is unavailable.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PrivateDriveTrack" }
        "403": { description: Verified private sign-in required. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Subject or review changed while reading. }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: confirmPrivateDriveTrack
      summary: Confirm a 30-minute local lookup of one instant in the displayed drive window
      tags: [Media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_review_id, started_at, ended_at, offset_s, confirmed]
              properties:
                expected_review_id: { type: integer, format: int64, minimum: 0, description: Zero for first setup. }
                started_at: { type: string, format: date-time }
                ended_at: { type: string, format: date-time }
                offset_s: { type: integer, minimum: 0, maximum: 86399, description: Elapsed seconds from the drive start. The instant must precede the end. }
                confirmed: { type: boolean, enum: [true] }
      responses:
        "204": { description: Local lookup consent stored. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Verified private sign-in required. }
        "409": { description: The drive window, review or subject changed. }
        "429": { description: Too many review changes. }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: clearPrivateDriveTrack
      summary: Clear the private review without changing drive or playback history
      tags: [Media]
      parameters:
        - $ref: "#/components/parameters/privateMediaReviewID"
      responses:
        "204": { description: Private lookup, authorization and outcome removed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Verified private sign-in required. }
        "409": { description: Subject or review changed, or a save is in flight. }
        "429": { description: Too many review changes. }
        "500": { $ref: "#/components/responses/InternalError" }

  /media/drive-track/{driveID}/spotify:
    parameters:
      - $ref: "#/components/parameters/privateTrackDriveID"
      - $ref: "#/components/parameters/privateTrackVehicleID"
      - $ref: "#/components/parameters/privateMediaReviewID"
    post:
      operationId: authorizePrivateSpotifyLibrary
      summary: Start a one-use PKCE attempt for only user-library-modify
      tags: [Media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: boolean, enum: [true] }
      responses:
        "200":
          description: Spotify authorization URL for this subject, review and permission.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [authorization_url]
                    properties:
                      authorization_url: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Verified private sign-in required. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Changed or unqualified review or identity. }
        "429": { description: Too many authorization attempts. }
        "503": { description: Spotify connector or encryption unavailable. }
    delete:
      operationId: disconnectPrivateSpotifyLibrary
      summary: Remove the local lookup's library grant and pending authorization
      tags: [Media]
      responses:
        "204": { description: Local authorization removed. Previously saved tracks are unchanged. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Verified private sign-in required. }
        "409": { description: Subject or review changed. }
        "429": { description: Too many authorization changes. }
        "500": { $ref: "#/components/responses/InternalError" }

  /media/drive-track/{driveID}/spotify/save:
    parameters:
      - $ref: "#/components/parameters/privateTrackDriveID"
      - $ref: "#/components/parameters/privateTrackVehicleID"
      - $ref: "#/components/parameters/privateMediaReviewID"
    post:
      operationId: savePrivateDriveTrackToSpotify
      summary: Verify and save a single explicitly selected track to the authorized personal library
      tags: [Media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed, evidence_key, spotify_track]
              properties:
                confirmed: { type: boolean, enum: [true] }
                evidence_key: { type: string, pattern: "^[0-9a-f]{64}$" }
                spotify_track: { type: string, format: uri, maxLength: 512 }
      responses:
        "200":
          description: Persisted outcome of one provider write attempt. No automatic retry.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, enum: [saved, rejected, unknown] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Verified private sign-in required. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Review, evidence or subject changed, or an active library grant is required. }
        "422": { description: Spotify could not verify the exact recording. No save attempted. }
        "429": { description: Too many save requests. }
        "503": { description: Spotify connector or encryption unavailable. }

  /media/journey-soundtrack/{journeyID}:
    description: Private review of source-attested playback within completed drives fully contained in one journey. Available to a verified ForwardAuth subject for the selected vehicle. No external service or delivery channel is used.
    parameters:
      - { name: journeyID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - { name: vehicle_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      operationId: getPrivateJourneySoundtrack
      summary: Read the authorized review and ordered local observations
      tags: [Media]
      responses:
        "200":
          description: The review status and eligible playback evidence. Off or held reviews never contain track evidence.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PrivateJourneySoundtrack" }
        "403": { description: Verified private sign-in required. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Subject or review changed while reading. }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: confirmPrivateJourneySoundtrack
      summary: Authorize local review of this exact completed journey interval
      tags: [Media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_review_id, started_at, ended_at, confirmed]
              properties:
                expected_review_id: { type: integer, format: int64, minimum: 0, description: Zero for first setup. }
                started_at: { type: string, format: date-time }
                ended_at: { type: string, format: date-time }
                confirmed: { type: boolean, enum: [true] }
      responses:
        "204": { description: New private consent recorded, not proof of available playback evidence. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Verified private sign-in required. }
        "409": { description: The journey, consent or identity changed, or the journey does not qualify. }
        "429": { description: Too many review changes. }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: holdPrivateJourneySoundtrack
      summary: Pause or snooze review for one day without deleting history
      tags: [Media]
      parameters:
        - $ref: "#/components/parameters/privateMediaReviewID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [pause, snooze] }
      responses:
        "204": { description: Private review held. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Verified private sign-in required. }
        "409": { description: Subject or review changed, expired or is already paused. }
        "429": { description: Too many review changes. }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: clearPrivateJourneySoundtrack
      summary: Remove the private review without changing drive or media history
      tags: [Media]
      parameters:
        - $ref: "#/components/parameters/privateMediaReviewID"
      responses:
        "204": { description: Private consent deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Verified private sign-in required. }
        "409": { description: Subject or review changed. }
        "429": { description: Too many review changes. }
        "500": { $ref: "#/components/responses/InternalError" }

  /media/playlist-review:
    description: Private on-demand playlist preview for a verified ForwardAuth subject and selected active vehicle. No provider calls occur during preview.
    parameters:
      - { name: vehicle_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      operationId: getPrivateDrivePlaylist
      summary: Read the current private preview, outcome and connection status
      tags: [Media]
      responses:
        "200":
          description: The current preview or null when off.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [draft, spotify_available, spotify_connected]
                    properties:
                      draft: { $ref: "#/components/schemas/PrivatePlaylistDraft" }
                      spotify_available: { type: boolean }
                      spotify_connected: { type: boolean }
        "403": { description: Verified private sign-in required. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Signed-in subject changed. }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: buildPrivateDrivePlaylist
      summary: Confirm a drive and analyze bounded local playback evidence
      tags: [Media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_draft_id, departure_at, target_duration_s, confirmed]
              properties:
                expected_draft_id: { type: integer, format: int64, minimum: 0, description: Zero for first setup. }
                departure_at: { type: string, format: date-time }
                target_duration_s: { type: integer, minimum: 300, maximum: 21600 }
                confirmed: { type: boolean, enum: [true], description: Confirmed departure and permission to use this vehicle's local playback evidence. }
      responses:
        "204": { description: Local preview recorded; may have no sufficiently supported candidates. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Verified private sign-in required. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Subject or preview changed. }
        "429": { description: Too many review changes. }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: holdPrivateDrivePlaylist
      summary: Pause or snooze local playlist review
      tags: [Media]
      parameters:
        - { $ref: "#/components/parameters/privatePlaylistDraftID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [pause, snooze] }
      responses:
        "204": { description: Review held; no external changes. }
        "403": { description: Verified private sign-in required. }
        "409": { description: Review changed or departed. }
    delete:
      operationId: clearPrivateDrivePlaylist
      summary: Turn off and clear local playlist preview and outcome
      tags: [Media]
      parameters:
        - { $ref: "#/components/parameters/privatePlaylistDraftID" }
      responses:
        "204": { description: Local preview cleared; source and provider records are unchanged. }
        "403": { description: Verified private sign-in required. }
        "409": { description: Review changed or its save is still in progress. }

  /media/playlist-review/save:
    post:
      operationId: savePrivateDrivePlaylist
      summary: Verify explicitly selected tracks and save one private Spotify playlist
      description: Requires active authorization and unexpired local preview. The server never retries either provider write or performs playback.
      tags: [Media]
      parameters:
        - { name: vehicle_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { $ref: "#/components/parameters/privatePlaylistDraftID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, selection, confirmed]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                confirmed: { type: boolean, enum: [true] }
                selection:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [position, spotify_track_link]
                    properties:
                      position: { type: integer, minimum: 1, maximum: 100 }
                      spotify_track_link: { type: string, format: uri, maxLength: 512 }
      responses:
        "200":
          description: Recorded outcome. An outcome other than saved is not confirmation of playlist contents.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, enum: [saved, rejected, created_only, unknown] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Verified private sign-in required. }
        "409": { description: Subject, preview or authorization changed, or already dispatched. }
        "422": { description: Track identity, artist and duration could not be verified; no provider write. }
        "429": { description: Too many requests. }
        "503": { description: Spotify connector unavailable. }

  /media/spotify/connection:
    post:
      operationId: beginPrivateSpotifyPlaylistAuthorization
      summary: Start a one-use Spotify PKCE flow for private playlist permission
      tags: [Media]
      parameters:
        - { name: vehicle_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: boolean, enum: [true] }
      responses:
        "200":
          description: Spotify authorization URL; no playlist write has occurred.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [authorization_url]
                    properties:
                      authorization_url: { type: string, format: uri }
        "403": { description: Verified private sign-in required. }
        "503": { description: Connector or encrypted storage unavailable. }
    delete:
      operationId: disconnectPrivateSpotifyPlaylistAuthorization
      summary: Remove the current subject's authorization and unused state
      tags: [Media]
      responses:
        "204": { description: Local connection removed; provider playlists unchanged. }
        "403": { description: Verified private sign-in required. }

  /media/spotify/callback:
    get:
      operationId: completePrivateSpotifyPlaylistAuthorization
      summary: Redeem a playlist, library or episode progress one-use PKCE state for the same signed-in subject
      tags: [Media]
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "303": { description: Returns to Media player or Drive Detail according to the purpose-bound state, without forwarding the code or state. }
        "403": { description: Verified private sign-in required. }

