        "204": { description: Plan saved; does not query or operate a vehicle. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PrivateBatteryReviewChanged" }
        "429": { description: Too many settings changes. }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: dismissOvernightDrainReview
      summary: Dismiss this morning's review
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id, morning_at]
              properties:
                plan_id: { type: integer, format: int64, minimum: 1 }
                morning_at: { type: string, format: date-time }
      responses:
        "204": { description: Review dismissed for the selected morning. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PrivateBatteryReviewChanged" }
        "429": { description: Too many settings changes. }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: clearOvernightDrainPlan
      summary: Turn off and clear the derived overnight review for this vehicle
      tags: [Notifications]
      parameters:
        - $ref: "#/components/parameters/privateBatteryReviewPlan"
      responses:
        "204": { description: Deleted settings and derived review; source telemetry is retained. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PrivateBatteryReviewChanged" }
        "429": { description: Too many settings changes. }
        "500": { $ref: "#/components/responses/InternalError" }

