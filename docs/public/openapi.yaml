        open:
          type: integer
        in_review:
          type: integer
        applied:
          type: integer
        dismissed:
          type: integer
        quarantined:
          type: integer
        restored:
          type: integer
        resolved:
          type: integer
        drive:
          type: integer
        charging:
          type: integer
        oldest_open_at:
          type: string
          format: date-time
          nullable: true
        last_scan_at:
          type: string
          format: date-time
          nullable: true

    DataRepairQuarantineList:
      type: object
      required: [quarantines, has_more]
      properties:
        quarantines:
          type: array
          items:
            $ref: "#/components/schemas/DataRepairQuarantine"
        has_more:
          type: boolean
        next_cursor:
          type: object
          nullable: true
          required: [quarantined_at, id]
          properties:
            quarantined_at:
              type: string
              format: date-time
            id:
              type: integer
              format: int64

    DataRepairScanResult:
      type: object
      required: [run_id, status, discovered, refreshed, truncated]
      properties:
        run_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [completed]
        discovered:
          type: integer
          minimum: 0
        refreshed:
          type: integer
          minimum: 0
        truncated:
          type: boolean

    DataRepairCloseRequest:
      type: object
      additionalProperties: false
      required: [ended_at, rule, expected_stored_ended_at]
      properties:
        case_id:
          type: integer
          format: int64
          minimum: 1
        ended_at:
          type: string
          format: date-time
        rule:
          type: string
          description: Server-provided diagnosis rule, or manual for an explicit operator boundary.
        expected_stored_ended_at:
          type: string
