  /charging-reconciliation/invoices:
    get:
      operationId: listChargingInvoices
      summary: List the subject's imported statements for the selected vehicle
      tags: [Charging]
      parameters:
        - { name: vehicle_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { $ref: "#/components/parameters/limitParam" }
        - { $ref: "#/components/parameters/offsetParam" }
      responses:
        "200":
          description: The selected vehicle's imported statements. Private responses are not cacheable.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ChargingInvoiceRecord" } }
                  total: { type: integer, minimum: 0 }
                  limit: { type: integer, minimum: 1 }
                  offset: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: importChargingInvoice
      summary: Import an invoice and optionally enable a private evidence-based statement check
      tags: [Charging]
      description: An opted-in statement is allowed only with verified sign-in. Omitting variance_options leaves the statement opted out. The optional reading, rate and complete fees are entered by the subject and not sent to any provider.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChargingInvoiceInput" }
      responses:
        "201":
          description: Statement and any optional review evidence saved privately.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargingInvoiceRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: A private variance check needs a verified sign-in. }
        "409": { description: An invoice already exists with the same provider and reference, or the identity has changed. }

  /charging-reconciliation/invoices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    delete:
      operationId: deleteChargingInvoice
      summary: Remove the subject's imported statement and any optional review evidence
      tags: [Charging]
      responses:
        "204": { description: The imported statement and related local data were removed; telemetry and provider records are unchanged. }
        "404": { $ref: "#/components/responses/NotFound" }

  /smart-charging/backup-charging:
    get:
      summary: Read the signed-in person's backup charging watch and unexpired evidence
      parameters:
        - in: query
          name: vehicle_id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Setup availability, read-only Tesla Energy connection status and local connection_revision when connected, server-authoritative active status, and nullable watch and decision. The decision includes observed and expiry timestamps, vehicle power in watts, and a conservative lower-bound estimate of home battery draw in watts.
        "403": { description: A verified signed-in principal is required. }
    post:
      summary: Start a one-hour watch for an explicitly confirmed utility outage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [vehicle_id, connection_revision, place_id, place_updated_at, device_id, device_updated_at, same_backup_circuit_confirmed, utility_outage_confirmed]
              properties:
                vehicle_id: { type: integer, format: int64, minimum: 1 }
                connection_revision: { type: integer, format: int64, minimum: 1 }
                place_id: { type: integer, format: int64, minimum: 1 }
                place_updated_at: { type: string, format: date-time }
                device_id: { type: integer, format: int64, minimum: 1 }
                device_updated_at: { type: string, format: date-time, description: Revision of the verified browser selected during confirmation. }
                same_backup_circuit_confirmed: { type: boolean, enum: [true] }
                utility_outage_confirmed: { type: boolean, enum: [true] }
      responses:
        "204": { description: Watch started; no provider write or vehicle command is made. }
        "400": { description: Missing or invalid input or confirmation. }
        "404": { description: The reviewed connection, place, vehicle, or verified recipient is unavailable, or a watch already exists. }
        "503": { description: Read-only Tesla Energy or personal delivery is unavailable. }
    delete:
      summary: Remove the exact watch and withdraw pending recommendations
      parameters:
        - in: query
          name: vehicle_id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: watch_id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "204": { description: The selected watch was removed. }
        "404": { description: No such watch for the signed-in principal and selected vehicle. }
  /smart-charging/shared-chargers:
    parameters:
      - { $ref: "#/components/parameters/sharedPlanningPrincipal" }
    get:
      operationId: listSharedChargerPlanning
      summary: List the current browser subject's charger plans and invitations
      tags: [Charging]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 32 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        "200":
          description: Private, non-cacheable owner refs and exact-subject invitations. No other subjects or confirmation inputs are returned.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [can_manage, owned, invitations]
                    properties:
                      can_manage: { type: boolean }
                      owned: { type: array, items: { $ref: "#/components/schemas/SharedChargerOwnedPlan" } }
                      invitations:
                        type: array
                        items:
                          allOf:
                            - { $ref: "#/components/schemas/SharedChargerOwnedPlan" }
                            - type: object
                              required: [vehicle_id, place_updated_at, reminder_offered, confirmed]
                              properties:
                                vehicle_id: { type: integer, format: int64 }
                                place_updated_at: { type: string, format: date-time }
                                reminder_offered: { type: boolean }
                                confirmed: { type: boolean }
        "409": { description: The expected principal no longer matches the browser. }
    post:
      operationId: authorizeSharedCharger
      summary: Authorize two vehicle nominations at one reviewed charger
      tags: [Charging]
      requestBody:
        $ref: "#/components/requestBodies/SharedChargerAuthorization"
      responses:
        "201": { $ref: "#/components/responses/SharedChargerSaved" }
        "403": { description: A trusted operator browser is required. }
        "404": { description: The reviewed charger revision or an active vehicle was not found. }
        "409": { description: This charger already has an active plan, or the identity has changed. }

  /smart-charging/shared-chargers/{planID}:
    parameters:
      - { $ref: "#/components/parameters/sharedPlanningPrincipal" }
      - { $ref: "#/components/parameters/sharedChargerPlanID" }
      - { $ref: "#/components/parameters/sharedChargerRevision" }
    put:
      operationId: reviseSharedCharger
      summary: Replace the exact plan revision and clear both confirmations
      tags: [Charging]
      requestBody:
        $ref: "#/components/requestBodies/SharedChargerAuthorization"
      responses:
        "200": { $ref: "#/components/responses/SharedChargerSaved" }
        "403": { description: A trusted operator browser is required. }
        "404": { description: The exact owned revision or reviewed charger is unavailable. }
        "409": { description: A swap was already published, another active plan exists, or the identity has changed. }
    delete:
      operationId: revokeSharedCharger
      summary: Revoke the exact owned revision and withdraw advice and its reminder
      tags: [Charging]
      responses:
        "204": { description: Revoked without changing any vehicle or charging schedule. }
        "403": { description: A trusted operator browser is required. }
        "404": { description: The exact owned revision is unavailable. }

  /smart-charging/shared-chargers/{planID}/vehicles/{vehicleID}:
    parameters:
      - { $ref: "#/components/parameters/sharedPlanningPrincipal" }
      - { $ref: "#/components/parameters/sharedChargerPlanID" }
      - { $ref: "#/components/parameters/sharedChargerRevision" }
      - { name: vehicleID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      operationId: confirmSharedChargerVehicle
      summary: Confirm this browser subject's nominated vehicle for the current plan
      tags: [Charging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [available_at, departure_at, energy_needed_wh, conservative_power_w, already_plugged]
              properties:
                available_at: { type: string, format: date-time }
                departure_at: { type: string, format: date-time }
                energy_needed_wh: { type: number, minimum: 0 }
                conservative_power_w: { type: number, minimum: 0, exclusiveMinimum: true }
                already_plugged: { type: boolean }
                accept_reminder: { type: boolean, default: false }
      responses:
        "204": { description: The vehicle's plan-specific declaration and consent were recorded. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: The exact revision and nomination are unavailable for this subject. }
        "409": { description: Already confirmed, or the identity has changed. }
    delete:
      operationId: withdrawSharedChargerVehicle
      summary: Withdraw this nomination and end the shared plan
      tags: [Charging]
      responses:
        "204": { description: Advice and pending reminder withdrawn without changing either vehicle. }
        "404": { description: The exact revision and nomination are unavailable for this subject. }

  /smart-charging/shared-chargers/{planID}/card:
    parameters:
      - { $ref: "#/components/parameters/sharedPlanningPrincipal" }
      - { $ref: "#/components/parameters/sharedChargerPlanID" }
      - { $ref: "#/components/parameters/sharedChargerRevision" }
    get:
      operationId: readSharedChargerCard
      summary: Read the feasible order and any due private reminder
      tags: [Charging]
      responses:
        "200":
          description: Private, non-cacheable advice. The card is null without two current confirmations, eligible evidence, and a confirmed viewer. Only the chosen opted-in participant can see the due reminder.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [card, reminder]
                    properties:
                      card: { $ref: "#/components/schemas/SharedChargerCard" }
                      reminder: { $ref: "#/components/schemas/SharedChargerReminder" }
        "409": { description: The expected principal no longer matches the browser. }

  /smart-charging/shared-trips:
    parameters:
      - { $ref: "#/components/parameters/sharedPlanningPrincipal" }
    get:
      operationId: listSharedTripPlanning
      summary: List the exact browser subject's shared departures and invitations
      tags: [Charging]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        "200":
          description: Private, non-cacheable owner refs and exact-subject invitations. Subjects and confirmation evidence are never returned.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [can_manage, owned, invitations]
                    properties:
                      can_manage: { type: boolean }
                      owned: { type: array, items: { $ref: "#/components/schemas/SharedTripRef" } }
                      invitations:
                        type: array
                        items:
                          type: object
                          required: [trip_id, revision, vehicle_id, entry_version, departure_at, consent_expires_at]
                          properties:
                            trip_id: { type: integer, format: int64, minimum: 1 }
                            revision: { type: integer, format: int64, minimum: 1 }
                            vehicle_id: { type: integer, format: int64, minimum: 1 }
                            entry_version: { type: integer, format: int64, minimum: 1 }
                            departure_at: { type: string, format: date-time }
                            consent_expires_at: { type: string, format: date-time, nullable: true }
    post:
      operationId: createSharedTrip
      summary: Authorize exact vehicle invitations for an explicitly shared departure
      tags: [Charging]
      requestBody:
        $ref: "#/components/requestBodies/SharedTripDraft"
      responses:
        "201": { $ref: "#/components/responses/SharedTripSaved" }
        "403": { description: A trusted operator browser is required. }

  /smart-charging/shared-trips/{tripID}:
    parameters:
      - { $ref: "#/components/parameters/sharedPlanningPrincipal" }
      - { $ref: "#/components/parameters/sharedTripID" }
    put:
      operationId: replaceSharedTrip
      summary: Replace the exact owned revision and require all participants to reconfirm
      tags: [Charging]
      requestBody:
        $ref: "#/components/requestBodies/SharedTripDraft"
      responses:
        "200": { $ref: "#/components/responses/SharedTripSaved" }
        "403": { description: A trusted operator browser is required. }
        "404": { description: The exact owned revision is unavailable. }
    delete:
      operationId: cancelSharedTrip
      summary: Cancel the exact owned departure revision
      tags: [Charging]
      parameters:
        - { name: revision, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "204": { description: The departure and invitations are withdrawn. }
        "404": { description: The exact owned revision is unavailable. }

  /smart-charging/shared-trips/{tripID}/vehicles/{vehicleID}:
    parameters:
      - { $ref: "#/components/parameters/sharedPlanningPrincipal" }
      - { $ref: "#/components/parameters/sharedTripID" }
      - { name: vehicleID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      operationId: confirmSharedTripVehicle
      summary: Confirm or update the signed-in participant's exact nomination
      tags: [Charging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, entry_version, trip_use_low_pct, trip_use_high_pct, reserve_pct, schedule_clear, maintenance_clear]
              properties:
                revision: { type: integer, format: int64, minimum: 1 }
                entry_version: { type: integer, format: int64, minimum: 1 }
                trip_use_low_pct: { type: number, minimum: 0, maximum: 100 }
                trip_use_high_pct: { type: number, minimum: 0, maximum: 100 }
                reserve_pct: { type: number, minimum: 0, maximum: 100 }
                schedule_clear: { type: boolean }
                maintenance_clear: { type: boolean }
      responses:
        "204": { description: Scoped consent and estimates saved for this nomination. }
        "404": { description: The exact nomination is unavailable. }
    delete:
      operationId: withdrawSharedTripVehicle
      summary: Revoke consent for one exact vehicle nomination
      tags: [Charging]
      parameters:
        - { name: revision, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: entry_version, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "204": { description: This nomination and its consent are withdrawn. }
        "404": { description: The exact nomination is unavailable. }

  /smart-charging/shared-trips/{tripID}/comparison:
    parameters:
      - { $ref: "#/components/parameters/sharedPlanningPrincipal" }
      - { $ref: "#/components/parameters/sharedTripID" }
    get:
      operationId: readSharedTripComparison
      summary: Read the requested departure's current share-safe comparison
      tags: [Charging]
      responses:
        "200":
          description: Private and non-cacheable. Comparison is null when fewer than two current eligible vehicles can be compared.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [comparison]
                    properties:
                      comparison:
                        type: object
                        nullable: true
                        required: [id, revision, departure_at, expires_at, options]
                        properties:
                          id: { type: integer, format: int64, minimum: 1 }
                          revision: { type: integer, format: int64, minimum: 1 }
                          departure_at: { type: string, format: date-time }
                          expires_at: { type: string, format: date-time }
                          options:
                            type: array
                            minItems: 2
                            items:
                              type: object
                              required: [vehicle_id, return_low_pct, return_high_pct, reserve_pct, observed_at, expires_at]
                              properties:
                                vehicle_id: { type: integer, format: int64, minimum: 1 }
                                return_low_pct: { type: number, minimum: 0, maximum: 100 }
                                return_high_pct: { type: number, minimum: 0, maximum: 100 }
                                reserve_pct: { type: number, minimum: 0, maximum: 100 }
                                observed_at: { type: string, format: date-time }
                                expires_at: { type: string, format: date-time }
        "404": { description: No current consent for this browser subject and departure. }

  /smart-charging/plans:
    post:
      operationId: createSmartChargingPlan
      summary: Create a charging readiness plan for a selected vehicle and place
      tags: [Charging]
      description: Creates a local plan only. Interruption monitoring is off by default and requires a verified sign-in; personal charging push enrollment is separate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmartChargingPlanInput" }
      responses:
        "201": { description: The charging readiness plan was saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /smart-charging/plans/{planID}:
    put:
      operationId: replaceSmartChargingPlan
      summary: Edit or pause a charging readiness plan using the current plan revision
      tags: [Charging]
      description: Requires the check instant and consent version from the plan being edited. A concurrent earlier check invalidates a stale edit even when the consent version is unchanged. Does not reschedule vehicle charging.
      parameters:
        - { name: planID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SmartChargingPlanInput"
                - type: object
                  required: [expected_version, expected_check_at]
                  properties:
                    expected_version: { type: integer, format: int64, minimum: 1 }
                    expected_check_at: { type: string, format: date-time }
      responses:
        "200": { description: The updated plan. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The plan changed after it was opened. Refresh before editing. }
    patch:
      operationId: advanceSmartChargingCheck
      summary: Elect the earlier check from a fresh estimate for the selected charging plan
      tags: [Charging]
      description: Changes only the TeslaSync check time. Revalidates the preview, owner, vehicle, plan version and measured charging evidence. Does not change a vehicle schedule or enroll a push device.
      parameters:
        - { name: planID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_id, expected_version, expected_check_at, check_at, preview_expires_at]
              properties:
                vehicle_id: { type: integer, format: int64, minimum: 1 }
                expected_version: { type: integer, format: int64, minimum: 1 }
                expected_check_at: { type: string, format: date-time }
                check_at: { type: string, format: date-time }
                preview_expires_at: { type: string, format: date-time }
      responses:
        "204": { description: The earlier local check was scheduled. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The plan, evidence or proposed time has changed. Reopen a fresh preview. }

  /smart-charging/plans/{planID}/stops:
    parameters:
      - { name: planID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - { name: vehicle_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      operationId: getSmartTripStops
      summary: Read the private reviewed stops and any current comparison without calling the routing provider
      tags: [Charging]
      responses:
        "200": { description: The scoped consent and result or an indication that the places need to be reviewed again. }
        "403": { description: A verified sign-in is required. }
    put:
      operationId: setSmartTripStops
      summary: Authorize comparison of the complete reviewed set of charging stops
      tags: [Charging]
      description: Saving consent does not call the routing provider. Every recorded wait must include a non-null wait_s. Use zero only for an observed absence of a wait.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_version, origin_updated_at, destination_place_id, destination_updated_at, capacity_wh, start_pct, limit_pct, high_usage_wh_per_m, stops, provider_consent, compatible_stops_confirmed]
              properties:
                plan_version: { type: integer, format: int64, minimum: 1 }
                origin_updated_at: { type: string, format: date-time }
                destination_place_id: { type: integer, format: int64, minimum: 1 }
                destination_updated_at: { type: string, format: date-time }
                capacity_wh: { type: number, minimum: 1000, maximum: 500000 }
                start_pct: { type: number, minimum: 1, maximum: 100 }
                limit_pct: { type: number, minimum: 1, maximum: 100 }
                high_usage_wh_per_m: { type: number, minimum: 0.000001, maximum: 2 }
                provider_consent: { type: boolean, enum: [true] }
                compatible_stops_confirmed: { type: boolean, enum: [true] }
                stops:
                  type: array
                  minItems: 2
                  maxItems: 4
                  items:
                    type: object
                    required: [place_id, place_updated_at, time_zone]
                    properties:
                      place_id: { type: integer, format: int64, minimum: 1 }
                      place_updated_at: { type: string, format: date-time }
                      time_zone: { type: string }
                      waits:
                        type: array
                        items:
                          type: object
                          required: [arrived_at, wait_s]
                          properties:
                            arrived_at: { type: string, format: date-time }
                            wait_s: { type: integer, minimum: 0, maximum: 14400 }
      responses:
        "204": { description: The complete stop set was authorized for an explicit later comparison. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: A verified sign-in is required. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The plan, place revision or reserve changed. }
    post:
      operationId: compareSmartTripStops
      summary: Explicitly request a comparison using only authorized places and qualified history
      tags: [Charging]
      responses:
        "200": { description: The current comparison if enough evidence qualifies. Historical queue estimates are not live stall availability. }
        "403": { description: A verified sign-in is required. }
        "404": { description: The owned plan, complete consented station set, or place evidence is no longer available. }
        "409": { description: A check was requested recently. }
        "502": { description: Routing did not provide usable estimates. }
        "503": { description: The routing provider is not configured. }
    delete:
      operationId: clearSmartTripStops
      summary: Revoke comparison consent and remove local setup, waits and derived results
      tags: [Charging]
      responses:
        "204": { description: No comparison remains for this scope. Source vehicle records are unchanged. }
        "403": { description: A verified sign-in is required. }

  /smart-charging/plans/{planID}/review:
    parameters:
      - { name: planID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - { name: vehicle_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      operationId: getSmartTripReview
      summary: Read a private trip baseline and comparison with unambiguous measured arrival evidence
      tags: [Charging]
      responses:
        "200": { description: The scoped baseline, qualified review and separately saved allowance, when available. }
        "403": { description: A verified sign-in is required. }
    put:
      operationId: setSmartTripReview
      summary: Confirm a baseline for a planned journey before departure
      tags: [Charging]
      description: A planned arrival percentage is required even if it is zero. When choosing a planned charging stop, also provide its place revision and a positive planned duration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [journey_id, plan_version, origin_updated_at, destination_id, destination_updated_at, planned_arrival_pct, local_review_confirmed]
              properties:
                journey_id: { type: integer, format: int64, minimum: 1 }
                plan_version: { type: integer, format: int64, minimum: 1 }
                origin_updated_at: { type: string, format: date-time }
                destination_id: { type: integer, format: int64, minimum: 1 }
                destination_updated_at: { type: string, format: date-time }
                stop_place_id: { type: integer, format: int64, minimum: 1, nullable: true }
                stop_place_updated_at: { type: string, format: date-time, nullable: true }
                planned_arrival_pct: { type: number, minimum: 0, maximum: 100 }
                planned_stop_s: { type: integer, minimum: 0, maximum: 21600 }
                local_review_confirmed: { type: boolean, enum: [true] }
      responses:
        "204": { description: The private baseline was recorded. No vehicle changes were made. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: A verified sign-in is required. }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: saveSmartTripAdjustment
      summary: Save a private planning allowance based on the latest qualified review
      tags: [Charging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adjustment_key]
              properties:
                adjustment_key: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        "204": { description: An allowance was saved for future similar trips; no plan was changed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: A verified sign-in is required. }
        "409": { description: The completed journey or measured evidence no longer qualifies for this exact review. }
    delete:
      operationId: clearSmartTripReview
      summary: Clear the private trip review and allowance without deleting original journey evidence
      tags: [Charging]
      responses:
        "204": { description: The private baseline and allowance were removed. }
        "403": { description: A verified sign-in is required. }

  /smart-commute:
    get:
      operationId: getSmartCommute
      summary: Read the current subject's commute settings and actionable route comparisons
      tags: [Notifications]
      description: Route comparisons are private to the selected vehicle and expire when its drive starts or the traffic evidence expires. Route labels are optional HERE road names and road numbers, not addresses.
      parameters:
        - { name: vehicle_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200":
          description: The scoped settings, routines, and current comparison evidence.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [settings, routines, traffic_available, traffic_decisions]
                    properties:
                      settings:
                        type: object
                        required: [vehicle_id, enabled, local_analysis_enabled, paused, time_zone]
                        properties:
                          vehicle_id: { type: integer, format: int64 }
                          enabled: { type: boolean }
                          local_analysis_enabled: { type: boolean }
                          paused: { type: boolean }
                          time_zone: { type: string }
                      routines:
                        type: array
                        items: { type: object }
                      traffic_available: { type: boolean }
                      navigation_available: { type: boolean }
                      traffic_decisions:
                        type: array
                        items:
                          type: object
                          required: [occurrence_id, routine_id, vehicle_id, routine_name, vehicle_name, time_zone, departure_at, usual_s, alternative_s, observed_at, expires_at]
                          properties:
                            occurrence_id: { type: string, pattern: '^[0-9a-f]{32}$' }
                            routine_id: { type: integer, format: int64 }
                            vehicle_id: { type: integer, format: int64 }
                            routine_name: { type: string }
                            vehicle_name: { type: string }
                            time_zone: { type: string }
                            departure_at: { type: string, format: date-time }
                            usual_s: { type: integer, format: int64 }
                            alternative_s: { type: integer, format: int64 }
                            usual_route_label: { type: string, maxLength: 120 }
                            alternative_route_label: { type: string, maxLength: 120 }
                            observed_at: { type: string, format: date-time }
                            expires_at: { type: string, format: date-time }
                            arrival_deadline_at: { type: string, format: date-time }
                            latest_departure_at: { type: string, format: date-time }
                            route_energy: { type: object }
                            route_energy_only: { type: boolean }
                            navigation_outcome: { type: string, enum: [accepted, rejected, delivery_unknown, expired, not_sent, wake_required, wake_permission_required] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /smart-commute/routines/{routineID}/navigation:
    post:
      operationId: sendSmartCommuteNavigation
      summary: Explicitly send a destination for one current private commute occurrence
      tags: [Notifications]
      description: Requires a verified operator, an active traffic comparison for the selected vehicle, and fresh evidence that the vehicle is parked near the routine origin. Tesla receives the entered address, not the HERE route. Without separate wake permission this operation only checks eligibility and reported connectivity. Tesla does not document a no-wake guarantee for destination sharing. Once a provider write is attempted, the occurrence cannot automatically or manually replay through this endpoint.
      parameters:
        - { name: routineID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: X-TeslaSync-Expected-Principal, in: header, required: true, schema: { type: string }, description: Browser identity race guard; not an authentication credential. }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [vehicle_id, occurrence_id, address, confirmed]
              properties:
                vehicle_id: { type: integer, format: int64, minimum: 1 }
                occurrence_id: { type: string, pattern: '^[0-9a-f]{32}$' }
                address: { type: string, minLength: 1, maxLength: 400 }
                confirmed: { type: boolean, enum: [true] }
                wake_confirmed: { type: boolean, default: false }
      responses:
        "200":
          description: The local outcome. Accepted is an acknowledgement, not proof of navigation or route choice.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [outcome]
                    properties:
                      outcome: { type: string, enum: [accepted, rejected, delivery_unknown, expired, not_sent, wake_required, wake_permission_required] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: A verified operator identity is required. }
        "409": { description: The authenticated identity changed or the command connection is unavailable. }
        "429": { description: Too many requests. No automatic replay. }

  /charging-reconciliation/invoices/{id}/report:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - name: vehicle_id
        in: query
        description: Required for any opted-in statement. Must match the stored statement's vehicle.
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      operationId: getChargingInvoiceReport
      summary: Audit the subject's statement and return any scoped variance findings
      tags: [Charging]
      responses:
        "200":
          description: The statement's audit. An opted-in check reports signed gaps separately and does not compute a recoverable amount.
          content:
            application/json:
              schema:
                type: object
                required: [invoice, billed_total_minor, lines]
                properties:
                  invoice: { $ref: "#/components/schemas/ChargingInvoiceRecord" }
                  billed_total_minor: { type: integer, format: int64, description: Sum of imported line totals. }
                  lines:
                    type: array
                    items:
                      type: object
                      required: [line, match_state]
                      properties:
                        line: { $ref: "#/components/schemas/ChargingInvoiceLine" }
                        match_state: { type: string, enum: [exact, probable, ambiguous, unmatched, duplicate, uninvoiced] }
                        session_id: { type: integer, format: int64, nullable: true }
                  variance_review:
                    $ref: "#/components/schemas/ChargingInvoiceVarianceReview"
                  dispute_packet_digest:
                    type: string
                    pattern: '^([a-f0-9]{64})?$'
                    description: Fingerprint of the current review, required with the invoice revision for a private dispute. Empty when cleared.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /charging-reconciliation/invoices/{id}/review:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      operationId: updateChargingInvoiceReview
      summary: Replace the scoped private review settings and optional evidence, not the statement
      description: Requires explicit consent. Previously opted-in statements can be edited or re-enabled after clear. Omitted line evidence is removed.
      tags: [Charging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_id, expected_version, variance_options, confirmed]
              properties:
                vehicle_id: { type: integer, format: int64, minimum: 1 }
                expected_version: { type: integer, minimum: 1 }
                variance_options: { $ref: "#/components/schemas/ChargingInvoiceInput/properties/variance_options" }
                confirmed: { type: boolean, description: True to authorize a private local review. }
                lines:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [line_id, evidence]
                    properties:
                      line_id: { type: integer, format: int64, minimum: 1 }
                      evidence: { $ref: "#/components/schemas/ChargingInvoiceLine/properties/variance_evidence" }
      responses:
        "204": { description: The review was changed and the statement revision advanced. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The expected principal or review revision changed. }
    delete:
      operationId: clearChargingInvoiceReview
      summary: Stop private review and remove only its independent comparison input
      tags: [Charging]
      parameters:
        - { name: vehicle_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: expected_version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: Check settings and evidence were removed; the original invoices, billed components, disputes and charging sessions remain. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The expected principal or review revision changed. }

  /charging-reconciliation/invoices/{id}/disputes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      operationId: recordChargingInvoiceDispute
      summary: Record an explicitly confirmed local dispute for the subject's invoice
      description: This does not submit anything to a billing provider. For an opted-in statement, provide the vehicle, revision and packet digest from the current actionable report.
      tags: [Charging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claimed_minor, confirmed]
              properties:
                claimed_minor: { type: integer, format: int64, minimum: 0 }
                confirmed: { type: boolean }
                reasons: { type: array, items: { type: string }, maxItems: 12 }
                note: { type: string, maxLength: 2000 }
                vehicle_id: { type: integer, format: int64, minimum: 1 }
                expected_version: { type: integer, minimum: 1 }
                expected_digest: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        "201": { description: A local dispute record was created. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The expected principal or private review changed, or the statement was already handled. }

  /analytics/tco/charging-cost-digest:
    description: Private monthly comparison of two completed local months. Requires verified sign-in; responses are not cacheable. No push or provider call.
    parameters:
      - { name: vehicle_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      operationId: getMonthlyChargingCostDigest
      summary: Read the signed-in subject's charging cost settings and current comparison
      tags: [Analytics]
      responses:
        "200":
          description: The scoped review. An empty object means the feature is off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonthlyChargingCostReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The expected principal no longer matches. }
    put:
      operationId: saveMonthlyChargingCostDigest
      summary: Confirm, change, resume or pause the monthly cost review
      tags: [Analytics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_plan_id, time_zone, currency, material_change_minor]
              properties:
                expected_plan_id: { type: integer, format: int64, minimum: 0, description: Zero for first enrollment; otherwise the current plan ID. }
                time_zone: { type: string, maxLength: 80, example: America/New_York }
                currency: { type: string, pattern: '^[A-Z]{3}$', example: USD }
                material_change_minor: { type: integer, format: int64, minimum: 1, maximum: 1000000000 }
                paused: { type: boolean, default: false }
                local_review_confirmed: { type: boolean, description: Must be true unless pausing. }
      responses:
        "204": { description: Settings replaced. A paused or replaced plan cannot publish an in-flight comparison. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Plan revision or expected principal has changed. }
    patch:
      operationId: dismissMonthlyChargingCostDigest
      summary: Dismiss one current comparison without stopping future checks
      tags: [Analytics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id, through]
              properties:
                plan_id: { type: integer, format: int64, minimum: 1 }
                through: { type: string, format: date-time, description: Exclusive end returned with the current comparison. }
      responses:
        "204": { description: The comparison is dismissed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: The comparison or expected principal has changed. }
    delete:
      operationId: deleteMonthlyChargingCostDigest
      summary: Remove the private cost review and stop future checks
      tags: [Analytics]
      parameters:
        - { name: plan_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "204": { description: The plan and derived comparison were cleared without changing the source records. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Plan revision or expected principal has changed. }

