      required:
        - id
        - case_id
        - kind
        - session_id
        - vehicle_id
        - schema_version
        - checksum
        - reason
        - quarantined_by
        - quarantined_at
      properties:
        id:
          type: integer
          format: int64
        case_id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/DataRepairSessionKind"
        session_id:
          type: integer
          format: int64
        vehicle_id:
          type: integer
          format: int64
        schema_version:
          type: integer
          minimum: 1
        checksum:
          type: string
          pattern: "^[0-9a-f]{64}$"
        reason:
          type: string
        quarantined_by:
          type: string
        quarantined_at:
          type: string
          format: date-time
        restored_by:
          type: string
          nullable: true
        restored_at:
          type: string
          format: date-time
          nullable: true

    DataRepairCaseList:
      type: object
      required: [cases, has_more]
      properties:
        cases:
          type: array
          items:
            $ref: "#/components/schemas/DataRepairCase"
        has_more:
          type: boolean
        next_cursor:
          type: object
          nullable: true
          required: [last_seen_at, id]
          properties:
            last_seen_at:
              type: string
              format: date-time
            id:
              type: integer
              format: int64

    DataRepairCaseCorrectionInput:
      type: object
      additionalProperties: false
      required: [expected_updated_at, field, mode]
      properties:
        expected_updated_at:
          type: string
          format: date-time
          description: Case revision observed before review.
        field:
          type: string
          enum: [duration_s, distance_m, energy_used_wh, regen_energy_wh, total_energy_added_wh, start_odometer_m, end_odometer_m, start_soc_pct, end_soc_pct, ended_at]
        mode:
          type: string
          enum: [derive, replace, clear, boundary]
          description: >
            Derive duration from stored boundaries, replace a measurement with
            a verified SI value, clear it to unknown, or supply an explicit end time.
            Clearing is limited to regenerated energy and odometer readings;
            other fields require verified replacements because existing views
            can display missing values as actual measurements.
        value:
          type: number
          format: double
          nullable: true
          description: SI replacement value; null for derive, clear, and boundary.
        target:
          type: string
          enum: [primary, related]
          description: Session whose end is corrected; required for boundary mode.
        ended_at:
          type: string
          format: date-time
          description: Explicit corrected end time; required for boundary mode.
        expected_source_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Preview hash; required when applying.

    DataRepairCaseCorrectionPreview:
      type: object
      required: [case_id, case_updated_at, kind, session_id, started_at, ended_at, source_hash, changes]
      properties:
        case_id:
          type: integer
          format: int64
        case_updated_at:
          type: string
          format: date-time
        kind:
          $ref: "#/components/schemas/DataRepairSessionKind"
        session_id:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        source_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        changes:
          type: array
          items:
            type: object
            required: [field, before, after]
            properties:
              field:
                type: string
              before:
                type: number
                format: double
                nullable: true
              after:
                type: number
                format: double
                nullable: true
              before_text:
                type: string
                description: Exact previous timestamp, cost, or cost provenance.
              after_text:
                type: string
                description: Exact proposed timestamp or cost provenance.
              unit:
                type: string
                description: Currency of an estimated cost.
        other:
          type: object
          description: Other session in a reviewed overlap.
          required: [kind, id, started_at, ended_at]
          properties:
            kind:
              $ref: "#/components/schemas/DataRepairSessionKind"
            id:
              type: integer
              format: int64
            started_at:
              type: string
              format: date-time
            ended_at:
              type: string
              format: date-time
              nullable: true

    DataRepairCaseDetail:
      type: object
      required: [case, comments]
      properties:
        case:
          $ref: "#/components/schemas/DataRepairCase"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/DataRepairCaseComment"
        quarantine:
