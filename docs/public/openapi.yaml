          type: integer
        front_left:
          type: number
          nullable: true
        front_right:
          type: number
          nullable: true
        rear_left:
          type: number
          nullable: true
        rear_right:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time

    SoftwareUpdate:
      type: object
