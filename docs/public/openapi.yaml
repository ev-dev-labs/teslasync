          type: string
          enum: [manual, suggestion]
        status:
          type: string
          enum: [ready, already_applied]
        started_at:
          type: string
          format: date-time
        current_ended_at:
          type: string
          format: date-time
          nullable: true
        proposed_ended_at:
          type: string
          format: date-time
        current_duration_s:
          type: integer
          format: int64
          nullable: true
        proposed_duration_s:
          type: integer
          format: int64
        fields_changed:
          type: array
          items:
            type: object
            required: [field, before, after]
            properties:
              field:
                type: string
