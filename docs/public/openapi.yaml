      properties:
        id:
          type: integer
        vehicle_id:
          type: integer
        name:
          type: string
          nullable: true
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
          nullable: true
        total_distance_km:
          type: number
        total_energy_kwh:
          type: number
        total_cost:
          type: number
