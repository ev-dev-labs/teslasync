    DataRepairCloseResponse:
      type: object
      required: [status, session_id, ended_at]
      properties:
        status:
          type: string
          enum: [closed, already_applied]
        session_id:
          type: integer
          format: int64
        ended_at:
          type: string
          format: date-time
        duration_s:
          type: integer
          format: int64
        recomputed_fields:
          type: array
          items:
            type: string

    DataRepairPreviewValue:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [null, timestamp, int64, float64, string]
        "null":
          type: boolean
        timestamp:
          type: string
          format: date-time
        int64:
          type: integer
          format: int64
        float64:
          type: number
          format: double
        string:
          type: string

    DataRepairPreview:
      type: object
      required:
        - kind
        - session_id
        - rule
        - source
        - status
        - started_at
        - proposed_ended_at
        - proposed_duration_s
        - fields_changed
        - fields_preserved
        - warnings
      properties:
        kind:
          $ref: "#/components/schemas/DataRepairSessionKind"
        session_id:
          type: integer
          format: int64
        rule:
          type: string
