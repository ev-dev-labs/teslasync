                    type: array
                    items:
                      $ref: "#/components/schemas/ChargingSession"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/suggestions:
    get:
      operationId: diagnoseDataRepairSuggestions
      summary: Diagnose session-boundary anomalies
      description: Returns bounded, evidence-backed repair proposals without changing source data.
      tags: [Data Repair]
      parameters:
        - name: vehicle_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: lookback_days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
        - name: limit
          in: query
          description: Maximum candidates inspected per session kind.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Evidence-backed repair diagnosis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairSuggestionReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: Diagnosis source is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/cases:
    get:
      operationId: listDataRepairCases
      summary: List durable repair cases
      description: Returns a bounded keyset-paginated repair worklist.
      tags: [Data Repair]
      parameters:
        - name: vehicle_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DataRepairCaseStatus"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/DataRepairSessionKind"
        - name: confidence
          in: query
          schema:
            $ref: "#/components/schemas/DataRepairConfidence"
        - name: assigned_to
          in: query
          schema:
            type: string
            maxLength: 255
        - name: cursor_last_seen_at
          in: query
          schema:
            type: string
            format: date-time
        - name: cursor_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Repair case page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairCaseList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: Case management is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

