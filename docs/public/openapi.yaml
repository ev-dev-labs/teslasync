openapi: 3.0.3
info:
  title: TeslaSync API
  version: 1.0.0
  description: Self-hosted Tesla Fleet Intelligence API
  license:
    name: MIT
  contact:
    name: TeslaSync
    url: https://github.com/ev-dev-labs/teslasync

servers:
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: Auth
    description: Authentication and OAuth management
  - name: Vehicles
    description: Vehicle management and telemetry
  - name: Drives
    description: Drive session tracking
  - name: Charging
    description: Charging session tracking
  - name: Geofences
    description: Geofence management
  - name: Settings
    description: Application settings
  - name: Alerts
    description: Alert management and rules
  - name: Analytics
    description: Fleet analytics
  - name: Notifications
    description: Notification channels and scheduling
  - name: Tire Pressure
    description: Tire pressure monitoring
  - name: Motor
    description: Motor and powertrain data
  - name: Climate
    description: Climate and HVAC data
  - name: Security
    description: Security and access events
  - name: Charging Telemetry
    description: Charging telemetry readings
  - name: Media
    description: Media state readings
  - name: Vehicle Config
    description: Vehicle configuration snapshots
  - name: Location
    description: Location snapshots
  - name: Safety
    description: Safety event readings
  - name: User Preferences
    description: User preference snapshots
  - name: Software Updates
    description: Software update events
  - name: Vampire Drain
    description: Vampire drain tracking
  - name: Visited Locations
    description: Visited location tracking
  - name: Mileage
    description: Mileage tracking and statistics
  - name: Trips
    description: Trip tracking
  - name: States
    description: Vehicle state timeline
  - name: System
    description: System health and management
  - name: API Keys
    description: API key management
  - name: Telemetry
    description: Fleet Telemetry ingestion
  - name: Dev Tools
    description: Development and debugging tools
  - name: Data Repair
    description: Data repair and session management
  - name: Backup
    description: Backup and restore
  - name: Export
    description: Data export and import
  - name: Gas Price
    description: Gas price tracking
  - name: Chatbot
    description: AI chatbot interface

paths:
  # ─── Auth ───────────────────────────────────────────────────────────
  /auth/login:
    get:
      operationId: authLogin
      summary: Initiate Tesla OAuth login
      description: Redirects to Tesla OAuth authorization page.
      tags: [Auth]
      responses:
        "302":
          description: Redirect to Tesla OAuth
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/callback:
    get:
      operationId: authCallback
      summary: Tesla OAuth callback
      description: Handles the OAuth callback from Tesla and exchanges the code for tokens.
      tags: [Auth]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: OAuth authorization code
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: authenticated successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Refresh Tesla OAuth token
      description: Refreshes the current Tesla OAuth access token.
      tags: [Auth]
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: token refreshed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/status:
    get:
      operationId: authStatus
      summary: Check authentication status
      description: Returns the current authentication status including token validity.
      tags: [Auth]
      responses:
        "200":
          description: Auth status
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                  expires_at:
                    type: string
                    format: date-time
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/disconnect:
    post:
      operationId: authDisconnect
      summary: Disconnect Tesla account
      description: Disconnects the linked Tesla account and revokes tokens.
      tags: [Auth]
      responses:
        "200":
          description: Account disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: disconnected
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Onboarding ─────────────────────────────────────────────────────
  /onboarding/status:
    get:
      operationId: onboardingStatus
      summary: First-run onboarding gate status
      description: >
        Reports the durable setup contract plus live, informational
        runtime anchors. `setup_complete` (and its backward-compatible
        alias `is_complete`) is persisted once tesla_connected,
        vehicle_count>0, and data_flowing were all observed true at
        least once; after that it is NEVER recomputed back to false by
        a later Fleet Telemetry outage or an expired Tesla token —
        `setup_required` is simply `!setup_complete`. `data_flowing`,
        `last_telemetry_at`, and `telemetry_health` remain live/
        informational fields for the onboarding UI and do not gate
        setup completeness.
      tags: [System]
      responses:
        "200":
          description: Onboarding status
          content:
            application/json:
              schema:
                type: object
                properties:
                  tesla_connected:
                    type: boolean
                  vehicle_count:
                    type: integer
                  data_flowing:
                    type: boolean
                  last_telemetry_at:
                    type: string
                    format: date-time
                    nullable: true
                  telemetry_health:
                    type: string
                    enum: [healthy, stale, unknown]
                  setup_required:
                    type: boolean
                  setup_complete:
                    type: boolean
                  is_complete:
                    type: boolean
                    description: Backward-compatible alias of setup_complete.
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Vehicles ───────────────────────────────────────────────────────
  /vehicles:
    get:
      operationId: listVehicles
      summary: List all tracked vehicles
      description: Returns all vehicles being tracked by TeslaSync.
      tags: [Vehicles]
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /vehicles/sync:
    post:
      operationId: syncVehicles
      summary: Sync vehicles from Tesla API
      description: Fetches the latest vehicle list from Tesla and syncs with local database. Rate limited.
      tags: [Vehicles]
      responses:
        "200":
          description: Vehicles synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: vehicles synced
                  count:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/TeslaAPIError"
        "500":
          $ref: "#/components/responses/InternalError"

  /vehicles/states:
    get:
      operationId: getFleetVehicleStates
      summary: Batch current state for the fleet
      description: >-
        Returns the current state of every requested vehicle in ONE request,
        replacing the per-vehicle fan-out. Every item carries its own outcome
        and provenance, so a single unreadable vehicle degrades that item only —
        it never fails the batch and is never reported as "offline". All items in
        one response are classified against a single request-level `now`.


        Storage reads are BULK: one pipelined Redis read (L2), one set-based
        signal_log query (durable last-known values) and one set-based
        fsm_transitions query cover the whole page, instead of three round
        trips per vehicle. The layering and every per-vehicle verdict are
        unchanged.


        Concurrent IDENTICAL requests are coalesced into one execution and a
        successful result is micro-cached for ~1s (never more than 2s).
        Failures are never cached, and the cache key carries every dimension
        that changes the result (scope, the exact id set, limit, offset), so
        results can never cross scopes.
      tags: [Vehicles]
      parameters:
        - name: vehicle_ids
          in: query
          required: false
          description: Comma-separated positive vehicle ids. Omitted means the whole fleet. Ids outside the caller's fleet are silently dropped.
          schema:
            type: string
            example: "1,2,3"
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Batch of per-vehicle current states
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [now, total, limit, offset, counts, summary, vehicles]
                    properties:
                      now:
                        type: string
                        format: date-time
                        description: The single instant every item was classified against.
                      total:
                        type: integer
                        description: Matching vehicles before pagination.
                      limit:
                        type: integer
                      offset:
                        type: integer
                      counts:
                        type: object
                        properties:
                          resolved: { type: integer }
                          missing: { type: integer }
                          failed: { type: integer }
                      summary:
                        type: object
                        description: >-
                          Server-derived Fleet Posture roll-up of THIS page,
                          computed from the same items, the same request-level
                          `now` and the same trust precedence (verified
                          charging → verified motion → verified FSM state), so
                          a client can paint the posture panel on first frame
                          without re-deriving anything. Every item lands in
                          exactly one bucket:
                          sum(operational) + sum(attention) == counted ==
                          length(vehicles). Operational totals count only
                          TRUSTED claims; `offline` is reachable only from a
                          verified, currently-fresh FSM state and is NEVER
                          inferred from missing, stale, unverified or failed
                          data.
                        required:
                          [counted, verified_count, attention_count, operational,
                           attention, oldest_observed_at, newest_observed_at, observed_count]
                        properties:
                          counted:
                            type: integer
                            description: Items in this page the summary describes (length of vehicles, not total).
                          verified_count:
                            type: integer
                            description: Items carrying a trusted operational status ("N of M verified").
                          attention_count:
                            type: integer
                            description: counted - verified_count.
                          operational:
                            type: object
                            description: >-
                              Trusted operational status totals. The vocabulary
                              is the backend FSM's (internal/enums); `updating`
                              is a Tesla-API/front-end-only label with no FSM
                              transition behind it and is therefore absent
                              rather than reported as a permanent zero. Any
                              trusted state outside the vocabulary is counted
                              in `other`.
                            required: [charging, driving, parked, asleep, online, offline, other]
                            properties:
                              charging: { type: integer }
                              driving: { type: integer }
                              parked: { type: integer }
                              asleep: { type: integer }
                              online: { type: integer }
                              offline: { type: integer }
                              other: { type: integer }
                          attention:
                            type: object
                            description: >-
                              Items with NO trusted operational status, split by
                              the reason. These are statements about our
                              EVIDENCE, never about the vehicle.
                            required: [unverified, stale, unknown, missing, failed]
                            properties:
                              unverified:
                                type: integer
                                description: Stream is fresh but the deciding field is not backed by a real observation.
                              stale:
                                type: integer
                                description: A real observation exists but is outside the freshness window.
                              unknown:
                                type: integer
                                description: No real observation at all (durable fallback / legacy values only).
                              missing:
                                type: integer
                                description: The read succeeded and there is authoritatively no state.
                              failed:
                                type: integer
                                description: Resolution failed for this vehicle. A fact about us.
                          oldest_observed_at:
                            type: string
                            format: date-time
                            nullable: true
                            description: Oldest REAL observation among items that have one; null when none does. Never a fetch time.
                          newest_observed_at:
                            type: string
                            format: date-time
                            nullable: true
                            description: Newest REAL observation among items that have one; null when none does.
                          observed_count:
                            type: integer
                            description: Items carrying a real observation instant.
                      vehicles:
                        type: array
                        items:
                          type: object
                          required: [vehicle_id, outcome, state, live, data_source, freshness, verified_fields]
                          properties:
                            vehicle_id:
                              type: integer
                              format: int64
                            outcome:
                              type: string
                              enum: [resolved, missing, failed]
                              description: >-
                                resolved = a state was assembled; missing = the read
                                succeeded and there is authoritatively no state;
                                failed = resolution failed for this vehicle. A null
                                state is never an offline classification.
                            state:
                              type: object
                              nullable: true
                              description: Assembled vehicle state; null for missing/failed items.
                            live:
                              type: boolean
                            data_source:
                              type: string
                              enum: [live_signal_store, db_fallback, unavailable]
                              description: >-
                                Provenance of a resolved state. Missing and
                                failed items use unavailable because no state
                                source can be asserted.
                            observed_at:
                              type: string
                              format: date-time
                              nullable: true
                              description: Instant of the newest real live observation. Absent when unknown.
                            freshness:
                              type: string
                              enum: [fresh, stale, unknown]
                            verified_fields:
                              type: array
                              items:
                                type: string
                              description: State fields backed by real live signals.
                            error:
                              type: string
                              enum: [state_unavailable]
                              description: Stable machine code; present only for failed items.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Fleet state subsystem not configured on this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vehicles/{vehicleID}:
    get:
      operationId: getVehicle
      summary: Get single vehicle
      description: Returns details for a specific vehicle.
      tags: [Vehicles]
      parameters:
        - $ref: "#/components/parameters/vehicleID"
      responses:
        "200":
          description: Vehicle details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteVehicle
      summary: Delete vehicle and associated data
      description: Deletes a vehicle and all its associated data (drives, charging, positions, etc.).
      tags: [Vehicles]
      parameters:
        - $ref: "#/components/parameters/vehicleID"
      responses:
        "200":
          description: Vehicle deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: vehicle deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /vehicles/{vehicleID}/positions:
    get:
      operationId: getVehiclePositions
      summary: Get vehicle position history
      description: Returns historical position data for a vehicle.
      tags: [Vehicles]
      parameters:
        - $ref: "#/components/parameters/vehicleID"
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: List of positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /vehicles/{vehicleID}/state:
    get:
      operationId: getVehicleState
      summary: Get current live vehicle state
      description: Returns the current live state of the vehicle from the Tesla API.
      tags: [Vehicles]
      parameters:
        - $ref: "#/components/parameters/vehicleID"
      responses:
        "200":
          description: Current vehicle state
          content:
            application/json:
              schema:
                type: object
                description: Full vehicle state object from Tesla API
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Vehicle offline or asleep
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /vehicles/{vehicleID}/wake:
    post:
      operationId: wakeVehicle
      summary: Wake up vehicle
      description: Sends a wake-up command to the vehicle. Rate limited.
      tags: [Vehicles]
      parameters:
        - $ref: "#/components/parameters/vehicleID"
      responses:
        "200":
          description: Wake command sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: wake command sent
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/TeslaAPIError"
        "500":
          $ref: "#/components/responses/InternalError"

  /vehicles/{vehicleID}/command:
    post:
      operationId: sendVehicleCommand
      summary: Send command to vehicle
      description: Sends a command to the vehicle via the Tesla API. Rate limited.
      tags: [Vehicles]
      parameters:
        - $ref: "#/components/parameters/vehicleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  description: Command name to send
                  example: honk_horn
      responses:
        "200":
          description: Command executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  result:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/TeslaAPIError"
        "500":
          $ref: "#/components/responses/InternalError"

  /vehicles/{vehicleID}/energy:
    get:
      operationId: getVehicleEnergy
      summary: Get energy stats
      description: Returns energy consumption and regeneration statistics for the vehicle.
      tags: [Vehicles]
      parameters:
        - $ref: "#/components/parameters/vehicleID"
      responses:
        "200":
          description: Energy statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_energy_used_wh:
                    type: number
                  total_energy_regen_wh:
                    type: number
                  efficiency_wh_per_m:
                    type: number
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /vehicles/{vehicleID}/battery:
    get:
      operationId: getVehicleBattery
      summary: Get battery report
      description: Returns battery health and degradation report for the vehicle.
      tags: [Vehicles]
      parameters:
        - $ref: "#/components/parameters/vehicleID"
      responses:
        "200":
          description: Battery report
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_capacity_wh:
                    type: number
                  original_capacity_wh:
                    type: number
                  degradation_percent:
                    type: number
                  health_score:
                    type: number
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  # ─── Drives ─────────────────────────────────────────────────────────
  /drives:
    get:
      operationId: listDrives
      summary: List drives
      description: Returns a paginated list of drive sessions.
      tags: [Drives]
      parameters:
        - name: vehicle_id
          in: query
          schema:
            type: integer
          description: Filter by vehicle ID
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: List of drives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Drive"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /drives/{driveID}:
    get:
      operationId: getDrive
      summary: Get single drive
      description: Returns details for a specific drive session.
      tags: [Drives]
      parameters:
        - $ref: "#/components/parameters/driveID"
      responses:
        "200":
          description: Drive details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drive"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /drives/{driveID}/positions:
    get:
      operationId: getDrivePositions
      summary: Get drive positions
      description: Returns the GPS positions recorded during a drive.
      tags: [Drives]
      parameters:
        - $ref: "#/components/parameters/driveID"
      responses:
        "200":
          description: List of positions for the drive
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /drives/{driveID}/telemetry:
    get:
      operationId: getDriveTelemetry
      summary: Get drive telemetry readings
      description: Returns detailed telemetry data recorded during a drive.
      tags: [Drives]
      parameters:
        - $ref: "#/components/parameters/driveID"
      responses:
        "200":
          description: Drive telemetry data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                      format: date-time
                    speed:
                      type: number
                    power:
                      type: number
                    battery_level:
                      type: integer
                    outside_temp:
                      type: number
                    elevation:
                      type: number
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Charging ───────────────────────────────────────────────────────
  /charging:
    get:
      operationId: listChargingSessions
      summary: List charging sessions
      description: Returns a paginated list of charging sessions.
      tags: [Charging]
      parameters:
        - name: vehicle_id
          in: query
          schema:
            type: integer
          description: Filter by vehicle ID
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
      responses:
        "200":
          description: List of charging sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChargingSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /charging/{sessionID}:
    get:
      operationId: getChargingSession
      summary: Get single charging session
      description: Returns details for a specific charging session.
      tags: [Charging]
      parameters:
        - $ref: "#/components/parameters/sessionID"
      responses:
        "200":
          description: Charging session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargingSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /charging/{sessionID}/telemetry:
    get:
      operationId: getChargingTelemetry
      summary: Get charging telemetry readings
      description: Returns telemetry data recorded during a charging session.
      tags: [Charging]
      parameters:
        - $ref: "#/components/parameters/sessionID"
      responses:
        "200":
          description: Charging telemetry data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                      format: date-time
                    battery_level:
                      type: integer
                    charge_rate:
                      type: number
                    charger_power:
                      type: number
                    voltage:
                      type: number
                    current:
                      type: number
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Geofences ──────────────────────────────────────────────────────
  /geofences:
    get:
