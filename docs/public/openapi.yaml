      summary: Get public shared drive report
      description: Returns a v2 share payload with SI canonical keys. Old v1 payloads may be read by the SPA only for existing shared URLs.
      tags: [Sharing]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared drive report
          content:
            application/json:
              schema:
                type: object
                properties:
                  payload_version:
                    type: string
                    example: v2
                  drive:
                    type: object
                    properties:
                      distance_m:
                        type: number
                      duration_s:
                        type: integer
                      max_speed_mps:
                        type: number
                        nullable: true
        "404":
          $ref: "#/components/responses/NotFound"

  /export/jobs:
    post:
      operationId: submitExportJob
      summary: Submit async export job
      description: "Submits an asynchronous export job for large datasets. CSV exports are v2-only and use SI canonical filenames and columns: teslasync-drives-v2.csv, teslasync-charging-v2.csv, teslasync-trips-v2.csv. Drive headers include distance_m, duration_s, max_speed_mps; trip headers include total_distance_m, total_energy_wh, total_duration_s."
      tags: [Export]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [drives, charging, trips, analytics, backup, account]
                vehicle_id:
                  type: integer
                format:
                  type: string
                  enum: [csv, json]
                  default: csv
      responses:
        "202":
          description: Export job submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                    example: pending
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listExportJobs
      summary: List export jobs
      description: Returns a list of export jobs.
      tags: [Export]
      responses:
        "200":
          description: List of export jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    type:
                      type: string
                    status:
                      type: string
                      enum: [pending, running, completed, failed]
                    created_at:
                      type: string
                      format: date-time
                    completed_at:
                      type: string
                      format: date-time
        "500":
          $ref: "#/components/responses/InternalError"

  /export/jobs/import:
    post:
      operationId: submitImportJob
      summary: Submit import job
      description: Submits a data import job.
      tags: [Export]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "202":
          description: Import job submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                    example: pending
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /export/jobs/{jobID}:
    get:
      operationId: getExportJob
      summary: Get export job status
      description: Returns the status of an export job.
      tags: [Export]
      parameters:
        - name: jobID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Export job status
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  status:
                    type: string
                    enum: [pending, running, completed, failed]
                  progress:
                    type: number
                  error:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /export/jobs/{jobID}/download:
    get:
      operationId: downloadExportJob
      summary: Download export job result
      description: Downloads the result of a completed export job.
      tags: [Export]
      parameters:
        - name: jobID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Export file download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
# ═══════════════════════════════════════════════════════════════════════
# Components
# ═══════════════════════════════════════════════════════════════════════
components:
  parameters:
    vehicleID:
      name: vehicleID
      in: path
      required: true
      description: Vehicle ID
      schema:
        type: integer

    driveID:
      name: driveID
      in: path
      required: true
      description: Drive session ID
      schema:
        type: integer

    sessionID:
      name: sessionID
      in: path
      required: true
      description: Charging session ID
      schema:
        type: integer

    geofenceID:
      name: geofenceID
      in: path
      required: true
      description: Geofence ID
      schema:
        type: integer

    channelID:
      name: channelID
      in: path
      required: true
      description: Notification channel ID
      schema:
        type: integer

    configID:
      name: configID
      in: path
      required: true
      description: Backup configuration ID
      schema:
        type: string

    runID:
      name: runID
      in: path
      required: true
      description: Backup run ID
      schema:
        type: string

    dataRepairID:
      name: id
      in: path
      required: true
      description: Data-repair case, session, or quarantine identifier
      schema:
        type: integer
        format: int64
        minimum: 1

    limitParam:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 1000

    offsetParam:
      name: offset
      in: query
      description: Number of results to skip
      schema:
        type: integer
        default: 0
        minimum: 0

  requestBodies:
    DataRepairReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
              reason:
                type: string
                minLength: 1
                maxLength: 1000

  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidInput:
              value:
                error: invalid input parameters
                code: VALIDATION_INVALID_INPUT
                category: validation
            invalidJson:
              value:
                error: invalid JSON body
                code: VALIDATION_INVALID_JSON
                category: validation
            missingField:
              value:
                error: required field missing
                code: VALIDATION_MISSING_FIELD
                category: validation

    Unauthorized:
      description: Authentication required or failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            tokenMissing:
              value:
                error: authentication token is required
                code: AUTH_TOKEN_MISSING
                category: auth
            tokenExpired:
              value:
                error: authentication token has expired
                code: AUTH_TOKEN_EXPIRED
                category: auth
            tokenInvalid:
              value:
                error: authentication token is invalid
                code: AUTH_TOKEN_INVALID
                category: auth
            apiKeyInvalid:
              value:
                error: API key is invalid
                code: AUTH_API_KEY_INVALID
                category: auth

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: insufficient permissions
            code: AUTH_INSUFFICIENT_PERMISSIONS
            category: auth

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: resource not found
            code: DB_RECORD_NOT_FOUND
            category: database

    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: rate limit exceeded
            code: RATE_LIMITED
            category: rate_limiting

    TeslaAPIError:
      description: Tesla API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Tesla API is unavailable
            code: TESLA_API_UNAVAILABLE
            category: tesla_api

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: an internal error occurred
            code: INTERNAL_ERROR
            category: internal

  schemas:
    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable error message
          example: resource not found
        code:
          type: string
          description: Machine-readable error code
          example: DB_RECORD_NOT_FOUND
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - CONFLICT
            - UNPROCESSABLE_ENTITY
            - AUTH_INVALID_CREDENTIALS
            - AUTH_TOKEN_EXPIRED
            - AUTH_TOKEN_INVALID
            - AUTH_TOKEN_MISSING
            - AUTH_API_KEY_INVALID
            - AUTH_API_KEY_EXPIRED
            - AUTH_API_KEY_REVOKED
            - AUTH_INSUFFICIENT_PERMISSIONS
            - VEHICLE_NOT_FOUND
            - VEHICLE_OFFLINE
            - VEHICLE_ASLEEP
            - VEHICLE_BUSY
            - DRIVE_NOT_FOUND
            - CHARGE_NOT_FOUND
            - TRIP_NOT_FOUND
            - SESSION_STILL_ACTIVE
            - SESSION_NOT_FOUND
            - TESLA_API_UNAVAILABLE
            - TESLA_API_SUSPENDED
            - TESLA_API_RATE_LIMITED
            - TESLA_API_TIMEOUT
            - TESLA_API_AUTH_FAILED
            - TESLA_NOT_CONNECTED
            - DB_CONNECTION_FAILED
            - DB_QUERY_FAILED
            - DB_TRANSACTION_FAILED
            - DB_RECORD_NOT_FOUND
            - DB_DUPLICATE_RECORD
            - VALIDATION_INVALID_INPUT
            - VALIDATION_INVALID_JSON
            - VALIDATION_MISSING_FIELD
            - VALIDATION_INVALID_RANGE
            - VALIDATION_INVALID_ID
            - VALIDATION_PAYLOAD_TOO_LARGE
            - GEOFENCE_NOT_FOUND
            - GEOFENCE_INVALID_COORDINATES
            - GEOFENCE_INVALID_RADIUS
            - COMMAND_NOT_SUPPORTED
            - COMMAND_FAILED
            - COMMAND_TIMEOUT
            - BACKUP_CONFIG_NOT_FOUND
            - BACKUP_RUN_NOT_FOUND
            - BACKUP_FAILED
            - BACKUP_STORAGE_ERROR
            - RESTORE_FAILED
            - NOTIFICATION_CHANNEL_NOT_FOUND
            - NOTIFICATION_TEST_FAILED
            - TELEMETRY_INGEST_FAILED
            - MQTT_UNAVAILABLE
            - EXPORT_FAILED
            - EXPORT_NOT_FOUND
            - EXPORT_INVALID_FORMAT
            - RATE_LIMITED
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
            - GATEWAY_TIMEOUT
            - NOT_IMPLEMENTED
            - ERROR
        category:
          type: string
          description: Error category
          example: database
          enum:
            - auth
            - vehicle
            - drives
            - charging
            - trips
            - tesla_api
            - database
            - validation
            - geofence
            - commands
            - backup
            - notifications
            - telemetry
            - export
            - rate_limiting
            - internal

    DataRepairSessionKind:
      type: string
      enum: [drive, charging]

    DataRepairConfidence:
      type: string
      enum: [high, medium]

    DataRepairCaseStatus:
      type: string
      enum: [open, in_review, applied, dismissed, quarantined, restored, resolved]

    DataRepairEvidence:
      type: object
      required: [ts, source, field, value]
      properties:
        ts:
          type: string
          format: date-time
        source:
          type: string
          enum: [signal_log, drive_telemetry, charging_telemetry, drives, charging_sessions]
        field:
          type: string
        value:
          type: string

    DataRepairSuggestion:
      type: object
      required:
        - kind
        - session_id
        - vehicle_id
        - rule
        - confidence
        - started_at
        - contradicting_evidence
        - suggested_ended_at
        - suggested_duration_s
        - evidence_gap_s
        - applicable
      properties:
        kind:
          $ref: "#/components/schemas/DataRepairSessionKind"
        session_id:
          type: integer
          format: int64
        vehicle_id:
          type: integer
          format: int64
        rule:
          type: string
        confidence:
          $ref: "#/components/schemas/DataRepairConfidence"
        started_at:
          type: string
          format: date-time
        stored_ended_at:
          type: string
          format: date-time
          nullable: true
        stored_duration_s:
          type: integer
          format: int64
          nullable: true
        last_in_session_evidence:
          allOf:
            - $ref: "#/components/schemas/DataRepairEvidence"
          nullable: true
        contradicting_evidence:
          $ref: "#/components/schemas/DataRepairEvidence"
        suggested_ended_at:
          type: string
          format: date-time
        suggested_duration_s:
          type: integer
          format: int64
          minimum: 0
        evidence_gap_s:
          type: integer
          format: int64
          minimum: 0
        applicable:
          type: boolean
        blocked_reason:
          type: string

    DataRepairSuggestionReport:
      type: object
      required:
        - generated_at
        - lookback_days
        - scanned_drives
        - scanned_charging_sessions
        - drive_suggestions
        - charging_suggestions
        - truncated
      properties:
        generated_at:
          type: string
          format: date-time
        lookback_days:
          type: integer
        scanned_drives:
          type: integer
        scanned_charging_sessions:
          type: integer
        drive_suggestions:
          type: array
          items:
            $ref: "#/components/schemas/DataRepairSuggestion"
        charging_suggestions:
          type: array
          items:
            $ref: "#/components/schemas/DataRepairSuggestion"
        truncated:
          type: boolean

    DataRepairCase:
      type: object
      required:
        - id
        - fingerprint
        - kind
        - session_id
        - vehicle_id
        - rule
        - confidence
        - status
        - evidence_started_at
        - evidence_contradiction_ts
        - evidence_contradiction_src
        - evidence_contradiction_field
        - evidence_contradiction_value
        - evidence_gap_s
        - applicable
        - first_seen_at
        - last_seen_at
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        fingerprint:
          type: string
          pattern: "^[0-9a-f]{64}$"
        kind:
          $ref: "#/components/schemas/DataRepairSessionKind"
        session_id:
          type: integer
          format: int64
        related_session_id:
          type: integer
          format: int64
          nullable: true
        vehicle_id:
          type: integer
          format: int64
        rule:
          type: string
        confidence:
          $ref: "#/components/schemas/DataRepairConfidence"
        status:
          $ref: "#/components/schemas/DataRepairCaseStatus"
        suggested_ended_at:
          type: string
          format: date-time
          nullable: true
        evidence_started_at:
          type: string
          format: date-time
        evidence_stored_ended_at:
          type: string
          format: date-time
          nullable: true
        evidence_contradiction_ts:
          type: string
          format: date-time
        evidence_contradiction_src:
          type: string
        evidence_contradiction_field:
          type: string
        evidence_contradiction_value:
          type: string
        evidence_last_in_session_ts:
          type: string
          format: date-time
          nullable: true
        evidence_last_in_session_src:
          type: string
          nullable: true
        evidence_last_in_session_field:
          type: string
          nullable: true
        evidence_last_in_session_value:
          type: string
          nullable: true
        evidence_gap_s:
          type: integer
          format: int64
          minimum: 0
        assigned_to:
          type: string
          nullable: true
        resolution_note:
          type: string
          nullable: true
        applicable:
          type: boolean
        blocked_reason:
          type: string
          nullable: true
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        applied_at:
          type: string
          format: date-time
          nullable: true
        dismissed_at:
          type: string
          format: date-time
          nullable: true
        quarantined_at:
          type: string
          format: date-time
          nullable: true
        restored_at:
          type: string
          format: date-time
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DataRepairCaseComment:
      type: object
      required: [id, case_id, actor, body, created_at]
      properties:
        id:
          type: integer
          format: int64
        case_id:
          type: integer
          format: int64
        actor:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time

    DataRepairQuarantine:
      type: object
      description: Payload-free quarantine metadata. The opaque source snapshot is never exposed.
      required:
        - id
        - case_id
        - kind
        - session_id
        - vehicle_id
        - schema_version
        - checksum
        - reason
        - quarantined_by
        - quarantined_at
      properties:
        id:
          type: integer
          format: int64
        case_id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/DataRepairSessionKind"
        session_id:
          type: integer
          format: int64
        vehicle_id:
          type: integer
          format: int64
        schema_version:
          type: integer
          minimum: 1
        checksum:
          type: string
          pattern: "^[0-9a-f]{64}$"
        reason:
          type: string
        quarantined_by:
          type: string
        quarantined_at:
          type: string
          format: date-time
        restored_by:
          type: string
          nullable: true
        restored_at:
          type: string
          format: date-time
          nullable: true

    DataRepairCaseList:
      type: object
      required: [cases, has_more]
      properties:
        cases:
          type: array
          items:
            $ref: "#/components/schemas/DataRepairCase"
        has_more:
          type: boolean
        next_cursor:
          type: object
          nullable: true
          required: [last_seen_at, id]
          properties:
            last_seen_at:
              type: string
              format: date-time
            id:
              type: integer
              format: int64

    DataRepairCaseDetail:
      type: object
      required: [case, comments]
      properties:
        case:
          $ref: "#/components/schemas/DataRepairCase"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/DataRepairCaseComment"
        quarantine:
          allOf:
            - $ref: "#/components/schemas/DataRepairQuarantine"
          nullable: true

    DataRepairCaseStats:
      type: object
      required:
        - total
        - open
        - in_review
        - applied
        - dismissed
        - quarantined
        - restored
        - resolved
        - drive
        - charging
      properties:
        total:
          type: integer
        open:
          type: integer
        in_review:
          type: integer
        applied:
          type: integer
        dismissed:
          type: integer
        quarantined:
          type: integer
        restored:
          type: integer
        resolved:
          type: integer
        drive:
          type: integer
        charging:
          type: integer
        oldest_open_at:
          type: string
          format: date-time
          nullable: true
        last_scan_at:
          type: string
          format: date-time
          nullable: true

    DataRepairQuarantineList:
      type: object
      required: [quarantines, has_more]
      properties:
        quarantines:
          type: array
          items:
            $ref: "#/components/schemas/DataRepairQuarantine"
        has_more:
          type: boolean
        next_cursor:
          type: object
          nullable: true
          required: [quarantined_at, id]
          properties:
            quarantined_at:
              type: string
              format: date-time
            id:
              type: integer
              format: int64

    DataRepairScanResult:
      type: object
      required: [run_id, status, discovered, refreshed, truncated]
      properties:
        run_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [completed]
        discovered:
          type: integer
          minimum: 0
        refreshed:
          type: integer
          minimum: 0
        truncated:
          type: boolean

    DataRepairCloseRequest:
      type: object
      additionalProperties: false
      required: [ended_at, rule, expected_stored_ended_at]
      properties:
        case_id:
          type: integer
          format: int64
          minimum: 1
        ended_at:
          type: string
          format: date-time
        rule:
          type: string
          description: Server-provided diagnosis rule, or manual for an explicit operator boundary.
        expected_stored_ended_at:
          type: string
          description: RFC3339 timestamp, or an empty string to assert that the session remains open.

    DataRepairCloseResponse:
      type: object
      required: [status, session_id, ended_at]
      properties:
        status:
          type: string
          enum: [closed, already_applied]
        session_id:
          type: integer
          format: int64
        ended_at:
          type: string
          format: date-time
        duration_s:
          type: integer
          format: int64
        recomputed_fields:
          type: array
          items:
            type: string

    DataRepairPreviewValue:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [null, timestamp, int64, float64, string]
        "null":
          type: boolean
        timestamp:
          type: string
          format: date-time
        int64:
          type: integer
          format: int64
        float64:
          type: number
          format: double
        string:
          type: string

    DataRepairPreview:
      type: object
      required:
        - kind
        - session_id
        - rule
        - source
        - status
        - started_at
        - proposed_ended_at
        - proposed_duration_s
        - fields_changed
        - fields_preserved
        - warnings
      properties:
        kind:
          $ref: "#/components/schemas/DataRepairSessionKind"
        session_id:
          type: integer
          format: int64
        rule:
          type: string
        source:
          type: string
          enum: [manual, suggestion]
        status:
          type: string
          enum: [ready, already_applied]
        started_at:
          type: string
          format: date-time
        current_ended_at:
          type: string
          format: date-time
          nullable: true
        proposed_ended_at:
          type: string
          format: date-time
        current_duration_s:
          type: integer
          format: int64
          nullable: true
        proposed_duration_s:
          type: integer
          format: int64
        fields_changed:
          type: array
          items:
            type: object
            required: [field, before, after]
            properties:
              field:
                type: string
              before:
                $ref: "#/components/schemas/DataRepairPreviewValue"
              after:
                $ref: "#/components/schemas/DataRepairPreviewValue"
        fields_preserved:
          type: array
          items:
            type: object
            required: [field, value, reason]
            properties:
              field:
                type: string
              value:
                $ref: "#/components/schemas/DataRepairPreviewValue"
              reason:
                type: string
        warnings:
          type: array
          items:
            type: string

    Vehicle:
      type: object
      properties:
        id:
          type: integer
          description: Internal database ID
          example: 1
        vehicle_id:
          type: integer
          description: Tesla vehicle ID
          example: 1234567890
        vin:
          type: string
          description: Vehicle identification number
          example: 5YJ3E1EA1LF000000
        display_name:
          type: string
          description: User-assigned display name
          example: My Tesla
        model:
          type: string
          description: Vehicle model
          example: Model 3
