      properties:
        id:
          type: integer
          example: 1
        vehicle_id:
          type: integer
          example: 1
        start_ts:
          type: string
          format: date-time
        end_ts:
          type: string
          format: date-time
          nullable: true
        start_lat:
          type: number
          example: 37.7749
        start_lon:
          type: number
          example: -122.4194
        end_lat:
          type: number
          example: 37.3382
        end_lon:
          type: number
          example: -121.8863
        start_address:
          type: string
          nullable: true
          example: San Francisco, CA
        end_address:
          type: string
          nullable: true
          example: San Jose, CA
        distance_m:
          type: number
          description: Distance travelled in meters (SI canonical).
          example: 124761.0
        duration_s:
          type: integer
          format: int64
          description: Drive duration in seconds (SI canonical).
          example: 3312
        avg_speed_mps:
          type: number
          description: Average speed in meters per second (SI canonical).
          nullable: true
          example: 23.4
        max_speed_mps:
          type: number
          description: Maximum speed in meters per second (SI canonical).
          nullable: true
          example: 33.5
        start_battery_pct:
          type: integer
          nullable: true
          example: 85
        end_battery_pct:
          type: integer
          nullable: true
          example: 62
        energy_used_wh:
          type: number
          description: Energy used in watt-hours (SI canonical).
          nullable: true
          example: 15300
        regen_energy_wh:
          type: number
          description: Energy recovered via regenerative braking in watt-hours (SI canonical).
          nullable: true
          example: 1850
        avg_power_w:
          type: number
          description: Average power draw in watts (SI canonical).
          nullable: true
          example: 16500
        outside_temp_avg_c:
