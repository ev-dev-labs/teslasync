                  type: string
                  minLength: 1
                  maxLength: 4000
      responses:
        "201":
          description: Created review note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairCaseComment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/cases/{id}/quarantine:
    post:
      operationId: quarantineDataRepairCase
      summary: Move a case's source session into reversible quarantine
      tags: [Data Repair]
      parameters:
        - $ref: "#/components/parameters/dataRepairID"
      requestBody:
        $ref: "#/components/requestBodies/DataRepairReason"
      responses:
        "200":
          description: Quarantine ledger record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairQuarantine"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Case, source, or quarantine state conflicts with the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/quarantine:
    get:
      operationId: listDataRepairQuarantine
      summary: List payload-free quarantine records
      description: Returns recovery metadata only. Opaque source snapshots are never serialized.
      tags: [Data Repair]
      parameters:
        - name: vehicle_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/DataRepairSessionKind"
        - name: restored
          in: query
          schema:
            type: boolean
        - name: cursor_quarantined_at
          in: query
          schema:
            type: string
            format: date-time
        - name: cursor_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Quarantine ledger page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairQuarantineList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/quarantine/{id}/restore:
    post:
      operationId: restoreDataRepairQuarantine
      summary: Verify and restore a quarantined session
      tags: [Data Repair]
      parameters:
        - $ref: "#/components/parameters/dataRepairID"
      requestBody:
        $ref: "#/components/requestBodies/DataRepairReason"
      responses:
        "200":
          description: Restored quarantine record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairQuarantine"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Snapshot integrity, schema, or lifecycle conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/charging/{id}:
    put:
      operationId: updateChargingData
      summary: Update charging session data
      description: Applies an audited partial correction. Session boundaries must use the preview and close endpoints.
      tags: [Data Repair]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Charging session updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargingSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Session changed while the correction was being applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteChargingData
      summary: Quarantine a charging session
      description: Legacy compatibility route that atomically snapshots the session, creates an operator case, removes it from active data, and retains a verified restore path.
      tags: [Data Repair]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        $ref: "#/components/requestBodies/DataRepairReason"
      responses:
        "204":
          description: Charging session moved to reversible quarantine
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Source or quarantine state conflicts with the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/charging/{id}/close:
    post:
      operationId: closeChargingSession
      summary: Apply a charging-session boundary repair
      description: Revalidates the reviewed boundary and applies it atomically with the case transition and audit trail.
      tags: [Data Repair]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRepairCloseRequest"
      responses:
        "200":
          description: Charging session closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairCloseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Session still active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/charging/{id}/preview:
    post:
      operationId: previewChargingSessionRepair
      summary: Preview a charging-session boundary repair
      description: Validates the requested boundary and reports exact changed and preserved fields without mutating data.
      tags: [Data Repair]
      parameters:
        - $ref: "#/components/parameters/dataRepairID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRepairCloseRequest"
      responses:
        "200":
          description: Server-calculated impact preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Reviewed boundary no longer matches durable evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/drive/{id}:
    put:
      operationId: updateDriveData
      summary: Update drive session data
      description: Applies an audited partial correction. Session boundaries must use the preview and close endpoints.
      tags: [Data Repair]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Drive session updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drive"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Drive changed while the correction was being applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteDriveData
      summary: Quarantine a drive session
      description: Legacy compatibility route that atomically snapshots the drive and linked relationships, creates an operator case, removes it from active data, and retains a verified restore path.
      tags: [Data Repair]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        $ref: "#/components/requestBodies/DataRepairReason"
      responses:
        "204":
          description: Drive moved to reversible quarantine
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Source or quarantine state conflicts with the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/drive/{id}/close:
    post:
      operationId: closeDriveSession
      summary: Apply a drive boundary repair
      description: Revalidates the reviewed boundary and applies it atomically with the case transition and audit trail.
      tags: [Data Repair]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRepairCloseRequest"
      responses:
        "200":
          description: Drive session closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairCloseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Session still active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/drive/{id}/preview:
    post:
      operationId: previewDriveSessionRepair
      summary: Preview a drive boundary repair
      description: Validates the requested boundary and reports exact changed and preserved fields without mutating data.
      tags: [Data Repair]
      parameters:
        - $ref: "#/components/parameters/dataRepairID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRepairCloseRequest"
      responses:
        "200":
          description: Server-calculated impact preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataRepairPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Reviewed boundary no longer matches durable evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── Backup ─────────────────────────────────────────────────────────
  /backup/configs:
    get:
      operationId: listBackupConfigs
      summary: List backup configs
      description: Returns all backup configurations.
      tags: [Backup]
      responses:
        "200":
          description: List of backup configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackupConfig"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createBackupConfig
      summary: Create backup config
      description: Creates a new backup configuration.
      tags: [Backup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, schedule, retention_days, storage_type]
              properties:
                name:
                  type: string
                  example: Daily Backup
                schedule:
                  type: string
                  description: Cron expression
                  example: "0 2 * * *"
                retention_days:
                  type: integer
                  example: 30
                storage_type:
                  type: string
                  enum: [local, s3]
                  example: local
      responses:
        "201":
          description: Backup config created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /backup/configs/{configID}:
    get:
      operationId: getBackupConfig
      summary: Get backup config
      description: Returns details for a specific backup configuration.
      tags: [Backup]
      parameters:
        - $ref: "#/components/parameters/configID"
      responses:
        "200":
          description: Backup config details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupConfig"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: updateBackupConfig
      summary: Update backup config
      description: Updates an existing backup configuration.
      tags: [Backup]
      parameters:
        - $ref: "#/components/parameters/configID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                schedule:
                  type: string
                retention_days:
                  type: integer
                storage_type:
                  type: string
                  enum: [local, s3]
                enabled:
                  type: boolean
      responses:
        "200":
          description: Backup config updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteBackupConfig
      summary: Delete backup config
      description: Deletes a backup configuration.
      tags: [Backup]
      parameters:
        - $ref: "#/components/parameters/configID"
      responses:
        "200":
          description: Backup config deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: backup config deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /backup/configs/{configID}/trigger:
    post:
      operationId: triggerBackup
      summary: Trigger manual backup
      description: Triggers a manual backup run for a configuration.
      tags: [Backup]
      parameters:
        - $ref: "#/components/parameters/configID"
      responses:
        "200":
          description: Backup triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRun"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /backup/quick:
    post:
      operationId: quickBackup
      summary: Quick one-time backup
      description: Creates a quick one-time backup without a configuration.
      tags: [Backup]
      responses:
        "200":
          description: Quick backup started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRun"
        "500":
          $ref: "#/components/responses/InternalError"

  /backup/runs:
    get:
      operationId: listBackupRuns
      summary: List backup runs
      description: Returns paginated list of backup runs.
      tags: [Backup]
      parameters:
        - name: config_id
          in: query
          schema:
            type: string
          description: Filter by backup config ID
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
      responses:
        "200":
          description: List of backup runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackupRun"
        "500":
          $ref: "#/components/responses/InternalError"

  /backup/runs/{runID}:
    get:
      operationId: getBackupRun
      summary: Get backup run details
      description: Returns details for a specific backup run.
      tags: [Backup]
      parameters:
        - $ref: "#/components/parameters/runID"
      responses:
        "200":
          description: Backup run details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRun"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /backup/runs/{runID}/download:
    get:
      operationId: downloadBackup
      summary: Download backup file
      description: Downloads the backup file for a specific run.
      tags: [Backup]
      parameters:
        - $ref: "#/components/parameters/runID"
      responses:
        "200":
          description: Backup file download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /backup/runs/{runID}/verify:
    post:
      operationId: verifyBackup
      summary: Verify backup integrity
      description: Verifies the integrity of a backup file.
      tags: [Backup]
      parameters:
        - $ref: "#/components/parameters/runID"
      responses:
        "200":
          description: Backup verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  checksum:
                    type: string
                  size_bytes:
                    type: integer
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /backup/runs/{runID}/preview:
    get:
      operationId: previewRestore
      summary: Preview restore contents
      description: Previews the contents of a backup before restoring.
      tags: [Backup]
      parameters:
        - $ref: "#/components/parameters/runID"
      responses:
        "200":
          description: Restore preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  tables:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        record_count:
                          type: integer
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  # ─── Export ─────────────────────────────────────────────────────────
  /export/{type}:
    get:
      operationId: exportData
      summary: Export data
      description: Exports data of the specified type (drives, charging, positions) in CSV or JSON format.
      tags: [Export]
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [drives, charging, trips, analytics, backup, account]
        - name: vehicle_id
          in: query
          schema:
            type: integer
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, json]
            default: csv
      responses:
        "200":
          description: Exported data
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /share/{token}:
    get:
      operationId: getPublicShare
      summary: Get public shared drive report
      description: Returns a v2 share payload with SI canonical keys. Old v1 payloads may be read by the SPA only for existing shared URLs.
      tags: [Sharing]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared drive report
          content:
            application/json:
              schema:
                type: object
                properties:
                  payload_version:
                    type: string
                    example: v2
                  drive:
                    type: object
                    properties:
                      distance_m:
                        type: number
                      duration_s:
                        type: integer
                      max_speed_mps:
                        type: number
                        nullable: true
        "404":
          $ref: "#/components/responses/NotFound"

  /export/jobs:
    post:
      operationId: submitExportJob
      summary: Submit async export job
      description: "Submits an asynchronous export job for large datasets. CSV exports are v2-only and use SI canonical filenames and columns: teslasync-drives-v2.csv, teslasync-charging-v2.csv, teslasync-trips-v2.csv. Drive headers include distance_m, duration_s, max_speed_mps; trip headers include total_distance_m, total_energy_wh, total_duration_s."
      tags: [Export]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [drives, charging, trips, analytics, backup, account]
                vehicle_id:
                  type: integer
                format:
                  type: string
                  enum: [csv, json]
                  default: csv
                start:
                  $ref: "#/components/schemas/QueuedExportStart"
                end:
                  $ref: "#/components/schemas/QueuedExportEnd"
      responses:
        "202":
          description: Export job submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                    example: pending
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listExportJobs
      summary: List export jobs
      description: Returns a list of export jobs.
      tags: [Export]
      responses:
        "200":
          description: List of export jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    type:
                      type: string
                    status:
                      type: string
                      enum: [pending, running, completed, failed]
                    created_at:
                      type: string
                      format: date-time
                    completed_at:
                      type: string
                      format: date-time
        "500":
          $ref: "#/components/responses/InternalError"

  /export/jobs/account:
    post:
      operationId: submitAccountExportJob
      summary: Queue an account ZIP export
      description: |
        Produces one CSV per allowed account table plus a manifest. Optional
        bounds use the same instant contract as /export/jobs; omitted sides
        remain unbounded. Existing date-only clients retain UTC midnight bounds.
      tags: [Export]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicle_id:
                  type: integer
                start:
                  $ref: "#/components/schemas/QueuedExportStart"
                end:
                  $ref: "#/components/schemas/QueuedExportEnd"
      responses:
        "202":
          description: Account export queued
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /export/jobs/import:
    post:
      operationId: submitImportJob
      summary: Submit import job
      description: Submits a data import job.
      tags: [Export]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "202":
          description: Import job submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                    example: pending
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /export/jobs/{jobID}:
    get:
      operationId: getExportJob
      summary: Get export job status
      description: Returns the status of an export job.
      tags: [Export]
      parameters:
        - name: jobID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Export job status
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  status:
                    type: string
                    enum: [pending, running, completed, failed]
                  progress:
                    type: number
                  error:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /export/jobs/{jobID}/download:
    get:
      operationId: downloadExportJob
      summary: Download export job result
      description: Downloads the result of a completed export job.
      tags: [Export]
      parameters:
        - name: jobID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Export file download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
# ═══════════════════════════════════════════════════════════════════════
# Components
# ═══════════════════════════════════════════════════════════════════════
components:
  parameters:
    sharedPlanningPrincipal:
      name: X-TeslaSync-Expected-Principal
      in: header
      required: true
      description: Current browser identity race guard, not an authentication credential.
      schema: { type: string }
    sharedChargerPlanID:
      name: planID
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    sharedChargerRevision:
      name: revision
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    sharedTripID:
      name: tripID
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    privateTrackDriveID:
      name: driveID
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    privateTrackVehicleID:
      name: vehicle_id
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    privateMediaReviewID:
      name: review_id
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    privatePlaylistDraftID:
      name: draft_id
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    privateParkingReviewPlan:
      name: plan_id
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    privateWindowRainPlan:
      name: plan_id
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    privateBatteryReviewVehicle:
      name: vehicle_id
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    privateBatteryReviewPlan:
      name: plan_id
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    automationHistoryTimezone:
      name: timezone
      in: query
      description: |
        IANA timezone used for full-range daily trend grouping. Does not change
        timestamps or since/until bounds. Unknown zones and server-local "Local"
        are rejected with HTTP 400.
      schema:
        type: string
        default: UTC
        example: America/Los_Angeles
    automationHistorySince:
      name: since
      in: query
      description: Inclusive RFC3339 instant, or legacy date-only UTC midnight.
      schema:
        type: string
        example: "2026-03-08T08:00:00Z"
    automationHistoryUntil:
      name: until
      in: query
      description: |
        Exclusive RFC3339 instant. A legacy date-only value includes that entire
        UTC date, independent of timezone. Must be after since when both exist.
      schema:
        type: string
        example: "2026-03-09T07:00:00Z"
    automationHistoryStatus:
      name: status
      in: query
      description: Restrict executions and both aggregates to this status.
      schema:
        type: string
    vehicleID:
      name: vehicleID
      in: path
      required: true
      description: Vehicle ID
      schema:
        type: integer

    driveID:
      name: driveID
      in: path
      required: true
      description: Drive session ID
      schema:
        type: integer

    sessionID:
      name: sessionID
      in: path
      required: true
      description: Charging session ID
      schema:
        type: integer

    geofenceID:
      name: geofenceID
      in: path
      required: true
      description: Geofence ID
      schema:
        type: integer

    channelID:
      name: channelID
      in: path
      required: true
      description: Notification channel ID
      schema:
        type: integer

    configID:
      name: configID
      in: path
      required: true
      description: Backup configuration ID
      schema:
        type: string

    runID:
      name: runID
      in: path
      required: true
      description: Backup run ID
      schema:
        type: string

    dataRepairID:
      name: id
      in: path
      required: true
      description: Data-repair case, session, or quarantine identifier
      schema:
        type: integer
        format: int64
        minimum: 1

    limitParam:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 1000

    offsetParam:
      name: offset
      in: query
      description: Number of results to skip
      schema:
        type: integer
        default: 0
        minimum: 0

  requestBodies:
    SharedTripDraft:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [departure_at, nominations]
            properties:
              revision: { type: integer, format: int64, minimum: 1, description: Required on replacement and omitted on creation. }
              departure_at: { type: string, format: date-time }
              nominations:
                type: array
                minItems: 2
                maxItems: 16
                items:
                  type: object
                  additionalProperties: false
                  required: [vehicle_id, subject]
                  properties:
                    vehicle_id: { type: integer, format: int64, minimum: 1 }
                    subject: { type: string, minLength: 1, maxLength: 256, description: Exact verified subject. At most 256 UTF-8 bytes. }
    SharedChargerAuthorization:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [place_id, place_updated_at, participants, expires_at]
            properties:
              place_id: { type: integer, format: int64, minimum: 1 }
              place_updated_at: { type: string, format: date-time }
              expires_at: { type: string, format: date-time }
              reminder_vehicle_id: { type: integer, format: int64, minimum: 0, default: 0, description: "One nominated vehicle, or zero to offer no reminder." }
              participants:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  type: object
                  additionalProperties: false
                  required: [vehicle_id, subject]
                  properties:
                    vehicle_id: { type: integer, format: int64, minimum: 1 }
                    subject: { type: string, minLength: 1, maxLength: 256, description: Exact verified subject. At most 256 UTF-8 bytes. }
    PrivateBatteryReviewPlan:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [expected_plan_id, time_zone]
            properties:
              expected_plan_id:
                type: integer
                format: int64
                minimum: 0
                description: Zero for first enrollment, otherwise the currently loaded plan ID.
              time_zone:
                type: string
                maxLength: 80
                description: IANA time zone (not server-local "Local").
              paused: { type: boolean, default: false }
              local_review_confirmed:
                type: boolean
                description: Must be true unless pausing an existing plan.
    DataRepairReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
              reason:
                type: string
                minLength: 1
                maxLength: 1000

  responses:
    SharedTripSaved:
      description: Scoped departure created or revised. No vehicle command or schedule change was made.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/SharedTripRef" }
    SharedChargerSaved:
      description: Private plan revision saved. No vehicle command or schedule change was made.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [id, revision]
                properties:
                  id: { type: integer, format: int64, minimum: 1 }
                  revision: { type: integer, format: int64, minimum: 1 }
    PrivateBatteryReviewChanged:
      description: Plan, review, or signed-in identity changed. Refresh and confirm again; do not retry an old write automatically.
    AutomationHistory:
      description: Execution page and unpaginated summary and daily trend
      content:
        application/json:
          schema:
            type: object
            required: [items, total, limit, offset, summary, trend]
            properties:
              items:
                type: array
                items:
                  type: object
              total:
                type: integer
              limit:
                type: integer
              offset:
                type: integer
              summary:
                type: object
                description: Aggregate statistics across the complete filtered range.
              trend:
                type: array
                items:
                  type: object
                  required: [day, status, count]
                  properties:
                    day:
                      type: string
                      format: date
                      description: Civil date in the requested timezone, not a UTC timestamp.
                    status:
                      type: string
                    count:
                      type: integer
                      minimum: 0
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidInput:
              value:
                error: invalid input parameters
                code: VALIDATION_INVALID_INPUT
                category: validation
            invalidJson:
              value:
                error: invalid JSON body
                code: VALIDATION_INVALID_JSON
                category: validation
            missingField:
              value:
                error: required field missing
                code: VALIDATION_MISSING_FIELD
                category: validation

    Unauthorized:
      description: Authentication required or failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            tokenMissing:
              value:
                error: authentication token is required
                code: AUTH_TOKEN_MISSING
                category: auth
            tokenExpired:
              value:
                error: authentication token has expired
                code: AUTH_TOKEN_EXPIRED
                category: auth
            tokenInvalid:
              value:
                error: authentication token is invalid
                code: AUTH_TOKEN_INVALID
                category: auth
            apiKeyInvalid:
              value:
                error: API key is invalid
                code: AUTH_API_KEY_INVALID
                category: auth

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: insufficient permissions
            code: AUTH_INSUFFICIENT_PERMISSIONS
            category: auth

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: resource not found
            code: DB_RECORD_NOT_FOUND
            category: database

    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: rate limit exceeded
            code: RATE_LIMITED
            category: rate_limiting

    TeslaAPIError:
      description: Tesla API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Tesla API is unavailable
            code: TESLA_API_UNAVAILABLE
            category: tesla_api

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: an internal error occurred
            code: INTERNAL_ERROR
            category: internal

  schemas:
    SharedTripRef:
      type: object
      required: [id, revision, departure_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
        departure_at: { type: string, format: date-time }
    SharedChargerOwnedPlan:
      type: object
      required: [id, revision, place_id, expires_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
        place_id: { type: integer, format: int64, minimum: 1 }
        expires_at: { type: string, format: date-time }
    SharedChargerSlot:
      type: object
      required: [vehicle_id, starts_at, ends_at]
      properties:
        vehicle_id: { type: integer, format: int64, minimum: 1 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    SharedChargerCard:
      type: object
      nullable: true
      required: [id, revision, place_id, expires_at, first, second, swap_at, evaluated_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
        place_id: { type: integer, format: int64, minimum: 1 }
        expires_at: { type: string, format: date-time }
        first: { $ref: "#/components/schemas/SharedChargerSlot" }
        second: { $ref: "#/components/schemas/SharedChargerSlot" }
        swap_at: { type: string, format: date-time }
        evaluated_at: { type: string, format: date-time }
    SharedChargerReminder:
      type: object
      nullable: true
      required: [id, revision, vehicle_id, swap_at, expires_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
        vehicle_id: { type: integer, format: int64, minimum: 1 }
        swap_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    PrivateFavoriteRecording:
      type: object
      required: [key, title, artist, source, duration_s]
      properties:
        key: { type: string, pattern: "^[0-9a-f]{64}$" }
        title: { type: string }
        artist: { type: string }
        source: { type: string, enum: [spotify, youtube_music, apple_music, tidal, bluetooth, usb] }
        duration_s: { type: integer, minimum: 30, maximum: 1800 }

    PrivateWindowRainRisk:
      type: object
      required: [window, forecast_at, risk_start_at, risk_end_at, expires_at]
      properties:
        window:
          type: object
          required: [position, observed_at]
          properties:
            position: { type: string, enum: [front_driver, front_passenger, rear_driver, rear_passenger] }
            observed_at: { type: string, format: date-time }
        forecast_at: { type: string, format: date-time }
        risk_start_at: { type: string, format: date-time }
        risk_end_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    PrivateCapacityDigest:
      type: object
      required: [baseline_from, recent_from, recent_to, observed_to, expires_at, baseline, recent, change, baseline_days, recent_days]
      properties:
        baseline_from: { type: string, format: date-time }
        recent_from: { type: string, format: date-time }
        recent_to: { type: string, format: date-time }
        observed_to: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        baseline: { $ref: "#/components/schemas/PrivateCapacityRange" }
        recent: { $ref: "#/components/schemas/PrivateCapacityRange" }
        change: { $ref: "#/components/schemas/PrivateCapacityRange" }
        baseline_days: { type: integer, minimum: 8 }
        recent_days: { type: integer, minimum: 8 }
    PrivateCapacityRange:
      type: object
      required: [low_wh, high_wh]
      properties:
        low_wh: { type: number, format: double }
        high_wh: { type: number, format: double }
    PrivateOvernightDrainReview:
      type: object
      required: [morning_at, expires_at, start_at, end_at, measured_loss_pct, typical_loss_low_pct, typical_loss_high_pct, comparable_nights, factors]
      properties:
        morning_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        measured_loss_pct: { type: number, format: double }
        typical_loss_low_pct: { type: number, format: double }
        typical_loss_high_pct: { type: number, format: double }
        comparable_nights: { type: integer, minimum: 4 }
        factors:
          type: array
          description: Same-window observations, not proof of cause.
          items:
            type: object
            required: [kind, observed_at]
            properties:
              kind: { type: string, enum: [sentry, climate, wake_requested] }
              observed_at: { type: string, format: date-time }
    TeslaUsageAmounts:
      type: object
      required: [signals, commands, data_requests, wakes, estimated_usd]
      properties:
        signals: { type: integer, format: int64 }
        commands: { type: integer, format: int64 }
        data_requests: { type: integer, format: int64 }
        wakes: { type: integer, format: int64 }
        estimated_usd:
          type: number
          description: Unrounded estimate from the four documented local observation rates.
    QueuedExportStart:
      type: string
      description: |
        Inclusive RFC3339 instant. Legacy YYYY-MM-DD inputs retain UTC-midnight
        semantics. Omitted or empty values leave the lower bound unbounded.
      example: "2026-03-08T08:00:00.000Z"
    QueuedExportEnd:
      type: string
      description: |
        Exclusive RFC3339 instant. The existing worker and inclusive SQL bounds
        receive the preceding microsecond, matching database precision without
        changing storage or MQTT fields. Legacy YYYY-MM-DD inputs retain their
        inclusive UTC-midnight behavior, not end-of-day behavior. Omitted or
        empty values leave the upper bound unbounded. Backup exports always
        contain the complete database and do not apply date filters.
      example: "2026-03-09T07:00:00.000Z"
    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable error message
          example: resource not found
        code:
          type: string
          description: Machine-readable error code
          example: DB_RECORD_NOT_FOUND
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - CONFLICT
            - UNPROCESSABLE_ENTITY
            - AUTH_INVALID_CREDENTIALS
            - AUTH_TOKEN_EXPIRED
            - AUTH_TOKEN_INVALID
            - AUTH_TOKEN_MISSING
            - AUTH_API_KEY_INVALID
            - AUTH_API_KEY_EXPIRED
            - AUTH_API_KEY_REVOKED
            - AUTH_INSUFFICIENT_PERMISSIONS
            - VEHICLE_NOT_FOUND
            - VEHICLE_OFFLINE
            - VEHICLE_ASLEEP
            - VEHICLE_BUSY
            - DRIVE_NOT_FOUND
            - CHARGE_NOT_FOUND
            - TRIP_NOT_FOUND
            - SESSION_STILL_ACTIVE
            - SESSION_NOT_FOUND
            - TESLA_API_UNAVAILABLE
            - TESLA_API_SUSPENDED
            - TESLA_API_RATE_LIMITED
            - TESLA_API_TIMEOUT
            - TESLA_API_AUTH_FAILED
            - TESLA_NOT_CONNECTED
            - DB_CONNECTION_FAILED
            - DB_QUERY_FAILED
            - DB_TRANSACTION_FAILED
            - DB_RECORD_NOT_FOUND
            - DB_DUPLICATE_RECORD
            - VALIDATION_INVALID_INPUT
            - VALIDATION_INVALID_JSON
            - VALIDATION_MISSING_FIELD
            - VALIDATION_INVALID_RANGE
            - VALIDATION_INVALID_ID
            - VALIDATION_PAYLOAD_TOO_LARGE
            - GEOFENCE_NOT_FOUND
            - GEOFENCE_INVALID_COORDINATES
            - GEOFENCE_INVALID_RADIUS
            - COMMAND_NOT_SUPPORTED
            - COMMAND_FAILED
            - COMMAND_TIMEOUT
            - BACKUP_CONFIG_NOT_FOUND
            - BACKUP_RUN_NOT_FOUND
            - BACKUP_FAILED
            - BACKUP_STORAGE_ERROR
            - RESTORE_FAILED
            - NOTIFICATION_CHANNEL_NOT_FOUND
            - NOTIFICATION_TEST_FAILED
            - TELEMETRY_INGEST_FAILED
            - MQTT_UNAVAILABLE
            - EXPORT_FAILED
            - EXPORT_NOT_FOUND
            - EXPORT_INVALID_FORMAT
            - RATE_LIMITED
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
            - GATEWAY_TIMEOUT
            - NOT_IMPLEMENTED
            - ERROR
        category:
          type: string
          description: Error category
          example: database
          enum:
            - auth
            - vehicle
            - drives
            - charging
            - trips
            - tesla_api
            - database
            - validation
            - geofence
            - commands
            - backup
            - notifications
            - telemetry
            - export
            - rate_limiting
            - internal

    DataRepairSessionKind:
      type: string
      enum: [drive, charging]

    DataRepairConfidence:
      type: string
      enum: [high, medium]

    DataRepairCaseStatus:
      type: string
      enum: [open, in_review, applied, dismissed, quarantined, restored, resolved]

    DataRepairEvidence:
      type: object
      required: [ts, source, field, value]
      properties:
        ts:
          type: string
          format: date-time
        source:
          type: string
          enum: [signal_log, drive_telemetry, charging_telemetry, drives, charging_sessions]
        field:
          type: string
        value:
          type: string

    DataRepairSuggestion:
      type: object
      required:
        - kind
        - session_id
        - vehicle_id
        - rule
        - confidence
        - started_at
        - contradicting_evidence
        - suggested_ended_at
        - suggested_duration_s
        - evidence_gap_s
        - applicable
      properties:
        kind:
          $ref: "#/components/schemas/DataRepairSessionKind"
        session_id:
          type: integer
          format: int64
        vehicle_id:
          type: integer
          format: int64
        rule:
          type: string
        confidence:
          $ref: "#/components/schemas/DataRepairConfidence"
        started_at:
          type: string
          format: date-time
        stored_ended_at:
          type: string
          format: date-time
          nullable: true
        stored_duration_s:
          type: integer
          format: int64
          nullable: true
        last_in_session_evidence:
          allOf:
            - $ref: "#/components/schemas/DataRepairEvidence"
          nullable: true
        contradicting_evidence:
          $ref: "#/components/schemas/DataRepairEvidence"
        suggested_ended_at:
          type: string
          format: date-time
        suggested_duration_s:
          type: integer
          format: int64
          minimum: 0
        evidence_gap_s:
          type: integer
          format: int64
          minimum: 0
        applicable:
          type: boolean
        blocked_reason:
          type: string

    DataRepairSuggestionReport:
      type: object
      required:
        - generated_at
        - lookback_days
        - scanned_drives
        - scanned_charging_sessions
        - drive_suggestions
        - charging_suggestions
        - truncated
      properties:
        generated_at:
          type: string
          format: date-time
        lookback_days:
          type: integer
        scanned_drives:
          type: integer
        scanned_charging_sessions:
          type: integer
        drive_suggestions:
          type: array
          items:
            $ref: "#/components/schemas/DataRepairSuggestion"
        charging_suggestions:
          type: array
          items:
            $ref: "#/components/schemas/DataRepairSuggestion"
        truncated:
          type: boolean

    DataRepairCase:
      type: object
      required:
        - id
        - fingerprint
        - kind
        - session_id
        - vehicle_id
        - rule
        - confidence
        - status
        - evidence_started_at
        - evidence_contradiction_ts
        - evidence_contradiction_src
        - evidence_contradiction_field
        - evidence_contradiction_value
        - evidence_gap_s
        - applicable
        - first_seen_at
        - last_seen_at
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        fingerprint:
          type: string
          pattern: "^[0-9a-f]{64}$"
        kind:
          $ref: "#/components/schemas/DataRepairSessionKind"
        session_id:
          type: integer
          format: int64
        related_session_id:
          type: integer
          format: int64
          nullable: true
        vehicle_id:
          type: integer
          format: int64
        rule:
          type: string
        confidence:
          $ref: "#/components/schemas/DataRepairConfidence"
        status:
          $ref: "#/components/schemas/DataRepairCaseStatus"
        suggested_ended_at:
          type: string
          format: date-time
          nullable: true
        evidence_started_at:
          type: string
          format: date-time
        evidence_stored_ended_at:
          type: string
          format: date-time
          nullable: true
        evidence_contradiction_ts:
          type: string
          format: date-time
        evidence_contradiction_src:
          type: string
        evidence_contradiction_field:
          type: string
        evidence_contradiction_value:
          type: string
        evidence_last_in_session_ts:
          type: string
          format: date-time
          nullable: true
        evidence_last_in_session_src:
          type: string
          nullable: true
        evidence_last_in_session_field:
          type: string
          nullable: true
        evidence_last_in_session_value:
          type: string
          nullable: true
        evidence_gap_s:
          type: integer
          format: int64
          minimum: 0
        assigned_to:
          type: string
          nullable: true
        resolution_note:
          type: string
          nullable: true
        applicable:
          type: boolean
        blocked_reason:
          type: string
          nullable: true
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        applied_at:
          type: string
          format: date-time
          nullable: true
        dismissed_at:
          type: string
          format: date-time
          nullable: true
        quarantined_at:
          type: string
          format: date-time
          nullable: true
        restored_at:
          type: string
