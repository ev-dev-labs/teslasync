    Vehicle:
      type: object
      properties:
        id:
          type: integer
          description: Internal database ID
          example: 1
        vehicle_id:
          type: integer
          description: Tesla vehicle ID
          example: 1234567890
        vin:
          type: string
          description: Vehicle identification number
          example: 5YJ3E1EA1LF000000
        display_name:
          type: string
          description: User-assigned display name
          example: My Tesla
        model:
          type: string
          description: Vehicle model
          example: Model 3
        trim_badging:
          type: string
          description: Trim level
          example: Long Range
        exterior_color:
          type: string
          description: Exterior color
          example: Pearl White
        wheel_type:
          type: string
          description: Wheel type
          example: Aero
        state:
          type: string
          description: Current vehicle state
          example: online
        healthy:
          type: boolean
          description: Whether the vehicle data is healthy
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Drive:
      type: object
      description: |
        SI canonical drive aggregate (Phase-42 migration 000185, Phase-48
        Slice 1 rename). All distance/speed/energy/power values are in SI base
        units. Convert at the display boundary using `useUnits()` on the
        frontend.
      properties:
        id:
          type: integer
          example: 1
        vehicle_id:
          type: integer
          example: 1
        start_ts:
          type: string
          format: date-time
        end_ts:
          type: string
          format: date-time
          nullable: true
        start_lat:
          type: number
          example: 37.7749
        start_lon:
          type: number
          example: -122.4194
        end_lat:
          type: number
          example: 37.3382
        end_lon:
          type: number
          example: -121.8863
        start_address:
          type: string
          nullable: true
          example: San Francisco, CA
        end_address:
          type: string
          nullable: true
          example: San Jose, CA
        distance_m:
          type: number
          description: Distance travelled in meters (SI canonical).
          example: 124761.0
        duration_s:
          type: integer
          format: int64
          description: Drive duration in seconds (SI canonical).
          example: 3312
        start_odometer_m:
          type: number
          nullable: true
          description: Recorded odometer at departure in meters; null when unavailable.
          example: 120000000
        end_odometer_m:
          type: number
          nullable: true
          description: Recorded odometer at arrival in meters; null while unavailable or in progress.
          example: 120124761
        avg_speed_mps:
          type: number
          description: Average speed in meters per second (SI canonical).
          nullable: true
          example: 23.4
        max_speed_mps:
          type: number
          description: Maximum speed in meters per second (SI canonical).
          nullable: true
          example: 33.5
        start_battery_pct:
          type: integer
          nullable: true
          example: 85
        end_battery_pct:
          type: integer
          nullable: true
          example: 62
        energy_used_wh:
          type: number
          description: Energy used in watt-hours (SI canonical).
          nullable: true
          example: 15300
        regen_energy_wh:
          type: number
          description: Energy recovered via regenerative braking in watt-hours (SI canonical).
          nullable: true
          example: 1850
        avg_power_w:
          type: number
          description: Average power draw in watts (SI canonical).
          nullable: true
          example: 16500
        outside_temp_avg_c:
          type: number
          description: Average ambient temperature in degrees Celsius.
          nullable: true
          example: 22.5

    ChargingInvoiceInput:
      type: object
      required: [vehicle_id, provider, invoice_ref, currency, period_start, period_end, billed_total_minor, lines]
      properties:
        vehicle_id: { type: integer, format: int64, minimum: 1 }
        provider: { type: string, maxLength: 160 }
        invoice_ref: { type: string, maxLength: 160 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time, description: Exclusive end for opted-in checks. }
        billed_total_minor: { type: integer, format: int64, minimum: 0, description: Total as printed on the statement. }
        lines: { type: array, minItems: 1, maxItems: 500, items: { $ref: "#/components/schemas/ChargingInvoiceLine" } }
        variance_options:
          type: object
          required: [material_amount_minor]
          properties:
            material_amount_minor: { type: integer, format: int64, minimum: 1, maximum: 1000000000000 }
            complete_statement: { type: boolean, default: false, description: Every line entered and no omitted adjustments or credits. }

    SmartChargingPlanInput:
      type: object
      required: [vehicle_id, enabled, notify_at, departure_at, trip_use_low_pct, trip_use_high_pct, reserve_pct]
      properties:
        vehicle_id: { type: integer, format: int64, minimum: 1 }
        charging_place_id: { type: integer, format: int64, minimum: 1, description: Required when creating or enabling a plan. }
        enabled: { type: boolean }
        notify_at: { type: string, format: date-time }
        departure_at: { type: string, format: date-time }
        trip_use_low_pct: { type: number, minimum: 0, maximum: 100 }
        trip_use_high_pct: { type: number, minimum: 0, maximum: 100 }
        reserve_pct: { type: number, minimum: 0, maximum: 100 }
        early_stop_watch:
          type: boolean
          default: false
          description: For a verified signed-in subject, use recent charging evidence during this plan's readiness window. False or omitted disables this check. Personal push enrollment is separate.

    ChargingInvoiceRecord:
      allOf:
        - { $ref: "#/components/schemas/ChargingInvoiceInput" }
        - type: object
          required: [id, status, line_count, version, created_at, updated_at]
          properties:
            id: { type: integer, format: int64, minimum: 1 }
            status: { type: string, enum: [open, reconciled, disputed, settled] }
            line_count: { type: integer, minimum: 1 }
            version: { type: integer, minimum: 1 }
            variance_review_cleared: { type: boolean, description: The owner explicitly cleared the private check; no automatic comparison is performed. }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    ChargingInvoiceLine:
      type: object
      required: [occurred_at, billed_energy_wh, billed_total_minor]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        line_ref: { type: string, maxLength: 160 }
        occurred_at: { type: string, format: date-time, description: Recorded session start is used for an opted-in check. }
        location: { type: string, maxLength: 240 }
        billed_energy_wh: { type: number, minimum: 0 }
        billed_energy_minor: { type: integer, format: int64, minimum: 0, nullable: true, description: Omit or pass null when unknown on import. Explicit zero is a documented zero. }
        billed_idle_minor: { type: integer, format: int64, minimum: 0, nullable: true, description: Omit or pass null when unknown on import. Explicit zero is a documented zero. }
        billed_tax_minor: { type: integer, format: int64, minimum: 0, nullable: true, description: Omit or pass null when unknown on import. Explicit zero is a documented zero. }
        billed_total_minor: { type: integer, format: int64, minimum: 0 }
        variance_evidence:
          type: object
          description: Independently entered evidence. Omitted values remain unknown; no current vehicle state or nominal SoC estimate is used.
          properties:
            billed_boundary: { type: string, enum: [station, battery] }
            meter:
              type: object
              required: [observed_boundary, observed_energy_wh]
              properties:
                observed_boundary: { type: string, enum: [station, battery] }
                observed_energy_wh: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000000 }
                max_loss_wh: { type: number, minimum: 0, description: Independently documented upper bound; required to compare different meter boundaries. }
            rate:
              type: object
              required: [boundary, amount_minor, energy_wh]
              properties:
                boundary: { type: string, enum: [station, battery] }
                amount_minor: { type: integer, format: int64, minimum: 0, description: Applicable flat energy rate in the invoice currency; excludes taxes and fees. }
                energy_wh: { type: integer, format: int64, minimum: 1, maximum: 1000000 }
            other_fees_minor: { type: integer, format: int64, minimum: 0, description: Explicit zero means no other fees. Line-total comparison also requires all three billed charge amounts. }

    MileageTermInputs:
      type: object
      required: [time_zone, first_day, end_day, opening_odometer_m, allowance_m, minimum_overage_m]
      properties:
        time_zone: { type: string, maxLength: 80, example: America/New_York }
        first_day: { type: string, format: date, description: First local day of the allowance term. }
        end_day: { type: string, format: date, description: First local day excluded from the allowance term. }
        opening_odometer_m: { type: number, format: double, minimum: 0, maximum: 10000000000 }
        allowance_m: { type: number, format: double, minimum: 1000, maximum: 10000000 }
        minimum_overage_m: { type: number, format: double, minimum: 100, maximum: 10000000 }
        paused: { type: boolean, default: false }
    MileageTermReview:
      type: object
      required: [settings, digest, last_checked_at, next_check_at]
      properties:
        settings:
          type: object
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/MileageTermInputs" }
            - type: object
              required: [id]
              properties:
                id: { type: integer, format: int64, minimum: 1 }
        last_checked_at: { type: string, format: date-time, nullable: true }
        next_check_at: { type: string, format: date-time, nullable: true }
        digest:
          type: object
          nullable: true
          required: [through, checked_at, expires_at, projection]
          properties:
            through: { type: string, format: date-time }
            checked_at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }
            projection:
              type: object
              required: [evidence_from, observed_at, observed_days, used_m, allowed_to_date_m, lower_m, upper_m]
              properties:
                evidence_from: { type: string, format: date-time }
                observed_at: { type: string, format: date-time }
                observed_days: { type: integer, minimum: 8, maximum: 91 }
                used_m: { type: number, format: double, minimum: 0 }
                allowed_to_date_m: { type: number, format: double, minimum: 0 }
                lower_m: { type: number, format: double, minimum: 0 }
                upper_m: { type: number, format: double, minimum: 0 }
    WeeklyDriveEfficiencyState:
      type: object
      required: [plan, digest, dismissed, review_allowed_until]
      properties:
        review_allowed_until: { type: string, format: date-time, nullable: true, description: Expiry of fresh parked evidence. Null keeps the review passive. }
        plan:
          type: object
          nullable: true
          required: [revision, time_zone, paused, next_check_at]
          properties:
            revision: { type: integer, format: int64, minimum: 1 }
            time_zone: { type: string }
            paused: { type: boolean }
            next_check_at: { type: string, format: date-time, nullable: true }
        digest:
          type: object
          nullable: true
          required: [reference_drive_id, baseline_from, recent_from, recent_until, observed_until, expires_at, baseline_days, recent_days, baseline, recent, higher]
          properties:
            reference_drive_id: { type: integer, format: int64, minimum: 1 }
            baseline_from: { type: string, format: date-time }
            recent_from: { type: string, format: date-time }
            recent_until: { type: string, format: date-time }
            observed_until: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }
            baseline_days: { type: integer, minimum: 4, maximum: 42 }
            recent_days: { type: integer, minimum: 4, maximum: 7 }
            baseline: { $ref: "#/components/schemas/ObservedDriveIntensity" }
            recent: { $ref: "#/components/schemas/ObservedDriveIntensity" }
            higher: { type: boolean, description: True only for a material observed increase across both parts of the week. }
        dismissed: { type: boolean }
    ObservedDriveIntensity:
      type: object
      required: [low_wh_per_m, high_wh_per_m]
      properties:
        low_wh_per_m: { type: number, format: double }
        high_wh_per_m: { type: number, format: double }
    SubscriptionRenewalState:
      type: object
      required: [plan, review, needs_review, dismissed]
      properties:
        plan:
          type: object
          nullable: true
          required: [revision, subscription_version, renewal_day, time_zone, lead_days, paused, next_check_at]
          properties:
            revision: { type: string, format: uuid }
            subscription_version: { type: integer, minimum: 1 }
            renewal_day: { type: string, format: date }
            time_zone: { type: string, maxLength: 80 }
            lead_days: { type: integer, minimum: 1, maximum: 30 }
            paused: { type: boolean }
            next_check_at: { type: string, format: date-time, nullable: true }
        review:
          type: object
          nullable: true
          required: [renewal_day, expires_at, name, price_minor, currency, billing_period, evidence]
          properties:
            renewal_day: { type: string, format: date }
            expires_at: { type: string, format: date-time, description: Midnight at the start of the recorded local renewal date. }
            name: { type: string }
            price_minor: { type: integer, format: int64, minimum: 0 }
            currency: { type: string, pattern: '^[A-Z]{3}$' }
            billing_period: { type: string, enum: [monthly, annual] }
            evidence:
              type: object
              required: [from, through, metric, quantity, observed_days, excluded, coverage]
              properties:
                from: { type: string, format: date-time }
                through: { type: string, format: date-time, description: Exclusive end for observation starts. }
                metric: { type: string, enum: [driving_distance, drive_count, charging_sessions, connectivity_time, supercharging_energy, none] }
                quantity:
                  type: number
                  format: double
                  minimum: 0
                  nullable: true
                  description: Meters for driving_distance, counts for drive_count and charging_sessions; otherwise null.
                observed_days: { type: integer, minimum: 0, maximum: 30 }
                excluded: { type: integer, minimum: 0, description: Completed drives missing valid distance. }
                coverage: { type: string, enum: [observed_only, no_evidence, not_measured, uncertain_coverage] }
        needs_review: { type: boolean }
        dismissed: { type: boolean }
    TripPacketExpectedVersion:
      type: object
      required: [plan_id, expected_revision]
      properties:
        plan_id: { type: integer, format: int64, minimum: 0, description: Zero for first enrollment only. }
        expected_revision: { type: integer, format: int64, minimum: 0, description: Zero for first enrollment only. }
    TripPacketReceipt:
      type: object
      required: [drive_id, receipt_day, reference, currency, amount_minor]
      properties:
        drive_id: { type: integer, format: int64, minimum: 1 }
        receipt_day: { type: string, format: date, description: Date on the receipt within the local start and end days of the matched drive. }
        reference: { type: string, minLength: 1, maxLength: 120 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        amount_minor: { type: integer, format: int64, minimum: 1, maximum: 1000000000 }
    TripPacketEntry:
      type: object
      required: [drive_id, purpose]
      properties:
        drive_id: { type: integer, format: int64, minimum: 1 }
        purpose: { type: string, enum: ['', business, commute, personal], description: Empty removes the confirmed purpose. }
        receipts:
          type: array
          maxItems: 10
          nullable: true
          description: Only accepted for a drive explicitly marked business.
          items: { $ref: "#/components/schemas/TripPacketReceipt" }
    TripPacketEvidence:
      type: object
      required: [from, through, business_drives, matched_receipts, unclassified_drive_count, business_drives_without_distance, unmatched_receipts, observed_business_distance_m]
      properties:
        from: { type: string, format: date-time, description: Inclusive local month start. }
        through: { type: string, format: date-time, description: Exclusive local month end for drive starts. }
        business_drives:
          type: array
          maxItems: 1024
          items:
            type: object
            required: [drive_id, started_at, ended_at, distance_m]
            properties:
              drive_id: { type: integer, format: int64, minimum: 1 }
              started_at: { type: string, format: date-time }
              ended_at: { type: string, format: date-time }
              distance_m: { type: number, format: double, minimum: 0, nullable: true }
        matched_receipts:
          type: array
          maxItems: 2048
          items: { $ref: "#/components/schemas/TripPacketReceipt" }
        unclassified_drive_count: { type: integer, minimum: 0 }
        business_drives_without_distance: { type: integer, minimum: 0 }
        unmatched_receipts: { type: integer, minimum: 0 }
        observed_business_distance_m: { type: number, format: double, minimum: 0 }
    TripPacketReview:
      type: object
      required: [plan, entry, packet]
      properties:
        plan:
          type: object
          nullable: true
          required: [id, revision, paused, time_zone, next_check_at]
          properties:
            id: { type: integer, format: int64, minimum: 1 }
            revision: { type: integer, format: int64, minimum: 1 }
            paused: { type: boolean }
            time_zone: { type: string, maxLength: 80 }
            next_check_at: { type: string, format: date-time, nullable: true }
        entry:
          type: object
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/TripPacketEntry" }
        packet:
          type: object
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/TripPacketEvidence" }
            - type: object
              properties:
                unclassified_drive_ids:
                  type: array
                  maxItems: 1024
                  items: { type: integer, format: int64, minimum: 1 }
        digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        expires_at: { type: string, format: date-time }
    MonthlyTariffInputs:
      type: object
      required: [site_id, site_revision, current_tariff_id, current_version, alternative_tariff_id, alternative_version, time_zone, minimum_savings_minor, switch_fee_minor]
      properties:
        site_id: { type: integer, format: int64, minimum: 1 }
        site_revision: { type: string, format: date-time }
        current_tariff_id: { type: integer, format: int64, minimum: 1 }
        current_version: { type: integer, minimum: 1 }
        alternative_tariff_id: { type: integer, format: int64, minimum: 1 }
        alternative_version: { type: integer, minimum: 1 }
        time_zone: { type: string, maxLength: 80, example: America/New_York }
        minimum_savings_minor: { type: integer, format: int64, minimum: 1, maximum: 1000000000 }
        switch_fee_minor: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        paused: { type: boolean, default: false }
    MonthlyTariffReview:
      type: object
      required: [needs_review]
      properties:
        settings:
          allOf:
            - { $ref: "#/components/schemas/MonthlyTariffInputs" }
            - type: object
              required: [id]
              properties:
                id: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        site_name: { type: string }
        current_name: { type: string }
        alternative_name: { type: string }
        needs_review: { type: boolean, description: The selected place or saved terms no longer match the approved versions. }
        last_checked_at: { type: string, format: date-time }
        digest:
          type: object
          required: [from, through, checked_at, expires_at, comparison]
          properties:
            from: { type: string, format: date-time }
            through: { type: string, format: date-time, description: Exclusive end of the compared local month. }
            checked_at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }
            comparison:
              type: object
              required: [days, sessions, energy_wh, current, alternative, current_fixed_minor, alternative_fixed_minor, switch_fee_minor, net_savings]
              properties:
                days: { type: integer, minimum: 28, maximum: 31 }
                sessions: { type: integer, minimum: 4, maximum: 512 }
                energy_wh: { type: number, format: double }
                current: { $ref: "#/components/schemas/MonthlyTariffCostRange" }
                alternative: { $ref: "#/components/schemas/MonthlyTariffCostRange" }
                current_fixed_minor: { type: integer, format: int64, minimum: 0 }
                alternative_fixed_minor: { type: integer, format: int64, minimum: 0 }
                switch_fee_minor: { type: integer, format: int64, minimum: 0 }
                net_savings: { $ref: "#/components/schemas/MonthlyTariffCostRange" }
    MonthlyTariffCostRange:
      type: object
      required: [lower_minor, upper_minor]
      properties:
        lower_minor: { type: integer, format: int64 }
        upper_minor: { type: integer, format: int64 }
    MonthlyChargingCostReview:
      type: object
      properties:
        settings:
          type: object
          required: [id, time_zone, currency, material_change_minor, paused]
          properties:
            id: { type: integer, format: int64, minimum: 1 }
            time_zone: { type: string }
            currency: { type: string }
            material_change_minor: { type: integer, format: int64, minimum: 1 }
            paused: { type: boolean }
        last_checked_at: { type: string, format: date-time }
        digest:
          type: object
          required: [prior_from, current_from, through, checked_at, expires_at, attribution]
          properties:
            prior_from: { type: string, format: date-time }
            current_from: { type: string, format: date-time }
            through: { type: string, format: date-time, description: Exclusive end of the recent completed month. }
            checked_at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }
            attribution:
              type: object
              description: Estimated contributions to the change in known spend, in minor currency units, not evidence of cause.
              required: [currency, prior, current, comparable_sites, distance_minor, purchase_intensity_minor, site_mix_minor, effective_price_minor, unattributed_minor]
              properties:
                currency: { type: string }
                prior: { $ref: "#/components/schemas/MonthlyChargingCostCoverage" }
                current: { $ref: "#/components/schemas/MonthlyChargingCostCoverage" }
                comparable_sites: { type: integer, minimum: 1 }
                distance_minor: { type: integer, format: int64 }
                purchase_intensity_minor: { type: integer, format: int64 }
                site_mix_minor: { type: integer, format: int64 }
                effective_price_minor: { type: integer, format: int64 }
                unattributed_minor: { type: integer, format: int64, description: Uncompared known spend and rounding. }

    MonthlyChargingCostCoverage:
      type: object
      required: [sessions, recorded_costs, compared_sessions, recorded_spend_minor, compared_spend_minor]
      properties:
        sessions: { type: integer, minimum: 0 }
        recorded_costs: { type: integer, minimum: 0 }
        compared_sessions: { type: integer, minimum: 0 }
        recorded_spend_minor: { type: integer, format: int64, minimum: 0 }
        compared_spend_minor: { type: integer, format: int64, minimum: 0 }
        recorded_distance_m: { type: number, format: double, minimum: 0 }

    ChargingInvoiceVarianceReview:
      type: object
      required: [state, matched_lines, comparable_lines, findings]
      properties:
        state: { type: string, enum: [off, insufficient, no_material_difference, review, handled] }
        matched_lines: { type: integer, minimum: 0 }
        comparable_lines: { type: integer, minimum: 0 }
        unexplained_statement_minor: { type: integer, format: int64, description: Printed total minus sum of complete entered lines. Not an overbilling determination. }
        findings:
          type: array
          maxItems: 500
          items:
            type: object
            required: [line_id, assessment]
            properties:
              line_id: { type: integer, format: int64, minimum: 1 }
              session_id: { type: integer, format: int64, minimum: 1 }
              session_started_at: { type: string, format: date-time }
              assessment:
                type: object
                properties:
                  expected_energy_lower_wh: { type: number, minimum: 0 }
                  expected_energy_upper_wh: { type: number, minimum: 0 }
                  unexplained_energy_wh: { type: number, description: Billed energy minus the nearest comparable meter bound. }
                  expected_energy_minor: { type: integer, format: int64, minimum: 0 }
                  unexplained_rate_minor: { type: integer, format: int64 }
                  components_total_minor: { type: integer, format: int64, minimum: 0 }
                  unexplained_total_minor: { type: integer, format: int64 }

