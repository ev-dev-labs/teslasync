  /data-repair/charging/{id}:
    put:
      operationId: updateChargingData
      summary: Update charging session data
      description: Applies an audited partial correction. Session boundaries must use the preview and close endpoints.
      tags: [Data Repair]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Charging session updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargingSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Session changed while the correction was being applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteChargingData
      summary: Quarantine a charging session
      description: Legacy compatibility route that atomically snapshots the session, creates an operator case, removes it from active data, and retains a verified restore path.
      tags: [Data Repair]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        $ref: "#/components/requestBodies/DataRepairReason"
      responses:
        "204":
          description: Charging session moved to reversible quarantine
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Source or quarantine state conflicts with the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /data-repair/charging/{id}/close:
    post:
      operationId: closeChargingSession
      summary: Apply a charging-session boundary repair
      description: Revalidates the reviewed boundary and applies it atomically with the case transition and audit trail.
      tags: [Data Repair]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
