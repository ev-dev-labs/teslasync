  /notifications/event-types:
    get:
      operationId: listNotificationEventTypes
      summary: List the stable component-health notification event-type catalog
      description: >
        Returns the complete, stable catalog of component-health
        notification event types (system.<component>.<outage|recovery>
        — telemetry, mqtt, database, redis, tesla_api, worker) a channel
        can opt in or out of via
        GET/PUT /notifications/{channelID}/preferences. Static and
        DB-free — the Channels UI should fetch this once to render one
        toggle per event_type without hardcoding or guessing the
        strings, then read/write the per-channel enabled state via the
        preferences endpoints, defaulting an absent preference row to
        each entry's default_enabled.
      tags: [Notifications]
      responses:
        "200":
          description: Event-type catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    event_type:
                      type: string
                      example: system.mqtt.outage
                    component:
                      type: string
                      example: mqtt
                    transition:
                      type: string
                      enum: [outage, recovery]
                    default_enabled:
                      type: boolean
                    description:
                      type: string

