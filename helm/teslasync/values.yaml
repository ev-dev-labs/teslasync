# Default values for teslasync.
# Override with: helm install teslasync ./helm/teslasync -f my-values.yaml

# -- Global image settings
global:
  imageRegistry: ""
  imagePullSecrets: []

# -- Additional image pull secrets
imagePullSecrets: []

# -- Override the release name
nameOverride: ""
fullnameOverride: ""

# ─────────────────────────────────────────────────────────────────────────────
# Backend service (Go)
# ─────────────────────────────────────────────────────────────────────────────
replicaCount: 1

image:
  repository: ghcr.io/ev-dev-labs/teslasync-api
  pullPolicy: IfNotPresent
  tag: ""

# -- Backend Kubernetes service configuration
# type: ClusterIP (internal only), NodePort, or LoadBalancer (public)
service:
  type: ClusterIP
  port: 8080
  # nodePort: 30080           # Only used when type: NodePort
  # loadBalancerIP: ""        # Only used when type: LoadBalancer
  # externalTrafficPolicy: "" # Local or Cluster (LoadBalancer only)
  annotations: {}
  # annotations:
  #   service.beta.kubernetes.io/aws-load-balancer-type: nlb
  #   service.beta.kubernetes.io/azure-load-balancer-internal: "true"

# -- Prometheus metrics configuration
# The API exposes /metrics in Prometheus format. Enable these options
# to let your Prometheus Operator auto-discover and scrape TeslaSync.
metrics:
  # Adds prometheus.io/* annotations to the API Service for auto-discovery
  enabled: true
  serviceMonitor:
    # Creates a ServiceMonitor CRD (requires Prometheus Operator)
    enabled: false
    # namespace: monitoring    # Deploy ServiceMonitor to a different namespace
    interval: "30s"            # Scrape interval
    # scrapeTimeout: "10s"     # Timeout per scrape
    labels: {}                 # Extra labels for ServiceMonitor (e.g., release: kube-prometheus)
    # labels:
    #   release: kube-prometheus-stack
    namespaceSelector: {}      # Namespace selector for cross-namespace monitoring
    metricRelabelings: []      # Metric relabeling rules
    relabelings: []            # Target relabeling rules

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Pin api + workers (notification, export, automation, command-proxy) to carbon
# so all teslasync workloads colocate on the node that hosts TimescaleDB, MQTT,
# and Redis. Empty {} restores default Kubernetes scheduling.
nodeSelector:
  kubernetes.io/hostname: carbon
tolerations: []
affinity: {}

# ─────────────────────────────────────────────────────────────────────────────
# Frontend service (Nginx)
# ─────────────────────────────────────────────────────────────────────────────
web:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/ev-dev-labs/teslasync-web
    pullPolicy: IfNotPresent
    tag: ""

  # -- Frontend Kubernetes service configuration
  # type: ClusterIP (internal only), NodePort, or LoadBalancer (public)
  service:
    type: ClusterIP
    port: 80
    # nodePort: 30080           # Only used when type: NodePort
    # loadBalancerIP: ""        # Only used when type: LoadBalancer
    # externalTrafficPolicy: "" # Local or Cluster (LoadBalancer only)
    annotations: {}
    # annotations:
    #   service.beta.kubernetes.io/aws-load-balancer-type: nlb

  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  # Colocate web with the rest of the teslasync stack on carbon.
  nodeSelector:
    kubernetes.io/hostname: carbon
  tolerations: []
  affinity: {}

# ─────────────────────────────────────────────────────────────────────────────
# Notification Worker
# ─────────────────────────────────────────────────────────────────────────────
notificationWorker:
  enabled: true
  replicaCount: 1

  # -- Database connection pool size for this worker. Workers need far fewer
  # connections than the API server. Keeps total connection budget low to avoid
  # exhausting Postgres max_connections during startup.
  dbMaxConns: 5
  dbMinConns: 2

  image:
    repository: ghcr.io/ev-dev-labs/teslasync-notification-worker
    pullPolicy: IfNotPresent
    tag: ""

  service:
    type: ClusterIP
    port: 8081

  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 32Mi

  # -- External notification worker — used when notificationWorker.enabled is false.
  external:
    host: ""
    port: 8081

# ─────────────────────────────────────────────────────────────────────────────
# Export Worker
#
# Processes data exports and database backups asynchronously via MQTT.
# Subscribes to teslasync/internal/exports for background job processing.
# ─────────────────────────────────────────────────────────────────────────────
exportWorker:
  enabled: true
  replicaCount: 1

  # -- Database connection pool size for this worker.
  dbMaxConns: 5
  dbMinConns: 2

  image:
    repository: ghcr.io/ev-dev-labs/teslasync-export-worker
    pullPolicy: IfNotPresent
    tag: ""

  service:
    type: ClusterIP
    port: 8082

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 64Mi

  # -- External export worker — used when exportWorker.enabled is false.
  external:
    host: ""
    port: 8082

# ─────────────────────────────────────────────────────────────────────────────
# Automation Worker
#
# Runs the automation engine: cron/mqtt/geofence/battery/energy/calendar/
# sunrise triggers, condition evaluation, and action execution.
# Subscribes to teslasync/automations/reload for config change notifications.
# Single-replica recommended — in-memory trigger state is not shared across pods.
# ─────────────────────────────────────────────────────────────────────────────
automationWorker:
  enabled: true
  replicaCount: 1

  # -- Database connection pool size for this worker.
  dbMaxConns: 5
  dbMinConns: 2

  image:
    repository: ghcr.io/ev-dev-labs/teslasync-automation-worker
    pullPolicy: IfNotPresent
    tag: ""

  service:
    type: ClusterIP
    port: 8083

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

  # -- External automation worker — used when automationWorker.enabled is false.
  external:
    host: ""
    port: 8083

# ─────────────────────────────────────────────────────────────────────────────
# Vehicle Command Proxy
#
# Routes vehicle commands through Tesla's Vehicle Command SDK for end-to-end
# signed command authentication. Required for 2021+ Model S/X and all Model 3/Y.
# See: https://github.com/teslamotors/vehicle-command
# ─────────────────────────────────────────────────────────────────────────────
commandProxy:
  enabled: false

  image:
    repository: tesla/vehicle-command
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 4443

  # -- Name of K8s Secret containing: private-key.pem, tls-cert.pem, tls-key.pem
  secretName: ""

  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 32Mi

  # -- External command proxy — used when commandProxy.enabled is false.
  external:
    url: ""

# ─────────────────────────────────────────────────────────────────────────────
# Encryption
# ─────────────────────────────────────────────────────────────────────────────
encryption:
  key: ""

# ─────────────────────────────────────────────────────────────────────────────
# Secrets
#
# By default the chart creates a K8s Secret with credentials from values.
# Set secrets.existingSecret to the name of a pre-created Secret to skip
# chart-managed secret creation. Useful for GitOps setups with SOPS,
# External Secrets Operator, or Sealed Secrets.
#
# The existing Secret must contain these keys:
#   TESLA_CLIENT_ID, TESLA_CLIENT_SECRET, DATABASE_PASS,
#   REDIS_PASSWORD, ENCRYPTION_KEY, GAS_PRICE_API_KEY,
#   AZURE_MAPS_API_KEY, GOOGLE_MAPS_API_KEY, MONGODB_URI
# ─────────────────────────────────────────────────────────────────────────────
secrets:
  existingSecret: ""

# ─────────────────────────────────────────────────────────────────────────────
# Fleet Telemetry (Tesla streaming data)
#
# Deploys Tesla's official Fleet Telemetry server (bundled) alongside TeslaSync.
# Uses Tesla's Docker image but auto-configures it to dispatch to TeslaSync's
# MQTT broker (Mosquitto). No separate Helm chart needed.
#
# Architecture:
#   Vehicle ──wss://──► Fleet Telemetry ──MQTT──► Mosquitto ──► TeslaSync Subscriber
#
# The same Tesla Developer app keypair is used for both Fleet API calls
# (OAuth, commands) and Fleet Telemetry vehicle registration.
#
# Requires:
#   - TLS certificates (vehicles only connect to valid HTTPS endpoints)
#   - Tesla Developer account with Fleet Telemetry access
#   - Public hostname reachable by vehicles
#
# See: https://github.com/teslamotors/fleet-telemetry
# ─────────────────────────────────────────────────────────────────────────────
fleetTelemetry:
  # -- Deploy the Fleet Telemetry server and enable TeslaSync's MQTT subscriber.
  enabled: false

  # -- Public hostname where vehicles connect via wss://.
  # Must be a valid FQDN with a publicly trusted TLS certificate.
  # Also passed to TeslaSync API as FLEET_TELEMETRY_HOST for the
  # DevTools vehicle subscription UI.
  # Example: telemetry.example.com
  host: ""

  # -- Tesla's official Fleet Telemetry Docker image.
  # See: https://hub.docker.com/r/tesla/fleet-telemetry
  image: tesla/fleet-telemetry:latest

  service:
    # NodePort opens port 30443 on every node's host network. The router
    # forwards WAN 8443 → carbon:30443 (carbon's real MAC keeps Deco happy).
    # nodePort must be in k3s's default range 30000-32767 unless the
    # apiserver --service-node-port-range flag has been customized.
    type: NodePort
    port: 4443
    nodePort: 30443
    # -- Optional: bind the Service port to one or more host IPs via kube-proxy
    # iptables. Useful when the cluster is behind a router/firewall that requires
    # a real node MAC for port-forwarding (e.g., TP-Link Deco) and a virtual
    # MetalLB IP isn't acceptable. Leave empty unless you know you need this.
    # The IPs MUST belong to a node already running the fleet-telemetry pod.
    # Example: ["192.168.68.112"]  (carbon's host IP)
    externalIPs: []

  # -- Pin the fleet-telemetry pod to a specific node. Required when
  # service.externalIPs is set so the bound IP belongs to the same node that
  # actually runs the pod.
  nodeSelector:
    kubernetes.io/hostname: carbon

  tolerations: []
  affinity: {}

  tls:
    # -- K8s TLS secret containing tls.crt and tls.key for the Fleet Telemetry server.
    # Vehicles verify this certificate — must be from a public CA (e.g., Let's Encrypt).
    # Self-signed certificates are rejected by vehicles.
    secretName: ""

  # -- MQTT topic base for fleet-telemetry's MQTT dispatcher.
  # Fleet Telemetry publishes each signal to: {topicBase}/{VIN}/v/{field_name}
  # TeslaSync's MQTT subscriber listens on: {topicBase}/+/v/+
  #   - segment 2: VIN (single-level wildcard)
  #   - segment 4: canonical proto field name (single-level wildcard)
  # Must match FLEET_TELEMETRY_TOPIC_BASE env var on the TeslaSync API.
  topicBase: "telemetry"

  # -- DEPRECATED — no-op on the per-field MQTT path. The legacy
  # proto-batch subscriber buffered atomics into per-VIN payloads
  # within this window before invoking the codec; the new per-field
  # subscriber processes each {VIN, field} message individually
  # (one codec.Atomic per MQTT message, one signal_log row per
  # codec.Atomic). The knob is kept for compat with legacy values
  # files but no production code reads it.
  batchMs: 100

  # -- Time without signals before a vehicle is considered stale.
  staleTimeout: "15m"

  # -- Polling interval for vehicles that stop streaming.
  # Set to "0" to disable fallback polling entirely.
  fallbackPollInterval: "5m"

  # -- How often to flush accumulated signals to snapshot tables per vehicle.
  snapshotWriteInterval: "1s"

  # -- How often to run stale-session cleanup.
  cleanupInterval: "2m"

  # -- Close drive/charge sessions idle longer than this.
  staleSessionTimeout: "5m"

  # -- Live signal store mode. "hybrid" keeps local L1 and Redis-backed
  # distributed live reads; "local" disables Redis-backed live reads/writes for rollback.
  liveSignalStoreMode: "hybrid"

  # -- Traefik IngressRouteTCP for TLS passthrough.
  # Required because vehicles connect with mTLS (client certificates).
  # Traefik must forward raw TCP — it must NOT terminate TLS.
  ingressRouteTCP:
    enabled: false
    annotations: {}
    entryPoints:
      - websecure
    host: ""  # e.g., telemetry.example.com

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

  # -- Prometheus metrics for fleet-telemetry server health.
  metrics:
    serviceMonitor:
      # -- Create a ServiceMonitor for fleet-telemetry Prometheus metrics (port 9090).
      enabled: true
      interval: "30s"

  # External Fleet Telemetry— used when fleetTelemetry.enabled is false
  # but you want TeslaSync's MQTT subscriber to connect to a Fleet Telemetry
  # server deployed separately (e.g., Tesla's own Helm chart or bare-metal).
  # TeslaSync still subscribes to MQTT topics regardless — just set the
  # mqtt.external values and fleetTelemetry.topicBase accordingly.
  external:
    host: ""
    port: 4443

# ─────────────────────────────────────────────────────────────────────────────
# Service Account
# ─────────────────────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

# ─────────────────────────────────────────────────────────────────────────────
# Ingress (standard Kubernetes)
# ─────────────────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: teslasync.local
      paths:
        - path: /
          pathType: Prefix
          service: web
  tls: []

# ─────────────────────────────────────────────────────────────────────────────
# Traefik IngressRoute (alternative to standard Ingress)
# All traffic routes to Nginx, which proxies /api/ and /.well-known/ to the
# backend internally over the Kubernetes network. This keeps API traffic
# off the ingress and on the internal cluster network.
# ─────────────────────────────────────────────────────────────────────────────
ingressRoute:
  enabled: false
  namespace: ""
  annotations: {}
  entryPoints:
    - websecure
  # SSE bypass route — auto-added before catch-all when a ForwardAuth provider is used.
  # Bypasses ForwardAuth for /api/v1/events so the Go backend validates JWT directly.
  sseBypass:
    match: Host(`teslasync.example.com`) && PathPrefix(`/api/v1/events`)
    middlewares:
      - name: default-headers
        namespace: traefik
    services:
      - name: ""   # leave empty → set to <release>-web
        port: 80
  routes:
    # Single route — Nginx handles static files + proxies API internally
    - match: Host(`teslasync.example.com`)
      kind: Rule
      middlewares: []
      services:
        - name: ""   # leave empty → set to <release>-web at deploy time
          port: 80
  tls:
    enabled: false
    secretName: teslasync-tls
    certResolver: ""
    domains: []
    # - main: teslasync.example.com

# ─────────────────────────────────────────────────────────────────────────────
# TeslaSync application configuration
# ─────────────────────────────────────────────────────────────────────────────
config:
  logLevel: info
  pollInterval: "30s"
  # -- Multiplier for polling interval when vehicle is sleeping
  sleepPollMultiplier: 4

  # -- Internal API endpoint used by Nginx reverse proxy to reach the backend.
  # This is a cluster-internal address — NOT reachable by browsers.
  # Only Nginx's proxy_pass uses this value.
  #
  # Examples:
  #   In-cluster: http://teslasync-api.teslasync.svc.cluster.local:8080
  #   Same namespace (default): auto-derived from release name
  #   Local dev: http://localhost:8080
  apiEndpoint: ""

  # -- Browser API base URL injected into the frontend at runtime.
  # Leave empty (recommended) so the browser uses relative paths (/api/v1/...)
  # which Nginx proxies to the backend. Only set this if the browser needs
  # to reach the API at a different origin (e.g., for CORS or split deploys).
  #
  # ⚠️  NEVER set this to an internal K8s address (svc.cluster.local) — the
  #     browser cannot resolve Kubernetes DNS names.
  #
  # Examples:
  #   Empty (default): "" — uses relative paths (recommended for K8s + Nginx)
  #   Public URL: "https://teslasync.example.com" — direct browser-to-API
  browserApiBase: ""

  # -- Public-facing base URL for the web frontend.
  # Used for CORS allowed origins. Leave empty to allow all origins.
  #
  # Examples:
  #   Public:   https://teslasync.cyphers.app
  #   Internal: http://teslasync-web.teslasync.svc.cluster.local
  webEndpoint: ""

  # OpenTelemetry distributed tracing (optional)
  # Supports any OTLP-compatible backend: Jaeger, Tempo, Datadog, New Relic, etc.
  openTelemetry:
    enabled: false
    # The default resolves to the release-scoped bundled collector or Jaeger
    # service when either backend is enabled. For an external collector, set
    # its endpoint explicitly, e.g. "jaeger.monitoring:4317".
    endpoint: "jaeger:4317"
    serviceName: "teslasync"
    insecure: true

  # ── Dead-letter queue inspector (Phase-44 / observability-batch / F4) ─
  # Subscribes to {fleetTelemetry.topicBase}/dlq/# and keeps the last
  # ringCapacity entries in memory for the admin /system/dlq* feed.
  # replayEnabled gates POST /system/dlq/{id}/replay — replay is also
  # sudo-token-gated AND writes a dlq_replay_audit row on every code
  # path (success / failure / disabled / unparseable / missing) so a
  # post-incident "who replayed what when" question has a single
  # authoritative answer. Default off because re-publishing a poison
  # payload is consequential.
  dlq:
    # -- Enable POST /system/dlq/{id}/replay (env: DLQ_REPLAY_ENABLED).
    replayEnabled: false
    # -- In-memory ring buffer capacity (env: DLQ_RING_CAPACITY). ~4KB per entry.
    ringCapacity: 200

  # ── Google Maps (optional) ──────────────────────────────────────────────
  # Enables enhanced geocoding, Places autocomplete, satellite/terrain tiles.
  # Free tier: 10,000 geocoding + 100,000 map tiles/month (covers 1-10 vehicles).
  # Get a key at https://console.cloud.google.com/google/maps-apis
  # When empty, TeslaSync uses CARTO tiles + Nominatim geocoding (free, no key).
  # Requires a valid API key to enable Google Maps features.
  googleMaps:
    apiKey: ""

  # ── Azure Maps (optional) ──────────────────────────────────────────────
  # Alternative to Google Maps. Free tier: 250,000 transactions/month.
  # Get a key at https://portal.azure.com → Create Azure Maps Account
  # Priority: Google Maps → Azure Maps → Nominatim (free).
  azureMaps:
    apiKey: ""

  # ── Inbound API call logs (Phase 38-10) ──────────────────────────────
  # Persists every inbound /api/v1 request to api_call_logs.
  # Body capture defaults to OFF; enable only during diagnostic windows.
  # Misconfigured writers can be disabled via inboundEnabled=false at runtime.
  # Maps to env vars: API_LOGS_INBOUND_ENABLED, API_LOG_CAPTURE_BODIES,
  # API_LOG_QUEUE_CAPACITY, API_LOG_BATCH_SIZE, API_LOG_FLUSH_INTERVAL.
  apiLogs:
    # -- Enable persisting inbound HTTP requests (env: API_LOGS_INBOUND_ENABLED).
    inboundEnabled: true
    # -- Capture request/response bodies, 10 KB cap (env: API_LOG_CAPTURE_BODIES).
    captureBodies: false
    # -- Buffered channel size for the async writer (env: API_LOG_QUEUE_CAPACITY).
    queueCapacity: 4096
    # -- Max batch size before flushing via pgx.CopyFrom (env: API_LOG_BATCH_SIZE).
    batchSize: 100
    # -- Max age of a buffered entry before flushing (env: API_LOG_FLUSH_INTERVAL).
    flushInterval: "1s"

  # ── Forward Auth ─────────────────────────────────────────────────────
  # Header set by your ForwardAuth provider. Examples:
  #   Authentik:     X-Authentik-Username
  #   Authelia:      Remote-User
  #   oauth2-proxy:  X-Auth-Request-User
  #   Keycloak:      X-Forwarded-User
  #   Empty:         disables auth (dev mode)
  forwardAuthHeader: ""

  # ── Auth-mode contract — Phase 46 / Prompt 57 ────────────────────────
  # Free-text hint surfaced verbatim by /system/auth-mode and rendered
  # by the SPA's RequiresAuth empty state. Set to your upstream IdP's
  # name (Authentik, Authelia, oauth2-proxy, Keycloak, …) for nicer
  # copy. TeslaSync NEVER speaks to the IdP's admin API and NEVER
  # routes off this value — it is presentation-only. Empty: SPA falls
  # back to a generic "your authentication provider" string.
  authProviderHint: ""

  # ── Cookie / GDPR consent banner — Phase 46 / Prompt 70 ─────────────
  # Most TeslaSync deployments are single-user self-hosted instances
  # where no consent is required. Flip this to `true` on multi-user
  # fleet deployments or any public-facing instance with optional
  # client-side reporting enabled (web vitals, error reporter) so the
  # SPA shows a non-blocking bottom banner on the first visit and
  # gates optional POSTs on the user's stored consent. Default
  # `false` — set explicitly to opt in.
  requireCookieConsent: false

  # ── Authentik SSE Auth (DEPRECATED) ──────────────────────────────────
  # DEPRECATED: Removed in Phase 18 auth unification. Use forwardAuthHeader instead.
  # authentikURL: ""
  # authentikHMACKey: ""

# ─────────────────────────────────────────────────────────────────────────────
# Gas Price Auto-Poll (EIA API)
#
# Automatically fetches the US average regular gasoline price from the
# U.S. Energy Information Administration (EIA) API. Used for EV vs ICE
# cost comparison in the dashboard.
#
# Requires a free EIA API key: https://www.eia.gov/opendata/register.php
# ─────────────────────────────────────────────────────────────────────────────
gasPrice:
  # -- Enable automatic gas price polling on startup.
  enabled: false
  # -- Poll interval: "daily", "7d", "15d", "30d"
  pollInterval: "7d"
  # -- EIA API key (required for gas price polling).
  apiKey: ""

# ─────────────────────────────────────────────────────────────────────────────
# Authentication (optional — leave jwtSecret empty to disable)
# ─────────────────────────────────────────────────────────────────────────────
auth:
  jwtSecret: ""

# ─────────────────────────────────────────────────────────────────────────────
# Web Push (VAPID) — Phase 40 / Prompt 52
#
# Generate a one-time keypair (offline) with:
#   go run ./cmd/teslasync vapid-keygen
# and copy PUBLIC into webPush.publicKey, PRIVATE into webPush.privateKey,
# and a contact URL or mailto: into webPush.subject.
#
# When all three are unset (the default), the API logs a single Warn at
# startup, hides the "Enable on this device" affordance in the frontend,
# and skips the webpush channel during alert fan-out.
#
# Rotating these keys invalidates EVERY existing browser subscription —
# never auto-generate them; pin them once and back them up with the rest
# of the deployment's secrets.
webPush:
  # -- VAPID public key (base64url, ~88 chars). Non-secret — exposed via
  # GET /api/v1/push/public-key for browsers to call PushManager.subscribe().
  publicKey: ""
  # -- VAPID private key (base64url, ~44 chars). SECRET — kept in the
  # Helm-rendered Secret, never in ConfigMap or the frontend bundle.
  privateKey: ""
  # -- VAPID `sub` field. Operator contact the push service can use.
  # Must be a `mailto:` URL or an https:// URL.
  subject: ""

# ─────────────────────────────────────────────────────────────────────────────
# Service mode banner override (Phase 46 / Prompt 04)
#
# When `system.mode` is set to "ok", "degraded", or "maintenance" the env
# value overrides the persisted system_state DB row so an operator can
# force-set or force-clear the top-of-app banner during deploys/rollbacks
# without touching the database. Leave empty (the default) to defer to the
# DB row + the admin UI / POST /api/v1/admin/maintenance API.
#
# `mode === "ok"` while the env override is active explicitly clears the
# banner regardless of the DB state — useful for "abort the maintenance
# window" rollback scenarios.
# ─────────────────────────────────────────────────────────────────────────────
system:
  # -- Service mode override. One of "" (use DB), "ok", "degraded",
  # "maintenance". Other values are ignored and fall through to the DB.
  mode: ""
  # -- Banner message shown to users when mode is "degraded" or
  # "maintenance". Trimmed and capped at 280 chars. Ignored when mode is
  # "ok" or empty.
  maintenanceMessage: ""
  # -- RFC3339 timestamp used by the SPA to render a countdown to the
  # window's end. Empty means "no scheduled end". Ignored when mode is
  # "ok" or empty.
  maintenanceUntil: ""

# ─────────────────────────────────────────────────────────────────────────────
# GitHub Issues bridge for the in-app feedback widget (Phase 46 / Prompt 08)
#
# When BOTH `github.repo` ("owner/name") and `github.token` (a GitHub
# fine-grained PAT with the "Issues: write" permission on `repo`) are
# set, the admin feedback queue exposes a "Forward to GitHub" action
# that mirrors a user's report into a real GitHub issue and stores the
# resulting URL back on the feedback row. Leave either empty to
# disable — the SPA hides the action when the server reports the
# bridge as unconfigured.
#
# `repo` is rendered to the (non-secret) ConfigMap; `token` is rendered
# to the Secret only when set, never to the ConfigMap and never to the
# frontend bundle.
# ─────────────────────────────────────────────────────────────────────────────
github:
  # -- Target GitHub repository in "owner/name" form
  # (e.g. "ev-dev-labs/teslasync"). Empty disables the bridge.
  repo: ""
  # -- Fine-grained GitHub PAT with "Issues: write" on `repo`. SECRET
  # — kept in the Helm-rendered Secret. Empty disables the bridge.
  token: ""

# ─────────────────────────────────────────────────────────────────────────────
# Vehicle hero photos — Phase 46 / Prompt 54
# ─────────────────────────────────────────────────────────────────────────────
# User-uploaded vehicle hero photos are written under `dir` at
# runtime (3 sizes per upload: 256/1024/2048 px JPEG). For
# persistence across pod restarts, mount a PV at this path on the
# API deployment. The chart does NOT mount one by default so
# existing installs are not surprised — operators must add their
# own volume + volumeMount alongside `dir`.
vehiclePhotos:
  dir: "/var/lib/teslasync/photos"

# ─────────────────────────────────────────────────────────────────────────────
# Tesla API credentials
# ─────────────────────────────────────────────────────────────────────────────
tesla:
  clientId: ""
  clientSecret: ""
  # -- Tesla OAuth callback URL (must be public-facing — Tesla calls this)
  redirectUri: "http://localhost:8080/api/v1/auth/callback"
  # Tesla Fleet API base URL — set to your region:
  #   NA: https://fleet-api.prd.na.vn.cloud.tesla.com
  #   EU: https://fleet-api.prd.eu.vn.cloud.tesla.com
  #   CN: https://fleet-api.prd.cn.vn.cloud.tesla.com
  apiBaseUrl: "https://fleet-api.prd.na.vn.cloud.tesla.com"
  # -- Tesla OAuth authorization URL (rarely needs changing)
  authUrl: "https://auth.tesla.com"
  # -- Timeout for Tesla API requests
  timeout: "30s"

# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL
#
# Set enabled: true  → an embedded PostgreSQL 17 pod is deployed.
# Set enabled: false → supply connection details via postgresql.external.
# ─────────────────────────────────────────────────────────────────────────────
postgresql:
  enabled: true

  # -- Connection pool tuning
  maxConns: 25
  minConns: 5

  # -- DSN connection timeout in seconds (prevents hanging on network issues)
  connectTimeout: 5
  # -- Per-statement timeout in milliseconds (kills long-running queries)
  statementTimeout: 30000
  # -- Pool health check interval (detects stale connections)
  healthCheckPeriod: "5s"

  # ⚠️  TimescaleDB-HA migration (ADR-007):
  #   The embedded Postgres image is timescale/timescaledb-ha:pg17, which
  #   bundles TimescaleDB + pgvector + pg_stat_statements. PGDATA is mounted
  #   at /home/postgres/pgdata/data (the image default for the HA variant).
  #   Upgrading from postgres:17-alpine requires deleting the PVC — existing
  #   data will not be preserved (staging losses accepted per ADR-009).
  image:
    repository: timescale/timescaledb-ha
    tag: pg17
    pullPolicy: IfNotPresent

  auth:
    username: teslasync
    password: teslasync
    database: teslasync

  service:
    type: ClusterIP
    port: 5432

  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    # -- PGDATA path inside the container (timescaledb-ha default)
    pgdataPath: /home/postgres/pgdata/data
    # -- Mount path for the PGDATA volume (parent of pgdataPath)
    mountPath: /home/postgres/pgdata

  # Init scripts mounted at /docker-entrypoint-initdb.d/ — run once on empty PGDATA.
  initScripts:
    enabled: true
    extensions:
      - timescaledb
      - vector
      - pg_stat_statements

  # -- Postgres `-c key=value` runtime overrides. Emitted as `args:` on
  # the deployment so the image entrypoint stays intact.
  # `shared_preload_libraries` MUST include `pg_stat_statements` for the
  # Slow Queries admin observability page to surface any data; the
  # timescaledb-ha image default is `timescaledb,pg_textsearch` which
  # we extend here. Kept in sync with docker-compose.yml postgres
  # `command:` block — both surfaces must enable the same extensions
  # so dev + prod observability features behave identically.
  serverConfig:
    max_connections: 100
    shared_buffers: 256MB
    shared_preload_libraries: timescaledb,pg_stat_statements,pg_textsearch
    pg_stat_statements.track: all

  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

  # External PostgreSQL — used when postgresql.enabled is false.
  external:
    host: ""
    port: 5432
    username: ""
    password: ""
    database: ""
    sslMode: "disable"

# ─────────────────────────────────────────────────────────────────────────────
# Redis
#
# Set enabled: true  → an embedded Redis pod is deployed.
# Set enabled: false → supply connection details via redis.external.
# ─────────────────────────────────────────────────────────────────────────────
redis:
  enabled: true
  # -- Redis database number
  db: 0

  image: redis:7-alpine

  command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]

  service:
    type: ClusterIP
    port: 6379

  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  resources:
    limits:
      cpu: 200m
      memory: 192Mi
    requests:
      cpu: 50m
      memory: 32Mi

  # External Redis — used when redis.enabled is false.
  external:
    host: ""
    port: 6379
    password: ""

# ─────────────────────────────────────────────────────────────────────────────
# MQTT (Mosquitto)
#
# Set enabled: true  → an embedded Mosquitto pod is deployed.
# Set enabled: false → supply connection details via mqtt.external.
# ─────────────────────────────────────────────────────────────────────────────
mqtt:
  enabled: true
  # -- MQTT client ID
  clientId: "teslasync"
  # -- MQTT topic prefix
  prefix: "teslasync"
  # -- MQTT auth (leave empty for no auth)
  username: ""
  password: ""

  image: eclipse-mosquitto:2

  service:
    type: ClusterIP
    port: 1883
    websocketPort: 9001

  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 25m
      memory: 16Mi

  # External MQTT — used when mqtt.enabled is false.
  external:
    host: ""
    port: 1883

  # ─── Phase-42 / ADR-004 #8 ───────────────────────────────────────────────
  # Surfaced as TESLA_MQTT_MAX_REDELIVERIES in the configmap. Read by
  # cmd/teslasync once the PipelineSubscriber is wired in (see
  # internal/mqtt.PipelineSubscriberConfig). Default 5 matches the
  # in-code default in `withDefaults()`.
  maxRedeliveries: 5

# ─────────────────────────────────────────────────────────────────────────────
# Phase-42 operator surface
#
# These knobs power the resubscribe + unit-drift workflows introduced in
# Phase-42 (ADR-004 #5 + #9). Both cmd/resubscribe and cmd/unit-drift-validator
# refuse to run without `operator.token` — leave it empty to keep them disabled.
# ─────────────────────────────────────────────────────────────────────────────
operator:
  # -- Operator token used by cmd/resubscribe and cmd/unit-drift-validator.
  # Rendered into the Secret as TESLASYNC_OPERATOR_TOKEN when non-empty.
  # Generate with `openssl rand -hex 32` and store in your secret manager.
  token: ""

# ─────────────────────────────────────────────────────────────────────────────
# Unit-drift validator (Phase-42 / ADR-004 #9)
#
# Nightly CronJob that runs cmd/unit-drift-validator against the live database.
# Detects silent unit corruption — e.g., a US car whose Setting*Unit signals
# stopped seeding `vehicle_unit_history` and is now emitting miles into a
# field the pipeline assumes is metric. The job is read-only and emits two
# Prometheus counters (tesla_unit_drift_suspected_total +
# tesla_unit_history_canary_total). See docs/observability/phase-42-metrics.md.
#
# Disabled by default so existing installs are not surprised by a new
# scheduled job. Enable on production deploys after seeding `operator.token`.
# ─────────────────────────────────────────────────────────────────────────────
unitDriftValidator:
  enabled: false
  # Cron schedule. Default 02:30 UTC daily — outside the typical nightly
  # backup window but well after the midnight settlement boundary.
  schedule: "30 2 * * *"
  # Drop the job if it cannot start within this window (concurrent runs are
  # already prevented by concurrencyPolicy: Forbid below).
  startingDeadlineSeconds: 600
  # successfulJobsHistoryLimit / failedJobsHistoryLimit: keep enough Job
  # records to investigate a regression without polluting the namespace.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Pass extra CLI flags to the validator binary (see cmd/unit-drift-validator).
  # Common: --window=24h --max-vehicles=100 --dry-run
  extraArgs: []
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ─────────────────────────────────────────────────────────────────────────────
# Data Retention
#
# Controls how long historical data is kept before automatic cleanup.
# ─────────────────────────────────────────────────────────────────────────────
retention:
  # Days to keep general data (drives, charges, positions, etc.)
  # Uncomment to enable automatic cleanup:
  # dataDays: 365
  # Days to keep high-frequency position data
  # positionDays: 90
  # Days to keep per-signal telemetry history (Postgres signal_history table)
  # signalHistoryDays: 7
  # Days to keep audit_logs entries (Phase-40 / Prompt 49). Hard delete after.
  # Set to 0 to disable cleanup. Default in the API server is 365.
  auditDays: 365
  # Days to keep audit_logs.ip and audit_logs.user_agent populated. After this
  # window the maintenance worker NULLs both columns so the per-user activity
  # feed keeps working without holding onto network PII indefinitely.
  # Set to 0 to never redact. Default in the API server is 30.
  auditIpDays: 30

# ─────────────────────────────────────────────────────────────────────────────
# MongoDB (raw telemetry signal capture)
#
# Stores raw fleet telemetry signals exactly as received from Tesla for
# debugging and testing. Uses a TTL index for automatic cleanup.
#
# Set enabled: true  → an embedded MongoDB pod is deployed.
# Set enabled: false → supply connection details via mongodb.external.
# ─────────────────────────────────────────────────────────────────────────────
mongodb:
  enabled: false

  image: mongo:7

  database: "teslasync"
  ttlDays: 7

  service:
    type: ClusterIP
    port: 27017

  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # External MongoDB — used when mongodb.enabled is false.
  external:
    # Full connection URI (supports auth, replica sets, options).
    # Example: mongodb://user:pass@mongo.svc:27017/teslasync
    uri: ""

# ─────────────────────────────────────────────────────────────────────────────
# Grafana
#
# Set enabled: true  → an embedded Grafana pod is deployed.
# Set enabled: false → supply connection details via grafana.external.
# ─────────────────────────────────────────────────────────────────────────────
grafana:
  enabled: true

  image: grafana/grafana:10.4.0

  adminUser: admin
  adminPassword: teslasync

  # This chart does not bundle Prometheus. Point the provisioned datasource
  # at the Prometheus service already present in the cluster.
  prometheusUrl: "http://prometheus-operated.monitoring.svc.cluster.local:9090"

  service:
    type: ClusterIP
    port: 3000

  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

  # External Grafana — used when grafana.enabled is false.
  external:
    host: ""
    port: 3000

# ─────────────────────────────────────────────────────────────────────────────
# Jaeger (optional, for distributed tracing)
#
# Deploys Jaeger all-in-one for collecting OpenTelemetry traces.
# Enable alongside config.openTelemetry.enabled to get end-to-end tracing.
#
# If you already have Jaeger/Tempo/OTLP collector running externally,
# skip this section and just set config.openTelemetry.endpoint to your
# existing collector address (e.g. "jaeger.monitoring.svc:4317").
# ─────────────────────────────────────────────────────────────────────────────
jaeger:
  enabled: false
  image: jaegertracing/all-in-one:1.57
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# ─────────────────────────────────────────────────────────────────────────────
# Observability stack (phase-44)
#
# Adds an OpenTelemetry collector that receives OTLP from app pods,
# applies tail-sampling per docs/runbooks/phase-44-trace-sampling.md,
# and forwards to Tempo (deployed in 0051). Disabled by default so the
# chart is install-clean on a stock cluster.
# ─────────────────────────────────────────────────────────────────────────────
observability:
  otelCollector:
    enabled: false
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: 0.116.1
      pullPolicy: IfNotPresent
    replicaCount: 1
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

  # Self-hosted Tempo backend for trace storage. The OTel collector
  # forwards sampled traces here over OTLP. Single-binary mode + local
  # filesystem storage; PV-backed for durability across pod restarts.
  tempo:
    enabled: false
    image:
      repository: grafana/tempo
      tag: 2.7.0
      pullPolicy: IfNotPresent
    # Block retention window. Tempo's compactor enforces this.
    retention: "168h"
    persistence:
      enabled: true
      # When true, use the StatefulSet volumeClaimTemplate (recommended for
      # production) rather than a separate PVC. False uses a manual PVC,
      # which is easier to clean up on a single-node dev cluster.
      useStatefulSetVolumeClaimTemplate: false
      accessMode: ReadWriteOnce
      size: 10Gi
      storageClass: ""
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
    # ───────────────────────────────────────────────────────────────────
    # Tempo metrics_generator — emits RED metrics + service-graph metrics
    # derived from sampled spans. Without this enabled, Tempo only stores
    # raw traces; the new infra dashboards (Service RED, Service Graph)
    # will show "No data" because they query traces_spanmetrics_* and
    # traces_service_graph_* series that nothing is producing.
    #
    # The series are written to a Prometheus that supports the remote-
    # write receiver. For kube-prometheus-stack you must enable
    # `prometheus.prometheusSpec.enableRemoteWriteReceiver: true` on the
    # Prometheus CR (it's off by default).
    # ───────────────────────────────────────────────────────────────────
    metricsGenerator:
      # Per-tenant `processors` opt-in. Empty list disables generation
      # for that tenant; Tempo will still START but won't emit any
      # series. Defaults to both processors enabled.
      processors:
        - service-graphs
        - span-metrics
      serviceGraphs:
        # Extra labels copied from span attributes onto every generated
        # service-graph series. Keep small — each value combination is a
        # distinct time series. Empty list = client/server/connection_type
        # only.
        dimensions: []
      spanMetrics:
        # Extra labels copied onto traces_spanmetrics_* series in
        # addition to the always-emitted service / span_name / span_kind
        # / status_code. These let dashboards split RED metrics by HTTP
        # method, route, DB system, etc. Keep cardinality reasonable.
        dimensions:
          - http.request.method
          - http.route
          - http.response.status_code
          - db.system
          - messaging.system
          - messaging.destination.name
        # Latency histogram bucket edges in seconds. Tempo's defaults
        # (0.002 → 15s) are reasonable for most APIs; this list mirrors
        # the prom-default exponential ladder so existing alert rules
        # work unchanged.
        histogramBuckets:
          - 0.002
          - 0.004
          - 0.008
          - 0.016
          - 0.032
          - 0.064
          - 0.128
          - 0.25
          - 0.5
          - 1.0
          - 2.5
          - 5.0
          - 10.0
          - 15.0
      # Where to ship the generated series. Disabled by default so the
      # chart installs clean on a stock cluster; enable + set url= once
      # a Prometheus with remote-write receiver is reachable.
      remoteWrite:
        enabled: false
        url: "http://prometheus-operated.monitoring.svc.cluster.local:9090/api/v1/write"
        sendExemplars: true
        # Optional HTTP headers (e.g., Tenant-ID for Mimir/Cortex).
        headers: {}
