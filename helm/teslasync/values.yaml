# Default values for teslasync.
# Override with: helm install teslasync ./helm/teslasync -f my-values.yaml

# -- Global image settings
global:
  imageRegistry: ""
  imagePullSecrets: []

# -- Additional image pull secrets
imagePullSecrets: []

# -- Override the release name
nameOverride: ""
fullnameOverride: ""

# ─────────────────────────────────────────────────────────────────────────────
# Backend service (Go)
# ─────────────────────────────────────────────────────────────────────────────
replicaCount: 1

image:
  repository: ghcr.io/ev-dev-labs/teslasync-api
  pullPolicy: IfNotPresent
  tag: ""

# -- Backend Kubernetes service configuration
# type: ClusterIP (internal only), NodePort, or LoadBalancer (public)
service:
  type: ClusterIP
  port: 8080
  # nodePort: 30080           # Only used when type: NodePort
  # loadBalancerIP: ""        # Only used when type: LoadBalancer
  # externalTrafficPolicy: "" # Local or Cluster (LoadBalancer only)
  annotations: {}
  # annotations:
  #   service.beta.kubernetes.io/aws-load-balancer-type: nlb
  #   service.beta.kubernetes.io/azure-load-balancer-internal: "true"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# ─────────────────────────────────────────────────────────────────────────────
# Frontend service (Nginx)
# ─────────────────────────────────────────────────────────────────────────────
web:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/ev-dev-labs/teslasync-web
    pullPolicy: IfNotPresent
    tag: ""

  # -- Frontend Kubernetes service configuration
  # type: ClusterIP (internal only), NodePort, or LoadBalancer (public)
  service:
    type: ClusterIP
    port: 80
    # nodePort: 30080           # Only used when type: NodePort
    # loadBalancerIP: ""        # Only used when type: LoadBalancer
    # externalTrafficPolicy: "" # Local or Cluster (LoadBalancer only)
    annotations: {}
    # annotations:
    #   service.beta.kubernetes.io/aws-load-balancer-type: nlb

  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  nodeSelector: {}
  tolerations: []
  affinity: {}

# ─────────────────────────────────────────────────────────────────────────────
# Notification Worker
# ─────────────────────────────────────────────────────────────────────────────
notificationWorker:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/ev-dev-labs/teslasync-notification-worker
    pullPolicy: IfNotPresent
    tag: ""

  service:
    type: ClusterIP
    port: 8081

  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 32Mi

  # -- External notification worker — used when notificationWorker.enabled is false.
  external:
    host: ""
    port: 8081

# ─────────────────────────────────────────────────────────────────────────────
# Export Worker
#
# Processes data exports and database backups asynchronously via MQTT.
# Subscribes to teslasync/internal/exports for background job processing.
# ─────────────────────────────────────────────────────────────────────────────
exportWorker:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/ev-dev-labs/teslasync-export-worker
    pullPolicy: IfNotPresent
    tag: ""

  service:
    type: ClusterIP
    port: 8082

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 64Mi

  # -- External export worker — used when exportWorker.enabled is false.
  external:
    host: ""
    port: 8082

# ─────────────────────────────────────────────────────────────────────────────
# Encryption
# ─────────────────────────────────────────────────────────────────────────────
encryption:
  key: ""

# ─────────────────────────────────────────────────────────────────────────────
# Fleet Telemetry (Tesla streaming data)
#
# Set enabled: true to deploy the official Tesla Fleet Telemetry server.
# Requires TLS certificates and a Tesla Developer account with Fleet Telemetry access.
# Vehicles connect via wss:// and stream real-time data at ~1s resolution.
# See: https://developer.tesla.com/docs/fleet-api/fleet-telemetry
# ─────────────────────────────────────────────────────────────────────────────
fleetTelemetry:
  enabled: false

  # -- Public hostname where vehicles connect via wss://.
  # This is also passed to the TeslaSync API as FLEET_TELEMETRY_HOST
  # for use in the DevTools subscription UI.
  host: ""

  image: ghcr.io/teslamotors/fleet-telemetry:latest

  service:
    type: ClusterIP
    port: 4443

  tls:
    secretName: ""  # K8s TLS secret with tls.crt and tls.key

  # -- MQTT topic base used by fleet-telemetry's MQTT dispatcher.
  # Fleet-telemetry publishes to: {topicBase}/{VIN}/v/{field}
  # TeslaSync subscribes to these topics to ingest telemetry.
  topicBase: "telemetry"

  # -- Signal batching window in milliseconds.
  # Fleet-telemetry publishes each field as a separate MQTT message.
  # The subscriber batches fields per VIN within this window before processing.
  batchMs: 100

  # -- Traefik IngressRouteTCP for TLS passthrough.
  # Required because vehicles connect with mTLS (client certificates).
  # Traefik must forward raw TCP — it must NOT terminate TLS.
  ingressRouteTCP:
    enabled: false
    annotations: {}
    entryPoints:
      - websecure
    host: ""  # e.g., telemetry.example.com

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

  # External Fleet Telemetry — used when fleetTelemetry.enabled is false.
  # Set these to connect TeslaSync to a Fleet Telemetry server running
  # outside the Helm release (e.g., a separate deployment or bare-metal).
  external:
    host: ""
    port: 4443

# ─────────────────────────────────────────────────────────────────────────────
# Service Account
# ─────────────────────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

# ─────────────────────────────────────────────────────────────────────────────
# Ingress (standard Kubernetes)
# ─────────────────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: teslasync.local
      paths:
        - path: /
          pathType: Prefix
          service: web
  tls: []

# ─────────────────────────────────────────────────────────────────────────────
# Traefik IngressRoute (alternative to standard Ingress)
# All traffic routes to Nginx, which proxies /api/ and /.well-known/ to the
# backend internally over the Kubernetes network. This keeps API traffic
# off the ingress and on the internal cluster network.
# ─────────────────────────────────────────────────────────────────────────────
ingressRoute:
  enabled: false
  namespace: ""
  annotations: {}
  entryPoints:
    - websecure
  routes:
    # Single route — Nginx handles static files + proxies API internally
    - match: Host(`teslasync.example.com`)
      kind: Rule
      middlewares: []
      services:
        - name: ""   # leave empty → set to <release>-web at deploy time
          port: 80
  tls:
    enabled: false
    secretName: teslasync-tls
    certResolver: ""
    domains: []
    # - main: teslasync.example.com

# ─────────────────────────────────────────────────────────────────────────────
# TeslaSync application configuration
# ─────────────────────────────────────────────────────────────────────────────
config:
  logLevel: info
  pollInterval: "30s"

  # -- Internal API endpoint used by Nginx reverse proxy to reach the backend.
  # This is a cluster-internal address — NOT reachable by browsers.
  # Only Nginx's proxy_pass uses this value.
  #
  # Examples:
  #   In-cluster: http://teslasync-api.teslasync.svc.cluster.local:8080
  #   Same namespace (default): auto-derived from release name
  #   Local dev: http://localhost:8080
  apiEndpoint: ""

  # -- Browser API base URL injected into the frontend at runtime.
  # Leave empty (recommended) so the browser uses relative paths (/api/v1/...)
  # which Nginx proxies to the backend. Only set this if the browser needs
  # to reach the API at a different origin (e.g., for CORS or split deploys).
  #
  # ⚠️  NEVER set this to an internal K8s address (svc.cluster.local) — the
  #     browser cannot resolve Kubernetes DNS names.
  #
  # Examples:
  #   Empty (default): "" — uses relative paths (recommended for K8s + Nginx)
  #   Public URL: "https://teslasync.example.com" — direct browser-to-API
  browserApiBase: ""

  # -- Public-facing base URL for the web frontend.
  # Used for CORS allowed origins. Leave empty to allow all origins.
  #
  # Examples:
  #   Public:   https://teslasync.cyphers.app
  #   Internal: http://teslasync-web.teslasync.svc.cluster.local
  webEndpoint: ""

# ─────────────────────────────────────────────────────────────────────────────
# Tesla API credentials
# ─────────────────────────────────────────────────────────────────────────────
tesla:
  clientId: ""
  clientSecret: ""
  # -- Tesla OAuth callback URL (must be public-facing — Tesla calls this)
  redirectUri: "http://localhost:8080/api/v1/auth/callback"
  # Tesla Fleet API base URL — set to your region:
  #   NA: https://fleet-api.prd.na.vn.cloud.tesla.com
  #   EU: https://fleet-api.prd.eu.vn.cloud.tesla.com
  #   CN: https://fleet-api.prd.cn.vn.cloud.tesla.com
  apiBaseUrl: "https://fleet-api.prd.na.vn.cloud.tesla.com"

# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL
#
# Set enabled: true  → an embedded PostgreSQL 17 pod is deployed.
# Set enabled: false → supply connection details via postgresql.external.
# ─────────────────────────────────────────────────────────────────────────────
postgresql:
  enabled: true

  image: postgres:17-alpine

  auth:
    username: teslasync
    password: teslasync
    database: teslasync

  service:
    type: ClusterIP
    port: 5432

  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi

  # External PostgreSQL — used when postgresql.enabled is false.
  external:
    host: ""
    port: 5432
    username: ""
    password: ""
    database: ""
    sslMode: "disable"

# ─────────────────────────────────────────────────────────────────────────────
# Redis
#
# Set enabled: true  → an embedded Redis pod is deployed.
# Set enabled: false → supply connection details via redis.external.
# ─────────────────────────────────────────────────────────────────────────────
redis:
  enabled: true

  image: redis:7-alpine

  command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]

  service:
    type: ClusterIP
    port: 6379

  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  resources:
    limits:
      cpu: 200m
      memory: 192Mi
    requests:
      cpu: 50m
      memory: 32Mi

  # External Redis — used when redis.enabled is false.
  external:
    host: ""
    port: 6379
    password: ""

# ─────────────────────────────────────────────────────────────────────────────
# MQTT (Mosquitto)
#
# Set enabled: true  → an embedded Mosquitto pod is deployed.
# Set enabled: false → supply connection details via mqtt.external.
# ─────────────────────────────────────────────────────────────────────────────
mqtt:
  enabled: true

  image: eclipse-mosquitto:2

  service:
    type: ClusterIP
    port: 1883
    websocketPort: 9001

  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 25m
      memory: 16Mi

  # External MQTT — used when mqtt.enabled is false.
  external:
    host: ""
    port: 1883

# ─────────────────────────────────────────────────────────────────────────────
# Grafana
#
# Set enabled: true  → an embedded Grafana pod is deployed.
# Set enabled: false → supply connection details via grafana.external.
# ─────────────────────────────────────────────────────────────────────────────
grafana:
  enabled: true

  image: grafana/grafana:10.4.0

  adminUser: admin
  adminPassword: teslasync

  service:
    type: ClusterIP
    port: 3000

  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

  # External Grafana — used when grafana.enabled is false.
  external:
    host: ""
    port: 3000
