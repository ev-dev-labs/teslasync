{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "teslasync.fullname" . }}
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    # OPS-05: scoped to the STABLE set in disjoint mode. A PDB that also
    # matched canary pods would count them toward minAvailable and could
    # block eviction of the stable set during a node drain.
    matchLabels:
      {{- include "teslasync.stableSelectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
---
{{- if and .Values.web.enabled .Values.web.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "teslasync.fullname" . }}-web
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    # OPS-05: stable-scoped for the same reason as the api PDB above.
    matchLabels:
      {{- include "teslasync.stableSelectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
{{- end }}
