{{- include "teslasync.validateMigrationGate" . -}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "teslasync.fullname" . }}
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
  {{- if include "teslasync.migrationGate.hookSource" . }}
  annotations:
    # The database migration Job is a pre-install/pre-upgrade hook that
    # reads DATABASE_PASS from the target Secret. Helm applies hooks
    # BEFORE ordinary manifests, so as an ordinary manifest this
    # ExternalSecret did not exist when the migration Job was scheduled:
    # on a fresh install ESO had not been asked to fetch anything, and
    # the Job's pod sat in CreateContainerConfigError until the hook
    # timed out with no message pointing at the cause.
    #
    # Rendering it as a lower-weight hook makes ESO start reconciling
    # first. That is necessary but not sufficient — existing is not
    # reconciled — so the Job additionally waits for the target Secret's
    # keys to materialise (see job-migrate.yaml).
    #
    # `resource-policy: keep` is what makes converting an existing
    # ordinary ExternalSecret into a hook survivable: without it Helm
    # would delete the live object during the regular removal phase of
    # the very upgrade that created it, because it is in the old release
    # manifest and not the new one. `kube.Client.Update` calls
    # `info.Get()` and skips the deletion when the LIVE object carries
    # the annotation; `kube.Client.Delete` — the path hook delete
    # policies use — never consults it, so `before-hook-creation` still
    # works.
    #
    # Target-Secret continuity across the `before-hook-creation`
    # delete/recreate is guaranteed by `creationPolicy: Orphan` below,
    # which is enforced, not merely defaulted.
    #
    # Cost: `helm uninstall` no longer removes this ExternalSecret. See
    # "Uninstall" in the chart README.
    helm.sh/resource-policy: keep
    {{- include "teslasync.migrationGate.hookAnnotations" . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name | quote }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | quote }}
  target:
    name: {{ include "teslasync.secretName" . }}
    # Orphan in every mode — see teslasync.externalSecrets.creationPolicy.
    # Any owning policy stamps .metadata.ownerReferences onto the target
    # Secret at creation time, and the day this release enters hook mode
    # the `before-hook-creation` delete of this CR garbage-collects the
    # credentials through that reference. `deletionPolicy` does NOT
    # protect against it: per the ESO API reference it only governs what
    # happens when data fields are deleted FROM THE PROVIDER.
    #
    # This value governs FUTURE reconciles only. It does not remove an
    # ownerReference a previous Owner-managed reconcile already wrote —
    # see the preflight in docs/runbooks/migration-gate-lifecycle.md.
    creationPolicy: {{ include "teslasync.externalSecrets.creationPolicy" . | quote }}
    deletionPolicy: {{ .Values.externalSecrets.target.deletionPolicy | quote }}
  {{- with .Values.externalSecrets.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.externalSecrets.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
