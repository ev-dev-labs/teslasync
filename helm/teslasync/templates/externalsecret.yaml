{{- /*
ExternalSecret template (External Secrets Operator integration).

When .Values.externalSecrets.enabled is true, this template creates an
ExternalSecret CR that pulls the chart's required keys from the
configured backend (Vault, AWS Secrets Manager, GCP Secret Manager,
Doppler, 1Password, etc.) and synthesises a Kubernetes Secret with
the same name the rest of the chart references.

The chart-managed Secret in templates/secret.yaml is automatically
suppressed when externalSecrets.enabled is true — see the conditional
at the top of templates/secret.yaml — because ESO will create a Secret
with the same name and the two would collide.

This template is intentionally opt-in (disabled by default) so installs
without External Secrets Operator (the common single-node k3s case)
continue to use the chart-managed Secret unchanged.

Required cluster prerequisite:
  ESO ≥ 0.9.x installed cluster-wide
  https://external-secrets.io/
*/ -}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "teslasync.fullname" . }}
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
  {{- with .Values.externalSecrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required when externalSecrets.enabled=true" .Values.externalSecrets.secretStoreRef.name | quote }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" | quote }}
  target:
    name: {{ include "teslasync.fullname" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations:
          # Match the chart-managed Secret's keep policy so an
          # accidental `helm uninstall` doesn't wipe upstream credentials.
          helm.sh/resource-policy: keep
  {{- if .Values.externalSecrets.dataFrom }}
  dataFrom:
    {{- toYaml .Values.externalSecrets.dataFrom | nindent 4 }}
  {{- end }}
  {{- if .Values.externalSecrets.data }}
  data:
    {{- range .Values.externalSecrets.data }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .remoteRef.key | quote }}
        {{- with .remoteRef.property }}
        property: {{ . | quote }}
        {{- end }}
        {{- with .remoteRef.version }}
        version: {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
