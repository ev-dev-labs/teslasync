{{- if .Values.autoscaling.enabled }}
{{- include "teslasync.assertCanarySelectors" . }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "teslasync.fullname" . }}
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # OPS-05: an HPA reads pod metrics through its target Deployment's
  # selector. With legacy (overlapping) selectors the stable HPA would
  # average CPU across canary pods too and scale the stable set on a
  # canary regression — which is why canary requires
  # rollout.selectorMode=disjoint.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "teslasync.fullname" . }}-api
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
