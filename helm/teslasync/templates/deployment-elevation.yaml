{{- if .Values.elevation.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "teslasync.fullname" . }}-elevation
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: elevation
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "teslasync.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: elevation
  template:
    metadata:
      labels:
        {{- include "teslasync.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: elevation
    spec:
      {{- include "teslasync.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "teslasync.serviceAccountName" . }}
      containers:
        - name: elevation
          image: {{ .Values.elevation.image | quote }}
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: COG_SOURCE
              value: {{ .Values.elevation.cogSource | quote }}
            - name: CACHE_MAX_SIZE
              value: {{ .Values.elevation.cacheMaxSize | default 1024 | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /getElevation/0/0
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /getElevation/0/0
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          {{- with .Values.elevation.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
