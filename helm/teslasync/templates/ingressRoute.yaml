{{- if .Values.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "teslasync.fullname" . }}-ingressroute
  namespace: {{ .Values.ingressRoute.namespace | default .Release.Namespace }}
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
  {{- if .Values.ingressRoute.annotations }}
  annotations:
{{ toYaml .Values.ingressRoute.annotations | indent 4 }}
  {{- end }}
spec:
  entryPoints:
{{ toYaml .Values.ingressRoute.entryPoints | indent 4 }}
  routes:
  {{- /* SSE bypass route — when authentik is configured, the SSE endpoint
         skips ForwardAuth and validates JWT in the Go backend instead.
         This fixes CORS issues with EventSource cross-origin redirects.
         Must appear BEFORE the catch-all route. */ -}}
  {{- if and .Values.config.authentikURL .Values.ingressRoute.sseBypass }}
    - match: {{ .Values.ingressRoute.sseBypass.match }}
      kind: Rule
      {{- if or .Values.ingressRoute.securityHeaders.enabled .Values.ingressRoute.sseBypass.middlewares }}
      middlewares:
      {{- if .Values.ingressRoute.securityHeaders.enabled }}
        - name: {{ include "teslasync.fullname" $ }}-security-headers
          namespace: {{ $.Values.ingressRoute.namespace | default $.Release.Namespace }}
      {{- end }}
      {{- range .Values.ingressRoute.sseBypass.middlewares }}
        - name: {{ .name }}
          namespace: {{ .namespace | default $.Values.ingressRoute.namespace }}
      {{- end }}
      {{- end }}
      services:
      {{- range .Values.ingressRoute.sseBypass.services }}
        - name: {{ .name | default (printf "%s-web" (include "teslasync.fullname" $)) }}
          namespace: {{ .namespace | default $.Values.ingressRoute.namespace | default $.Release.Namespace }}
          port: {{ .port | default 80 }}
      {{- end }}
  {{- end }}
  {{- range .Values.ingressRoute.routes }}
    - match: {{ .match }}
      kind: {{ .kind | default "Rule" }}
      {{- if or $.Values.ingressRoute.securityHeaders.enabled .middlewares }}
      middlewares:
      {{- if $.Values.ingressRoute.securityHeaders.enabled }}
        - name: {{ include "teslasync.fullname" $ }}-security-headers
          namespace: {{ $.Values.ingressRoute.namespace | default $.Release.Namespace }}
      {{- end }}
      {{- range .middlewares }}
        - name: {{ .name }}
          namespace: {{ .namespace | default $.Values.ingressRoute.namespace }}
      {{- end }}
      {{- end }}
      services:
      {{- range .services }}
        - name: {{ .name | default (printf "%s-%s" (include "teslasync.fullname" $) (eq (.port | int) 80 | ternary "web" "api")) }}
          namespace: {{ .namespace | default $.Values.ingressRoute.namespace | default $.Release.Namespace }}
          port: {{ .port }}
      {{- end }}
  {{- end }}
  {{- if .Values.ingressRoute.tls.enabled }}
  tls:
    {{- if .Values.ingressRoute.tls.secretName }}
    secretName: {{ .Values.ingressRoute.tls.secretName }}
    {{- end }}
    {{- if .Values.ingressRoute.tls.certResolver }}
    certResolver: {{ .Values.ingressRoute.tls.certResolver }}
    {{- end }}
    {{- if .Values.ingressRoute.tls.domains }}
    domains:
    {{- range .Values.ingressRoute.tls.domains }}
      - main: {{ .main }}
        sans:
          {{- range .sans }}
          - {{ . }}
          {{- end }}
    {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
