{{- if .Values.grafana.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "teslasync.fullname" . }}-grafana-datasources
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "teslasync.fullname" . }}-prometheus:9090
        isDefault: true
        jsonData:
          # Trace ID exemplars are emitted as `trace_id` labels by the Go SDK
          # (see internal/metrics) and tail-sampled at the OTel collector
          # (see helm/teslasync/files/otel-collector/config.yaml). The
          # exemplar config below lets Grafana follow exemplars from a
          # latency histogram into the corresponding trace in Tempo.
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo
              urlDisplayLabel: View trace
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://{{ include "teslasync.fullname" . }}-tempo:3200
        jsonData:
          # tracesToLogsV2 lets us jump from a span to the matching log
          # window. Loki is not part of this chart yet — the panel will be
          # disabled by Grafana when the Loki datasource isn't present.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -1m
            spanEndTimeShift: 1m
          tracesToMetrics:
            datasourceUid: prometheus
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          search:
            hide: false
          lokiSearch:
            datasourceUid: loki
{{- end }}
