{{- if .Values.grafana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "teslasync.fullname" . }}-grafana
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "teslasync.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "teslasync.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      {{- include "teslasync.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "teslasync.serviceAccountName" . }}
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- toYaml .Values.grafana.podSecurityContext | nindent 8 }}
      containers:
        - name: grafana
          securityContext:
            {{- toYaml .Values.grafana.securityContext | nindent 12 }}
          image: {{ .Values.grafana.image | quote }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.grafana.adminUser | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "teslasync.secretName" . }}
                  key: GRAFANA_ADMIN_PASSWORD
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: {{ .Values.nodeRecovery.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.nodeRecovery.startupProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 5
          {{- with .Values.grafana.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboardproviders.yaml
              subPath: dashboardproviders.yaml
              readOnly: true
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards/slo
              readOnly: true
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-tmp
              mountPath: /tmp
      volumes:
        - name: grafana-datasources
          configMap:
            name: {{ include "teslasync.fullname" . }}-grafana-datasources
        - name: grafana-dashboard-provider
          configMap:
            name: {{ include "teslasync.fullname" . }}-grafana-dashboards-slo
            items:
              - key: dashboardproviders.yaml
                path: dashboardproviders.yaml
        - name: grafana-dashboards
          configMap:
            name: {{ include "teslasync.fullname" . }}-grafana-dashboards-slo
            items:
              {{- range $path, $_ := .Files.Glob "files/grafana/dashboards/*.json" }}
              - key: {{ base $path }}
                path: {{ base $path }}
              {{- end }}
        - name: grafana-data
        {{- if .Values.grafana.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "teslasync.fullname" . }}-grafana-data
        {{- else }}
          emptyDir: {}
        {{- end }}
        - name: grafana-tmp
          emptyDir: {}
{{- end }}
