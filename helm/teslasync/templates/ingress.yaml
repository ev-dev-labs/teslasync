{{- if .Values.ingress.enabled -}}
{{- $securityAnnotations := dict }}
{{- range $key, $value := .Values.ingress.annotations }}
{{- $_ := set $securityAnnotations $key $value }}
{{- end }}
{{- if .Values.ingress.tls }}
{{- $_ := set $securityAnnotations "nginx.ingress.kubernetes.io/force-ssl-redirect" "true" }}
{{- $_ := set $securityAnnotations "nginx.ingress.kubernetes.io/ssl-redirect" "true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "teslasync.fullname" . }}
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
  {{- if $securityAnnotations }}
  annotations:
    {{- toYaml $securityAnnotations | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if eq .service "backend" }}
                name: {{ include "teslasync.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
                {{- else }}
                name: {{ include "teslasync.fullname" $ }}-web
                port:
                  number: {{ $.Values.web.service.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
