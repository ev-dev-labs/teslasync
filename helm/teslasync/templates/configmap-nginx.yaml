{{- if .Values.web.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "teslasync.fullname" . }}-nginx
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  default.conf: |
    {{- $apiBackend := .Values.config.apiEndpoint | default (printf "http://%s-api:%v" (include "teslasync.fullname" .) (int .Values.service.port)) }}
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Inject API base URL into frontend at runtime
        sub_filter '</head>' '<script>window.__TESLASYNC_API_BASE__="{{ $apiBackend }}";</script></head>';
        sub_filter_once on;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass {{ $apiBackend }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /healthz {
            proxy_pass {{ $apiBackend }};
        }

        location /readyz {
            proxy_pass {{ $apiBackend }};
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
{{- end }}
