{{- if .Values.web.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "teslasync.fullname" . }}-nginx
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  default.conf: |
    {{- $apiBackend := .Values.config.apiEndpoint | default (printf "http://%s-api:%v" (include "teslasync.fullname" .) (int .Values.service.port)) }}
    {{- $browserApiBase := .Values.config.browserApiBase | default "" }}
    {{- $forwardAuthHeader := .Values.config.forwardAuthHeader | default "" }}
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Kubernetes DNS resolver — re-resolves every 10s instead of once at startup.
        # This prevents Nginx from crashing if the API service isn't registered yet.
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
        resolver_timeout 5s;

        # Inject API base URL into frontend at runtime.
        # This MUST be empty or a public URL reachable by the browser.
        # The internal K8s address is only used by Nginx's proxy_pass.
        sub_filter '</head>' '<script>window.__TESLASYNC_API_BASE__="{{ $browserApiBase }}";</script></head>';
        sub_filter_once on;

        location / {
            try_files $uri $uri/ /index.html;
            # index.html must not be cached so new JS bundle references are picked up
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        location /api/ {
            set $backend "{{ $apiBackend }}";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            {{- if $forwardAuthHeader }}
            # Forward the auth header from the reverse proxy (Authentik/Authelia/etc.)
            proxy_set_header {{ $forwardAuthHeader }} $http_{{ $forwardAuthHeader | lower | replace "-" "_" }};
            {{- end }}
            proxy_read_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
        }

        location /healthz {
            set $backend "{{ $apiBackend }}";
            proxy_pass $backend;
        }

        location /readyz {
            set $backend "{{ $apiBackend }}";
            proxy_pass $backend;
        }

        location /.well-known/ {
            set $backend "{{ $apiBackend }}";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /metrics {
            set $backend "{{ $apiBackend }}";
            proxy_pass $backend;
        }

        # Service worker must never be cached — browser needs to detect updates
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires 0;
        }

        # Hashed static assets (Vite bundles) can be cached long-term
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
{{- end }}
