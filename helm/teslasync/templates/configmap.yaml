apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "teslasync.fullname" . }}
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
data:
  DATABASE_HOST: {{ include "teslasync.postgresql.host" . | quote }}
  DATABASE_PORT: {{ include "teslasync.postgresql.port" . | quote }}
  DATABASE_USER: {{ include "teslasync.postgresql.username" . | quote }}
  DATABASE_NAME: {{ include "teslasync.postgresql.database" . | quote }}
  DATABASE_SSLMODE: {{ include "teslasync.postgresql.sslMode" . | quote }}
  DATABASE_MAX_CONNS: {{ .Values.postgresql.maxConns | default 25 | quote }}
  DATABASE_MIN_CONNS: {{ .Values.postgresql.minConns | default 5 | quote }}
  DATABASE_CONNECT_TIMEOUT: {{ .Values.postgresql.connectTimeout | default 5 | quote }}
  DATABASE_STATEMENT_TIMEOUT: {{ .Values.postgresql.statementTimeout | default 30000 | quote }}
  DATABASE_HEALTH_CHECK_PERIOD: {{ .Values.postgresql.healthCheckPeriod | default "5s" | quote }}
  MQTT_HOST: {{ include "teslasync.mqtt.host" . | quote }}
  MQTT_PORT: {{ include "teslasync.mqtt.port" . | quote }}
  MQTT_CLIENT_ID: {{ .Values.mqtt.clientId | default "teslasync" | quote }}
  MQTT_PREFIX: {{ .Values.mqtt.prefix | default "teslasync" | quote }}
  {{- if .Values.mqtt.username }}
  MQTT_USERNAME: {{ .Values.mqtt.username | quote }}
  {{- end }}
  REDIS_ENABLED: "true"
  REDIS_HOST: {{ include "teslasync.redis.host" . | quote }}
  REDIS_PORT: {{ include "teslasync.redis.port" . | quote }}
  REDIS_DB: {{ .Values.redis.db | default 0 | quote }}
  LIVE_SIGNAL_STORE_MODE: {{ .Values.fleetTelemetry.liveSignalStoreMode | default "hybrid" | quote }}
  GRAFANA_HOST: {{ include "teslasync.grafana.host" . | quote }}
  GRAFANA_PORT: {{ include "teslasync.grafana.port" . | quote }}
  {{- $apiEndpoint := .Values.config.apiEndpoint | default (printf "http://%s-api:%v" (include "teslasync.fullname" .) (int .Values.service.port)) }}
  API_ENDPOINT: {{ $apiEndpoint | quote }}
  TESLA_REDIRECT_URI: {{ .Values.tesla.redirectUri | quote }}
  TESLA_API_BASE_URL: {{ .Values.tesla.apiBaseUrl | quote }}
  TESLA_AUTH_URL: {{ .Values.tesla.authUrl | default "https://auth.tesla.com" | quote }}
  TESLA_TIMEOUT: {{ .Values.tesla.timeout | default "30s" | quote }}
  WORKER_POLL_INTERVAL: {{ .Values.config.pollInterval | quote }}
  WORKER_SLEEP_POLL_MULT: {{ .Values.config.sleepPollMultiplier | default 4 | quote }}
  TESLASYNC_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  FORWARD_AUTH_HEADER: {{ .Values.config.forwardAuthHeader | quote }}
  TESLASYNC_PORT: {{ .Values.service.port | quote }}
  HELM_CHART_VERSION: {{ .Chart.Version | quote }}
  {{- $publicOrigins := .Values.config.webEndpoint | default "" }}
  {{- if and (not $publicOrigins) .Values.ingress.enabled .Values.ingress.tls }}
  {{- $derivedOrigins := list }}
  {{- range .Values.ingress.tls }}
  {{- range .hosts }}
  {{- $derivedOrigins = append $derivedOrigins (printf "https://%s" .) }}
  {{- end }}
  {{- end }}
  {{- $publicOrigins = join "," $derivedOrigins }}
  {{- end }}
  {{- if and (not $publicOrigins) .Values.ingress.enabled .Values.ingress.tls }}
  {{- fail "config.webEndpoint is required when ingress TLS has no public host so CSRF has a trusted origin" }}
  {{- end }}
  {{- if and (not $publicOrigins) .Values.ingressRoute.enabled .Values.ingressRoute.tls.enabled }}
  {{- fail "config.webEndpoint is required when ingressRoute TLS is enabled so CSRF has a trusted public origin" }}
  {{- end }}
  {{- if $publicOrigins }}
  CORS_ORIGINS: {{ $publicOrigins | quote }}
  {{- end }}
  {{- $ftHost := include "teslasync.fleetTelemetry.host" . }}
  {{- if or .Values.fleetTelemetry.enabled $ftHost }}
  FLEET_TELEMETRY_ENABLED: "true"
  FLEET_TELEMETRY_HOST: {{ $ftHost | quote }}
  FLEET_TELEMETRY_PORT: {{ include "teslasync.fleetTelemetry.port" . | quote }}
  FLEET_TELEMETRY_TOPIC_BASE: {{ .Values.fleetTelemetry.topicBase | default "telemetry" | quote }}
  FLEET_TELEMETRY_BATCH_MS: {{ .Values.fleetTelemetry.batchMs | default 100 | quote }}
  FLEET_TELEMETRY_STALE_TIMEOUT: {{ .Values.fleetTelemetry.staleTimeout | default "15m" | quote }}
  FLEET_TELEMETRY_FALLBACK_POLL_INTERVAL: {{ .Values.fleetTelemetry.fallbackPollInterval | default "5m" | quote }}
  FLEET_TELEMETRY_SNAPSHOT_WRITE_INTERVAL: {{ .Values.fleetTelemetry.snapshotWriteInterval | default "1s" | quote }}
  FLEET_TELEMETRY_CLEANUP_INTERVAL: {{ .Values.fleetTelemetry.cleanupInterval | default "2m" | quote }}
  FLEET_TELEMETRY_STALE_SESSION_TIMEOUT: {{ .Values.fleetTelemetry.staleSessionTimeout | default "5m" | quote }}
  {{- end }}
  {{- if or .Values.mongodb.enabled .Values.mongodb.external.uri }}
  MONGODB_ENABLED: "true"
  {{- if not .Values.secrets.existingSecret }}
  {{- if .Values.mongodb.external.uri }}
  MONGODB_URI: {{ .Values.mongodb.external.uri | quote }}
  {{- else }}
  MONGODB_URI: {{ printf "mongodb://%s:%s" (include "teslasync.mongodb.host" .) (include "teslasync.mongodb.port" .) | quote }}
  {{- end }}
  {{- end }}
  MONGODB_DATABASE: {{ .Values.mongodb.database | default "teslasync" | quote }}
  MONGODB_TTL_DAYS: {{ .Values.mongodb.ttlDays | default 7 | quote }}
  {{- end }}
  # Data retention (0 or unset = no automatic cleanup)
  {{- if .Values.retention }}
  {{- if .Values.retention.dataDays }}
  DATA_RETENTION_DAYS: {{ .Values.retention.dataDays | quote }}
  {{- end }}
  {{- if .Values.retention.positionDays }}
  POSITION_RETENTION_DAYS: {{ .Values.retention.positionDays | quote }}
  {{- end }}
  {{- if .Values.retention.signalHistoryDays }}
  SIGNAL_HISTORY_RETENTION_DAYS: {{ .Values.retention.signalHistoryDays | quote }}
  {{- end }}
  {{- if hasKey .Values.retention "auditDays" }}
  AUDIT_RETENTION_DAYS: {{ .Values.retention.auditDays | quote }}
  {{- end }}
  {{- if hasKey .Values.retention "auditIpDays" }}
  AUDIT_IP_RETENTION_DAYS: {{ .Values.retention.auditIpDays | quote }}
  {{- end }}
  {{- end }}
  NOTIFICATION_WORKER_HOST: {{ include "teslasync.notificationWorker.host" . | quote }}
  NOTIFICATION_WORKER_PORT: {{ include "teslasync.notificationWorker.port" . | quote }}
  EXPORT_WORKER_HOST: {{ include "teslasync.exportWorker.host" . | quote }}
  EXPORT_WORKER_PORT: {{ include "teslasync.exportWorker.port" . | quote }}
  AUTOMATION_WORKER_HOST: {{ include "teslasync.automationWorker.host" . | quote }}
  AUTOMATION_WORKER_PORT: {{ include "teslasync.automationWorker.port" . | quote }}
  {{- $proxyURL := include "teslasync.commandProxy.url" . }}
  {{- if $proxyURL }}
  TESLA_COMMAND_PROXY_URL: {{ $proxyURL | quote }}
  {{- end }}
  {{- if .Values.gasPrice }}
  GAS_PRICE_ENABLED: {{ .Values.gasPrice.enabled | default false | quote }}
  GAS_PRICE_POLL_INTERVAL: {{ .Values.gasPrice.pollInterval | default "7d" | quote }}
  {{- end }}
  {{- if .Values.config.openTelemetry.enabled }}
  {{- $otelEndpoint := tpl .Values.config.openTelemetry.endpoint . }}
  {{- if and .Values.observability.otelCollector.enabled (eq .Values.config.openTelemetry.endpoint "jaeger:4317") }}
  {{- $otelEndpoint = printf "%s-otel-collector:4317" (include "teslasync.fullname" .) }}
  {{- else if and .Values.jaeger.enabled (eq .Values.config.openTelemetry.endpoint "jaeger:4317") }}
  {{- $otelEndpoint = printf "%s-jaeger:4317" (include "teslasync.fullname" .) }}
  {{- end }}
  OTEL_ENABLED: "true"
  OTEL_ENDPOINT: {{ $otelEndpoint | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.openTelemetry.serviceName | quote }}
  OTEL_INSECURE: {{ .Values.config.openTelemetry.insecure | quote }}
  {{- end }}
  # Phase-44 / observability-batch / Prompt F4 — DLQ Inspector.
  # Replay is opt-in because re-publishing a payload that already
  # triggered a production exception is consequential. Replay is
  # also gated by sudo-token AND audited on every code path.
  {{- if .Values.config.dlq }}
  DLQ_REPLAY_ENABLED: {{ .Values.config.dlq.replayEnabled | default false | quote }}
  DLQ_RING_CAPACITY: {{ .Values.config.dlq.ringCapacity | default 200 | quote }}
  {{- else }}
  DLQ_REPLAY_ENABLED: "false"
  DLQ_RING_CAPACITY: "200"
  {{- end }}
  {{- if not .Values.secrets.existingSecret }}
  {{- if .Values.config.googleMaps.apiKey }}
  GOOGLE_MAPS_API_KEY: {{ .Values.config.googleMaps.apiKey | quote }}
  {{- end }}
  {{- end }}
  {{- if not .Values.secrets.existingSecret }}
  {{- if .Values.config.azureMaps.apiKey }}
  AZURE_MAPS_API_KEY: {{ .Values.config.azureMaps.apiKey | quote }}
  {{- end }}
  {{- end }}
  # Inbound api_call_logs middleware (Phase 38-10).
  # Body capture defaults to OFF; enable only for diagnostic windows.
  {{- if .Values.config.apiLogs }}
  API_LOGS_INBOUND_ENABLED: {{ .Values.config.apiLogs.inboundEnabled | default true | quote }}
  API_LOG_CAPTURE_BODIES: {{ .Values.config.apiLogs.captureBodies | default false | quote }}
  API_LOG_QUEUE_CAPACITY: {{ .Values.config.apiLogs.queueCapacity | default 4096 | quote }}
  API_LOG_BATCH_SIZE: {{ .Values.config.apiLogs.batchSize | default 100 | quote }}
  API_LOG_FLUSH_INTERVAL: {{ .Values.config.apiLogs.flushInterval | default "1s" | quote }}
  {{- else }}
  API_LOGS_INBOUND_ENABLED: "true"
  API_LOG_CAPTURE_BODIES: "false"
  API_LOG_QUEUE_CAPACITY: "4096"
  API_LOG_BATCH_SIZE: "100"
  API_LOG_FLUSH_INTERVAL: "1s"
  {{- end }}
  {{- if and .Values.webPush .Values.webPush.publicKey }}
  TESLASYNC_VAPID_PUBLIC_KEY: {{ .Values.webPush.publicKey | quote }}
  {{- end }}
  # Service-mode banner override (Phase 46 / Prompt 04). Always rendered
  # so the API picks up the env knob deterministically; empty values
  # mean "fall through to the system_state DB row + admin POST API".
  TESLASYNC_SYSTEM_MODE: {{ default "" (and .Values.system .Values.system.mode) | quote }}
  TESLASYNC_SYSTEM_MAINTENANCE_MESSAGE: {{ default "" (and .Values.system .Values.system.maintenanceMessage) | quote }}
  TESLASYNC_SYSTEM_MAINTENANCE_UNTIL: {{ default "" (and .Values.system .Values.system.maintenanceUntil) | quote }}
  # Optional GitHub Issues bridge for the in-app feedback widget
  # (Phase 46 / Prompt 08). Repo is the non-secret half — the
  # corresponding TESLASYNC_GITHUB_TOKEN is rendered to the Secret
  # template only when set. Empty repo disables the bridge entirely.
  TESLASYNC_GITHUB_REPO: {{ default "" (and .Values.github .Values.github.repo) | quote }}
  # Vehicle photo upload root — Phase 46 / Prompt 54.
  # Hero photos are written under this directory at runtime (3
  # rendered sizes per upload). For persistence across pod restarts,
  # mount a PV at this path on the API deployment — the chart does
  # NOT mount one by default so existing installs aren't surprised.
  TESLASYNC_VEHICLE_PHOTO_DIR: {{ default "/var/lib/teslasync/photos" (and .Values.vehiclePhotos .Values.vehiclePhotos.dir) | quote }}
  # Auth-mode contract — Phase 46 / Prompt 57.
  # Free-text hint surfaced verbatim by /system/auth-mode and
  # rendered by the SPA's RequiresAuth empty state. Set to your
  # upstream IdP's name (Authentik, Authelia, oauth2-proxy,
  # Keycloak, …) for nicer copy. TeslaSync NEVER speaks to the
  # IdP's admin API and NEVER routes off this value — it is
  # presentation-only. Empty by default: SPA falls back to a
  # generic "your authentication provider" string.
  TESLASYNC_AUTH_PROVIDER_HINT: {{ default "" (and .Values.config .Values.config.authProviderHint) | quote }}
  # Cookie / GDPR consent banner — Phase 46 / Prompt 70.
  # Default "false": single-user self-hosted installs do not
  # require a banner. Flip to "true" on multi-user fleet or
  # public-facing deployments to comply with ePrivacy / GDPR.
  # When true, the SPA renders a non-blocking bottom banner on
  # first visit and gates optional client-side reporting (web
  # vitals, error reporter) on the user's stored consent.
  TESLASYNC_REQUIRE_COOKIE_CONSENT: {{ default false (and .Values.config .Values.config.requireCookieConsent) | quote }}
