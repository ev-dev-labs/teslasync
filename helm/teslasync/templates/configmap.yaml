apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "teslasync.fullname" . }}
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
data:
  DATABASE_HOST: {{ include "teslasync.postgresql.host" . | quote }}
  DATABASE_PORT: {{ include "teslasync.postgresql.port" . | quote }}
  DATABASE_USER: {{ include "teslasync.postgresql.username" . | quote }}
  DATABASE_NAME: {{ include "teslasync.postgresql.database" . | quote }}
  DATABASE_SSLMODE: {{ include "teslasync.postgresql.sslMode" . | quote }}
  MQTT_HOST: {{ include "teslasync.mqtt.host" . | quote }}
  MQTT_PORT: {{ include "teslasync.mqtt.port" . | quote }}
  REDIS_ENABLED: "true"
  REDIS_HOST: {{ include "teslasync.redis.host" . | quote }}
  REDIS_PORT: {{ include "teslasync.redis.port" . | quote }}
  GRAFANA_HOST: {{ include "teslasync.grafana.host" . | quote }}
  GRAFANA_PORT: {{ include "teslasync.grafana.port" . | quote }}
  {{- $apiEndpoint := .Values.config.apiEndpoint | default (printf "http://%s-api:%v" (include "teslasync.fullname" .) (int .Values.service.port)) }}
  API_ENDPOINT: {{ $apiEndpoint | quote }}
  TESLA_REDIRECT_URI: {{ .Values.tesla.redirectUri | quote }}
  TESLA_API_BASE_URL: {{ .Values.tesla.apiBaseUrl | quote }}
  WORKER_POLL_INTERVAL: {{ .Values.config.pollInterval | quote }}
  TESLASYNC_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  TESLASYNC_PORT: {{ .Values.service.port | quote }}
  HELM_CHART_VERSION: {{ .Chart.Version | quote }}
  {{- if .Values.config.webEndpoint }}
  CORS_ORIGINS: {{ .Values.config.webEndpoint | quote }}
  {{- end }}
  {{- $ftHost := include "teslasync.fleetTelemetry.host" . }}
  {{- if or .Values.fleetTelemetry.enabled $ftHost }}
  FLEET_TELEMETRY_ENABLED: "true"
  FLEET_TELEMETRY_HOST: {{ $ftHost | quote }}
  FLEET_TELEMETRY_PORT: {{ include "teslasync.fleetTelemetry.port" . | quote }}
  FLEET_TELEMETRY_TOPIC_BASE: {{ .Values.fleetTelemetry.topicBase | default "telemetry" | quote }}
  FLEET_TELEMETRY_BATCH_MS: {{ .Values.fleetTelemetry.batchMs | default 100 | quote }}
  {{- end }}
  NOTIFICATION_WORKER_HOST: {{ include "teslasync.notificationWorker.host" . | quote }}
  NOTIFICATION_WORKER_PORT: {{ include "teslasync.notificationWorker.port" . | quote }}
  EXPORT_WORKER_HOST: {{ include "teslasync.exportWorker.host" . | quote }}
  EXPORT_WORKER_PORT: {{ include "teslasync.exportWorker.port" . | quote }}
  {{- $proxyURL := include "teslasync.commandProxy.url" . }}
  {{- if $proxyURL }}
  TESLA_COMMAND_PROXY_URL: {{ $proxyURL | quote }}
  {{- end }}
  {{- if .Values.gasPrice }}
  GAS_PRICE_ENABLED: {{ .Values.gasPrice.enabled | default false | quote }}
  GAS_PRICE_POLL_INTERVAL: {{ .Values.gasPrice.pollInterval | default "7d" | quote }}
  {{- end }}
  {{- if .Values.config.openTelemetry.enabled }}
  OTEL_ENABLED: "true"
  OTEL_ENDPOINT: {{ .Values.config.openTelemetry.endpoint | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.openTelemetry.serviceName | quote }}
  OTEL_INSECURE: {{ .Values.config.openTelemetry.insecure | quote }}
  {{- end }}
  {{- if .Values.config.googleMaps.apiKey }}
  GOOGLE_MAPS_API_KEY: {{ .Values.config.googleMaps.apiKey | quote }}
  {{- end }}
