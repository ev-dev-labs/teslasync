apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "teslasync.fullname" . }}
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
data:
  DATABASE_HOST: {{ include "teslasync.postgresql.host" . | quote }}
  DATABASE_PORT: {{ include "teslasync.postgresql.port" . | quote }}
  DATABASE_USER: {{ include "teslasync.postgresql.username" . | quote }}
  DATABASE_NAME: {{ include "teslasync.postgresql.database" . | quote }}
  DATABASE_SSLMODE: {{ include "teslasync.postgresql.sslMode" . | quote }}
  DATABASE_MAX_CONNS: {{ .Values.postgresql.maxConns | default 25 | quote }}
  DATABASE_MIN_CONNS: {{ .Values.postgresql.minConns | default 5 | quote }}
  DATABASE_CONNECT_TIMEOUT: {{ .Values.postgresql.connectTimeout | default 5 | quote }}
  DATABASE_STATEMENT_TIMEOUT: {{ .Values.postgresql.statementTimeout | default 30000 | quote }}
  DATABASE_HEALTH_CHECK_PERIOD: {{ .Values.postgresql.healthCheckPeriod | default "5s" | quote }}
  MQTT_HOST: {{ include "teslasync.mqtt.host" . | quote }}
  MQTT_PORT: {{ include "teslasync.mqtt.port" . | quote }}
  MQTT_CLIENT_ID: {{ .Values.mqtt.clientId | default "teslasync" | quote }}
  MQTT_PREFIX: {{ .Values.mqtt.prefix | default "teslasync" | quote }}
  {{- if .Values.mqtt.username }}
  MQTT_USERNAME: {{ .Values.mqtt.username | quote }}
  {{- end }}
  REDIS_ENABLED: "true"
  REDIS_HOST: {{ include "teslasync.redis.host" . | quote }}
  REDIS_PORT: {{ include "teslasync.redis.port" . | quote }}
  REDIS_DB: {{ .Values.redis.db | default 0 | quote }}
  GRAFANA_HOST: {{ include "teslasync.grafana.host" . | quote }}
  GRAFANA_PORT: {{ include "teslasync.grafana.port" . | quote }}
  {{- $apiEndpoint := .Values.config.apiEndpoint | default (printf "http://%s-api:%v" (include "teslasync.fullname" .) (int .Values.service.port)) }}
  API_ENDPOINT: {{ $apiEndpoint | quote }}
  TESLA_REDIRECT_URI: {{ .Values.tesla.redirectUri | quote }}
  TESLA_API_BASE_URL: {{ .Values.tesla.apiBaseUrl | quote }}
  TESLA_AUTH_URL: {{ .Values.tesla.authUrl | default "https://auth.tesla.com" | quote }}
  TESLA_TIMEOUT: {{ .Values.tesla.timeout | default "30s" | quote }}
  WORKER_POLL_INTERVAL: {{ .Values.config.pollInterval | quote }}
  WORKER_SLEEP_POLL_MULT: {{ .Values.config.sleepPollMultiplier | default 4 | quote }}
  TESLASYNC_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  TESLASYNC_PORT: {{ .Values.service.port | quote }}
  HELM_CHART_VERSION: {{ .Chart.Version | quote }}
  {{- if .Values.config.webEndpoint }}
  CORS_ORIGINS: {{ .Values.config.webEndpoint | quote }}
  {{- end }}
  {{- $ftHost := include "teslasync.fleetTelemetry.host" . }}
  {{- if or .Values.fleetTelemetry.enabled $ftHost }}
  FLEET_TELEMETRY_ENABLED: "true"
  FLEET_TELEMETRY_HOST: {{ $ftHost | quote }}
  FLEET_TELEMETRY_PORT: {{ include "teslasync.fleetTelemetry.port" . | quote }}
  FLEET_TELEMETRY_TOPIC_BASE: {{ .Values.fleetTelemetry.topicBase | default "telemetry" | quote }}
  FLEET_TELEMETRY_BATCH_MS: {{ .Values.fleetTelemetry.batchMs | default 100 | quote }}
  FLEET_TELEMETRY_STALE_TIMEOUT: {{ .Values.fleetTelemetry.staleTimeout | default "15m" | quote }}
  FLEET_TELEMETRY_FALLBACK_POLL_INTERVAL: {{ .Values.fleetTelemetry.fallbackPollInterval | default "5m" | quote }}
  FLEET_TELEMETRY_SNAPSHOT_WRITE_INTERVAL: {{ .Values.fleetTelemetry.snapshotWriteInterval | default "1s" | quote }}
  FLEET_TELEMETRY_CLEANUP_INTERVAL: {{ .Values.fleetTelemetry.cleanupInterval | default "2m" | quote }}
  FLEET_TELEMETRY_STALE_SESSION_TIMEOUT: {{ .Values.fleetTelemetry.staleSessionTimeout | default "5m" | quote }}
  {{- end }}
  {{- if or .Values.mongodb.enabled .Values.mongodb.external.uri }}
  MONGODB_ENABLED: "true"
  {{- if not .Values.secrets.existingSecret }}
  {{- if .Values.mongodb.external.uri }}
  MONGODB_URI: {{ .Values.mongodb.external.uri | quote }}
  {{- else }}
  MONGODB_URI: {{ printf "mongodb://%s:%s" (include "teslasync.mongodb.host" .) (include "teslasync.mongodb.port" .) | quote }}
  {{- end }}
  {{- end }}
  MONGODB_DATABASE: {{ .Values.mongodb.database | default "teslasync" | quote }}
  MONGODB_TTL_DAYS: {{ .Values.mongodb.ttlDays | default 7 | quote }}
  {{- end }}
  # Data retention (0 or unset = no automatic cleanup, retain forever)
  # TimescaleDB drop_chunks policies — applied at startup, removable by setting to 0.
  {{- if .Values.retention }}
  {{- if .Values.retention.positions }}
  RETENTION_POSITIONS_DAYS: {{ .Values.retention.positions | quote }}
  {{- end }}
  {{- if .Values.retention.chargingTelemetry }}
  RETENTION_CHARGING_TELEMETRY_DAYS: {{ .Values.retention.chargingTelemetry | quote }}
  {{- end }}
  {{- if .Values.retention.climateSnapshots }}
  RETENTION_CLIMATE_SNAPSHOTS_DAYS: {{ .Values.retention.climateSnapshots | quote }}
  {{- end }}
  {{- if .Values.retention.securityEvents }}
  RETENTION_SECURITY_EVENTS_DAYS: {{ .Values.retention.securityEvents | quote }}
  {{- end }}
  {{- if .Values.retention.motorSnapshots }}
  RETENTION_MOTOR_SNAPSHOTS_DAYS: {{ .Values.retention.motorSnapshots | quote }}
  {{- end }}
  {{- if .Values.retention.tirePressure }}
  RETENTION_TIRE_PRESSURE_DAYS: {{ .Values.retention.tirePressure | quote }}
  {{- end }}
  {{- if .Values.retention.mediaSnapshots }}
  RETENTION_MEDIA_SNAPSHOTS_DAYS: {{ .Values.retention.mediaSnapshots | quote }}
  {{- end }}
  {{- if .Values.retention.safetySnapshots }}
  RETENTION_SAFETY_SNAPSHOTS_DAYS: {{ .Values.retention.safetySnapshots | quote }}
  {{- end }}
  {{- end }}
  NOTIFICATION_WORKER_HOST: {{ include "teslasync.notificationWorker.host" . | quote }}
  NOTIFICATION_WORKER_PORT: {{ include "teslasync.notificationWorker.port" . | quote }}
  EXPORT_WORKER_HOST: {{ include "teslasync.exportWorker.host" . | quote }}
  EXPORT_WORKER_PORT: {{ include "teslasync.exportWorker.port" . | quote }}
  AUTOMATION_WORKER_HOST: {{ include "teslasync.automationWorker.host" . | quote }}
  AUTOMATION_WORKER_PORT: {{ include "teslasync.automationWorker.port" . | quote }}
  {{- $proxyURL := include "teslasync.commandProxy.url" . }}
  {{- if $proxyURL }}
  TESLA_COMMAND_PROXY_URL: {{ $proxyURL | quote }}
  {{- end }}
  {{- if .Values.gasPrice }}
  GAS_PRICE_ENABLED: {{ .Values.gasPrice.enabled | default false | quote }}
  GAS_PRICE_POLL_INTERVAL: {{ .Values.gasPrice.pollInterval | default "7d" | quote }}
  {{- end }}
  {{- if .Values.embedding }}
  EMBEDDING_ENABLED: {{ .Values.embedding.enabled | default false | quote }}
  EMBEDDING_PROVIDER: {{ .Values.embedding.provider | default "local" | quote }}
  EMBEDDING_MODEL: {{ .Values.embedding.model | default "text-embedding-3-small" | quote }}
  EMBEDDING_DIMENSIONS: {{ .Values.embedding.dimensions | default 1536 | quote }}
  EMBEDDING_BATCH_SIZE: {{ .Values.embedding.batchSize | default 50 | quote }}
  EMBEDDING_REFRESH_INTERVAL: {{ .Values.embedding.refreshInterval | default "5m" | quote }}
  {{- end }}
  {{- if .Values.config.openTelemetry.enabled }}
  OTEL_ENABLED: "true"
  OTEL_ENDPOINT: {{ .Values.config.openTelemetry.endpoint | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.openTelemetry.serviceName | quote }}
  OTEL_INSECURE: {{ .Values.config.openTelemetry.insecure | quote }}
  {{- end }}
  {{- if not .Values.secrets.existingSecret }}
  {{- if .Values.config.googleMaps.apiKey }}
  GOOGLE_MAPS_API_KEY: {{ .Values.config.googleMaps.apiKey | quote }}
  {{- end }}
  {{- end }}
  {{- if not .Values.secrets.existingSecret }}
  {{- if .Values.config.azureMaps.apiKey }}
  AZURE_MAPS_API_KEY: {{ .Values.config.azureMaps.apiKey | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.config.authentikURL }}
  AUTHENTIK_URL: {{ .Values.config.authentikURL | quote }}
  {{- end }}
  {{- if not .Values.secrets.existingSecret }}
  {{- if .Values.config.authentikHMACKey }}
  AUTHENTIK_HMAC_KEY: {{ .Values.config.authentikHMACKey | quote }}
  {{- end }}
  {{- end }}
