{{- if .Values.grafana.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "teslasync.fullname" . }}-grafana-dashboards-slo
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
    # Sidecar dashboards label so grafana/grafana sidecar (or
    # grafana-operator) auto-loads them. Override via
    # values.observability.grafanaDashboardsLabel if your sidecar uses a
    # different label.
    grafana_dashboard: "1"
data:
  dashboardproviders.yaml: |
    apiVersion: 1
    providers:
      - name: TeslaSync SLOs
        orgId: 1
        folder: TeslaSync SLOs
        type: file
        disableDeletion: true
        editable: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/slo
{{- range $path, $_ := .Files.Glob "files/grafana/dashboards/*.json" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
