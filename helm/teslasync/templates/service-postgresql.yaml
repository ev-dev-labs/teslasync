{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "teslasync.fullname" . }}-postgresql
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: {{ .Values.postgresql.service.type }}
  selector:
    {{- include "teslasync.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  ports:
    - name: postgres
      port: {{ .Values.postgresql.service.port }}
      targetPort: postgres
      protocol: TCP
    {{- if .Values.postgresql.pgbouncer.enabled }}
    - name: pgbouncer
      port: {{ .Values.postgresql.pgbouncer.port | default 6432 }}
      targetPort: pgbouncer
      protocol: TCP
    {{- end }}
    {{- if .Values.postgresql.metrics.enabled }}
    - name: metrics
      port: {{ .Values.postgresql.metrics.port | default 9187 }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
{{- end }}
