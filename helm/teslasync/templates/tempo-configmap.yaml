{{- if .Values.observability.tempo.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "teslasync.fullname" . }}-tempo
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
      grpc_listen_port: 9095
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    ingester:
      max_block_duration: 5m
      trace_idle_period: 10s
      flush_check_period: 10s
    compactor:
      compaction:
        block_retention: {{ .Values.observability.tempo.retention | default "168h" }}
    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
    metrics_generator:
      registry:
        external_labels:
          source: tempo
      storage:
        path: /var/tempo/generator/wal
{{- end }}
