{{- if .Values.notificationWorker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "teslasync.fullname" . }}-notification-worker
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification-worker
spec:
  type: {{ .Values.notificationWorker.service.type }}
  selector:
    {{- include "teslasync.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: notification-worker
  ports:
    - name: health
      port: {{ .Values.notificationWorker.service.port }}
      targetPort: health
      protocol: TCP
{{- end }}
