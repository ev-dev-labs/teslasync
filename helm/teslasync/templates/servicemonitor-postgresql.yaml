{{- if and .Values.postgresql.enabled .Values.postgresql.metrics.enabled .Values.postgresql.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "teslasync.fullname" . }}-postgresql
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  selector:
    matchLabels:
      {{- include "teslasync.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  endpoints:
    - port: metrics
      interval: {{ .Values.postgresql.metrics.serviceMonitor.interval | default "30s" }}
      path: /metrics
{{- end }}
