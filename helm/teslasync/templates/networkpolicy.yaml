{{- /* ─── observability plane: grafana / jaeger / otel-collector / tempo ─ */}}
{{- if .Values.grafana.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-grafana
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    networkpolicy.teslasync.io/type: component
    networkpolicy.teslasync.io/component: grafana
spec:
  podSelector:
    matchLabels:
      {{- include "teslasync.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.ingressNamespaceSelector }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
    {{- else }}
    - from:
        - podSelector: {}
    {{- end }}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "teslasync.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              {{- include "teslasync.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: jaeger
      ports:
        - protocol: TCP
          port: 16686
    - to:
        - podSelector:
            matchLabels:
              {{- include "teslasync.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: tempo
      ports:
        - protocol: TCP
          port: 3200
    # Grafana scrapes /metrics from teslasync services
    - to:
        - podSelector:
            matchLabels:
              {{- include "teslasync.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8080
---
{{- end }}

{{- if .Values.jaeger.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-jaeger
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    networkpolicy.teslasync.io/type: component
    networkpolicy.teslasync.io/component: jaeger
spec:
  podSelector:
    matchLabels:
      {{- include "teslasync.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: jaeger
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # OTLP receivers
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - api
                  - notification-worker
                  - export-worker
                  - automation-worker
                  - otel-collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 14250
        - protocol: TCP
          port: 14268
    # UI from grafana / ingress
    - from:
        - podSelector:
            matchLabels:
              {{- include "teslasync.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: grafana
      ports:
        - protocol: TCP
          port: 16686
    {{- if .Values.networkPolicy.ingressNamespaceSelector }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 16686
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "teslasync.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: mongodb
      ports:
        - protocol: TCP
          port: 27017
---
{{- end }}

{{- /* OTel collector and Tempo: gated by their own .Values toggles where present. */}}
