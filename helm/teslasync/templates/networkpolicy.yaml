{{- if .Values.mongodb.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-mongodb
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    networkpolicy.teslasync.io/type: component
    networkpolicy.teslasync.io/component: mongodb
spec:
  podSelector:
    matchLabels:
      {{- include "teslasync.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mongodb
  policyTypes:
