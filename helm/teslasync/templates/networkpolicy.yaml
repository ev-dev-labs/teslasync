kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-mosquitto
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    networkpolicy.teslasync.io/type: component
    networkpolicy.teslasync.io/component: mosquitto
spec:
  podSelector:
    matchLabels:
      {{- include "teslasync.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mosquitto
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
