{{- if and .Values.backup.enabled (eq .Values.backup.dest "s3") (not .Values.backup.s3.credentialsSecret) }}
{{- /*
  Chart-managed S3 credentials secret for the backup CronJob.
  Skipped when the operator points credentialsSecret at an externally-
  managed secret (ExternalSecrets / sealed-secrets / SOPS).

  Requires both backup.s3.accessKey and backup.s3.secretKey to be
  populated; we deliberately fail-loud rather than ship empty creds
  that would yield a confusing 403 from the bucket at 03:30 UTC.
*/}}
{{- if not .Values.backup.s3.accessKey -}}
{{- fail "backup.s3.accessKey is required when backup.dest=s3 and backup.s3.credentialsSecret is unset. Either set the key or pre-create the secret and pass its name in backup.s3.credentialsSecret." -}}
{{- end }}
{{- if not .Values.backup.s3.secretKey -}}
{{- fail "backup.s3.secretKey is required when backup.dest=s3 and backup.s3.credentialsSecret is unset." -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "teslasync.fullname" . }}-backup-s3
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
type: Opaque
stringData:
  access-key: {{ .Values.backup.s3.accessKey | quote }}
  secret-key: {{ .Values.backup.s3.secretKey | quote }}
{{- end }}
