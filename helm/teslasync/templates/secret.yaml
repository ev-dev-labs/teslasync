{{- if and (not .Values.secrets.existingSecret) (not .Values.externalSecrets.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "teslasync.fullname" . }}
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  TESLA_CLIENT_ID: {{ .Values.tesla.clientId | quote }}
  TESLA_CLIENT_SECRET: {{ .Values.tesla.clientSecret | quote }}
  DATABASE_PASS: {{ include "teslasync.postgresql.password" . | quote }}
  {{- if and (not .Values.redis.enabled) .Values.redis.external.password }}
  REDIS_PASSWORD: {{ .Values.redis.external.password | quote }}
  {{- end }}
  {{- if .Values.grafana.enabled }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.grafana.adminPassword | quote }}
  {{- end }}
  {{- if .Values.encryption.key }}
  ENCRYPTION_KEY: {{ .Values.encryption.key | quote }}
  {{- end }}
  {{- if and .Values.gasPrice .Values.gasPrice.apiKey }}
  GAS_PRICE_API_KEY: {{ .Values.gasPrice.apiKey | quote }}
  {{- end }}
  {{- if .Values.mqtt.password }}
  MQTT_PASSWORD: {{ .Values.mqtt.password | quote }}
  {{- end }}
  {{- if .Values.auth.jwtSecret }}
  AUTH_JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.config.googleMaps.apiKey }}
  GOOGLE_MAPS_API_KEY: {{ .Values.config.googleMaps.apiKey | quote }}
  {{- end }}
  {{- if .Values.config.azureMaps.apiKey }}
  AZURE_MAPS_API_KEY: {{ .Values.config.azureMaps.apiKey | quote }}
  {{- end }}
  {{- if and .Values.webPush .Values.webPush.privateKey }}
  TESLASYNC_VAPID_PRIVATE_KEY: {{ .Values.webPush.privateKey | quote }}
  {{- end }}
  {{- if and .Values.webPush .Values.webPush.subject }}
  TESLASYNC_VAPID_SUBJECT: {{ .Values.webPush.subject | quote }}
  {{- end }}
  {{- if and .Values.github .Values.github.token }}
  TESLASYNC_GITHUB_TOKEN: {{ .Values.github.token | quote }}
  {{- end }}
  {{- if and .Values.operator .Values.operator.token }}
  # Phase-42 (ADR-004 #5 / prompts 0090, 0091). Required by cmd/resubscribe and
  # cmd/unit-drift-validator (the CronJob below mounts this secret). Both
  # binaries refuse to run without it. Operators should rotate this token
  # whenever an admin leaves the team — it grants resubscribe + drift-audit
  # privileges across the entire fleet.
  TESLASYNC_OPERATOR_TOKEN: {{ .Values.operator.token | quote }}
  {{- end }}
{{- end }}
