{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "teslasync.fullname" . }}-postgresql
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "teslasync.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "teslasync.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      {{- include "teslasync.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "teslasync.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.postgresql.podSecurityContext | nindent 8 }}
      containers:
        - name: postgresql
          securityContext:
            {{- toYaml .Values.postgresql.securityContext | nindent 12 }}
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy | default "IfNotPresent" }}
          {{- /*
            shared_preload_libraries MUST include pg_stat_statements for
            the Slow Queries admin page (Phase-45) to surface anything.
            The timescaledb-ha:pg17 image default is
            `timescaledb,pg_textsearch` — we extend it via the values
            list and emit one -c flag per setting. Keep timescaledb +
            pg_textsearch first to preserve image defaults.
          */}}
          {{- with .Values.postgresql.serverConfig }}
          args:
            - postgres
            {{- range $key, $value := . }}
            - -c
            - {{ printf "%s=%v" $key $value | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "teslasync.secretName" . }}
                  key: DATABASE_PASS
            - name: PGDATA
              value: {{ .Values.postgresql.persistence.pgdataPath | quote }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.auth.username | quote }}
                - -d
                - {{ .Values.postgresql.auth.database | quote }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.auth.username | quote }}
                - -d
                - {{ .Values.postgresql.auth.database | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 5
          {{- with .Values.postgresql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.postgresql.persistence.enabled }}
            - name: postgresql-data
              mountPath: {{ .Values.postgresql.persistence.mountPath | quote }}
            {{- else }}
            - name: postgresql-data
              mountPath: {{ .Values.postgresql.persistence.mountPath | quote }}
            {{- end }}
            - name: postgresql-run
              mountPath: /var/run/postgresql
            - name: postgresql-tmp
              mountPath: /tmp
            {{- if .Values.postgresql.initScripts.enabled }}
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.postgresql.persistence.enabled }}
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: {{ include "teslasync.fullname" . }}-postgresql-data
        {{- else }}
        - name: postgresql-data
          emptyDir: {}
        {{- end }}
        - name: postgresql-run
          emptyDir: {}
        - name: postgresql-tmp
          emptyDir: {}
        {{- if .Values.postgresql.initScripts.enabled }}
        - name: init-scripts
          configMap:
            name: {{ include "teslasync.fullname" . }}-postgres-init
        {{- end }}
{{- end }}
