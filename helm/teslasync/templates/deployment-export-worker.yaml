{{- if .Values.exportWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "teslasync.fullname" . }}-export-worker
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: export-worker
spec:
  replicas: {{ .Values.exportWorker.replicaCount }}
  {{- if .Values.rollout.paused }}
  paused: true
  {{- end }}
  {{- if .Values.rollout.exportWorker.strategy.type }}
  # Stable MQTT client IDs require non-overlapping worker revisions.
  strategy:
    type: {{ .Values.rollout.exportWorker.strategy.type }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "teslasync.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: export-worker
  template:
    metadata:
      labels:
        {{- include "teslasync.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: export-worker
    spec:
      {{- include "teslasync.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "teslasync.serviceAccountName" . }}
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "teslasync.dependencyWaitInitContainer" (dict "root" . "name" "database" "host" (include "teslasync.postgresql.host" .) "port" (include "teslasync.postgresql.port" .)) | nindent 8 }}
        {{- include "teslasync.dependencyWaitInitContainer" (dict "root" . "name" "mqtt" "host" (include "teslasync.mqtt.host" .) "port" (include "teslasync.mqtt.port" .)) | nindent 8 }}
      containers:
        - name: export-worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "teslasync.exportWorker.image" . | quote }}
          imagePullPolicy: {{ .Values.exportWorker.image.pullPolicy }}
          ports:
            - name: health
              containerPort: 8082
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: {{ .Values.nodeRecovery.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.nodeRecovery.startupProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: HEALTH_PORT
              value: "8082"
            - name: DATABASE_MAX_CONNS
              value: {{ .Values.exportWorker.dbMaxConns | default 5 | quote }}
            - name: DATABASE_MIN_CONNS
              value: {{ .Values.exportWorker.dbMinConns | default 2 | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "teslasync.fullname" . }}
            - secretRef:
                name: {{ include "teslasync.secretName" . }}
          resources:
            {{- toYaml .Values.exportWorker.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
