{{- if .Values.observability.otelCollector.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "teslasync.fullname" . }}-otel-collector
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  type: ClusterIP
  selector:
    {{- include "teslasync.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: prometheus
      port: 9464
      targetPort: 9464
      protocol: TCP
{{- end }}
