{{- if .Values.mqtt.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "teslasync.fullname" . }}-mosquitto
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "teslasync.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mosquitto
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/mosquitto-config: {{ include (print $.Template.BasePath "/configmap-mosquitto.yaml") . | sha256sum }}
      labels:
        {{- include "teslasync.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mosquitto
    spec:
      {{- include "teslasync.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "teslasync.serviceAccountName" . }}
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- toYaml .Values.mqtt.podSecurityContext | nindent 8 }}
      containers:
        - name: mosquitto
          securityContext:
            {{- toYaml .Values.mqtt.securityContext | nindent 12 }}
          image: {{ .Values.mqtt.image | quote }}
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
            - name: websocket
              containerPort: 9001
              protocol: TCP
          # Loading a large persistent-session queue must finish before
          # liveness can recycle the broker.
          startupProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 5
            periodSeconds: {{ .Values.nodeRecovery.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.nodeRecovery.startupProbe.failureThreshold }}
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 5
          {{- with .Values.mqtt.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: mosquitto-data
              mountPath: /mosquitto/data
            - name: mosquitto-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
      volumes:
        - name: mosquitto-config
          configMap:
            name: {{ include "teslasync.fullname" . }}-mosquitto
        - name: mosquitto-data
        {{- if .Values.mqtt.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "teslasync.fullname" . }}-mosquitto-data
        {{- else }}
          emptyDir: {}
        {{- end }}
{{- end }}
