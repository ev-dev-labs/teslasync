{{- /*
PrometheusRule custom resource that wraps the recording + alerting rules
generated by `go run ./cmd/slogen generate` from slo/catalog.yaml.

The Prometheus Operator picks PrometheusRule CRs up automatically based
on `.Values.prometheusRule.labels` (typically `release: kube-prometheus`).
If the operator is not installed, set `.Values.prometheusRule.enabled`
to false (default) — the recording-rules.yaml / alerting-rules.yaml
files can still be loaded directly via `rule_files:` in a vanilla
Prometheus config.

Generated rule files live at helm/teslasync/files/prometheus/ and are
committed alongside the source SLO catalog. Regenerate with:
    go run ./cmd/slogen generate
*/ -}}
{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "teslasync.fullname" . }}-slo
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.prometheusRule.namespace }}
  namespace: {{ . }}
  {{- end }}
spec:
{{ .Files.Get "files/prometheus/recording-rules.yaml" | indent 2 }}
{{- end }}
---
{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "teslasync.fullname" . }}-slo-alerts
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.prometheusRule.namespace }}
  namespace: {{ . }}
  {{- end }}
spec:
{{ .Files.Get "files/prometheus/alerting-rules.yaml" | indent 2 }}
{{- end }}
