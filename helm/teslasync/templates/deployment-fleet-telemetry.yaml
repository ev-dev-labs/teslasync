{{- if .Values.fleetTelemetry.enabled }}
{{- $fleetTelemetryTag := .Values.fleetTelemetry.imageTag | default .Chart.AppVersion }}
{{- $fleetTelemetryImage := .Values.fleetTelemetry.image | default (printf "%s:%s" .Values.fleetTelemetry.imageRepository $fleetTelemetryTag) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "teslasync.fullname" . }}-fleet-telemetry
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: fleet-telemetry
spec:
  replicas: 1
  strategy:
    # The configured MQTT client ID is stable. Do not overlap revisions.
    type: Recreate
  selector:
    matchLabels:
      {{- include "teslasync.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: fleet-telemetry
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-fleet-telemetry.yaml") . | sha256sum }}
      labels:
        {{- include "teslasync.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: fleet-telemetry
    spec:
      {{- include "teslasync.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "teslasync.serviceAccountName" . }}
      terminationGracePeriodSeconds: 60
      initContainers:
        {{- include "teslasync.dependencyWaitInitContainer" (dict "root" . "name" "mqtt" "host" (include "teslasync.mqtt.host" .) "port" (include "teslasync.mqtt.port" .)) | nindent 8 }}
      containers:
        - name: fleet-telemetry
          image: {{ $fleetTelemetryImage | quote }}
          imagePullPolicy: {{ .Values.fleetTelemetry.imagePullPolicy }}
          ports:
            - name: wss
              containerPort: 4443
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: wss
            initialDelaySeconds: 5
            periodSeconds: {{ .Values.nodeRecovery.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.nodeRecovery.startupProbe.failureThreshold }}
          livenessProbe:
            tcpSocket:
              port: wss
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: wss
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/fleet-telemetry
            {{- if .Values.fleetTelemetry.tls.secretName }}
            - name: tls
              mountPath: /certs
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.fleetTelemetry.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "teslasync.fullname" . }}-fleet-telemetry
        {{- if .Values.fleetTelemetry.tls.secretName }}
        - name: tls
          secret:
            secretName: {{ .Values.fleetTelemetry.tls.secretName }}
        {{- end }}
      {{- with .Values.fleetTelemetry.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.fleetTelemetry.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.fleetTelemetry.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "teslasync.fullname" . }}-fleet-telemetry
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: fleet-telemetry
spec:
  type: {{ .Values.fleetTelemetry.service.type | default "ClusterIP" }}
  {{- with .Values.fleetTelemetry.service.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.fleetTelemetry.service.port | default 4443 }}
      targetPort: wss
      protocol: TCP
      name: wss
      {{- if and (eq (.Values.fleetTelemetry.service.type | default "ClusterIP") "NodePort") .Values.fleetTelemetry.service.nodePort }}
      nodePort: {{ .Values.fleetTelemetry.service.nodePort }}
      {{- end }}
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "teslasync.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: fleet-telemetry
{{- end }}
