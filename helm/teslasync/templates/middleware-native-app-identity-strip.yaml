{{- if and .Values.ingressRoute.enabled .Values.ingressRoute.nativeAppAuth.enabled }}
{{- $header := required "config.forwardAuthHeader is required when nativeAppAuth is enabled" .Values.config.forwardAuthHeader }}
{{- $headers := dict $header "" }}
{{- range .Values.ingressRoute.nativeAppAuth.identityHeaders }}
{{- $_ := set $headers . "" }}
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "teslasync.fullname" . }}-native-app-identity-strip
  namespace: {{ .Values.ingressRoute.namespace | default .Release.Namespace }}
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
spec:
  headers:
    customRequestHeaders:
      {{- range $name, $_ := $headers }}
      {{ $name | quote }}: ""
      {{- end }}
{{- end }}
