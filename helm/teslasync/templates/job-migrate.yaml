apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "teslasync.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-upgrade,pre-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "teslasync.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      {{- include "teslasync.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "teslasync.serviceAccountName" . }}
      restartPolicy: Never
      initContainers:
        # Wait for the DIRECT PostgreSQL endpoint (NOT PgBouncer): migrations
        # need session-mode access for advisory locks, DDL, and CREATE EXTENSION,
        # all of which break under PgBouncer transaction pooling.
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "teslasync.postgresql.directHost" . }} {{ include "teslasync.postgresql.directPort" . }}; do echo "waiting for database..."; sleep 2; done']
      containers:
        - name: migrate
          image: {{ include "teslasync.backend.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MIGRATE_ONLY
              value: "true"
            - name: DATABASE_MAX_CONNS
              value: "2"
            - name: DATABASE_MIN_CONNS
              value: "1"
          envFrom:
            - configMapRef:
                name: {{ include "teslasync.fullname" . }}
            - secretRef:
                name: {{ include "teslasync.secretName" . }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
