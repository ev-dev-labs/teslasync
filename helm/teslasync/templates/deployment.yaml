{{- include "teslasync.assertCanarySelectors" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "teslasync.fullname" . }}-api
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if .Values.rollout.paused }}
  # OPS-05: rollout.paused freezes an in-flight rollout in place.
  paused: true
  {{- end }}
  selector:
    matchLabels:
      {{- include "teslasync.stableSelectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  strategy:
    type: {{ .Values.rollout.api.strategy.type }}
    {{- if eq .Values.rollout.api.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.rollout.api.strategy.maxSurge }}
      maxUnavailable: {{ .Values.rollout.api.strategy.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "teslasync.stableSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      # OPS-09: must hold the full shutdown budget; see values.yaml and
      # ops/rollout/stages.yaml `shutdown`.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- include "teslasync.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "teslasync.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          securityContext:
            {{- toYaml .Values.initSecurityContext | nindent 12 }}
          command: ['sh', '-c', 'until nc -z {{ include "teslasync.postgresql.host" . }} {{ include "teslasync.postgresql.port" . }}; do echo "waiting for database..."; sleep 2; done']
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "teslasync.backend.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # OPS-09: the drain listener is deliberately NOT declared as
            # a containerPort. It binds to 127.0.0.1 only, so it is not
            # reachable from the pod network at all and advertising it
            # would misrepresent the contract. The preStop exec hook
            # reaches it over loopback from inside the container.
          envFrom:
            - configMapRef:
                name: {{ include "teslasync.fullname" . }}
            - secretRef:
                name: {{ include "teslasync.secretName" . }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              # OPS-09: exec, NOT httpGet. The drain listener binds to
              # 127.0.0.1 so nothing on the pod network can reach a
              # one-way, pod-fatal endpoint — and kubelet dials httpGet
              # probes from OUTSIDE the container, against the pod IP.
              # An exec hook runs INSIDE the container, where loopback
              # is reachable. The image is distroless (no shell), so the
              # hook re-execs the same binary; exec takes an argv, not a
              # shell command line.
              exec:
                command: ["/usr/local/bin/teslasync", "drain"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
