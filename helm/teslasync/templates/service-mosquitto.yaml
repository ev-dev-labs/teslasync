{{- if .Values.mqtt.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "teslasync.fullname" . }}-mosquitto
  labels:
    {{- include "teslasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: mosquitto
spec:
  type: {{ .Values.mqtt.service.type }}
  selector:
    {{- include "teslasync.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mosquitto
  ports:
    - name: mqtt
      port: {{ .Values.mqtt.service.port }}
      targetPort: mqtt
      protocol: TCP
    - name: websocket
      port: {{ .Values.mqtt.service.websocketPort }}
      targetPort: websocket
      protocol: TCP
{{- end }}
