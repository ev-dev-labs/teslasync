apiVersion: 1

datasources:
  - name: TeslaSync PostgreSQL
    uid: DS_TESLASYNC_POSTGRESQL
    type: postgres
    access: proxy
    url: ${POSTGRES_HOST}:${POSTGRES_PORT}
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1700
      # timescaledb: true enables Grafana to translate $__timeGroup() into
      # time_bucket(), which is chunk-aware on hypertables and produces better
      # query plans than date_trunc(). Continuous aggregate queries (cagg_*)
      # also benefit from this for cleaner editor UX.
      timescaledb: true
    isDefault: true
    editable: true

  - name: TeslaSync Prometheus
    uid: DS_TESLASYNC_PROMETHEUS
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
