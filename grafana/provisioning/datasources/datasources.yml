apiVersion: 1

datasources:
  - name: TeslaSync PostgreSQL
    uid: DS_TESLASYNC_POSTGRESQL
    type: postgres
    access: proxy
    url: ${POSTGRES_HOST}:${POSTGRES_PORT}
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1700
      # Enable TimescaleDB-aware query editor: $__timeGroup translates to
      # time_bucket() (chunk-aware, CAGG-compatible), query inspector surfaces
      # hypertable chunk metadata, and continuous-aggregate-backed panels get
      # automatic time-bucket alignment.
      timescaledb: true
    isDefault: true
    editable: true

  - name: TeslaSync Prometheus
    uid: DS_TESLASYNC_PROMETHEUS
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
