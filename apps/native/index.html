<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeslaSync Native Web</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #050816;
      }

      #root {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Point the web-parity API client at this origin so requests are
      // same-origin and the Vite dev proxy can forward /api -> :8080 (no CORS).
      window.TESLASYNC_API_BASE_URL = window.location.origin;
    </script>
    <script type="module" src="/index.web.tsx"></script>
  </body>
</html>
