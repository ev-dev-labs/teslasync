# Gradle Version Catalog — Shared KMP core (ADR-004 / ADR-012 version lock).
#
# Source of truth: apps/versions.lock.md. Versions are PINNED — do not float.
# Renovate keeps patch versions current; major bumps require a superseding ADR.

[versions]
# Kotlin 2.4.0 KGP requires AGP >= 8.5.2; 8.9.2 also supports compileSdk 36 cleanly.
kotlin = "2.4.0"
agp = "8.9.2"
ktor = "3.5.0"
kotlinxSerialization = "1.11.0"
kotlinxDatetime = "0.7.0"
kotlinxCoroutines = "1.10.2"
sqldelight = "2.3.2"
ktlint = "12.1.2"
ktlintEngine = "1.5.0"
android-minSdk = "26"
android-compileSdk = "36"

[libraries]
# Declared for later S-phases (net/SSE/units/cache). Wired here so consumers just use them.
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
# Test-only: in-memory MockEngine (no real network in tests).
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
# Test-only: virtual-time coroutine test scheduler (deterministic SSE reconnect/staleness).
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
# P1/S7 offline cache (ADR-013): platform SQL drivers for the shared cache.
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
# Test-only: in-memory JDBC SQLite driver so android unit tests hit no real database file.
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
