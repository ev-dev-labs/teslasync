name: TeslaSync

# XcodeGen spec (checked in for reproducibility — the generated `.xcodeproj` is
# git-ignored and rebuilt with `xcodegen generate`). One SwiftUI source group
# (`Sources/`) is shared by the iOS/iPadOS and macOS app targets (ADR-002);
# both consume the KMP shared core as the static `Shared.xcframework` (ADR-004).
options:
  bundleIdPrefix: io.teslasync
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  # ---- iOS / iPadOS app ----
  TeslaSync:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      # Co-located *Tests.swift live next to each surface but belong to the
      # XCTest bundles (they `@testable import TeslaSync`), not the app target.
      - path: Sources
        excludes:
          - "**/*Tests.swift"
          - "*Tests.swift"
      - path: TeslaSync/dashboard-widgets
        excludes:
          - "**/*Tests.swift"
          - "*Tests.swift"
      - path: TeslaSync/feature-views
        excludes:
          - "**/*Tests.swift"
          - "*Tests.swift"
      - path: TeslaSync/misc-surfaces
        excludes:
          - "**/*Tests.swift"
          - "*Tests.swift"
      - path: Localization
      - path: ../design/generated/apple
        name: DesignTokens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.teslasync.app
        PRODUCT_MODULE_NAME: TeslaSync
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Resources/TeslaSync.entitlements
        INFOPLIST_FILE: Resources/Info-iOS.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - framework: Frameworks/Shared.xcframework
        embed: false
      - sdk: libsqlite3.tbd
      - target: TeslaSyncActivities
      - target: TeslaSyncWidgets

  # ---- macOS app ----
  TeslaSync-macOS:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      # Co-located *Tests.swift belong to the XCTest bundles, not the app target.
      - path: Sources
        excludes:
          - "**/*Tests.swift"
          - "*Tests.swift"
      - path: TeslaSync/dashboard-widgets
        excludes:
          - "**/*Tests.swift"
          - "*Tests.swift"
      - path: TeslaSync/feature-views
        excludes:
          - "**/*Tests.swift"
          - "*Tests.swift"
      - path: TeslaSync/misc-surfaces
        excludes:
          - "**/*Tests.swift"
          - "*Tests.swift"
      - path: Localization
      - path: ../design/generated/apple
        name: DesignTokens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.teslasync.app.macos
        PRODUCT_NAME: TeslaSync
        PRODUCT_MODULE_NAME: TeslaSync
        CODE_SIGN_ENTITLEMENTS: Resources/TeslaSync-macOS.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_FILE: Resources/Info-macOS.plist
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - framework: Frameworks/Shared.xcframework
        embed: false
      - sdk: libsqlite3.tbd
      - target: TeslaSyncWidgets-macOS

  # ---- iOS Live Activities widget extension ----
  # The lock-screen / Dynamic Island UI for the charging / drive / command Live
  # Activities. iOS-only (ActivityKit + WidgetKit); the `ActivityAttributes` are
  # shared with the app via file membership so both agree on the payload shape.
  TeslaSyncActivities:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: NotificationsExtension
      - path: Sources/Notifications/LiveActivities/ChargingActivityAttributes.swift
      - path: Sources/Notifications/LiveActivities/DriveActivityAttributes.swift
      - path: Sources/Notifications/LiveActivities/CommandActivityAttributes.swift
      - path: Localization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.teslasync.app.activities
        PRODUCT_MODULE_NAME: TeslaSyncActivities
        INFOPLIST_FILE: Resources/Info-Activities.plist
        INFOPLIST_KEY_CFBundleDisplayName: TeslaSync Activities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""

  # ---- iOS WidgetKit extension ----
  # Home Screen / Lock Screen / StandBy widgets. Reads cached summaries from the App
  # Group store the app writes to; no networking lives here. The shared snapshot
  # layer (Sources/Widgets/Shared) is compiled into both the app and this extension
  # via file membership, the same way the Live Activity attributes are.
  TeslaSyncWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: TeslaSyncWidgets
      - path: Sources/Widgets/Shared
      - path: Localization
      - path: ../design/generated/apple
        name: DesignTokens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.teslasync.app.widgets
        PRODUCT_MODULE_NAME: TeslaSyncWidgets
        INFOPLIST_FILE: Resources/Info-Widgets.plist
        CODE_SIGN_ENTITLEMENTS: Resources/TeslaSyncWidgets.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: TeslaSync
        INFOPLIST_KEY_NSHumanReadableCopyright: ""

  # ---- macOS WidgetKit extension ----
  # Same widget sources, delivered through the macOS app. Accessory (Lock Screen)
  # families are compiled out on macOS via `#if os(iOS)`.
  TeslaSyncWidgets-macOS:
    type: app-extension
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: TeslaSyncWidgets
      - path: Sources/Widgets/Shared
      - path: Localization
      - path: ../design/generated/apple
        name: DesignTokens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.teslasync.app.macos.widgets
        PRODUCT_MODULE_NAME: TeslaSyncWidgets
        INFOPLIST_FILE: Resources/Info-Widgets.plist
        CODE_SIGN_ENTITLEMENTS: Resources/TeslaSyncWidgets-macOS.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: TeslaSync
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES

  # ---- watchOS companion app ----
  # A modern single-target SwiftUI watch app (WKApplication, no legacy WatchKit
  # extension). It is intentionally KMP-`Shared`-free (like the widgets): it reads
  # the cached glance summaries the phone delivers over WatchConnectivity and the
  # shared App Group snapshot store, so it builds and tests without the Kotlin/Native
  # toolchain. It runs independently of the companion app (P4/P8).
  TeslaSyncWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: TeslaSyncWatch
      - path: Sources/Widgets/Shared
      - path: Sources/WatchBridge
      - path: Sources/Platform/Settings/MeasurementSystem.swift
      - path: Sources/App/AppRoute.swift
      - path: Sources/App/AppRouteParser.swift
      - path: TeslaSyncWatchShared
      - path: Localization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.teslasync.app.watchkitapp
        PRODUCT_MODULE_NAME: TeslaSyncWatch
        INFOPLIST_FILE: Resources/Info-Watch.plist
        CODE_SIGN_ENTITLEMENTS: Resources/TeslaSyncWatch.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: TeslaSync
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
    dependencies:
      - target: TeslaSyncWatchWidgets
        embed: true

  # ---- watchOS complication / widget extension ----
  # The watch-face complications (accessory families). Reads the same cached snapshot
  # the watch app writes to the watch App Group; no networking lives here.
  TeslaSyncWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: TeslaSyncWatchWidgets
      - path: Sources/Widgets/Shared
      - path: TeslaSyncWatchShared
      - path: Localization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.teslasync.app.watchkitapp.widgets
        PRODUCT_MODULE_NAME: TeslaSyncWatchWidgets
        INFOPLIST_FILE: Resources/Info-WatchWidgets.plist
        CODE_SIGN_ENTITLEMENTS: Resources/TeslaSyncWatchWidgets.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: TeslaSync

  # ---- watchOS test bundle ----
  TeslaSyncWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Tests/Watch
    dependencies:
      - target: TeslaSyncWatch

  # ---- iOS test bundles ----
  TeslaSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
      # Co-located surface tests (feature-views + dashboard-widgets) run here.
      - path: TeslaSync/dashboard-widgets
        includes:
          - "**/*Tests.swift"
          - "*Tests.swift"
      - path: TeslaSync/feature-views
        includes:
          - "**/*Tests.swift"
          - "*Tests.swift"
      - path: TeslaSync/misc-surfaces
        includes:
          - "**/*Tests.swift"
          - "*Tests.swift"
    dependencies:
      - target: TeslaSync
      - framework: Frameworks/Shared.xcframework
        embed: false
      - sdk: libsqlite3.tbd

  TeslaSyncUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: TeslaSync

  # ---- macOS test bundles ----
  TeslaSync-macOSTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Unit
      # Co-located surface tests (feature-views + dashboard-widgets) run here.
      - path: TeslaSync/dashboard-widgets
        includes:
          - "**/*Tests.swift"
          - "*Tests.swift"
      - path: TeslaSync/feature-views
        includes:
          - "**/*Tests.swift"
          - "*Tests.swift"
      - path: TeslaSync/misc-surfaces
        includes:
          - "**/*Tests.swift"
          - "*Tests.swift"
    settings:
      base:
        # The macOS app target overrides PRODUCT_NAME to "TeslaSync" (both
        # platforms ship the same product name, ADR-002), so the hosted-test
        # TEST_HOST must point at TeslaSync.app rather than the XcodeGen default
        # derived from the target name (TeslaSync-macOS.app), which does not exist.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TeslaSync.app/Contents/MacOS/TeslaSync"
    dependencies:
      - target: TeslaSync-macOS
      - framework: Frameworks/Shared.xcframework
        embed: false
      - sdk: libsqlite3.tbd

  TeslaSync-macOSUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: TeslaSync-macOS

schemes:
  TeslaSync:
    build:
      targets:
        TeslaSync: all
      preActions:
        - name: Stage Shared.xcframework
          script: |
            "${PROJECT_DIR}/Scripts/build-shared-xcframework.sh"
          settingsTarget: TeslaSync
    test:
      targets:
        - TeslaSyncTests
        - TeslaSyncUITests
      preActions:
        - name: Stage Shared.xcframework
          script: |
            "${PROJECT_DIR}/Scripts/build-shared-xcframework.sh"
          settingsTarget: TeslaSync
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  TeslaSync-macOS:
    build:
      targets:
        TeslaSync-macOS: all
      preActions:
        - name: Stage Shared.xcframework
          script: |
            "${PROJECT_DIR}/Scripts/build-shared-xcframework.sh"
          settingsTarget: TeslaSync-macOS
    test:
      targets:
        - TeslaSync-macOSTests
        - TeslaSync-macOSUITests
      preActions:
        - name: Stage Shared.xcframework
          script: |
            "${PROJECT_DIR}/Scripts/build-shared-xcframework.sh"
          settingsTarget: TeslaSync-macOS
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  TeslaSyncWatch:
    build:
      targets:
        TeslaSyncWatch: all
    test:
      targets:
        - TeslaSyncWatchTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
