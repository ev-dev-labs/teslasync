# JVM + Gradle settings (mirrors apps/shared for a consistent, reproducible build).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# Disabled to match the shared build and avoid composite-build/KMP config-cache edges.
org.gradle.configuration-cache=false

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
# compileSdk 36 is the locked baseline; silence the "unsupported compile SDK" advisory.
android.suppressUnsupportedCompileSdk=36
