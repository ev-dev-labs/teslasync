# Gradle Version Catalog — Android program (ADR-012 version lock).
#
# Source of truth: apps/versions.lock.md. Kotlin 2.4.0 KGP requires AGP >= 8.5.2;
# 8.9.2 is the locked baseline and supports compileSdk 36 cleanly. Compose artifact
# versions are governed by the Compose BOM. Renovate keeps patch versions current;
# major bumps require a superseding ADR.

[versions]
kotlin = "2.4.0"
agp = "8.9.2"
# AndroidX runtime
androidxCoreKtx = "1.15.0"
androidxActivity = "1.9.3"
androidxLifecycle = "2.8.7"
# Navigation-Compose — typed route graph, deep links, predictive back (P3/A3). Not part of
# the Compose BOM (it ships under androidx.navigation), so it carries its own version pin.
# 2.9.8 is the latest stable line compatible with the BOM-resolved Compose 1.9 / material3 1.4.
androidxNavigation = "2.9.8"
# Compose Bill of Materials — pins every androidx.compose.* artifact version.
composeBom = "2026.04.01"
# Vico — Compose-native charting (ADR-012 lock, apps/versions.lock.md). Major bumps
# require a superseding ADR; Renovate keeps patch versions current.
vico = "2.0.0"
# Google Maps Compose — Compose-native map wrappers (ADR-002 native UI, ADR-012
# lists "MapLibre/Google Maps Compose"). The maps-compose AAR is published to Maven
# Central; its transitive play-services-maps comes from the Google Maven repo (the
# settings.gradle.kts content filter routes com.google.* there). Major bumps require
# a superseding ADR; Renovate keeps patch versions current.
mapsCompose = "6.6.0"
# AppAuth — OAuth 2.0 / OIDC Authorization-Code + PKCE via Chrome Custom Tabs (ADR-008, P3/A4).
# 0.11.1 is the current stable line; it contributes the redirect-receiver activity (bound to the
# appAuthRedirectScheme manifest placeholder) and pulls androidx.browser transitively.
appAuth = "0.11.1"
# Firebase Android BoM (ADR-009 push, ADR-012 version lock). Governs com.google.firebase:* artifact
# versions so firebase-messaging is declared without an explicit version (the same BoM-governed pattern
# as the Compose BOM). 34.14.1 is the locked baseline verified on Google Maven; major bumps require a
# superseding ADR, Renovate keeps patch versions current. The google-services Gradle plugin is
# intentionally NOT applied here — credential provisioning (google-services.json) is P5/H5-0001 scope;
# the FCM token surface degrades gracefully until the default FirebaseApp is configured.
firebaseBom = "34.14.1"
# Jetpack Glance — Compose-style home-screen app widgets (P3/A8, ADR-002 native UI). Not part of the
# Compose BOM (ships under androidx.glance with its own Compose-runtime alignment), so it carries its
# own pin. 1.1.1 is the current stable line; it supplies glance-appwidget (GlanceAppWidget + receiver +
# WorkManager-backed update path) and glance-material3 (GlanceTheme + dynamic-color ColorProviders).
# Major bumps require a superseding ADR; Renovate keeps patch versions current.
glance = "1.1.1"
# WorkManager — responsible, OS-throttle-friendly background refresh for the home-screen widgets
# (P3/A8, ADR-009: widgets refresh via WorkManager, never a held SSE stream). 2.10.0 is the current
# stable line; work-runtime-ktx adds the CoroutineWorker + KTX builders. Major bumps require an ADR.
androidxWork = "2.10.0"
# SQLDelight runtime — referenced by the app only to construct the shared-core offline cache
# (LocalCache(DriverFactory(context).createDriver()), ADR-013); the driver itself lives in :core.
# Pinned to the same version the shared core uses (apps/shared/gradle/libs.versions.toml).
sqldelight = "2.3.2"
# Coroutines — the auth state holder, redirect bridge, and flows are coroutine-based. Pinned to the
# shared-core version so the app and :core resolve one coroutines line (ADR-012 version lock).
kotlinxCoroutines = "1.10.2"
# kotlinx.serialization JSON — the data layer parses the `/settings` document (UnitFormatter) and
# handles the JsonElement-typed results the shared stores expose. Pinned to the shared-core version
# so the app and :core resolve one serialization line (ADR-012 version lock).
kotlinxSerialization = "1.11.0"
# Quality
ktlint = "12.1.2"
ktlintEngine = "1.5.0"
# detekt 1.23.8 — Gradle plugin runs on Gradle 8.x; the default (no type-resolution)
# `detekt` task parses sources with its bundled Kotlin frontend. Required by the
# apps-android CI lane (`./gradlew ktlintCheck detekt lint`) and the P3/A1 gate.
detekt = "1.23.8"
# Test
junit = "4.13.2"
androidxTestExtJunit = "1.2.1"
# SDK levels (mirror apps/versions.lock.md)
android-minSdk = "26"
android-targetSdk = "36"
android-compileSdk = "36"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
# Lifecycle ViewModel + Compose integration (P3/A5). viewmodel-compose supplies `viewModel()` and the
# `viewModelFactory`/`initializer` DSL the DataContainer builds its factory with; viewmodel-ktx supplies
# `viewModelScope`; runtime-compose supplies `collectAsStateWithLifecycle` for the page bind pattern.
# All governed by the same androidxLifecycle pin so the lifecycle artifacts resolve to one line.
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
# Lifecycle Process — ProcessLifecycleOwner for the app-wide foreground/background signal that gates the
# live SSE stream (P3/A6, ADR-009). Same androidxLifecycle pin; its androidx.startup initializer registers
# the owner before Application.onCreate, so ProcessLifecycleOwner.get() is safe there.
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycle" }
# Compose — versions come from the BOM (declared without version.ref).
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
# Material 3 WindowSizeClass — adaptive compact/medium/expanded navigation (P3/A3). Version
# governed by the Compose BOM (declared without version.ref, like the other material3 artifacts).
# Alias avoids the word "class" (a reserved Gradle catalog accessor segment).
compose-material3-window-size = { module = "androidx.compose.material3:material3-window-size-class" }
# Navigation-Compose — NavHost, typed routes, deep links, predictive-back integration.
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }
# Vico charts — Compose-native cartesian charts + Material 3 theme bridge.
vico-compose = { module = "com.patrykandpatrick.vico:compose", version.ref = "vico" }
vico-compose-m3 = { module = "com.patrykandpatrick.vico:compose-m3", version.ref = "vico" }
# Google Maps Compose — pulls play-services-maps + maps-ktx transitively.
maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "mapsCompose" }
# AppAuth — OAuth 2.0 / OIDC Authorization-Code + PKCE (Chrome Custom Tabs + redirect receiver).
appauth = { module = "net.openid:appauth", version.ref = "appAuth" }
# Firebase Cloud Messaging — device push transport (ADR-009). Version comes from the Firebase BoM
# (declared without version.ref, like the Compose BOM artifacts). Pulls play-services-tasks +
# firebase-common transitively (all com.google.* → the Google Maven repo per settings.gradle.kts).
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
# Jetpack Glance — home-screen app widgets (P3/A8). glance-appwidget brings the GlanceAppWidget /
# GlanceAppWidgetReceiver / Glance state APIs; glance-material3 brings GlanceTheme + the dynamic-color
# ColorProviders the widget theme maps the generated design tokens onto.
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }
# WorkManager (KTX) — CoroutineWorker + unique periodic/one-time enqueue for the widget refresh (P3/A8).
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWork" }
# SQLDelight runtime — names SqlDriver so the app can build the shared-core LocalCache (ADR-013).
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
# Coroutines — Android dispatchers for the auth state holder + redirect bridge.
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
# kotlinx.serialization JSON — settings-document parsing (UnitFormatter) + JsonElement store results.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# Test
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
# Test-only: virtual-time coroutine test scheduler for deterministic auth-flow tests.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# kotlinx.serialization compiler plugin — generates serializers for the app's @Serializable wire models
# (the FCM device-registration request/response, ADR-009). Pinned to the Kotlin version, mirroring the
# shared core's plugin so the app and :core resolve one serialization toolchain (ADR-012 version lock).
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
