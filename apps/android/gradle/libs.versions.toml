# Gradle Version Catalog — Android program (ADR-012 version lock)
#
# Source of truth: apps/versions.lock.md. Baselines below are placeholders to be
# finalized/wired by the first Android build prompt (W0/A0 sln-scaffold equivalent).
# Renovate keeps patch versions current; major bumps require a superseding ADR.

[versions]
kotlin = "2.4.0"
agp = "8.4.0"
ktor = "3.5.0"
kotlinxSerialization = "1.11.0"
kotlinxDatetime = "0.7.0"
sqldelight = "2.5.3"
composeBom = "2026.04.01"
material3 = "1.4.0"
vico = "2.0.0"
minSdk = "26"
targetSdk = "36"
compileSdk = "36"

[libraries]
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
vico-compose = { module = "com.patrykandpatrick.vico:compose", version.ref = "vico" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
