root = "."
tmp_dir = ".air-tmp"

[build]
# Build the API server with the same flags CI uses minus the race
# detector (which slows hot-reload cycles). For race-checked dev use
# `go test -race ./...` separately.
cmd = "go build -o ./.air-tmp/teslasync ./cmd/teslasync"
bin = "./.air-tmp/teslasync"
full_bin = ""
# Watch Go sources + config files; rebuild on any change.
include_ext = ["go", "tpl", "tmpl", "yaml", "yml", "sql"]
include_dir = ["cmd", "internal", "migrations", "api/proto"]
exclude_dir = [
  ".air-tmp",
  "bin",
  "dist",
  "tmp",
  "vendor",
  "node_modules",
  "web/node_modules",
  "web/dist",
  "coverage",
  "test-results",
  ".github",
  ".devcontainer",
]
exclude_file = []
exclude_regex = ["_test\\.go$", ".*_mock\\.go$"]
exclude_unchanged = true
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "3s"
log = "air-build-errors.log"

[color]
main    = "magenta"
watcher = "cyan"
build   = "yellow"
runner  = "green"

[log]
time = true

[misc]
clean_on_exit = true
