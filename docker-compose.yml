services:
  teslasync:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    container_name: teslasync
    restart: unless-stopped
    ports:
      - "${TESLASYNC_PORT:-8080}:8080"
    environment:
      - TESLASYNC_PORT=8080
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-teslasync}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-teslasync}
      - DATABASE_NAME=${POSTGRES_DB:-teslasync}
      - DATABASE_SSL_MODE=disable
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TESLA_CLIENT_ID=${TESLA_CLIENT_ID}
      - TESLA_CLIENT_SECRET=${TESLA_CLIENT_SECRET}
      - TESLA_REDIRECT_URI=${TESLA_REDIRECT_URI:-http://localhost:8080/api/v1/auth/callback}
      - TESLA_API_BASE_URL=${TESLA_API_BASE_URL:-https://fleet-api.prd.na.vn.cloud.tesla.com}
      - POLL_INTERVAL=${POLL_INTERVAL:-30s}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - FLEET_TELEMETRY_ENABLED=${FLEET_TELEMETRY_ENABLED:-false}
      - FLEET_TELEMETRY_HOST=${FLEET_TELEMETRY_HOST:-}
      - FLEET_TELEMETRY_PORT=${FLEET_TELEMETRY_PORT:-4443}
      - FLEET_TELEMETRY_TOPIC_BASE=${FLEET_TELEMETRY_TOPIC_BASE:-telemetry}
      - FLEET_TELEMETRY_BATCH_MS=${FLEET_TELEMETRY_BATCH_MS:-100}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: teslasync-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      teslasync:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  notification-worker:
    build:
      context: .
      dockerfile: Dockerfile.notification
      args:
        VERSION: ${VERSION:-dev}
    container_name: teslasync-notification-worker
    restart: unless-stopped
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-teslasync}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-teslasync}
      - DATABASE_NAME=${POSTGRES_DB:-teslasync}
      - DATABASE_SSL_MODE=disable
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - HEALTH_PORT=8081
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  postgres:
    image: postgres:17-alpine
    container_name: teslasync-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-teslasync}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-teslasync}
      - POSTGRES_DB=${POSTGRES_DB:-teslasync}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teslasync}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  grafana:
    image: grafana/grafana:10.4.0
    container_name: teslasync-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-teslasync}
      - GF_INSTALL_PLUGINS=grafana-clock-panel
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-teslasync}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-teslasync}
      - POSTGRES_DB=${POSTGRES_DB:-teslasync}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: teslasync-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

  redis:
    image: redis:7-alpine
    container_name: teslasync-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 32M

  export-worker:
    build:
      context: .
      dockerfile: Dockerfile.export-worker
      args:
        VERSION: ${VERSION:-dev}
    container_name: teslasync-export-worker
    restart: unless-stopped
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-teslasync}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-teslasync}
      - DATABASE_NAME=${POSTGRES_DB:-teslasync}
      - DATABASE_SSL_MODE=disable
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - HEALTH_PORT=8082
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M

  # Fleet Telemetry Server (optional — set FLEET_TELEMETRY_ENABLED=true to enable)
  # Receives streaming data from Tesla vehicles via WebSocket and relays to TeslaSync API.
  # Requires TLS certificates and Tesla Developer account with Fleet Telemetry access.
  fleet-telemetry:
    image: ghcr.io/teslamotors/fleet-telemetry:latest
    container_name: teslasync-fleet-telemetry
    restart: unless-stopped
    profiles:
      - telemetry
    ports:
      - "${FLEET_TELEMETRY_PORT:-4443}:4443"
    volumes:
      - ./fleet-telemetry-config.json:/etc/fleet-telemetry/config.json:ro
      - ${FLEET_TELEMETRY_TLS_CERT:-./certs/server.crt}:/certs/server.crt:ro
      - ${FLEET_TELEMETRY_TLS_KEY:-./certs/server.key}:/certs/server.key:ro
    depends_on:
      teslasync:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

volumes:
  postgres_data:
  grafana_data:
  mosquitto_data:
  redis_data:
