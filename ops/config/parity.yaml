# OPS-06 — Configuration parity gate.
#
# .github/copilot-instructions.md mandates that every config variable is
# added to ALL THREE deployment targets in the same commit:
#   1. internal/config/config.go   (Go env binding)
#   2. docker-compose.yml          (local dev)
#   3. helm/teslasync/templates/   (configmap.yaml or secret.yaml)
#
# This file turns that instruction into an executable gate:
#   go run ./cmd/ops-gate -check config-parity
#
# The gate is a RATCHET. `baseline` records the drift that already
# existed when the gate was introduced, so it does not block work on
# pre-existing debt. But:
#   * any NEW drift fails immediately, and
#   * any baseline entry that stops drifting must be deleted (a stale
#     entry also fails), so the list can only ever shrink.
#
# Regenerate the baseline after a deliberate, reviewed change with:
#   go run ./cmd/ops-gate -check config-parity -write-baseline
version: 1

sources:
  go_config: internal/config/config.go
  compose: docker-compose.yml
  helm_configmap: helm/teslasync/templates/configmap.yaml
  helm_secret: helm/teslasync/templates/secret.yaml
  helm_values: helm/teslasync/values.yaml
  # Additionally scanned for point-of-use os.Getenv reads so variables
  # like ENCRYPTION_KEY / API_ENDPOINT / HELM_CHART_VERSION (read where
  # they are used rather than bound in config.go) are not mistaken for
  # dead deployment config.
  go_scan_dirs:
    - internal
    - cmd

# Only first-party services are compared. Third-party images
# (postgres, grafana, mosquitto, redis, jaeger…) legitimately declare
# environment variables that internal/config knows nothing about.
compose_services:
  - teslasync-api
  - notification-worker
  - export-worker
  - automation-worker

# A variable matching any of these is a credential and must never be
# rendered into the non-secret ConfigMap.
secret_patterns:
  - "(^|_)(PASSWORD|PASS|SECRET|TOKEN|CREDENTIALS?)$"
  - "_API_KEY$"
  - "^ENCRYPTION_KEY$"
  - "PRIVATE_KEY$"
  - "^AUTH_JWT_SECRET$"

# Names that look like credentials but are not.
non_secret_overrides:
  - TESLASYNC_VAPID_PUBLIC_KEY
  - MQTT_CLIENT_ID
  - TESLA_CLIENT_ID

exemptions: []

# ── Ratchet baseline ─────────────────────────────────────────────────
# Generated by `go run ./cmd/ops-gate -check config-parity -write-baseline`
# from the state of the tree when the gate was introduced. Every entry is
# reported as an ADVISORY on each run so the debt stays visible.
#
# Known real defects captured here (do not "fix" by deleting the entry —
# fix the config, then regenerate):
#   * The *_WORKER_HOST/PORT, GRAFANA_* and TESLASYNC_OPERATOR_TOKEN keys
#     rendered by the chart are not bound by internal/config nor read via
#     os.Getenv anywhere in internal/ or cmd/.
baseline:
  missing_in_compose:
    - AUTH_ENABLED
    - AUTH_JWT_SECRET
    - CORS_ORIGINS
    - DATABASE_CONN_MAX_IDLE_TIME
    - DATABASE_CONN_MAX_LIFETIME
    - DATABASE_MIGRATIONS
    - ENVIRONMENT
    - FORWARD_AUTH_HEADER
    - GAS_PRICE_API_KEY
    - GAS_PRICE_ENABLED
    - GAS_PRICE_POLL_INTERVAL
    - HOMEASSISTANT_DISCOVERY_PREFIX
    - HOMEASSISTANT_ENABLED
    - HOMEASSISTANT_PUBLISH_INTERVAL
    - MONGODB_DATABASE
    - MONGODB_ENABLED
    - MONGODB_TTL_DAYS
    - MONGODB_URI
    - MQTT_CLIENT_ID
    - MQTT_ENABLED
    - MQTT_PASSWORD
    - MQTT_PREFIX
    - MQTT_USERNAME
    - REDIS_DB
    - REDIS_PASSWORD
    - TESLASYNC_ENVIRONMENT
    - TESLASYNC_SERVICE_VERSION
    - TESLA_AUTH_URL
    - TESLA_COMMAND_PROXY_URL
    - TESLA_TIMEOUT
    - VERSION
    - WORKER_SLEEP_POLL_MULT
    - WORKER_STREAMING
  missing_in_helm:
    - AUTH_ENABLED
    - DATABASE_CONN_MAX_IDLE_TIME
    - DATABASE_CONN_MAX_LIFETIME
    - DATABASE_MIGRATIONS
    - DATA_QUALITY_ENABLED
    - DATA_QUALITY_WINDOW_MINS
    - ENVIRONMENT
    - HOMEASSISTANT_DISCOVERY_PREFIX
    - HOMEASSISTANT_ENABLED
    - HOMEASSISTANT_PUBLISH_INTERVAL
    - MQTT_ENABLED
    - OTEL_EXPORTER_OTLP_ENDPOINT
    - OTEL_TRACES_SAMPLER_ARG
    - PROMETHEUS_BASE_URL
    - PYROSCOPE_ENABLED
    - PYROSCOPE_SERVER_ADDRESS
    - PYROSCOPE_UPLOAD_RATE
    - SLO_CATALOG_PATH
    - TESLASYNC_ENVIRONMENT
    - TESLASYNC_SERVICE_VERSION
    - VERSION
    - WORKER_STREAMING
  unknown_in_compose: []
  unknown_in_helm:
    - AUTOMATION_WORKER_HOST
    - AUTOMATION_WORKER_PORT
    - EXPORT_WORKER_HOST
    - EXPORT_WORKER_PORT
    - GRAFANA_ADMIN_PASSWORD
    - GRAFANA_HOST
    - GRAFANA_PORT
    - NOTIFICATION_WORKER_HOST
    - NOTIFICATION_WORKER_PORT
    - TESLASYNC_OPERATOR_TOKEN
