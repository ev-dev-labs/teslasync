# OPS-10 — Repeatable capacity-test profiles.
#
# These profiles are DEFINITIONS, not results. Nothing in this file
# asserts that a load test has been executed. `last_executed: never`
# means exactly that, and `go run ./cmd/ops-gate -check capacity` fails
# if a profile claims a result without a recorded run reference.
#
# Execution is opt-in and explicitly confirmed:
#   gh workflow run capacity-test.yml -f profile=telemetry-burst -f confirm=RUN
# or locally:
#   go run ./cmd/ops-gate -check capacity            # validate only
#   k6 run tests/k6/<script>                          # requires a target
version: 1

safety:
  # A profile may only target these environments. Production load tests
  # are structurally impossible without editing this list under review.
  allowed_environments: [local, ephemeral-ci, staging]
  # Every execution path must require an explicit confirmation token so
  # a stray workflow_dispatch cannot generate load.
  require_confirmation: true
  confirmation_token: RUN
  # Hard ceiling applied by the workflow regardless of profile settings.
  max_duration: 30m
  # Profiles that write to a datastore must run against a disposable one.
  destructive_profiles_require_ephemeral_stack: true

profiles:
  - id: telemetry-burst
    title: Fleet Telemetry ingest burst
    description: >-
      Sustained per-field MQTT publish burst through the phase-42
      PipelineSubscriber → codec → normalize.Pipeline → router chain,
      sized to model a whole fleet waking simultaneously after a
      software update.
    subsystem: telemetry-ingest
    driver: mqtt
    entrypoint: cmd/pub-test-signal
    destructive: true
    workload:
      vehicles: 25
      fields_per_vehicle: 40
      publish_rate_per_second: 500
      ramp_up: 1m
      duration: 5m
    thresholds:
      - metric: teslasync_mqtt_consumer_backlog
        comparison: lt
        value: 100
        rationale: slo/catalog.yaml mqtt_handler_backlog bounds messages already admitted to concurrent API handlers; it does not measure Mosquitto's offline queue.
      - metric: normalize_pipeline_process_seconds_p99
        comparison: lt
        value: 0.25
        rationale: Ingest must stay well inside the 15s FSM reconciliation tick.
    observability:
      dashboards: [slo-normalize_throughput, slo-telemetry_freshness, slo-mqtt_pipeline_subscription, slo-mqtt_handler_backlog]
    last_executed: never

  - id: sse-fanout
    title: SSE fan-out under wide subscriber count
    description: >-
      Many concurrent EventSource subscribers on /api/v1/events while a
      steady signal-change stream is broadcast, to size the hub's
      per-client channel buffers and the Redis Pub/Sub fan-out.
    subsystem: realtime
    driver: k6
    entrypoint: tests/k6/sse_fanout.js
    destructive: false
    workload:
      concurrent_subscribers: 500
      broadcast_rate_per_second: 50
      ramp_up: 30s
      duration: 5m
    thresholds:
      - metric: teslasync_sse_connections_active
        comparison: gte
        value: 495
        rationale: Fewer than 99% of subscribers connected means the hub is shedding clients.
      - metric: sse_event_delivery_latency_p95_seconds
        comparison: lt
        value: 1.0
        rationale: slo/catalog.yaml sse_delivery expects sub-second live updates.
      - metric: sse_stream_bytes
        comparison: gt
        value: 0
        rationale: Connected but idle subscribers do not exercise Redis Pub/Sub fan-out; the run must deliver actual SSE payload bytes.
      - metric: sse_vehicle_updates
        comparison: gt
        value: 0
        rationale: Only named vehicle_update events count; the built-in connected event cannot make a broken Redis fan-out path pass.
    observability:
      dashboards: [slo-sse_delivery]
    last_executed: never

  - id: analytics-query
    title: Analytics read amplification
    description: >-
      Concurrent reads across the heaviest analytics endpoints
      (battery degradation, fleet stats, route efficiency) to expose
      hypertable scan regressions and pgx pool starvation.
    subsystem: analytics
    driver: k6
    entrypoint: tests/k6/analytics_read.js
    destructive: false
    workload:
      virtual_users: 50
      ramp_up: 1m
      duration: 5m
    thresholds:
      - metric: http_req_duration_p99_seconds
        comparison: lt
        value: 1.5
        rationale: Analytics pages become unusable past ~1.5s p99; slo battery_health_latency_1s targets 1s.
      - metric: http_req_failed_ratio
        comparison: lt
        value: 0.01
        rationale: Pool exhaustion shows up as 5xx long before latency saturates.
    observability:
      dashboards: [slo-api_latency_p99_500ms, slo-battery_health_latency_1s]
    last_executed: never

  - id: fleet-state-batch-100
    title: Fleet canonical state read — 100 vehicles
    description: >-
      Concurrent single-page reads through the canonical fleet-state endpoint
      at small-fleet scale, to establish the latency floor before the
      500- and 5,000-vehicle tiers are compared against it.
    subsystem: fleet-state
    driver: k6
    entrypoint: tests/k6/fleet_state_batch.js
    destructive: false
    workload:
      vehicles: 100
      virtual_users: 25
      ramp_up: 30s
      duration: 5m
    thresholds:
      - metric: fleet_state_batch_p95_seconds
        comparison: lt
        value: 0.4
        rationale: A 100-vehicle single page must be near-instant; anything slower indicates a fixed per-request cost problem, not scale.
      - metric: fleet_state_batch_p99_seconds
        comparison: lt
        value: 0.8
        rationale: Tail latency above this at the smallest tier would only get worse at 500/5,000.
      - metric: fleet_state_batch_incomplete_ratio
        comparison: lt
        value: 0.01
        rationale: A fast response that silently omits vehicles is not a successful capacity result.
    observability:
      dashboards: [slo-api_latency_p99_500ms, fleet-overview, sse-realtime]
    last_executed: never

  - id: fleet-state-batch-500
    title: Fleet canonical state read — 500 vehicles (max single page)
    description: >-
      Concurrent maximum-page reads through the canonical fleet-state endpoint
      to exercise roster selection, pipelined Redis reads, set-based signal_log
      and FSM reconstruction, request coalescing, and one-second micro-caching.
    subsystem: fleet-state
    driver: k6
    entrypoint: tests/k6/fleet_state_batch.js
    destructive: false
    workload:
      vehicles: 500
      virtual_users: 25
      ramp_up: 30s
      duration: 5m
    thresholds:
      - metric: fleet_state_batch_p95_seconds
        comparison: lt
        value: 0.75
        rationale: Fleet Posture must remain interactive at the maximum supported 500-vehicle page.
      - metric: fleet_state_batch_p99_seconds
        comparison: lt
        value: 1.5
        rationale: Tail latency above 1.5 seconds makes route transitions feel stalled.
      - metric: fleet_state_batch_incomplete_ratio
        comparison: lt
        value: 0.01
        rationale: A fast response that silently omits vehicles is not a successful capacity result.
    observability:
      dashboards: [slo-api_latency_p99_500ms, fleet-overview, sse-realtime]
    last_executed: never

  - id: fleet-state-batch-5000
    title: Fleet canonical state read — 5,000 vehicles (paginated scan)
    description: >-
      Walks a 5,000-vehicle fleet as ten sequential 500-row pages per
      iteration through the canonical fleet-state endpoint — the same
      access pattern the SPA's fleet-wide roster fetch uses once a
      deployment outgrows a single page. Exercises sustained roster
      selection, pipelined Redis reads, and signal_log/FSM
      reconstruction under a scan long enough that pool starvation and
      cache-eviction pressure would surface partway through, not only
      at the first page.
    subsystem: fleet-state
    driver: k6
    entrypoint: tests/k6/fleet_state_batch.js
    destructive: false
    workload:
      vehicles: 5000
      virtual_users: 10
      ramp_up: 30s
      duration: 5m
    thresholds:
      - metric: fleet_state_batch_p95_seconds
        comparison: lt
        value: 0.75
        rationale: Each individual 500-row page must stay within the same per-page budget as the 500-vehicle tier — pagination must not make one page slower.
      - metric: fleet_state_batch_p99_seconds
        comparison: lt
        value: 1.5
        rationale: Tail latency per page above 1.5 seconds makes a 10-page scan feel stalled partway through.
      - metric: fleet_state_batch_incomplete_ratio
        comparison: lt
        value: 0.01
        rationale: A fast page that silently omits vehicles is not a successful capacity result.
      - metric: fleet_state_scan_p95_seconds
        comparison: lt
        value: 4.0
        rationale: The full 10-page scan of a 5,000-vehicle fleet must stay well under the 30s FSM reconciliation tick.
      - metric: fleet_state_scan_incomplete_ratio
        comparison: lt
        value: 0.01
        rationale: A scan that drops even one page's vehicles undercounts the fleet for any operator reading the aggregate.
    observability:
      dashboards: [slo-api_latency_p99_500ms, fleet-overview, sse-realtime]
    last_executed: never

  - id: fleet-state-mixed
    title: Fleet state REST + SSE fan-out (mixed concurrent load)
    description: >-
      Runs the fleet-state paginated REST scan and the SSE fan-out
      subscriber load concurrently in one k6 run, modeling the real
      production mix — operators paging the roster over REST while
      every connected browser tab holds a live EventSource subscription
      open. The two paths share the same Redis Pub/Sub fan-out and DB
      pool, so testing them in isolation understates contention either
      one alone would not reveal.
    subsystem: fleet-state
    driver: k6
    entrypoint: tests/k6/fleet_state_mixed.js
    destructive: false
    workload:
      vehicles: 500
      subscribers: 200
      broadcast_rate_per_second: 50
      ramp_up: 30s
      duration: 5m
    thresholds:
      - metric: fleet_state_batch_p95_seconds
        comparison: lt
        value: 1.0
        rationale: Concurrent SSE fan-out load may add modest contention over the REST-only 500-vehicle tier; the ceiling is relaxed accordingly.
      - metric: sse_connect_failure_ratio
        comparison: lt
        value: 0.01
        rationale: Fewer than 99% of subscribers connecting means the hub is shedding clients under combined load.
      - metric: sse_connect_p95_seconds
        comparison: lt
        value: 1.0
        rationale: slo/catalog.yaml sse_delivery expects sub-second live updates even while REST batch reads are in flight.
      - metric: sse_stream_bytes
        comparison: gt
        value: 0
        rationale: The mixed profile must exercise real Redis-to-SSE fan-out rather than only holding idle HTTP connections.
      - metric: sse_vehicle_updates
        comparison: gt
        value: 0
        rationale: Only named vehicle_update events count; the stream's initial connected event is not delivery evidence.
    observability:
      dashboards: [slo-api_latency_p99_500ms, fleet-overview, sse-realtime]
    last_executed: never

  - id: export-generation
    title: Concurrent export job generation
    description: >-
      Parallel large export requests through the export worker to size
      memory, temp storage, and object-storage upload throughput.
    subsystem: exports
    driver: k6
    entrypoint: tests/k6/export_generation.js
    destructive: true
    workload:
      concurrent_exports: 10
      rows_per_export: 500000
      duration: 10m
    thresholds:
      - metric: export_job_duration_p95_seconds
        comparison: lt
        value: 300
        rationale: Exports queued behind a 5-minute p95 stop feeling interactive and pile up.
      - metric: export_job_failed_ratio
        comparison: lt
        value: 0.01
        rationale: OOM or storage backpressure surfaces as job failures first.
    observability:
      dashboards: [slo-overview]
    last_executed: never

  - id: reconnect-storm
    title: Fleet-state recovery after Redis degradation
    description: >-
      Inject Redis latency and a full Redis blackhole through toxiproxy while
      the API remains on the layered L1/durable fallback path, then verify the
      service returns to health after each toxic is removed.
    subsystem: resilience
    driver: chaos
    entrypoint: cmd/chaos-runner
    destructive: false
    workload:
      scenarios: redis_latency_500ms_60s,redis_blackhole_20s
      latency_ms: 500
      blackhole_duration: 20s
      recovery_deadline: 30s
      duration: 3m
    thresholds:
      - metric: time_to_api_recovery_seconds
        comparison: lt
        value: 30
        rationale: The chaos runner fails unless the API health probe recovers within this deadline after toxic removal.
      - metric: fleet_state_http_5xx_ratio_during_redis_fault
        comparison: lte
        value: 0
        rationale: Redis is an optional L2; its failure must not turn fleet reads into server errors.
    observability:
      dashboards: [fleet-overview, sse-realtime, slo-telemetry_freshness]
    last_executed: never
