# OPS-03 — Scheduled backup restore drill.
#
# A backup that has never been restored is a hypothesis, not a backup.
# This file defines the drill; `.github/workflows/backup-restore-drill.yml`
# executes it on a schedule, and `go run ./cmd/ops-gate -check restore`
# validates that the definition, the workflow, and the runbook agree.
#
# Two modes exist, deliberately:
#
#   roundtrip  — self-contained. Boots a throwaway TimescaleDB, seeds it,
#                runs a real backup through internal/backup.Processor,
#                restores it into a SECOND scratch database, and asserts
#                row parity. Needs no production credentials, so it runs
#                on every schedule tick and gates nothing in production.
#
#   production-artifact — restores the newest real production backup
#                artifact into an isolated CI TimescaleDB, validates row
#                parity, boots the API against it, and records structured
#                evidence. Requires read-only production backup metadata
#                access, so it is manual and opt-in.
version: 1

schedule:
  cron: "0 5 * * 1"          # Mondays 05:00 UTC
  timezone: UTC
  # A drill that has not run within this window is itself a finding.
  max_interval: 192h        # 8 days — one missed weekly run is a finding

modes:
  - id: roundtrip
    default: true
    requires_credentials: false
    description: >-
      Backup → upload (local provider) → download → checksum → decompress
      → restore into a scratch database → assert critical-table row
      parity. Fully self-contained inside the CI job.
    target: ephemeral CI service container

  - id: production-artifact
    default: false
    requires_credentials: true
    credential_env:
      - BACKUP_DRILL_DATABASE_URL
    description: >-
      Downloads the newest successful production backup_run artifact and
      imports every included table into an isolated CI TimescaleDB, validates
      critical rows, and boots the API against the restored database. Never
      writes to production.
    target: guarded ephemeral CI TimescaleDB

# Tables whose row counts must survive the round trip. Kept small and
# high-signal: one core entity, one time-series, one config table.
critical_tables:
  - vehicles
  - drives
  - charging_sessions

success_criteria:
  - id: artifact-round-trips
    statement: The uploaded artifact downloads with a matching checksum and decompresses cleanly.
    implemented_by: internal/backupverify.Verifier.VerifyLatest + cmd/backup-restore-drill
  - id: critical-tables-non-empty
    statement: >-
      Every table in critical_tables is non-empty in the SOURCE before
      comparison, and non-empty after restore. Asserted explicitly so an
      empty fixture cannot pass as 0-vs-0 parity.
    implemented_by: .github/workflows/backup-restore-drill.yml + scripts/seed-restore-drill.sql
  - id: row-parity
    statement: Restored row counts equal the artifact counts for every imported table.
    implemented_by: internal/backuprestore.Restorer
  - id: api-health
    statement: The TeslaSync API boots against the restored scratch database and returns HTTP 200 from /healthz.
    implemented_by: .github/workflows/backup-restore-drill.yml
  - id: rto-recorded
    statement: Production-artifact evidence records the full scratch provisioning, import, and API-health duration.
    implemented_by: .github/workflows/backup-restore-drill.yml
  - id: immutable-evidence
    statement: >-
      Measured recovery claims require a committed structured result tied to
      one immutable workflow run, commit SHA, artifact checksum, restored row
      counts, and API health result.
    implemented_by: internal/ops.validateRestoreEvidence
  - id: scratch-reset-is-scoped-and-measured
    statement: >-
      The scratch database is fully migrated, and a migrated schema is NOT
      empty (migrations seed `settings`). The import therefore resets the
      target first, but only the explicitly allowlisted restorable tables,
      in reverse foreign-key order, inside the same transaction as the
      import, with foreign keys still ENFORCED so a RESTRICT-referencing
      non-restorable row fails the drill loudly instead of being orphaned.
      Rows removed by the schema's own ON DELETE CASCADE rules are counted
      before and after and published as `collateral_rows_cleared`.
    implemented_by: internal/backuprestore.Restorer + internal/backuprestore restore_realschema_test.go
  - id: identity-columns-preserved
    statement: >-
      `vehicles`, `alert_rules`, `geofences`, and `notification_channels`
      declare `id bigint GENERATED ALWAYS AS IDENTITY`. The import uses
      OVERRIDING SYSTEM VALUE for exactly those tables so the artifact's
      production primary keys survive and the restored foreign keys still
      resolve; sequences are then advanced past the imported maximum so the
      first post-restore insert does not collide.
    implemented_by: internal/backuprestore.scratchTable.insertStatement + resetTableSequences
  - id: restore-contract-tested-on-real-schema
    statement: >-
      The restore contract is exercised against the real `migrations/` tree,
      not a simplified fixture schema. A three-column fixture cannot
      reproduce seeded rows or identity columns and previously passed while
      the production-artifact drill could not import a single row.
    implemented_by: >-
      .github/workflows/backup-restore-drill.yml (Restore contract tests step)
      + internal/backuprestore/restore_realschema_test.go

# The fixture that makes critical_tables non-empty. Validated to exist by
# `go run ./cmd/ops-gate -check restore`.
fixture: scripts/seed-restore-drill.sql

# Recovery objectives. These are TARGETS, not measurements. The drill
# records actual durations into the job summary; nothing here claims a
# measured value.
objectives:
  scope: Durable vehicle history and API service restoration
  rto_target: 1h
  rpo_target: 24h
  recovery_point_source: Newest checksum-verified production backup artifact
  measurement_status: pending-first-drill
  last_measured_at: ""
  last_measured_rto: ""
  last_measured_rpo: ""
  last_drill_reference: ""

# Roles, not people, keep the policy valid for every self-hosted deployment.
# One person may hold multiple roles in a small install, but every
# responsibility must still be explicitly assigned during an incident.
ownership:
  accountable_role: deployment-owner
  incident_commander_role: platform-on-call
  recovery_lead_role: database-on-call
  communications_role: deployment-owner
  fallback_role: repository-maintainers
  handoff_interval: 30m

escalation:
  on_failure: >-
    Open an issue labelled `ops,backup` with the drill job URL attached,
    and follow docs/runbooks/backup-restore-drill.md § "Drill failed".
  runbook: docs/runbooks/backup-restore-drill.md

workflow: .github/workflows/backup-restore-drill.yml
