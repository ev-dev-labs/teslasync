  # ────────────────────────────────────────────────────────────────────
  - id: OPS-13
    title: Generated production readiness scorecard
    status: implemented
    owner:
      role: engineering-management
      github: "@atulmgupta"
    summary: >-
      A scorecard covering availability, latency, security,
      accessibility, recovery, and cost, generated from a definition plus
      the live state of the repository. Every status is derived from
      evidence existence and gate results; criteria needing a deployed
      environment are excluded from the score and listed separately
      rather than counted as met.
    depends_on: [OPS-01, OPS-02, OPS-03, OPS-04, OPS-05, OPS-06, OPS-07, OPS-08, OPS-09, OPS-10, OPS-11]
    artifacts:
      - ops/scorecard/dimensions.yaml
      - cmd/readiness-scorecard
      - internal/ops/scorecard.go
      - docs/operations/production-readiness-scorecard.md
    acceptance:
      - id: OPS-13-A1
        statement: All six dimensions are covered and every gate reference resolves to an implemented check.
        evidence: [ops/scorecard/dimensions.yaml, internal/ops/scorecard.go]
        verification: go run ./cmd/ops-gate -check scorecard
      - id: OPS-13-A2
        statement: Status is derived from evidence and gate results, never hand-asserted.
        evidence: [internal/ops/scorecard.go, internal/ops/manifests_test.go]
        verification: go test ./internal/ops/... -run TestGenerateScorecard
