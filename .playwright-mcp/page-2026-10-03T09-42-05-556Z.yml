                    - list [ref=f13e435]:
                      - listitem [ref=f13e436]:
                        - generic [ref=f13e439]: Compare power peaks with the trip’s speed and road conditions. Average motor power alone cannot tell whether acceleration was smooth or efficient.
                      - listitem [ref=f13e440]:
                        - generic [ref=f13e443]: Review energy recovered alongside energy used. A peak regen reading is not a measure of braking quality, and friction-brake use cannot be reconstructed from motor power.
                      - listitem [ref=f13e444]:
                        - generic [ref=f13e447]: Use the front and rear torque traces to see which axle reported load. Gaps are missing telemetry, not evidence that an axle was inactive.
                      - listitem [ref=f13e448]:
                        - generic [ref=f13e451]: Temperature adds context to sustained motor load. Without the vehicle’s limiting signals, these samples do not prove overheating or reduced power.
