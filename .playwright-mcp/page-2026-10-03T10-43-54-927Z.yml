                        - generic [ref=f22e588]: Use the front and rear torque traces to see which axle reported load. Gaps are missing telemetry, not evidence that an axle was inactive.
                      - listitem [ref=f22e589]:
                        - generic [ref=f22e592]: Temperature adds context to sustained motor load. Without the vehicle’s limiting signals, these samples do not prove overheating or reduced power.
