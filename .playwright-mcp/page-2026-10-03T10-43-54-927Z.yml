                    - list [ref=f22e576]:
                      - listitem [ref=f22e577]:
                        - generic [ref=f22e580]: Compare power peaks with the trip’s speed and road conditions. Average motor power alone cannot tell whether acceleration was smooth or efficient.
                      - listitem [ref=f22e581]:
                        - generic [ref=f22e584]: Review energy recovered alongside energy used. A peak regen reading is not a measure of braking quality, and friction-brake use cannot be reconstructed from motor power.
