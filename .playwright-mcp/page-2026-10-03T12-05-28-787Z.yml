                      - generic [ref=f31e447]:
                        - button "What is State of health (SoH)?" [ref=f31e448] [cursor=pointer]
                        - tooltip "State of health — current usable capacity divided by the original rated capacity, expressed as a percentage. Higher is better; new packs start at 100%. Estimated from observed full-charge capacity over time. It is an estimate with a real error bar, which is why the trend matters more than any single value."
                    - generic [ref=f31e452]:
                      - term [ref=f31e453]: Degradation
                      - generic [ref=f31e454]:
                        - button "What is Degradation?" [ref=f31e455] [cursor=pointer]
                        - 'tooltip "Annualised rate of capacity loss based on observed SoH trend. Combines calendar fade (time at temperature/SoC) and cycle fade (kWh throughput). Derived from many observed charges over weeks. A single reading is noise: temperature, recent fast charging and a resting pack all shift the estimate by more than a year of real loss."'
                    - generic [ref=f31e459]:
                      - term [ref=f31e460]: State of charge (SOC)
                      - generic [ref=f31e461]:
                        - button "What is State of charge (SOC)?" [ref=f31e462] [cursor=pointer]
                        - tooltip "The percentage of usable energy currently left in the battery, where 100% is a full charge of the pack as it exists today — not as it was when new. Reported directly by the vehicle. The displayed value already excludes the buffer the car reserves below 0%, so a car at 0% is not an empty pack."
                    - generic [ref=f31e466]:
                      - term [ref=f31e467]: Rated range
                      - generic [ref=f31e468]:
                        - button "What is Rated range?" [ref=f31e469] [cursor=pointer]
                        - 'tooltip "A rating, not a prediction: the current state of charge multiplied by a fixed EPA-derived distance per percent. It ignores weather, speed, terrain and load. Reported by the vehicle. Because the multiplier is fixed, rated range moves only when state of charge or the pack’s estimated capacity moves — real trips almost always use more."'
