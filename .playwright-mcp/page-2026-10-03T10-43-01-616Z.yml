                    - list [ref=f21e566]:
                      - listitem [ref=f21e567]:
                        - generic [ref=f21e570]: Compare power peaks with the trip’s speed and road conditions. Average motor power alone cannot tell whether acceleration was smooth or efficient.
                      - listitem [ref=f21e571]:
                        - generic [ref=f21e574]: Review energy recovered alongside energy used. A peak regen reading is not a measure of braking quality, and friction-brake use cannot be reconstructed from motor power.
                      - listitem [ref=f21e575]:
                        - generic [ref=f21e578]: Use the front and rear torque traces to see which axle reported load. Gaps are missing telemetry, not evidence that an axle was inactive.
                      - listitem [ref=f21e579]:
                        - generic [ref=f21e582]: Temperature adds context to sustained motor load. Without the vehicle’s limiting signals, these samples do not prove overheating or reduced power.
